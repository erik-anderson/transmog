services:
  nginx:
    image: nginx:1.28.0-alpine@sha256:30f1c0d78e0ad60901648be663a710bdadf19e4c10ac6782c235200619158284
    init: true
    ports:
      - "127.0.0.1::80"
    volumes:
      - ./fixtures/nginx/index.html:/usr/share/nginx/html/index.html:ro
      - ./fixtures/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - type: bind
        source: ${TRANSMOG_INTEROP_ASSETS_DIR:?set TRANSMOG_INTEROP_ASSETS_DIR}
        target: /usr/share/nginx/html/encoding
        read_only: true
      - type: bind
        source: ${TRANSMOG_INTEROP_ASSETS_DIR:?set TRANSMOG_INTEROP_ASSETS_DIR}/image.png
        target: /usr/share/nginx/html/image.png
        read_only: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 2s
    restart: "no"

  caddy:
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    init: true
    ports:
      - "127.0.0.1:${TRANSMOG_INTEROP_TLS_PORT:?set TRANSMOG_INTEROP_TLS_PORT}:443/tcp"
      - "127.0.0.1:${TRANSMOG_INTEROP_TLS_PORT:?set TRANSMOG_INTEROP_TLS_PORT}:443/udp"
    volumes:
      - ./fixtures/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./fixtures/caddy/index.html:/srv/index.html:ro
      - type: bind
        source: ${TRANSMOG_INTEROP_TLS_DIR:?set TRANSMOG_INTEROP_TLS_DIR}/origin.pem
        target: /certs/origin.pem
        read_only: true
      - type: bind
        source: ${TRANSMOG_INTEROP_TLS_DIR:?set TRANSMOG_INTEROP_TLS_DIR}/origin.key
        target: /certs/origin.key
        read_only: true
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "-q", "-O", "/dev/null", "https://127.0.0.1/"]
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 2s
    restart: "no"

  apache:
    image: httpd:2.4.65-alpine@sha256:07b2fabb7029a0b8aeb2e0fd02651c28fe22c21c5b5a59d6ff5b022791fcd89e
    init: true
    ports:
      - "127.0.0.1::80"
    volumes:
      - ./fixtures/apache/index.html:/usr/local/apache2/htdocs/index.html:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 1s
      timeout: 2s
      retries: 30
      start_period: 2s
    restart: "no"
