map $uri $interop_content_encoding {
    default "";
    /encoding/gzip gzip;
    /encoding/br br;
    /encoding/deflate deflate;
    /encoding/zstd zstd;
    /encoding/stacked "gzip, br, deflate, zstd";
    /encoding/truncated gzip;
    /encoding/unsupported future-coding;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens on;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /encoding/ {
        default_type text/html;
        add_header Content-Encoding $interop_content_encoding always;
        try_files $uri =404;
    }

    location /echo/ {
        default_type text/plain;
        add_header X-Seen-User-Agent $http_user_agent always;
        return 200 "$http_user_agent\n";
    }

    location /text-edit/ {
        default_type text/plain;
        add_header Cache-Control "max-age=123" always;
        add_header ETag '"fresh-origin"' always;
        add_header Set-Cookie "one=1" always;
        add_header Set-Cookie "two=2" always;
        return 200 "seed token=$http_x_fresh_token old\n";
    }

    location = /image.png {
        default_type image/png;
        try_files $uri =404;
    }

    location = /body/modify {
        default_type text/html;
        return 200 '<!doctype html><html><body data-origin="nginx">original response body</body></html>';
    }
}
