map $uri $interop_content_encoding {
    default "";
    /encoding/gzip gzip;
    /encoding/br br;
    /encoding/deflate deflate;
    /encoding/zstd zstd;
    /encoding/stacked "gzip, br, deflate, zstd";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens on;
    root /usr/share/nginx/html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /encoding/ {
        default_type text/html;
        add_header Content-Encoding $interop_content_encoding always;
        try_files $uri =404;
    }
}
