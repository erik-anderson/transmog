[workspace]
resolver = "2"
members = [
    "apps/desktop",
    "crates/app",
    "crates/app-webui",
    "crates/client-identity",
    "crates/host-windows",
    "crates/network",
    "crates/socket-info",
    "crates/proxy-core",
    "crates/proxy-content",
    "crates/proxy-tls",
    "crates/proxy-http",
    "crates/proxy-h3",
    "crates/proxy-runtime",
    "crates/proxy-control-model",
    "crates/proxy-control-transport",
    "crates/proxy-capture",
    "crates/proxy-saz",
    "crates/proxy-automation",
    "crates/proxy-script",
    "crates/script-host",
    "crates/script-supervisor",
    "crates/preview-worker",
    "crates/process-sandbox",
    "crates/webview-preview-windows",
    "crates/proxy-websocket",
    "crates/proxy-session",
    "crates/proxy-cli",
    "examples/dotnet-embedding/native",
]

[workspace.package]
version = "0.1.0+0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/erik-anderson/transmog"

[workspace.dependencies]
sysinfo = { version = "=0.37.2", default-features = false, features = ["system"] }
async-compression = { version = "=0.4.50", default-features = false, features = ["brotli", "deflate", "gzip", "tokio", "zlib", "zstd"] }
base64 = "0.22.1"
boring = "=5.2.0"
brotli = "=9.0.0"
bytes = { version = "1.11.1", features = ["serde"] }
deno_ast = { version = "=0.53.3", features = ["transpiling"] }
deno_core = "=0.412.0"
crc32fast = "1.5.2"
flate2 = "1.1.10"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
getrandom = "0.4.3"
http = "1.3.1"
http-body = "1.0.1"
http-body-util = "0.1.3"
httparse = "=1.10.1"
image = { version = "=0.25.10", default-features = false, features = ["gif", "ico", "jpeg", "png", "webp"] }
libc = "=0.2.190"
percent-encoding = "2.3.2"
hyper = { version = "1.11.1", features = ["client", "http1", "http2", "server"] }
hyper-boring = "=5.2.0"
hyper-util = { version = "0.1.21", features = ["client", "client-legacy", "http1", "http2", "server", "service", "tokio"] }
quiche = { version = "=0.30.0", default-features = false, features = ["boringssl-boring-crate"] }
rustls-native-certs = "0.8.4"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
regex = "1.13.1"
unicode-normalization = "=0.1.25"
quick-xml = "=0.42.0"
sha1 = "0.10.6"
sha2 = "0.10.9"
sourcemap = "=9.3.2"
thiserror = "2.0.17"
tempfile = "=3.27.0"
time = { version = "=0.3.55", features = ["parsing"] }
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-boring = "=5.2.0"
tower-service = "0.3.3"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Isolation", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_IO", "Win32_System_SystemInformation", "Win32_System_Threading"] }
zip = { version = "=8.6.0", default-features = false, features = ["deflate-flate2"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
