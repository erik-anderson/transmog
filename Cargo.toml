[workspace]
exclude = ["sdk", "third_party/rust-transport/vendor/h2", "third_party/rust-transport/vendor/hyper", "third_party/rust-transport/vendor/quiche", "third_party/swc-ecma-parser"]
resolver = "2"
members = [
    "crates/mcp",
    "crates/auth",
    "apps/desktop",
    "crates/app",
    "crates/app-webui",
    "crates/client-identity",
    "crates/client-certificates",
    "crates/windows-trust",
    "crates/host-windows",
    "crates/key-protection",
    "crates/network",
    "crates/socket-info",
    "crates/proxy-core",
    "crates/proxy-content",
    "crates/proxy-tls",
    "crates/tls-native",
    "crates/proxy-http",
    "crates/proxy-h3",
    "crates/proxy-runtime",
    "crates/proxy-control-model",
    "crates/proxy-control-transport",
    "crates/proxy-capture",
    "crates/proxy-saz",
    "crates/proxy-automation",
    "crates/portable",
    "crates/package-zip",
    "crates/extensions",
    "crates/extension-host",
    "crates/extension-supervisor",
    "crates/extension-registry",
    "crates/directory-watch",
    "crates/proxy-script",
    "crates/script-compiler",
    "crates/js-runtime",
    "crates/script-host",
    "crates/script-supervisor",
    "crates/preview-worker",
    "crates/process-sandbox",
    "crates/webview-preview-windows",
    "crates/proxy-websocket",
    "crates/proxy-session",
    "crates/proxy-cli",
]

[workspace.package]
version = "0.1.15"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/erik-anderson/transmog"

[workspace.dependencies]
rpassword = "=7.5.4"
# Callers supply keys/nonces and derive raw key bytes; omit RNG and PHC helpers.
aes-gcm = { version = "=0.11.1", default-features = false, features = ["aes", "alloc"] }
argon2 = { version = "=0.6.0", default-features = false, features = ["alloc"] }
zeroize = "=1.9.1"
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }
async-compression = { version = "=0.4.51", default-features = false, features = ["brotli", "deflate", "gzip", "tokio", "zlib", "zstd"] }
base64 = "0.22.1"
boring = { version = "=5.3.0", features = ["credential"] }
boring-sys = "=5.3.0"
foreign-types = "=0.5.0"
brotli = "=9.0.0"
bytes = { version = "1.11.1", features = ["serde"] }
stacker = "=0.1.25"
swc_common = { version = "=26.0.0", features = ["sourcemap"] }
swc_ecma_ast = "=29.0.2"
swc_ecma_parser = "=46.1.2"
swc_ecma_codegen = "=32.0.5"
swc_ecma_transforms_base = { version = "=50.0.3", features = ["inline-helpers"] }
swc_ecma_transforms_typescript = "=56.0.1"
swc_ecma_visit = "=29.0.0"
url = "=2.5.8"
v8 = { version = "=152.2.0", default-features = false, features = ["simdutf"] }
crc32fast = "1.5.3"
flate2 = "1.1.10"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
getrandom = "0.4.3"
hex = "=0.4.3"
http = "1.3.1"
http-body = "1.0.1"
http-body-util = "0.1.3"
httparse = "=1.10.1"
image = { version = "=0.25.10", default-features = false, features = ["gif", "ico", "jpeg", "png", "webp"] }
libc = "=0.2.191"
percent-encoding = "2.3.2"
prost = "=0.14.4"
hyper = { version = "=1.12.0", features = ["client", "http1", "http2", "server"] }
h2 = "=0.4.20"
hyper-boring = "=5.3.0"
hickory-resolver = { version = "=0.26.3", default-features = false, features = ["tokio", "system-config"] }
hyper-util = { version = "0.1.21", features = ["client", "client-legacy", "http1", "http2", "server", "service", "tokio"] }
quiche = { version = "=0.30.0", default-features = false, features = ["boringssl-boring-crate", "custom-client-dcid"] }
rustls-native-certs = "0.8.5"
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.154"
regex = "1.13.1"
unicode-normalization = "=0.1.26"
quick-xml = "=0.42.0"
sha1 = "0.11.0"
sha2 = "0.11.1"
sourcemap = "=9.3.2"
thiserror = "2.0.17"
toml = "=1.1.6"
tempfile = "=3.27.0"
time = { version = "=0.3.55", features = ["parsing", "formatting"] }
tokio = { version = "1.54.1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-boring = "=5.3.0"
tower-service = "0.3.3"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt", "json"] }
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_Security", "Win32_Security_Isolation", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_IO", "Win32_System_SystemInformation", "Win32_System_Threading"] }
zip = { version = "=9.0.4", default-features = false, features = ["deflate-flate2", "aes-crypto"] }
zstd = { version = "=0.14.3", default-features = false }

[patch.crates-io]
swc_ecma_parser = { path = "third_party/swc-ecma-parser" }
h2 = { path = "third_party/rust-transport/vendor/h2" }
hyper = { path = "third_party/rust-transport/vendor/hyper" }
quiche = { path = "third_party/rust-transport/vendor/quiche" }
# Keep the Boring 5.3.0 release on one immutable revision so native source
# verification and quiche use the same qualified TLS provider.
boring = { git = "https://github.com/cloudflare/boring", rev = "2bea8245d9b21776bc9f767b4e82dc2a78a5a262" }
boring-sys = { git = "https://github.com/cloudflare/boring", rev = "2bea8245d9b21776bc9f767b4e82dc2a78a5a262" }
hyper-boring = { git = "https://github.com/cloudflare/boring", rev = "2bea8245d9b21776bc9f767b4e82dc2a78a5a262" }
tokio-boring = { git = "https://github.com/cloudflare/boring", rev = "2bea8245d9b21776bc9f767b4e82dc2a78a5a262" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
debug = 2
strip = "none"
