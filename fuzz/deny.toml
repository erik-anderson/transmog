[graph]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]

[advisories]
yanked = "deny"
# The shipping policy already accepts this maintenance-only SWC dependency:
# the pinned parser has no compatible upgrade that removes smartstring.
# Keep fuzzing the same compiler graph; vulnerability advisories stay denied.
ignore = ["RUSTSEC-2026-0249"]

[licenses]
confidence-threshold = 0.93
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception", # ar_archive_writer via SWC's stacker build dependency; also allowed by shipping policy
    "BSD-3-Clause",
    "ISC", # libloading through BoringSSL bindgen; also allowed by the shipping policy
    "MIT",
    "MPL-2.0", # smartstring via the pinned SWC parser; also allowed by shipping policy
    "NCSA",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = [
    { name = "native-tls" },
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "rustls" },
    { name = "rustls-webpki" },
    { name = "webpki" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
