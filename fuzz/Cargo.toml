[package]
name = "transmog-content-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT"

[package.metadata]
cargo-fuzz = true

[dependencies]
bytes = "1.11.1"
libfuzzer-sys = "=0.4.13"
transmog-content = { version = "=1.0.0", path = "../crates/proxy-content" }
transmog-core = { version = "=1.0.0", path = "../crates/proxy-core" }
transmog-websocket = { version = "=1.0.0", path = "../crates/proxy-websocket" }
tokio = { version = "1.53.1", features = ["rt", "time"] }

[workspace]

[[bin]]
name = "content_encoding"
path = "fuzz_targets/content_encoding.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_stream"
path = "fuzz_targets/decode_stream.rs"
test = false
doc = false
bench = false

[[bin]]
name = "codec_roundtrip"
path = "fuzz_targets/codec_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "content_pipeline"
path = "fuzz_targets/content_pipeline.rs"
test = false
doc = false
bench = false

[[bin]]
name = "websocket_frames"
path = "fuzz_targets/websocket_frames.rs"
test = false
doc = false
bench = false
