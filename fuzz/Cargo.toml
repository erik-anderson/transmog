[package]
name = "transmog-content-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT"

[package.metadata]
cargo-fuzz = true

[dependencies]
transmog-auth = { version = "=0.1.13", path = "../crates/auth" }
base64 = "0.22.1"
bytes = "1.11.1"
libfuzzer-sys = "=0.4.13"
transmog-script-compiler = { version = "=0.1.13", path = "../crates/script-compiler" }
transmog-script = { version = "=0.1.13", path = "../crates/proxy-script" }
transmog-extensions = { version = "=0.1.13", path = "../crates/extensions" }
sourcemap = "=9.3.2"
url = "=2.5.8"
serde = "1.0.228"
transmog-content = { version = "=0.1.13", path = "../crates/proxy-content" }
transmog-core = { version = "=0.1.13", path = "../crates/proxy-core" }
transmog-websocket = { version = "=0.1.13", path = "../crates/proxy-websocket" }
tokio = { version = "1.54.1", features = ["rt", "time"] }

transmog-capture = { version = "=0.1.13", path = "../crates/proxy-capture" }
serde_json = "1.0.154"
hex = "=0.4.3"
sha2 = "0.11.1"
crc32fast = "1.5.3"
zstd = { version = "=0.14.3", default-features = false }

[workspace]

[patch.crates-io]
swc_ecma_parser = { path = "../third_party/swc-ecma-parser" }

[[bin]]
name = "script_compiler"
path = "fuzz_targets/script_compiler.rs"
test = false
doc = false
bench = false

[[bin]]
name = "script_protocol"
path = "fuzz_targets/script_protocol.rs"
test = false
doc = false
bench = false

[[bin]]
name = "auth_evidence"
path = "fuzz_targets/auth_evidence.rs"
test = false
doc = false
bench = false

[[bin]]
name = "content_encoding"
path = "fuzz_targets/content_encoding.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_stream"
path = "fuzz_targets/decode_stream.rs"
test = false
doc = false
bench = false

[[bin]]
name = "codec_roundtrip"
path = "fuzz_targets/codec_roundtrip.rs"
test = false
doc = false
bench = false

[[bin]]
name = "content_pipeline"
path = "fuzz_targets/content_pipeline.rs"
test = false
doc = false
bench = false

[[bin]]
name = "sse_stream"
path = "fuzz_targets/sse_stream.rs"
test = false
doc = false
bench = false

[[bin]]
name = "websocket_frames"
path = "fuzz_targets/websocket_frames.rs"
test = false
doc = false
bench = false

[[bin]]
name = "capture_reader"
path = "fuzz_targets/capture_reader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "capture_crypto"
path = "fuzz_targets/capture_crypto.rs"
test = false
doc = false
bench = false
