[package]
name = "rustymiddle-content-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT"

[package.metadata]
cargo-fuzz = true

[dependencies]
bytes = "1.11.1"
libfuzzer-sys = "=0.4.13"
rustymiddle-content = { version = "=0.1.0", path = "../crates/proxy-content" }
rustymiddle-core = { version = "=0.1.0", path = "../crates/proxy-core" }

[workspace]

[[bin]]
name = "content_encoding"
path = "fuzz_targets/content_encoding.rs"
test = false
doc = false
bench = false

[[bin]]
name = "decode_stream"
path = "fuzz_targets/decode_stream.rs"
test = false
doc = false
bench = false
