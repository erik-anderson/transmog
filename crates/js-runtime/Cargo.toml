[package]
name = "transmog-js-runtime"
description = "Capability-free direct V8 embedding shared by isolated JavaScript hosts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Development-only proof of the pinned Inspector API; never enabled by a host.
inspector-probe = ["dep:serde_json"]
# Shared native debugger. Sessions stay disabled until explicitly attached.
debugger = ["dep:serde_json"]

[dependencies]
percent-encoding.workspace = true
serde_json = { workspace = true, optional = true }
transmog-script-diagnostics = { version = "=0.1.21", path = "../script-diagnostics" }
url.workspace = true
v8.workspace = true

[dev-dependencies]
transmog-process-sandbox = { version = "=0.1.21", path = "../process-sandbox" }

[[example]]
name = "inspector-probe"
required-features = ["inspector-probe"]

[[example]]
name = "debugger-benchmark"
required-features = ["debugger"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
