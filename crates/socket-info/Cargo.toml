[package]
name = "transmog-socket-info"
description = "Read-only native TCP statistics boundary for Transmog"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
transmog-core = { version = "=0.1.1", path = "../proxy-core" }

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

[lints.rust]
# Read-only, synchronous socket queries. Borrowed handles cannot outlive sockets.
# Every unsafe block documents buffer initialization, bounds and lifetime.
unsafe_code = "allow"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
