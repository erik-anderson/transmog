[package]
name = "transmog-client-identity"
description = "Best-effort local client process attribution for Transmog"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
transmog-core = { version = "=1.0.0", path = "../proxy-core" }

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[lints.rust]
# This crate is the single audited endpoint/process attribution FFI boundary.
# Every unsafe block documents its buffer, pointer, handle, and lifetime invariants.
unsafe_code = "allow"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
