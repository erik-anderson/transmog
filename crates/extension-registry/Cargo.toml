[package]
name = "transmog-extension-registry"
description = "Metadata-only extension management and active-instance ownership"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
getrandom.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
tokio.workspace = true
transmog-extensions = { version = "=0.1.8", path = "../extensions" }
transmog-extension-supervisor = { version = "=0.1.8", path = "../extension-supervisor" }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.5", features = ["fs"] }

[target.'cfg(windows)'.dependencies]
transmog-directory-watch = { version = "=0.1.8", path = "../directory-watch" }

[lints]
workspace = true
