[package]
name = "transmog-tls-native"
description = "BoringSSL certificate callback and server credential boundary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
boring.workspace = true
boring-sys.workspace = true
foreign-types.workspace = true
idna = "=1.1.0"
percent-encoding.workspace = true
url = "=2.5.8"

[build-dependencies]
cc = "=1.6.0"
serde_json.workspace = true

[lints.rust]
# Native certificate hooks use the same BoringSSL instance, owned credential
# references and synchronous borrowed callback pointers.
unsafe_code = "allow"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
