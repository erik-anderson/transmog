[package]
name = "transmog-directory-watch"
description = "Bounded owned Windows directory notification boundary"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile.workspace = true

[lints.rust]
# Audited directory notification FFI only. Buffers, events and OVERLAPPED storage
# remain owned until canceled I/O completes; callers receive inert bounded names.
unsafe_code = "allow"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
