[package]
name = "transmog-script-host"
description = "Capability-free isolated V8 host for one Transmog traffic script"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[dependencies]
deno_core.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }
transmog-process-sandbox = { version = "=0.1.2", path = "../process-sandbox" }
transmog-script = { version = "=0.1.2", path = "../proxy-script" }

[dev-dependencies]
transmog-script-supervisor = { version = "=0.1.2", path = "../script-supervisor" }
