[package]
name = "transmog-script-host"
description = "Capability-free isolated V8 host for one Transmog traffic script"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[dependencies]
serde_json.workspace = true
transmog-js-runtime = { version = "=0.1.15", path = "../js-runtime" }
url.workspace = true
transmog-process-sandbox = { version = "=0.1.15", path = "../process-sandbox" }
transmog-script = { version = "=0.1.15", path = "../proxy-script" }
transmog-extension-host = { version = "=0.1.15", path = "../extension-host" }

[dev-dependencies]
serde.workspace = true
tokio.workspace = true
transmog-script-supervisor = { version = "=0.1.15", path = "../script-supervisor" }
base64.workspace = true
tempfile.workspace = true
transmog-extensions = { version = "=0.1.15", path = "../extensions" }
transmog-extension-supervisor = { version = "=0.1.15", path = "../extension-supervisor" }
transmog-extension-registry = { version = "=0.1.15", path = "../extension-registry" }

[[test]]
name = "extension_sandbox"
path = "../extension-host/tests/sandbox.rs"

[[test]]
name = "extension_mapi"
path = "../extension-host/tests/mapi.rs"

[[test]]
name = "extension_mapi_visualizer"
path = "../extension-host/tests/mapi_visualizer.rs"

[[test]]
name = "extension_registry"
path = "../extension-host/tests/registry.rs"
