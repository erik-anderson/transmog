[package]
name = "transmog-process-sandbox"
description = "Audited zero-capability Windows helper-process sandbox for Transmog"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[lints.rust]
# This is the single audited Win32 FFI boundary. Every unsafe block documents
# the exact handle, pointer, lifetime, and structure invariant it relies on.
unsafe_code = "allow"
missing_docs = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
