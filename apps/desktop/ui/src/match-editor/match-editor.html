<template>
  <div class="match-editor">
    <div class="match-mode-row"><label>URL matching <select aria-label="URL matching" @change="{changeMode(e)}"><option value="exact" ?selected="{{matchMode == 'exact'}}">Exact</option><option value="pattern" ?selected="{{matchMode == 'pattern'}}">URL pattern</option><option value="regex" ?selected="{{matchMode == 'regex'}}">Regex · advanced</option><option value="any" ?selected="{{matchMode == 'any'}}">Any URL · advanced</option></select></label><label ?hidden="{{matchMode != 'regex'}}">Match against <select @change="{changeScope(e)}"><option value="url" ?selected="{{regexScope == 'url'}}">Full URL</option><option value="path" ?selected="{{regexScope == 'path'}}">Path only</option></select></label></div>
    <label ?hidden="{{matchMode == 'any'}}"><span><if condition="matchMode == 'exact'">Exact URL</if><if condition="matchMode == 'pattern'">Address pattern</if><if condition="matchMode == 'regex'">Regular expression</if></span><input w-ref="{addressInput}" name="url" aria-label="Matching address" ?required="{{matchMode != 'any'}}" maxlength="8192" placeholder="https://example.test/users/42" @input="{changed()}" @select="{inspectSelection()}" @click="{inspectSelection()}" @keyup="{inspectSelection()}" aria-describedby="match-help"></label><p class="field-help" ?hidden="{{matchMode != 'any'}}">Any URL can match; method and other request conditions still apply.</p>
    <if condition="matchMode == 'pattern'"><p id="match-help" class="field-help">Use <code>{}</code> for one path segment, <code>{:digits}</code> for digits, or a final <code>{...}</code> for remaining segments. Names such as <code>{id}</code> are optional annotations and do not affect matching.</p><div class="pattern-preview" aria-label="Pattern preview"><for each="part in patternParts"><span ?data-token="{{part.token}}">{{part.text}}</span></for></div><div class="actions compact-actions"><if condition="selectedPart"><span>Generalize “{{selectedPart}}”:</span><button type="button" class="secondary compact-button" @click="{generalize('segment')}">Any ID</button><button type="button" class="secondary compact-button" @click="{generalize('digits')}">Numeric ID</button><button type="button" class="secondary compact-button" @click="{generalize('rest')}">Remaining path</button></if><button type="button" class="secondary compact-button" ?hidden="{{!annotationAvailable}}" @click="{openAnnotation()}">Edit placeholder</button></div></if>
    <details class="match-options" ?hidden="{{matchMode == 'exact'}}"><summary>Matching options</summary><label><input w-ref="{caseInput}" type="checkbox" checked @change="{changed()}"> Case-sensitive <if condition="matchMode == 'pattern'">path literals</if></label><label ?hidden="{{matchMode != 'regex'}}"><input w-ref="{wholeInput}" type="checkbox" checked @change="{changed()}"> Match the whole value</label><p class="field-help" ?hidden="{{matchMode != 'regex'}}">Use bounded Rust regex syntax without delimiter slashes. Whole-value matching includes both ends; clear it to search for a substring.</p></details>
    <details ?hidden="{{queryHidden}}"><summary>Query conditions</summary><label>Query matching <select @change="{changeQuery(e)}"><option value="none" ?selected="{{queryMode == 'none'}}">Require no query</option><option value="exact" ?selected="{{queryMode == 'exact'}}">Exact query, including order</option><option value="parameters" ?selected="{{queryMode == 'parameters'}}">Required parameters; allow others</option><option value="ignore" ?selected="{{queryMode == 'ignore'}}">Ignore query</option></select></label><label ?hidden="{{queryMode == 'none' || queryMode == 'ignore'}}">Query values <textarea w-ref="{queryInput}" rows="3" placeholder="include=profile" @input="{changed()}"></textarea></label><p class="field-help" ?hidden="{{queryMode != 'parameters'}}">One decoded name=value pair per line. Repeated names are supported; every specified pair must occur.</p></details>
    <p class="field-error" role="status" ?hidden="{{!matchEditorError}}">{{matchEditorError}}</p>
    <div w-ref="{annotationPopover}" class="table-popover annotation-popover" popover="auto"><label>Optional annotation <input w-ref="{annotationInput}" maxlength="64" placeholder="Leave empty for an anonymous match" @input="{changed()}"></label><p class="field-help">Names describe matched parts; they do not change matching. Repeated names can match different values.</p><label>Match kind <select w-ref="{annotationType}"><option value="segment">One nonempty segment</option><option value="digits">Decimal digits</option><option value="rest">Remaining path segments</option></select></label><button type="button" @click="{saveAnnotation()}">Apply placeholder</button></div>
  </div>
</template>
