<template>
  <section class="auth-inspector" aria-label="Auth inspection">
    <div class="auth-actions"><button type="button" class="secondary compact-button" @click="{retry()}" ?disabled="{{authBusy || !selection}}">Retry inspection</button><button type="button" class="secondary compact-button" @click="{related()}" ?disabled="{{authBusy || !authFindings.length || authRelatedBusy}}">Related traffic</button></div>
    <p class="auth-help">Decoded evidence is unverified. Reveal and Copy value include sensitive material. Show original source opens retained traffic that may contain secrets.</p>
    <if condition="authBusy"><p role="status">Inspecting retained auth evidence…</p></if>
    <if condition="authError"><p role="alert">{{authError}}</p></if>
    <if condition="authNotice"><p role="status">{{authNotice}}</p></if>
    <if condition="!selection"><p>Select an exchange to inspect authentication.</p></if>
    <div class="auth-scroll">
      <for id="auth-finding" each="finding in authFindings">
        <details class="auth-finding" key="{{finding.id}}" open>
          <summary><strong>{{finding.format}}</strong> <span>{{finding.role}}</span><span class="auth-state">{{finding.status}} · {{finding.verification}}</span></summary>
          <if condition="finding.summary"><p class="auth-summary">{{finding.summary}}</p></if>
          <div class="auth-source"><span>{{finding.source.label}}</span><button type="button" class="secondary compact-button" @click="{source(finding.id)}">Show original source</button></div>
          <if condition="finding.source.transforms.length"><details class="auth-provenance"><summary>Decoding provenance</summary><ol><for each="transform in finding.source.transforms"><li>{{transform}}</li></for></ol><p>Offsets, when available, refer to the named source. Transformed fields do not claim exact compressed-byte mapping.</p></details></if>
          <for each="diagnostic in finding.diagnostics"><p class="auth-diagnostic">{{diagnostic}}</p></for>
          <dl class="auth-fields"><for id="auth-field" each="field in finding.readableFields"><div class="auth-field" key="{{field.id}}"><dt>{{field.name}}</dt><dd><pre tabindex="0">{{field.value}}</pre><div class="auth-field-actions"><if condition="field.sensitive"><button type="button" class="secondary compact-button" @click="{reveal(field.id)}" ?disabled="{{!field.available || field.busy}}" aria-label="Reveal or hide {{field.name}}"><if condition="field.revealed">Hide</if><if condition="!field.revealed">Reveal</if></button></if><button type="button" class="secondary compact-button" @click="{copy(field.id)}" ?disabled="{{!field.available || field.busy}}" aria-label="Copy value for {{field.name}}">Copy value</button></div><details class="auth-meaning"><summary>Meaning and limits</summary><p>{{field.note}}</p></details><if condition="field.error"><p role="alert">{{field.error}}</p></if></dd></div></for></dl>
          <if condition="finding.technicalFields.length"><details class="auth-technical"><summary>Raw and decoded values · may contain secrets</summary><dl class="auth-fields"><for id="auth-field" each="field in finding.technicalFields" /></dl></details></if>
          <for id="auth-finding" each="finding in finding.children" />
        </details>
      </for>
      <if condition="!authBusy && !authError && !authFindings.length"><p>No auth detected in the completed scanned sources. Coverage below shows sources that were skipped, unavailable or limited.</p></if>
      <details class="auth-coverage" open><summary>Source coverage</summary><ul><for each="coverage in authCoverage"><li><strong>{{coverage.source}} · {{coverage.status}}</strong><p>{{coverage.detail}}</p></li></for></ul></details>
      <for each="diagnostic in authDiagnostics"><p class="auth-diagnostic">{{diagnostic}}</p></for>
      <if condition="authRelated"><section class="auth-related" aria-label="Related auth traffic"><h4>Related traffic</h4><p>{{authRelated.searched}} retained entries considered. <if condition="authRelated.limited">Search limited.</if></p><p>{{authRelated.detail}}</p><if condition="!authRelated.entries.length"><p>No related traffic found in this searched scope.</p></if><ul><for each="entry in authRelated.entries"><li><button type="button" class="secondary compact-button" @click="{navigate(entry)}">{{entry.label}} · {{entry.boundary}}</button><p>{{entry.reason}}</p></li></for></ul></section></if>
    </div>
  </section>
</template>
