<template>
  <section class="auth-inspector" aria-label="Auth inspection">
    <div class="auth-actions"><if condition="authError"><button type="button" class="secondary compact-button" @click="{retry()}" ?disabled="{{authBusy || !selection}}">Retry inspection</button></if><button type="button" class="secondary compact-button" w-ref="{relatedButton}" @click="{related()}" ?disabled="{{authBusy || !authFindings.length || authRelatedBusy}}">Related traffic</button><details class="auth-options"><summary>Inspection options</summary><button type="button" class="secondary compact-button" @click="{retry()}" ?disabled="{{authBusy || !selection}}">Refresh inspection</button><p>Reveal and Copy value include sensitive material. Show original source opens retained traffic that may contain secrets. Structural decoding does not check signatures or authentication success.</p></details></div>
    <if condition="!authBusy && !authError && selection"><p class="auth-overview">Decoded evidence is unverified. {{authCoverageSummary}}.</p></if>
    <if condition="authBusy"><p role="status"><if condition="interpretation == 'auto'">Inspecting retained auth evidence…</if><if condition="interpretation != 'auto'">Interpreting body as {{authBodyFormat}}…</if></p></if>
    <if condition="authError"><p role="alert">{{authError}}</p></if>
    <if condition="authNotice"><p role="status">{{authNotice}}</p></if>
    <if condition="!selection"><p>Select an exchange to inspect authentication.</p></if>
    <div class="auth-scroll">
    <if condition="interpretation != 'auto'"><div class="auth-body-format"><strong>Body as {{authBodyFormat}}</strong><button type="button" class="secondary compact-button" @click="{closeBody()}">Back to body</button></div><if condition="authBodyResult"><p class="auth-diagnostic" role="status">{{authBodyResult}}</p></if><details class="auth-help"><summary>About this body viewer</summary><p>{{authBodyHint}}</p></details></if>

      <if condition="authRelated"><section class="auth-related" aria-label="Related auth traffic"><div class="auth-body-format"><h4>Related traffic</h4><button type="button" class="secondary compact-button" @click="{closeRelated()}">Back to evidence</button></div><p>{{authRelated.searched}} retained entries considered. <if condition="authRelated.limited">Search limited.</if></p><p>{{authRelated.detail}}</p><if condition="!authRelated.entries.length"><p>No related traffic found in this searched scope.</p></if><ul><for each="entry in authRelated.entries"><li><button type="button" class="secondary compact-button" @click="{navigate(entry)}">{{entry.label}} · {{entry.boundary}}</button><p>{{entry.reason}}</p></li></for></ul></section></if>
      <for id="auth-finding" each="finding in authArtifacts">
        <details class="auth-finding" key="{{finding.id}}" open>
          <summary @contextmenu="{findingContext(finding.id,e)}" @keydown="{findingContext(finding.id,e)}"><strong>{{finding.format}}</strong> <span>{{finding.context}}</span></summary>
          <for each="origin in finding.sources"><div class="auth-source"><span>{{origin.source.label}}</span><button type="button" class="secondary compact-button" @click="{source(origin.id)}">Show original source</button></div></for>
          <for each="notice in finding.notices"><div class="auth-diagnostic" key="{{notice.id}}"><strong>{{notice.label}}</strong><for each="diagnostic in notice.diagnostics"><p>{{diagnostic}}</p></for></div></for>
          <dl class="auth-fields"><for id="auth-field" each="field in finding.readableFields"><div class="auth-field" key="{{field.id}}" tabindex="0" @contextmenu="{fieldContext(field.id,e)}" @keydown="{fieldContext(field.id,e)}"><dt>{{field.name}}</dt><dd><div class="auth-value"><pre tabindex="0">{{field.value}}</pre><if condition="field.sensitive && field.available"><button type="button" class="auth-reveal" @click="{reveal(field.id)}" ?disabled="{{field.busy}}" aria-label="Reveal or hide {{field.name}}" aria-pressed="{{field.revealed}}" title="{{field.visibilityLabel}}"><if condition="!field.revealed"><svg class="auth-eye" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"></path><circle cx="12" cy="12" r="3"></circle></svg></if><if condition="field.revealed"><svg class="auth-eye" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="m3 3 18 18"></path><path d="M9.8 5.2A11 11 0 0 1 12 5c6.5 0 10 7 10 7a19 19 0 0 1-3.2 4"></path><path d="M6.5 6.5A20 20 0 0 0 2 12s3.5 7 10 7a11 11 0 0 0 5.5-1.5"></path><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"></path></svg></if></button></if></div><if condition="field.note"><p class="auth-meaning">{{field.note}}</p></if><if condition="field.error"><p role="alert">{{field.error}}</p></if></dd></div></for></dl>
          <for id="auth-finding" each="finding in finding.children" />
          <details class="auth-technical"><summary>Technical details</summary>
            <for each="layer in finding.layers"><section class="auth-layer" key="{{layer.id}}" aria-label="{{layer.format}} decoding layer">
              <h4>{{layer.format}} · {{layer.role}}</h4><p>{{layer.recognition}} · {{layer.status}} · {{layer.verification}}</p>
              <p>{{layer.source.label}}<if condition="layer.source.offset != null"> · Offset {{layer.source.offset}}, length {{layer.source.length}}</if></p>
              <if condition="layer.source.transforms.length"><div class="auth-provenance"><ol><for each="transform in layer.source.transforms"><li>{{transform}}</li></for></ol><p>Offsets refer to the named source. Transformed fields do not claim exact compressed-byte mapping.</p></div></if>
              <if condition="layer.technicalFields.length"><h4>Raw and decoded values · may contain secrets</h4><dl class="auth-fields"><for id="auth-field" each="field in layer.technicalFields" /></dl></if>
            </section></for>
          </details>
        </details>
      </for>
      <if condition="!authBusy && !authError && !authFindings.length && interpretation == 'auto'"><p>No auth detected in the completed scanned sources. Coverage below shows sources that were skipped, unavailable or limited.</p></if>
      <details class="auth-coverage"><summary>Source coverage</summary><ul><for each="coverage in authCoverage"><li><strong>{{coverage.source}} · {{coverage.status}}</strong><p>{{coverage.detail}}</p></li></for></ul></details>
      <for each="diagnostic in authDiagnostics"><p class="auth-diagnostic">{{diagnostic}}</p></for>

    </div>
  </section>
</template>
