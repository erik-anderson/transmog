<template>
  <portable-case @case-open-change="{onCaseOpenChange(e)}" @case-review-closed="{processOpenedTraces()}" @case-preview-report-request="{onCasePreviewReport(e)}" @case-preview-opened="{onCasePreview(e)}" w-ref="{portableCase}" ?viewer-mode="{{viewerMode}}" @case-evidence-opened="{onCaseEvidenceOpened(e)}" @case-reference-request="{onCaseReference(e)}"></portable-case>
  <section @incident-window-request="{onIncidentWindow(e)}" id="traffic" class="app-view traffic-view" aria-labelledby="traffic-heading" ?hidden="{{view != 'traffic'}}" ?data-active="{{view == 'traffic'}}">
    <div class="traffic-toolbar-stack"><header class="view-toolbar">
      <div class="view-title"><h1 id="traffic-heading">Traffic</h1></div>
      <form w-ref="{filterForm}" class="filters" @submit="{runContentSearch(e)}">
        <select class="traffic-search-kind" aria-label="Traffic search mode" title="Search contents (Ctrl+Shift+F)" aria-keyshortcuts="Control+Shift+F" @change="{changeTrafficSearchKind(e)}"><option value="filter" ?selected="{{trafficSearchKind == 'filter'}}">Filter</option><option value="contents" ?selected="{{trafficSearchKind == 'contents'}}">Search contents</option></select>
        <label class="traffic-search"><span class="sr-only">Filter or search traffic</span><input w-ref="{searchInput}" name="search" type="search" placeholder="{{searchPlaceholder}}" title="Focus filter or search (Ctrl+F)" aria-keyshortcuts="Control+F" maxlength="4096" @input="{searchChanged(e)}"></label>
        <span class="search-actions" ?hidden="{{trafficSearchKind != 'contents'}}"><button type="submit" class="secondary compact-button" ?disabled="{{searchingTraffic}}">Search</button><button type="button" class="secondary compact-button search-options-trigger" popovertarget="traffic-search-options" aria-label="Search options" title="Search options">⋯</button></span>
      </form>
      <div class="traffic-tools">
        <if condition="!viewerMode && hasEnabledResponses"><autoresponse-switch :state="{{autoresponseState}}" :busy="{{autoresponsePending}}"></autoresponse-switch></if>
        <button type="button" w-ref="{filesMenuButton}" class="secondary compact-button files-menu-trigger" popovertarget="trace-files-menu">Files</button>
        <button type="button" class="secondary compact-button" @click="{clearTraffic()}" ?disabled="{{removingTraffic}}" title="Clear entries in this window. Open WebSockets stay visible unless termination on clear is enabled in Settings. Undo expires after 5 minutes for 100 MB or more and is unavailable for 1 GB or more.">Clear all</button>
        <button type="button" w-ref="{filterButton}" class="secondary compact-button" @click="{openFilters(e)}">Filters <if condition="filterCount">({{filterCount}})</if></button>
        <button type="button" class="secondary compact-button timeline-toggle" aria-label="Timeline" aria-pressed="{{timelineMode}}" title="{{timelineMode ? 'Show request list' : 'Show timeline'}}" @click="{toggleTimeline()}"><svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><path d="M2 4h7M5 10h10M10 16h8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path></svg></button>
        <button type="button" w-ref="{viewMenuButton}" class="secondary compact-button" popovertarget="table-settings">View</button>
      </div>

    </header><if condition="incidentWindow"><div class="content-search-status"><span>{{incidentWindowLabel}}. Other filters still apply.</span><button type="button" class="secondary compact-button" @click="{clearIncidentWindow()}">Clear time filter</button><button type="button" class="secondary compact-button" @click="{clearIncidentWindow(true)}">Clear other filters</button></div></if>
    <if condition="comparisonBaseline"><div class="content-search-status"><span>Comparison baseline: {{comparisonBaselineLabel}}</span><button type="button" class="secondary compact-button" @click="{compareWithBaseline()}" ?disabled="{{selectedTrafficCount != 1}}">Compare with baseline</button><button type="button" class="secondary compact-button" @click="{clearComparisonBaseline()}">Clear baseline</button></div></if>
    <if condition="contentSearchStatus"><div class="content-search-status"><span role="status">{{contentSearchStatus}}</span><if condition="searchingTraffic"><button type="button" class="secondary compact-button" @click="{cancelContentSearch()}">Cancel search</button></if></div></if>
    <if condition="contentSearchActive"><div class="content-search-results"><span class="search-result-label" title="{{contentSearchLabel}}">Search results: {{contentSearchLabel}}</span><button type="button" class="secondary compact-button" @click="{selectAllSearchMatches()}" ?disabled="{{searchingTraffic}}"><if condition="contentMatchCount == 1">Select 1 entry</if><if condition="contentMatchCount != 1">Select all {{contentMatchCount}} entries</if></button><button type="button" class="secondary compact-button" @click="{showMatches()}" ?disabled="{{searchingTraffic || !contentMatchCount}}">View matches…</button><button type="button" class="secondary compact-button" @click="{clearContentSearch()}">Clear search</button><span class="field-help"><if condition="viewerMode">Search again after importing more traffic.</if><if condition="!viewerMode">Search again to include newly captured traffic.</if></span></div></if>
    <if condition="importStatus"><div class="trace-import-status"><span role="status">{{importStatus}}</span><if condition="importingTrace"><progress aria-label="Indexing saved traffic" value="{{importPercent}}" max="100"></progress><button type="button" class="secondary compact-button" @click="{cancelImport()}">Cancel import</button></if><if condition="!importingTrace"><button type="button" class="secondary compact-button" aria-label="Dismiss import message" @click="{dismissImportStatus()}">×</button></if></div></if>
    <if condition="savingTrace && !saveTraceOpen"><div class="trace-import-status"><span role="status">{{saveTraceStatus}}</span><if condition="saveTraceTotal"><progress aria-label="Saving trace" value="{{saveTraceCompleted}}" max="{{saveTraceTotal}}"></progress></if><if condition="!saveTraceTotal"><progress aria-label="Saving trace"></progress></if><button type="button" class="secondary compact-button" @click="{showSaveTrace()}">Save progress…</button></div></if>

    <details class="trace-markers-panel" ?hidden="{{!markerReviews.length}}" ?open="{{markersOpen}}" @toggle="{markersToggled(e)}"><summary><span class="marker-summary-row"><span>Markers ({{markerCount}})<if condition="markersDirty"> · Unsaved changes</if><if condition="markerDraftDirty"> · Editing note</if></span><if condition="markerReviews.length == 1"><span class="marker-source-name" title="{{markerTraceName}}">{{markerTraceName}}</span></if><if condition="markerReviews.length > 1"><select aria-label="Trace" @change="{changeMarkerTrace(e)}"><for each="source in markerReviews"><option key="{{source.traceId}}" value="{{source.traceId}}" ?selected="{{source.traceId == markersTraceId}}">{{source.name}}</option></for></select></if><button type="button" class="secondary compact-button" @click="{markerSave()}" ?disabled="{{!markersTraceId || savingTrace}}">Save copy…</button></span></summary><div class="trace-markers-content"><p role="status">{{markerStatus}}</p><incident-intake w-ref="{markerIntake}" trace-id="{{markersTraceId}}" refresh-token="{{markersRefresh}}" @marker-time-request="{markerTimeRequest(e)}" @markers-changed="{markersChanged(e)}" @marker-draft-change="{markerDraftChanged(e)}"></incident-intake></div></details>
    <div class="traffic-summary"><output class="session-status" data-kind="{{sessionKind}}">{{sessionText}}</output><span class="sort-summary" ?hidden="{{timelineMode}}">{{sortLabel}}</span></div>
    <if condition="filterCount">
      <div class="filter-chips"><for each="filter in filterChips"><span key="{{filter.dimension}}" class="filter-chip"><button type="button" class="filter-chip-edit" aria-label="Edit {{filter.label}} filter" title="{{filter.label}}" @click="{openFilterPicker(filter.dimension,e)}">{{filter.label}}</button><button type="button" class="filter-chip-remove" aria-label="Remove {{filter.label}} filter" @click="{removeFilterDimension(filter.dimension)}">×</button></span></for><button type="button" class="clear-filters" @click="{clearFilters()}">Clear filters</button></div>
    </if>
    </div><div class="traffic-workspace" data-layout="{{preferences.layout}}" data-list-share="{{listShare}}">
      <trace-drop-target variant="region" ?show-help="{{showTraceImportHelp}}" ?active="{{view == 'traffic'}}" ?busy="{{importingTrace}}"><section class="session-list-pane" aria-label="Captured traffic" @keydown="{listKeyboard(e)}">
        <div class="traffic-selection-bar" ?hidden="{{selectedTrafficCount <= 1}}"><span role="status">{{trafficSelectionText}}</span><button type="button" class="secondary compact-button" @click="{compareSelected()}" ?disabled="{{selectedTrafficCount != 2}}" title="Select exactly two requests">Compare requests</button><button type="button" class="secondary compact-button" ?hidden="{{viewerMode}}" @click="{selectedResponses()}" ?disabled="{{removingTraffic || !selectedTrafficCount}}">{{trafficCreateLabel}}</button><button type="button" class="secondary compact-button" ?hidden="{{viewerMode}}" @click="{addSelectedToResponseSet()}" ?disabled="{{removingTraffic || !selectedTrafficCount}}">Add to response set…</button><button type="button" class="secondary compact-button" popovertarget="traffic-entry-menu" @click="{positionTrafficMenu(e)}">More</button></div>
        <div class="timeline-surface" ?hidden="{{!timelineMode}}"><div class="timeline-load-state"><if condition="timelineBusy"><span role="status">Loading timeline…</span></if><if condition="timelineError"><span role="status">{{timelineError}}</span><button type="button" class="secondary compact-button" @click="{refreshTimeline()}">Retry</button></if></div>

        <traffic-timeline w-ref="{timeline}" :entries="{{timelineEntries}}" :chosen="{{timelineSelection}}" :sources="{{traceMetadataRows}}" :compact="{{preferences.compactRows}}" :markers="{{markerItems}}" marker-current="{{markerCurrent}}" @timeline-marker="{timelineMarker(e)}" current="{{selectedSessionId}}" @timeline-inspect="{inspectTimeline(e)}" @timeline-clear-selection="{clearTrafficSelection()}" @timeline-refresh="{refreshTimeline()}" @timeline-select="{selectTimeline(e)}"></traffic-timeline></div>
        <div w-ref="{sessionScroller}" class="table-wrap" ?hidden="{{timelineMode}}" @scroll="{sessionScrolled()}">
          <table w-ref="{trafficTable}" class="traffic-table" role="grid" tabindex="0" aria-rowcount="{{rowCount}}" aria-activedescendant="{{activeRowId}}" aria-multiselectable="true" aria-label="Traffic entries" data-width="{{tableWidth}}" ?data-compact="{{preferences.compactRows}}">
            <colgroup><for each="column in columns"><col key="{{column.id}}" data-width="{{column.widthCss}}"></for></colgroup>
            <thead><tr aria-rowindex="1"><for each="column in columns">
              <th key="{{column.id}}" id="header-{{column.id}}" scope="col" data-column-id="{{column.id}}" ?data-pinned="{{column.pinned}}" data-offset="{{column.offsetCss}}" aria-sort="{{column.sortDirection}}" ?data-dragging="{{column.id == draggingColumn}}" ?data-drop-target="{{column.id == dropColumnId}}" data-drop-placement="{{dropPlacement}}">
                <button type="button" class="column-trigger" popovertarget="column-actions" @click="{openColumnMenu(column.id,e)}" @pointerdown="{startColumnDrag(column.id,e)}" @pointermove="{moveColumnDrag(e)}" @pointerup="{finishColumnDrag(e)}" @pointercancel="{cancelColumnDrag(e)}" @lostpointercapture="{cancelColumnDrag(e)}" @keydown="{cancelColumnDrag(e)}" aria-label="{{column.label}}" title="Click to sort or filter; drag to move {{column.label}}"><span class="column-label">{{column.headerLabel}}</span><span class="sort-arrow">{{column.sortArrow}}</span><span class="column-caret" aria-hidden="true">⌄</span></button>
                <span class="column-resizer" role="separator" tabindex="0" aria-orientation="vertical" aria-label="Resize {{column.label}} column" aria-valuemin="32" aria-valuemax="1200" aria-valuenow="{{column.width}}" @pointerdown="{startColumnResize(column.id,e)}" @pointermove="{resizeColumn(e)}" @pointerup="{finishColumnResize(e)}" @pointercancel="{cancelColumnResize(e)}" @keydown="{resizeColumnWithKeyboard(column.id,e)}" @dblclick="{fitColumn(column.id)}"></span>
              </th>
            </for></tr></thead>
            <tbody>
              <if condition="!totalMatched"><tr aria-rowindex="2"><td colspan="{{columns.length}}" class="empty-cell">{{emptyTrafficText}}</td></tr></if>
              <tr class="traffic-spacer" aria-hidden="true" role="presentation"><td colspan="{{columns.length}}"><div data-size="{{topSpace}}"></div></td></tr>
              <for each="session in sessions">
                <tr key="{{session.id}}" id="session-{{session.id}}" tabindex="-1" aria-rowindex="{{session.rowIndex}}" aria-busy="{{session.loading}}" aria-label="{{session.rowLabel}}" data-session-id="{{session.id}}" data-loading="{{session.loading}}" data-tone="{{session.tone}}" ?data-current="{{session.id == selectedSessionId}}" ?data-selected="{{session.selectionState == 'true'}}" aria-selected="{{session.selectionState}}" @click="{selectTraffic(session,e)}" @keydown="{selectWithKeyboard(session,e)}" @contextmenu="{openTrafficMenu(session,e)}">
                  <for each="cell in session.cells">
                    <td key="{{cell.id}}" data-column-id="{{cell.id}}" data-offset="{{cell.offsetCss}}" ?data-pinned="{{cell.pinned}}" ?data-numeric="{{cell.numeric}}" title="{{cell.title}}">
                      <if condition="session.markerLabel && cell.id == 'request-number'"><span class="request-marker-flag" aria-label="Flagged" title="Flagged">⚑</span></if><if condition="session.topLevelNavigation && cell.id == 'path'"><span class="navigation-badge" title="Top-level navigation" aria-label="Top-level navigation">Page</span></if>
                      <if condition="cell.id == 'method'"><button type="button" class="session-link" @click="{selectWithButton(session,e)}">{{cell.text}}</button></if>
                      <if condition="cell.id != 'method' && cell.id != 'protocol'"><span class="cell-value" data-tone="{{cell.tone}}">{{cell.text}}</span></if>
                      <if condition="cell.id == 'protocol'"><if condition="session.streamLabel"><button type="button" class="stream-identity" ?data-active="{{session.terminal == 'active'}}" aria-label="{{session.streamAccessibleLabel}}" @click="{openStreamDisclosure(session,e)}" @keydown="{streamControlKey(e)}">{{session.streamDisplay}}<span aria-hidden="true">⌄</span></button><span class="stream-http-version">{{cell.text}}</span></if><if condition="!session.streamLabel"><span class="cell-value">{{cell.text}}</span></if></if>
                      <if condition="session.autoResponse && cell.id == 'status'"><span class="auto-badge" title="Served by an auto-response rule">AUTO</span></if>
                      <if condition="session.loss && cell.id == 'state'"><span title="Some exchange evidence was omitted"> · loss</span></if>
                    </td>
                  </for>
                </tr>
              </for>
              <tr class="traffic-spacer" aria-hidden="true" role="presentation"><td colspan="{{columns.length}}"><div data-size="{{bottomSpace}}"></div></td></tr>
            </tbody>
          </table>
        </div>
        <div class="traffic-undo" ?hidden="{{!trafficUndoText}}"><span role="status">{{trafficUndoText}}</span><button w-ref="{trafficUndoButton}" type="button" class="secondary compact-button" @click="{undoTrafficRemoval()}" ?hidden="{{!trafficUndo.length}}" ?disabled="{{removingTraffic}}">Undo traffic removal</button></div>
        <div class="list-footer" ?hidden="{{timelineMode}}">
          <span ?hidden="{{timelineMode}}">{{followText}}</span><span ?hidden="{{!timelineMode}}">Timeline reflects retained traffic · adjusted ranges stay fixed</span>
          <div class="list-footer-actions" ?hidden="{{timelineMode}}">
            <if condition="updatesPending"><button type="button" class="new-traffic-button compact-button" @click="{showUpdates()}"><if condition="newTrafficCount">{{newTrafficCount}} new · </if>Show updates</button></if>
            <button type="button" class="secondary compact-button" ?hidden="{{viewerMode}}" @click="{resumeLatest()}" ?disabled="{{followLatest}}" title="Show the newest traffic and keep it updated as requests arrive. Selecting an entry pauses this.">Follow newest</button>

          </div>
        </div>
      </section></trace-drop-target>
      <pane-divider orientation="{{dividerOrientation}}" label="Resize traffic list and inspector" value="{{preferences.listSplit}}" initial="45" @pane-resize="{resizeList(e)}"></pane-divider>
      <section class="details-pane" aria-labelledby="inspector-heading">
        <p class="inspector-empty" ?hidden="{{selectedSessionId}}">Select a request to inspect its headers and body.</p>
        <header class="selection-bar" ?hidden="{{!selectedSessionId}}" ?data-auto-response="{{selectedDetail.autoResponse}}">
          <span class="method-badge">{{selectedMethodText}}</span><button id="inspector-heading" class="selected-url" type="button" title="Show full URL" popovertarget="selected-url-full" ?disabled="{{!selectedSessionId}}">{{selectedUrlText}}</button><span class="status-badge" data-tone="{{selectedTone}}">{{selectedStatusText}}</span>
          <div class="compact-inspector-side" ?hidden="{{streamPanel}}" role="group" aria-label="Message to inspect">
            <label><input type="radio" name="inspector-side" value="request" ?checked="{{inspectorSide == 'request'}}" @change="{showInspectorSide('request')}">Request</label>
            <label><input type="radio" name="inspector-side" value="response" ?checked="{{inspectorSide == 'response'}}" @change="{showInspectorSide('response')}">Response</label>
          </div>
          <div class="selection-actions"><button type="button" w-ref="{detailsButton}" class="secondary compact-button" @click="{showTimings()}" ?disabled="{{!selectedDetail}}">Details…</button><button type="button" class="secondary compact-button" w-ref="{actionsButton}" @click="{prepareInspectorContext()}" popovertarget="selected-request-actions" ?disabled="{{!selectedDetail}}">Actions</button><button type="button" class="secondary compact-button" @click="{showMatchedAutoResponse()}" ?hidden="{{!matchedRuleId}}">{{matchedRuleLabel}}</button></div>
          <span class="auto-response-notice" ?hidden="{{!selectedDetail.autoResponse}}"><strong>Auto-responded</strong> · {{selectedDetail.autoResponse.ruleName}}</span>
        </header>
        <div class="stream-tabs" ?hidden="{{!selectedDetail || !selectedDetail.stream}}"><button class="secondary compact-button" type="button" ?data-selected="{{streamPanel}}" @click="{showStream(true)}">Messages / Events</button><button class="secondary compact-button" type="button" ?data-selected="{{!streamPanel}}" @click="{showStream(false)}">HTTP handshake</button></div>
        <stream-inspector ?hidden="{{!selectedSessionId || !streamPanel}}" :detail="{{selectedDetail}}"></stream-inspector>
        <div class="exchange-inspector" ?hidden="{{!selectedSessionId || streamPanel}}" data-side="{{inspectorSide}}" data-request-share="{{requestShare}}" @inspector-resize="{resizeMessage(e)}">
          <message-inspector side="request" split="{{preferences.requestBodySplit}}" :detail="{{selectedDetail}}"></message-inspector>
          <pane-divider orientation="vertical" label="Resize request and response inspectors" value="{{preferences.requestSplit}}" initial="45" @pane-resize="{resizeRequest(e)}"></pane-divider>
          <message-inspector side="response" split="{{preferences.responseBodySplit}}" :detail="{{selectedDetail}}"></message-inspector>
        </div>
      </section>
    </div>

              <div id="selected-request-actions" w-ref="{requestActionsMenu}" @click="{closeRequestActions(e)}" @keydown="{actionMenuKey(e,true)}" class="table-popover selected-request-actions" popover="auto"><button type="button" ?hidden="{{viewerMode}}" @click="{cancelInspectedRequest()}" ?disabled="{{!selectedDetail || selectedDetail.terminalState != 'active' || cancelingRequests}}">Cancel request</button><button type="button" @click="{replaySelected(true)}" ?disabled="{{!selectedDetail}}">Edit and replay</button>
      <action-submenu label="Filter by"><p role="status" ?hidden="{{inspectorContextReady}}">{{inspectorContextStatus}}</p><button type="button" ?disabled="{{!inspectorContextReady}}" title="{{inspectorContextValues.0.label}}" @click="{openContextFilter('host',e,true)}">{{inspectorContextValues.0.label}}…</button><button type="button" ?disabled="{{!inspectorContextReady}}" title="{{inspectorContextValues.1.label}}" @click="{openContextFilter('process',e,true)}">{{inspectorContextValues.1.label}}…</button><button type="button" ?disabled="{{!inspectorContextReady}}" title="{{inspectorContextValues.2.label}}" @click="{openContextFilter('status',e,true)}">{{inspectorContextValues.2.label}}…</button><button type="button" ?disabled="{{!inspectorContextReady}}" title="{{inspectorContextValues.3.label}}" @click="{openContextFilter('content-type',e,true)}">{{inspectorContextValues.3.label}}…</button></action-submenu>
      <action-submenu label="Compare">
        <button type="button" @click="{compareSelected()}" ?disabled="{{selectedTrafficCount != 2}}">Compare requests</button><p ?hidden="{{selectedTrafficCount == 2}}">Select two requests to compare them.</p>
        <button type="button" @click="{compareWithBaseline(true)}" ?disabled="{{!comparisonBaseline || !selectedDetail}}">Compare with baseline</button><p ?hidden="{{comparisonBaseline}}">Set a comparison baseline first.</p><p ?hidden="{{!comparisonBaseline}}">Baseline: {{comparisonBaselineLabel}}</p>
        <button type="button" @click="{compareSelectedResponseStages(true)}" ?disabled="{{!selectedDetail}}">Server response with client response</button>
        <hr><button type="button" @click="{setComparisonBaseline(true)}" ?disabled="{{!selectedDetail}}">Set as comparison baseline</button><button type="button" @click="{clearComparisonBaseline()}" ?disabled="{{!comparisonBaseline}}">Clear comparison baseline</button>
      </action-submenu>
      <action-submenu label="Create rule" ?hidden="{{viewerMode}}">
        <button type="button" @click="{beginRuleFromSelected('request-headers',true)}" ?disabled="{{!selectedDetail}}">Change request headers…</button>
        <button type="button" @click="{beginRuleFromSelected('browser-headers',true)}" ?disabled="{{!selectedDetail}}">Change UA headers…</button>
        <button type="button" @click="{beginRuleFromSelected('response-headers',true)}" ?disabled="{{!selectedDetail}}">Change response headers…</button>
        <button type="button" @click="{beginRuleFromSelected('response-text',true)}" ?disabled="{{!selectedDetail}}">Find and replace response text…</button>
        <button type="button" @click="{beginAutoResponseFromSelected()}" ?disabled="{{reuseDisabled}}" title="{{reuseTitle}}">Serve a saved response…</button><p ?hidden="{{!reuseDisabled}}">{{reuseTitle}}</p>
      </action-submenu>
      <button type="button" ?hidden="{{viewerMode}}" @click="{addSelectedToResponseSet(true)}" ?disabled="{{reuseDisabled}}" title="{{reuseTitle}}">Add to response set…</button>
      <if condition="windowsCommands"><action-submenu label="Preview">
        <button type="button" @click="{showCapturedPage()}" ?disabled="{{!selectedDetail || !previewPageAvailable || previewPageBusy}}">Preview page…</button><p ?hidden="{{previewPageAvailable}}">Select a complete retained HTML response.</p>
        <button type="button" ?hidden="{{!previewSceneAvailable}}" @click="{showRelatedPreview('captured')}">Captured baseline…</button>
        <button type="button" ?hidden="{{viewerMode || !previewSceneAvailable}}" @click="{showRelatedPreview('modified')}">With saved changes…</button>
        <button type="button" ?hidden="{{!previewReportAvailable}}" @click="{showPreviewReport()}">Last preview diagnostics…</button>
      </action-submenu></if>
      <action-submenu label="Flag"><button type="button" @click="{flagMessage('request',true)}" ?disabled="{{!selectedDetail}}">Flag request…</button><button type="button" @click="{flagMessage('response',true)}" ?disabled="{{!selectedDetail}}">Flag response…</button></action-submenu>
      <action-submenu label="Copy">
        <button type="button" @click="{copySelectedUrl(true)}" ?disabled="{{!selectedDetail}}">Copy URL</button>
        <button type="button" @click="{copyRequestSummary(true)}" ?disabled="{{!selectedDetail}}">Copy request summary</button>
        <button type="button" @click="{copyRequest('curl',true)}" ?disabled="{{!selectedDetail || commandBusy}}">Copy as cURL</button>
        <if condition="windowsCommands"><button type="button" @click="{copyRequest('powershell',true)}" ?disabled="{{!selectedDetail || commandBusy}}">Copy as PowerShell</button></if>
        <button type="button" @click="{copyAllHeaders(true)}" ?disabled="{{!selectedDetail || commandBusy}}">Copy all headers</button>
      </action-submenu></div>
    <div id="selected-url-full" class="table-popover url-popover" popover="auto"><strong>Selected URL</strong><p class="full-value">{{selectedUrlText}}</p><button type="button" @click="{copyUrl()}">Copy URL</button></div>
    <div id="traffic-entry-menu" w-ref="{trafficMenu}" @click="{closeTrafficActions(e)}" @keydown="{actionMenuKey(e,false)}" class="table-popover traffic-entry-menu" data-x="{{trafficMenuX}}" data-y="{{trafficMenuY}}" popover="auto"><strong>{{trafficSelectionText}}</strong><button type="button" @click="{replaySelected(false)}" ?disabled="{{selectedTrafficCount != 1}}">Edit and replay</button>
      <action-submenu label="Filter by"><button type="button" title="{{contextValues.0.label}}" @click="{openContextFilter('host',e)}">{{contextValues.0.label}}…</button><button type="button" title="{{contextValues.1.label}}" @click="{openContextFilter('process',e)}">{{contextValues.1.label}}…</button><button type="button" title="{{contextValues.2.label}}" @click="{openContextFilter('status',e)}">{{contextValues.2.label}}…</button><button type="button" title="{{contextValues.3.label}}" @click="{openContextFilter('content-type',e)}">{{contextValues.3.label}}…</button></action-submenu>
      <action-submenu label="Compare">
        <button type="button" @click="{compareSelected()}" ?disabled="{{selectedTrafficCount != 2}}">Compare requests</button><p ?hidden="{{selectedTrafficCount == 2}}">Select two requests to compare them.</p>
        <button type="button" @click="{compareWithBaseline(false)}" ?disabled="{{!comparisonBaseline || selectedTrafficCount != 1}}">Compare with baseline</button><p ?hidden="{{comparisonBaseline}}">Set a comparison baseline first.</p><p ?hidden="{{!comparisonBaseline}}">Baseline: {{comparisonBaselineLabel}}</p>
        <button type="button" @click="{compareSelectedResponseStages(false)}" ?disabled="{{selectedTrafficCount != 1}}">Server response with client response</button>
        <hr><button type="button" @click="{setComparisonBaseline(false)}" ?disabled="{{selectedTrafficCount != 1}}">Set as comparison baseline</button><button type="button" @click="{clearComparisonBaseline()}" ?disabled="{{!comparisonBaseline}}">Clear comparison baseline</button>
      </action-submenu>
      <action-submenu label="Create rule" ?hidden="{{viewerMode}}">
        <button type="button" @click="{beginRuleFromSelected('request-headers',false)}" ?disabled="{{selectedTrafficCount != 1}}">Change request headers…</button>
        <button type="button" @click="{beginRuleFromSelected('browser-headers',false)}" ?disabled="{{selectedTrafficCount != 1}}">Change UA headers…</button>
        <button type="button" @click="{beginRuleFromSelected('response-headers',false)}" ?disabled="{{selectedTrafficCount != 1}}">Change response headers…</button>
        <button type="button" @click="{beginRuleFromSelected('response-text',false)}" ?disabled="{{selectedTrafficCount != 1}}">Find and replace response text…</button>
        <button type="button" @click="{beginAutoResponseFromSelected()}" ?disabled="{{reuseDisabled || selectedTrafficCount != 1}}" title="{{reuseTitle}}">Serve a saved response…</button><p ?hidden="{{!reuseDisabled}}">{{reuseTitle}}</p>
      </action-submenu>

      <if condition="windowsCommands"><action-submenu label="Preview">
        <button type="button" @click="{showCapturedPage()}" ?disabled="{{!selectedDetail || !previewPageAvailable || previewPageBusy}}">Preview page…</button><p ?hidden="{{previewPageAvailable}}">Select a complete retained HTML response.</p>
        <button type="button" ?hidden="{{!previewSceneAvailable}}" @click="{showRelatedPreview('captured')}">Captured baseline…</button>
        <button type="button" ?hidden="{{viewerMode || !previewSceneAvailable}}" @click="{showRelatedPreview('modified')}">With saved changes…</button>
        <button type="button" ?hidden="{{!previewReportAvailable}}" @click="{showPreviewReport()}">Last preview diagnostics…</button>
      </action-submenu></if>

    <dialog w-ref="{saveTraceDialog}" class="trace-save-dialog" aria-labelledby="save-trace-heading" @close="{saveTraceClosed()}">

      <h2 id="save-trace-heading">Save trace copy</h2><p class="field-help">Save all retained traffic or choose a subset. Removed requests are excluded.</p>

      <form w-ref="{saveTraceForm}" @submit="{saveTrafficTrace(e)}"><div class="trace-save-options"><label>Evidence to include<select aria-label="Evidence to include" @change="{changeExportScope(e)}" ?disabled="{{savingTrace}}"><option value="all" ?selected="{{exportReviewScope == 'all'}}">All retained entries</option><option value="selected" ?selected="{{exportReviewScope == 'selected'}}">Selected requests</option><option value="filtered" ?selected="{{exportReviewScope == 'filtered'}}">Current filter and incident window</option><for each="trace in metadataTraceOptions"><option key="{{trace.id}}" value="source:{{trace.id}}">{{trace.label}}</option></for></select></label><p role="status">{{exportReviewSummary}}</p><details><summary>Included evidence inventory</summary><dl class="trace-export-facts"><for each="fact in exportReviewFacts"><div key="{{fact.label}}"><dt>{{fact.label}}</dt><dd>{{fact.value}}</dd></div></for></dl><p>{{exportReviewNote}}</p><button type="button" class="secondary compact-button" @click="{reviewTraceExport()}" ?disabled="{{savingTrace || exportReviewBusy}}">Refresh inventory</button></details><fieldset ?disabled="{{savingTrace}}"><label>Format <select name="format" aria-label="Format" @change="{changeSaveTraceFormat(e)}"><option value="native">TMCap</option><option value="har">HTTP Archive (HAR)</option><option value="saz-strict">SAZ · compatibility</option><option value="saz-extended">SAZ · extended fidelity</option></select></label><p class="field-help"><if condition="saveTraceFormat == 'native'">Preserves captured requests, responses, streams and source details in Transmog.</if><if condition="saveTraceFormat == 'har'">For tools that read HAR. Includes HTTP traffic; omits stream activity, incident notes and network configuration.</if><if condition="saveTraceFormat == 'saz-strict'">For Fiddler and other SAZ readers. Includes HTTP traffic and WebSocket messages.</if><if condition="saveTraceFormat == 'saz-extended'">SAZ with additional Transmog source details and incident notes.</if></p><label class="checkbox-label"><input name="encrypt" type="checkbox" ?disabled="{{saveTraceFormat == 'har'}}"> Encrypt with a password (AES-256)</label><p class="field-help">Choose a password for this copy, even if the original was encrypted.</p><label class="checkbox-label"><input name="markers" type="checkbox" checked ?disabled="{{saveTraceFormat == 'har' || saveTraceFormat == 'saz-strict'}}"> Include markers and notes</label><p class="field-help">Includes remaining markers for each selected trace, even when only some requests are saved.</p><if condition="saveTraceFormat == 'har' || saveTraceFormat == 'saz-strict'"><p class="field-help">This format omits markers and notes.</p></if><label class="checkbox-label"><input name="originalContext" type="checkbox" checked> Include capture details</label><p class="field-help">Includes recorded configuration, reproduction steps, source notes and paths where supported.</p><label class="checkbox-label"><input name="redactHeaders" type="checkbox"> Remove authentication and cookie header values</label><p class="field-help">Removes Authorization, Proxy-Authorization, Cookie and Set-Cookie values. Bodies and URLs may still contain private data.</p><label class="checkbox-label"><input name="networkContext" type="checkbox" ?disabled="{{saveTraceFormat == 'har'}}"> Include this computer’s network configuration</label><p class="field-help">Collects this computer’s adapter addresses, DNS settings and name.</p><p class="field-help">Captured content may contain private data.</p><details><summary>Format details and capture limits</summary><p class="field-help">TMCap preserves full stream details. SAZ reconstructs WebSocket frames and uses labeled placeholders for uncaptured headers; its ZIP filenames remain visible even when encrypted. HAR omits streams. Missing or unfinished bodies remain marked incomplete. Context options do not remove request headers, bodies or URLs.</p></details></fieldset></div><if condition="saveTraceStatus"><p role="status">{{saveTraceStatus}}</p></if><if condition="savingTrace"><if condition="saveTraceTotal"><progress class="trace-save-progress" aria-label="Saving trace" value="{{saveTraceCompleted}}" max="{{saveTraceTotal}}"></progress></if><if condition="!saveTraceTotal"><progress class="trace-save-progress" aria-label="Saving trace"></progress></if><p class="field-help">You can close this dialog and keep working while the trace saves.</p></if><footer class="actions"><button type="submit" ?disabled="{{savingTrace || exportReviewBusy || !exportReviewId}}">Save as…</button><button type="button" class="secondary" @click="{closeSaveTrace()}">Close</button></footer></form>
    </dialog>

    <dialog w-ref="{matchDialog}" class="search-match-dialog" aria-labelledby="search-match-heading" @cancel="{closeMatches(e)}" @keydown="{matchKeyboard(e)}"><h3 id="search-match-heading">Search matches</h3><div class="search-match-scroll"><p class="search-match-query">Search: {{contentSearchLabel}}</p><p class="full-value">{{matchEntryLabel}}</p><p role="status">{{matchPosition}}<if condition="matchBusy"> · Loading…</if></p><p class="field-error" ?hidden="{{!matchError}}">{{matchError}}</p><strong>{{matchField}}</strong><pre class="search-match-context" tabindex="0" ?hidden="{{!matchHasLocation}}"><span>{{matchBefore}}</span><mark ?data-empty="{{!matchText}}">{{matchText}}</mark><span>{{matchAfter}}</span></pre><p class="field-help">{{matchNote}}</p></div><footer class="actions"><button type="button" class="secondary" @click="{moveMatch(-1)}" ?disabled="{{matchBusy || !matchHasPrevious}}">Previous match</button><button type="button" class="secondary" @click="{moveMatch(1)}" ?disabled="{{matchBusy || !matchHasNext}}">Next match <kbd>F3</kbd></button><button type="button" class="secondary" @click="{moveMatchEntry(-1)}" ?disabled="{{matchBusy || !matchHasPreviousEntry}}">Previous entry</button><button type="button" class="secondary" @click="{moveMatchEntry(1)}" ?disabled="{{matchBusy || !matchHasNextEntry}}">Next entry</button><button type="button" class="secondary" @click="{closeMatches()}">Close</button></footer></dialog>
    <dialog w-ref="{timingDialog}" class="timing-dialog details-dialog" aria-labelledby="timing-heading" @close="{timingsClosed()}">
      <h2 id="timing-heading">Request details</h2><p class="details-url full-value">{{detailsUrl}}</p>
      <nav class="details-tabs" role="tablist" aria-label="Request details" @keydown="{detailsTabKeydown(e)}"><button type="button" id="details-tab-timings" role="tab" aria-controls="details-panel-timings" aria-selected="{{detailsTimingsSelected}}" ?data-selected="{{detailsTab == 'timings'}}" tabindex="{{detailsTimingsTabIndex}}" @click="{showDetailsTab('timings')}">Timings</button><button type="button" id="details-tab-connection" role="tab" aria-controls="details-panel-security" aria-selected="{{detailsConnectionSelected}}" ?data-selected="{{detailsTab == 'connection'}}" tabindex="{{detailsConnectionTabIndex}}" @click="{showDetailsTab('connection')}">Connection</button><button type="button" id="details-tab-certificates" role="tab" aria-controls="details-panel-security" aria-selected="{{detailsCertificatesSelected}}" ?data-selected="{{detailsTab == 'certificates'}}" tabindex="{{detailsCertificatesTabIndex}}" @click="{showDetailsTab('certificates')}">Certificates</button><button type="button" id="details-tab-source" role="tab" aria-controls="details-panel-source" aria-selected="{{detailsSourceSelected}}" ?data-selected="{{detailsTab == 'source'}}" tabindex="{{detailsSourceTabIndex}}" ?hidden="{{!detailsHasSource}}" @click="{showDetailsTab('source')}">Capture source</button></nav>
      <aside class="auto-response-evidence" ?hidden="{{!timingAutoResponse}}"><strong>Auto-responded · {{timingAutoResponse.ruleName}}</strong><p>Transmog supplied this response using a saved response rule.</p><small>Recorded rule revision {{timingAutoResponse.ruleRevision}} · Response status {{timingAutoResponse.status}}</small></aside>
      <div class="details-scroll">
      <section id="details-panel-timings" role="tabpanel" aria-labelledby="details-tab-timings" ?hidden="{{detailsTab != 'timings'}}"><p class="field-help">{{timingSummary}}</p><p role="status">{{timingError}}</p>
        <if condition="bodyEditRows.length"><details class="recorded-body-edits"><summary>Recorded body edits</summary><p>Actual bounded operation results, with decoded input/output identities. No text values are stored in these reports. Missing, failed or interrupted evidence does not establish successful delivery. The comparison includes all observed upstream-to-client changes and reports missing or incomplete body evidence.</p><ul><for each="edit in bodyEditRows"><li key="{{edit.id}}"><strong>{{edit.id}} · {{edit.name}}</strong><p>{{edit.summary}}</p><code class="full-value">{{edit.identity}}</code><dl><dt>Decoded input SHA-256</dt><dd class="full-value">{{edit.beforeHash}}</dd><dt>Decoded output SHA-256</dt><dd class="full-value">{{edit.afterHash}}</dd></dl></li></for></ul><button type="button" class="secondary" @click="{compareResponseStages()}">Compare original and effective response</button></details></if><if condition="headerEffectRows.length"><details class="recorded-header-edits"><summary>Recorded header edits</summary><p>Observed head edits in execution order, with captured names and revisions. Header values are excluded. No-op replacements are recorded; absent rows do not establish that a rule was evaluated. Imported or truncated evidence may omit steps.</p><ul><for each="effect in headerEffectRows"><li key="{{effect.id}}"><strong>{{effect.sequence}} · {{effect.phase}} · {{effect.name}} · {{effect.state}}</strong><p>{{effect.details}}</p><code class="full-value">{{effect.identity}}</code></li></for></ul></details></if><if condition="responseEvidenceRows.length"><details class="response-file-evidence"><summary>Response file evidence</summary><dl class="timing-facts"><for each="field in responseEvidenceRows"><div key="{{field.id}}"><dt>{{field.label}}</dt><dd class="full-value">{{field.value}}<small>{{field.note}}</small></dd></div></for></dl></details></if>
        <if condition="timingSaved.length"><details ?open="{{!timingRows.length}}"><summary>Original imported timing and session evidence</summary><p class="field-help">These are the source capture's original attributes. Their names and clocks belong to that capture; missing or unset values are not inferred.</p><dl class="timing-facts"><for each="field in timingSaved"><div key="{{field.id}}"><dt>{{field.label}}</dt><dd>{{field.value}}</dd></div></for></dl></details></if>
        <if condition="timingRows.length">
        <if condition="timingWaterfall.length"><h3>Request waterfall</h3><p class="field-help">Rows can overlap. Solid bars are elapsed intervals; dashed windows show repeated calls, with measured call time listed separately.</p><div class="waterfall-axis"><span>0 ms · request headers</span><span>{{timingRange}}</span></div><div class="waterfall-rows"><for each="row in timingWaterfall"><div key="{{row.id}}" class="waterfall-row"><span title="{{row.label}}">{{row.label}}</span><svg class="waterfall-bar" viewBox="0 0 1000 18" preserveAspectRatio="none" role="img" aria-label="{{row.note}}"><rect class="waterfall-track" x="0" y="2" width="1000" height="14"></rect><rect class="waterfall-span" ?data-repeated="{{row.repeated}}" x="{{row.start}}" y="3" width="{{row.width}}" height="12"></rect><if condition="row.width == 0"><circle class="waterfall-zero" cx="{{row.start}}" cy="9" r="2"></circle></if></svg><span>{{row.value}}</span></div></for></div></if><if condition="timingMinor.length"><details><summary>Proxy operations under 1 ms ({{timingMinor.length}})</summary><p class="field-help">Measured call time includes nested work and waits. Bars share the waterfall scale above.</p><div class="waterfall-rows"><for each="row in timingMinor"><div key="{{row.id}}" class="waterfall-row"><span title="{{row.label}}">{{row.label}}</span><svg class="waterfall-bar" viewBox="0 0 1000 18" preserveAspectRatio="none" role="img" aria-label="{{row.note}}"><rect class="waterfall-track" x="0" y="2" width="1000" height="14"></rect><rect class="waterfall-span" ?data-repeated="{{row.repeated}}" x="{{row.start}}" y="3" width="{{row.width}}" height="12"></rect><if condition="row.width == 0"><circle class="waterfall-zero" cx="{{row.start}}" cy="9" r="2"></circle></if></svg><span>{{row.value}}</span></div></for></div></details></if><details><summary>Latency phase details</summary><p class="field-help">Phases can overlap. Unavailable means this point was not measured; zero is a measured duration.</p>
        <dl class="timing-facts"><for each="phase in timingPhases"><div key="{{phase.id}}"><dt>{{phase.label}}</dt><dd>{{phase.value}}<small>{{phase.note}}</small></dd></div></for></dl>
        </details><if condition="timingRows.length"><details><summary>Timeline observations</summary><div class="timing-table-scroll"><table><thead><tr><th scope="col">Observation</th><th scope="col">UTC time</th><th scope="col">From headers</th></tr></thead><tbody><for each="point in timingRows"><tr key="{{point.id}}"><th scope="row">{{point.label}}</th><td>{{point.time}}</td><td>{{point.offset}}</td></tr></for></tbody></table></div></details></if>
        </if>
<if condition="timingWork.length"><details><summary>Measured proxy work</summary><p class="field-help">Call time includes waits and nested work; it does not measure CPU usage. Repeated calls are aggregated without counting gaps between calls.</p><dl class="timing-facts"><for each="field in timingWork"><div key="{{field.id}}"><dt>{{field.label}}</dt><dd>{{field.value}}<small>{{field.note}}</small></dd></div></for></dl></details></if>

<details ?open="{{timingReportVisible}}"><summary>Report text</summary><textarea class="timing-report" aria-label="Timing report" readonly w-ref="{timingReportPreview}" rows="12"></textarea></details>
      <p role="status">{{timingStatus}}</p></section>
      <section id="details-panel-security" role="tabpanel" aria-label="Connection and certificates" ?hidden="{{detailsTab != 'connection' && detailsTab != 'certificates'}}"><div ?hidden="{{detailsTab != 'connection'}}">        <h3>Physical connections</h3><details><summary>About these measurements</summary><p class="field-help">Setup waits belong to this request; notes preserve the original connection phases. Socket counters include every HTTP stream on the connection. TCP counts socket payload, including TLS, without IP/TCP headers or kernel retransmissions. Kernel TCP statistics are shown when supported. Retransmissions are connection totals, not proof of where packets were lost. Socket writes and flushes show local acceptance, not client receipt.</p></details>
        <if condition="!timingTransports.length"><p>No physical connection measurements were saved.</p></if>
        <for each="transport in timingTransports"><details key="{{transport.id}}"><summary>{{transport.title}}</summary><p class="field-help full-value">{{transport.summary}}</p><dl class="timing-facts"><for each="field in transport.fields"><div key="{{field.id}}"><dt>{{field.label}}</dt><dd>{{field.value}}<small>{{field.note}}</small></dd></div></for></dl></details></for>
</div>
      <p class="field-help" ?hidden="{{detailsTab != 'certificates'}}">Public certificates recorded for this request.</p>

      <section id="details-panel-source" role="tabpanel" aria-labelledby="details-tab-source" ?hidden="{{detailsTab != 'source'}}"><h3>{{metadataTraceName}}</h3><p class="full-value">{{metadataSummary}}</p><p class="full-value">{{sourceRequestIdentity}}</p><button type="button" class="secondary" @click="{copyRequestSource()}">Copy source details</button><p role="status">{{metadataError}}</p><if condition="metadataNetworkTitle"><h3>{{metadataNetworkTitle}}</h3><p class="field-help">{{metadataNetworkSummary}}</p><if condition="metadataNetworkContext"><pre class="trace-context">{{metadataNetworkContext}}</pre></if><if condition="!metadataNetworkContext"><p>No network configuration output was available.</p></if></if><if condition="metadataContext"><pre class="trace-context">{{metadataContext}}</pre></if>
      <for each="note in metadataNotes"><p key="{{note.id}}" class="field-help">{{note.text}}</p></for></section>
      </div><footer class="actions"><button type="button" class="secondary" ?hidden="{{detailsTab != 'timings'}}" @click="{copyTimings()}" ?disabled="{{timingBusy || !timingReportText}}">Copy report</button><button type="button" class="secondary" ?hidden="{{detailsTab != 'timings' && detailsTab != 'connection'}}" @click="{refreshTimings()}" ?disabled="{{timingBusy}}">Refresh measurements</button><button type="button" class="secondary" @click="{closeTimings()}">Close</button></footer>
    </dialog>

    <dialog w-ref="{flagDialog}" class="trace-metadata-dialog" aria-labelledby="flag-heading" @close="{flagClosed()}" @cancel="{closeFlag()}"><h2 id="flag-heading">Add marker</h2><p>{{flagRequestLabel}}</p><form @submit="{addMarker(e)}"><label>At<select value="{{flagBoundary}}" @change="{changeFlagBoundary(e)}"><option value="request" ?selected="{{flagBoundary == 'request'}}">Request</option><option value="response" ?selected="{{flagBoundary == 'response'}}">Response</option></select></label><label>Note (optional)<textarea w-ref="{flagNote}" rows="3"></textarea></label><p class="field-help">Save a copy to keep your marker. When response timing is unavailable, the marker uses the request time.</p><p role="status">{{flagStatus}}</p><footer class="actions"><button type="submit" ?disabled="{{flagBusy}}">Add marker</button><button type="button" class="secondary" @click="{closeFlag()}" ?disabled="{{flagBusy}}">Cancel</button></footer></form></dialog>
    <dialog w-ref="{markerUnsaved}" class="trace-metadata-dialog" aria-labelledby="marker-unsaved-heading" @cancel="{resolveMarkerUnsaved('stay')}"><h2 id="marker-unsaved-heading">Save your marker changes?</h2><p>Save a copy to keep your changes.</p><footer class="actions"><button type="button" @click="{resolveMarkerUnsaved('save')}">Save copy…</button><button type="button" class="secondary" @click="{resolveMarkerUnsaved('discard')}">Discard changes</button><button type="button" class="secondary" @click="{resolveMarkerUnsaved('stay')}">Keep reviewing</button></footer></dialog>
    <dialog w-ref="{metadataDialog}" class="trace-metadata-dialog" aria-labelledby="trace-metadata-heading" @close="{metadataClosed()}">
      <h2 id="trace-metadata-heading">Trace metadata</h2><p class="field-help">Original context belongs to its source capture. Requests imported from different files keep their own trace association.</p>
      <label>Source trace<select w-ref="{metadataSelector}" @change="{changeMetadataTrace(e)}" ?disabled="{{metadataBusy || !traceMetadataRows.length}}"><for each="trace in metadataTraceOptions"><option key="{{trace.id}}" value="{{trace.id}}">{{trace.label}}</option></for></select></label>

      <button type="button" class="secondary" @click="{reviewMetadataMarkers()}">Review markers</button>
      <h3>{{metadataTraceName}}</h3><p class="full-value">{{metadataSummary}}</p><p class="full-value">{{sourceRequestIdentity}}</p><p role="status">{{metadataError}}</p><if condition="metadataNetworkTitle"><h3>{{metadataNetworkTitle}}</h3><p class="field-help">{{metadataNetworkSummary}}</p><if condition="metadataNetworkContext"><pre class="trace-context">{{metadataNetworkContext}}</pre></if><if condition="!metadataNetworkContext"><p>No network configuration output was available.</p></if></if><if condition="metadataContext"><pre class="trace-context">{{metadataContext}}</pre></if>

    <div id="traffic-search-options" class="table-popover search-options" popover="auto"><strong>Search options</strong>

      <strong>Search in</strong><label><input type="checkbox" ?checked="{{searchMetadata}}" @change="{setSearchOption('searchMetadata',e)}"> URL, method, process, PID and status</label><label><input type="checkbox" ?checked="{{searchRequestHeaders}}" @change="{setSearchOption('searchRequestHeaders',e)}"> Request headers</label><label><input type="checkbox" ?checked="{{searchResponseHeaders}}" @change="{setSearchOption('searchResponseHeaders',e)}"> Response headers</label><label><input type="checkbox" ?checked="{{searchRequestBodies}}" @change="{setSearchOption('searchRequestBodies',e)}"> Decoded text request bodies</label><label><input type="checkbox" ?checked="{{searchBodies}}" @change="{setSearchOption('searchBodies',e)}"> Decoded text response bodies</label>
      <label><input type="checkbox" ?checked="{{selectSearchMatches}}" @change="{setSearchOption('selectSearchMatches',e)}"> Select all matches after searching</label><p class="field-help">Successful searches reset the selection; Select all matches selects the current matches. Cancellation or failure preserves the previous selection. Binary bodies are skipped. Text bodies are searched within a 16 MiB limit.</p>

        <div class="filter-picker-heading"><label>Filter by <select w-ref="{filterField}" aria-label="Filter field" @change="{changePickerDimension(e)}"><for each="field in pickerFields"><option key="{{field.id}}" value="{{field.id}}" ?selected="{{field.id == pickerDimension}}">{{field.label}}</option></for></select></label><button type="button" aria-label="Close filter" @click="{closePicker()}">×</button></div>
        <p class="filter-picker-hint">Choose any values. Different fields narrow results.</p>
        <p class="filter-picker-hint" role="status"><if condition="pickerLoading">Loading counts…</if><if condition="!pickerLoading && !pickerError">{{pickerScope}}</if></p>
        <if condition="pickerError"><p class="filter-picker-error" role="status">{{pickerError}}</p><button type="button" @click="{loadFacets()}">Retry counts</button></if>
        <div class="filter-observed" ?hidden="{{!pickerObserved}}"><input type="search" w-ref="{observedSearch}" aria-label="Search observed values" placeholder="Search observed values" maxlength="255" @input="{observedSearchChanged(e)}" @keydown="{observedSearchKey(e)}"><button type="button" ?hidden="{{!pickerSearch}}" @click="{addObservedValue()}">Use exact value “{{pickerSearch}}”</button></div>
        <div class="filter-options" role="group" aria-label="Filter values"><for each="option in pickerOptions"><label key="{{option.key}}"><input id="filter-option-{{option.key}}" type="checkbox" aria-label="{{option.label}}" aria-describedby="filter-count-{{option.key}}" ?checked="{{option.selected}}" @change="{togglePickerValue(option.key,e)}" @blur="{pickerOptionBlurred()}"><span>{{option.label}}</span><span id="filter-count-{{option.key}}" class="filter-option-count" aria-label="{{option.countText}} entries">{{option.countText}}</span></label></for>
          <if condition="pickerMoreOptions.length"><details><summary>More values ({{pickerMoreOptions.length}})</summary><for each="option in pickerMoreOptions"><label key="{{option.key}}"><input id="filter-option-{{option.key}}" type="checkbox" aria-label="{{option.label}}" aria-describedby="filter-count-{{option.key}}" ?checked="{{option.selected}}" @change="{togglePickerValue(option.key,e)}" @blur="{pickerOptionBlurred()}"><span>{{option.label}}</span><span id="filter-count-{{option.key}}" class="filter-option-count" aria-label="{{option.countText}} entries">{{option.countText}}</span></label></for></details></if>
        </div>
        <div class="filter-observed-footer" ?hidden="{{!pickerObserved}}"><span>{{pickerSuggestionHint}}</span><button type="button" ?hidden="{{!pickerCanMore}}" ?disabled="{{pickerLoading}}" @click="{loadMoreFacets()}">Load more</button></div>
        <div class="filter-range" ?hidden="{{!pickerRange}}"><div class="filter-range-tools"><strong>Inclusive range</strong><select aria-label="Range units" ?hidden="{{pickerTime || pickerRangeKind == 'integer'}}" @change="{changeRangeUnit(e)}"><for each="unit in pickerRangeUnits"><option key="{{unit.value}}" value="{{unit.value}}" ?selected="{{unit.value == pickerRangeUnit}}">{{unit.label}}</option></for></select><select aria-label="Range preset" ?hidden="{{!pickerPresets.length}}" @change="{rangePreset(e)}"><option value="">Presets…</option><for each="preset in pickerPresets"><option key="{{preset.value}}" value="{{preset.value}}">{{preset.label}}</option></for></select></div><div class="filter-range-bounds"><label>From<input type="{{pickerRangeInput}}" w-ref="{filterFrom}" aria-label="Range from inclusive" step="0.001" maxlength="64" @input="{rangeEdited(e)}" placeholder="No lower bound"></label><label>To<input type="{{pickerRangeInput}}" w-ref="{filterTo}" aria-label="Range to inclusive" step="0.001" maxlength="64" @input="{rangeEdited(e)}" placeholder="No upper bound"></label></div><p class="filter-picker-hint">Blank bounds are unrestricted. Ranges match measured values.</p><p class="filter-picker-hint" ?hidden="{{!pickerTime}}">{{pickerTimeZone}}</p></div>
        <p class="filter-picker-hint" ?hidden="{{!pickerRangeNotice}}">{{pickerRangeNotice}}</p>
        <if condition="pickerOmission"><p class="filter-picker-hint">{{pickerOmission}}</p></if>
        <details class="filter-custom" ?open="{{!pickerOptions.length || pickerConstraints.length}}" ?hidden="{{!pickerCustom}}"><summary>Custom match</summary><for each="condition in pickerConstraints"><div key="{{condition.operator}}" class="filter-condition"><span>{{condition.operator}} {{condition.value}}</span><button type="button" aria-label="Remove {{condition.operator}} condition" @click="{removePickerConstraint(condition.operator)}">×</button></div></for><label>Comparison<select w-ref="{filterOperator}" aria-label="Filter comparison"><option value="contains" ?hidden="{{pickerNumeric}}">Contains</option><option value="equals">Equals</option><option value="minimum" ?hidden="{{!pickerNumeric}}">At least</option><option value="maximum" ?hidden="{{!pickerNumeric}}">At most</option></select></label><input w-ref="{filterInput}" @input="{clearFilterValidity()}" aria-label="Column filter value" placeholder="{{pickerPlaceholder}}" maxlength="255"><p class="filter-picker-hint">Custom conditions also apply to the selected values. A new condition replaces the same comparison.</p></details>
        <div class="filter-picker-footer"><button type="button" class="secondary compact-button" @click="{clearPicker()}">Clear selection</button><button type="submit" class="compact-button">Apply filter</button></div>
      </form>
    </div>
    <div id="stream-disclosure" class="table-popover stream-disclosure" w-ref="{streamDisclosure}" popover="auto" aria-label="Stream details and filters" @keydown="{streamDisclosureKey(e)}"><strong class="popover-title">{{streamDisclosureLabel}} · {{streamDisclosureState}}</strong><p>{{streamDisclosureTiming}}</p><p>{{streamDisclosureHttp}}</p><button type="button" w-ref="{streamTypeButton}" @click="{filterDisclosedStream()}">{{streamTypeAction}}</button><button type="button" @click="{filterDisclosedStream(true)}">{{streamStateAction}}</button><button type="button" @click="{closeStreamDisclosure()}">Close</button></div>
    <div id="table-settings" w-ref="{viewMenu}" class="table-popover table-settings" popover="auto">
      <div class="view-menu-heading"><strong>View</strong><button type="button" class="secondary compact-button" @click="{openViewer()}" ?disabled="{{openingViewer}}" aria-keyshortcuts="Control+N" title="Open new viewer window (Ctrl+N)">Open new viewer window</button></div>
      <label>Layout <select aria-label="Traffic layout" @change="{setLayout(e)}"><option value="stacked" ?selected="{{preferences.layout == 'stacked'}}">Inspector below</option><option value="side-by-side" ?selected="{{preferences.layout == 'side-by-side'}}">Inspector beside</option></select></label>
      <label><input type="checkbox" ?checked="{{preferences.compactRows}}" @change="{setCompact(e)}"> Compact rows</label>
      <if condition="!timelineMode"><details class="list-column-settings"><summary>List columns</summary><for each="column in settingsColumns"><label key="{{column.id}}"><input type="checkbox" ?checked="{{column.visible}}" @change="{setVisible(column.id,e)}"> {{column.label}}</label></for>
      <p class="column-hint">Drag headers to reorder. Drag their edges to resize; double-click an edge to fit.</p><button type="button" @click="{resetColumns()}">Reset columns</button></details></if>
    </div>
  </section>
</template>
