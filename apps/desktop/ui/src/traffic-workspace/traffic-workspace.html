<template>
  <section id="traffic" class="app-view traffic-view" aria-labelledby="traffic-heading" ?hidden="{{view != 'traffic'}}" ?data-active="{{view == 'traffic'}}">
    <header class="view-toolbar">
      <div class="view-title"><h1 id="traffic-heading">Traffic</h1></div>
      <form w-ref="{filterForm}" class="filters" @submit="{refreshSessions(e)}">
        <label class="traffic-search"><span class="sr-only">Search traffic</span><input w-ref="{searchInput}" name="search" type="search" placeholder="Search URL, host, process or PID" maxlength="255" @input="{searchChanged(e)}"></label>
        <button type="submit" class="secondary compact-button">Search</button>
      </form>
      <div class="traffic-tools">
        <autoresponse-switch :state="{{autoresponseState}}" :busy="{{autoresponsePending}}"></autoresponse-switch>
        <button type="button" class="secondary compact-button" popovertarget="filter-fields">Filter <if condition="filters.length">({{filters.length}})</if></button>
        <button type="button" class="secondary compact-button" popovertarget="table-settings">Table settings</button>
      </div>
    </header>
    <div class="traffic-summary"><output class="session-status" data-kind="{{sessionKind}}">{{sessionText}}</output><span class="sort-summary">{{sortLabel}}</span></div>
    <if condition="filters.length || searchText">
      <div class="filter-chips"><for each="filter in filters"><button key="{{filter.label}}" type="button" class="filter-chip" aria-label="Remove {{filter.label}} filter" @click="{removeFilter(filter.column,filter.operator)}">{{filter.label}} ×</button></for><button type="button" class="clear-filters" @click="{clearFilters()}">Clear filters</button></div>
    </if>
    <div class="traffic-workspace" data-layout="{{preferences.layout}}" data-list-share="{{listShare}}">
      <section class="session-list-pane" aria-label="Captured traffic" @keydown="{listKeyboard(e)}">
        <div class="traffic-selection-bar" ?hidden="{{!selectedTrafficCount}}"><span role="status">{{trafficSelectionText}}</span><button type="button" class="secondary compact-button" @click="{selectedResponses()}" ?disabled="{{removingTraffic}}">{{trafficCreateLabel}}</button><button type="button" class="secondary compact-button" popovertarget="traffic-entry-menu" @click="{positionTrafficMenu(e)}">More</button></div>
        <div w-ref="{sessionScroller}" class="table-wrap" @scroll="{sessionScrolled()}">
          <table w-ref="{trafficTable}" class="traffic-table" role="grid" aria-multiselectable="true" aria-label="Traffic entries" data-width="{{tableWidth}}" ?data-wrap="{{preferences.wrapCells}}" ?data-compact="{{preferences.compactRows}}">
            <colgroup><for each="column in columns"><col key="{{column.id}}" data-width="{{column.widthCss}}"></for></colgroup>
            <thead><tr><for each="column in columns">
              <th key="{{column.id}}" id="header-{{column.id}}" scope="col" data-column-id="{{column.id}}" ?data-pinned="{{column.pinned}}" data-offset="{{column.offsetCss}}" aria-sort="{{column.sortDirection}}" ?data-dragging="{{column.id == draggingColumn}}" ?data-drop-target="{{column.id == dropColumnId}}" data-drop-placement="{{dropPlacement}}">
                <button type="button" class="column-trigger" popovertarget="column-actions" @click="{openColumnMenu(column.id,e)}" @pointerdown="{startColumnDrag(column.id,e)}" @pointermove="{moveColumnDrag(e)}" @pointerup="{finishColumnDrag(e)}" @pointercancel="{cancelColumnDrag(e)}" @lostpointercapture="{cancelColumnDrag(e)}" @keydown="{cancelColumnDrag(e)}" title="Click to sort or filter; drag to move {{column.label}}"><span class="column-label">{{column.label}}</span><span class="sort-arrow">{{column.sortArrow}}</span><span class="column-caret" aria-hidden="true">⌄</span></button>
                <span class="column-resizer" role="separator" tabindex="0" aria-orientation="vertical" aria-label="Resize {{column.label}} column" aria-valuemin="32" aria-valuemax="1200" aria-valuenow="{{column.width}}" @pointerdown="{startColumnResize(column.id,e)}" @pointermove="{resizeColumn(e)}" @pointerup="{finishColumnResize(e)}" @pointercancel="{cancelColumnResize(e)}" @keydown="{resizeColumnWithKeyboard(column.id,e)}" @dblclick="{fitColumn(column.id)}"></span>
              </th>
            </for></tr></thead>
            <tbody>
              <if condition="!sessions.length"><tr><td colspan="{{columns.length}}" class="empty-cell">No matching exchanges.<br>Capture traffic or adjust your filters.</td></tr></if>
              <for each="session in sessions">
                <tr key="{{session.id}}" id="session-{{session.id}}" tabindex="0" aria-label="{{session.rowLabel}}" data-session-id="{{session.id}}" data-tone="{{session.tone}}" ?data-selected="{{session.selectionState == 'true'}}" aria-selected="{{session.selectionState}}" @click="{selectTraffic(session,e)}" @keydown="{selectWithKeyboard(session,e)}" @contextmenu="{openTrafficMenu(session,e)}">
                  <for each="cell in session.cells">
                    <td key="{{cell.id}}" data-column-id="{{cell.id}}" data-offset="{{cell.offsetCss}}" ?data-pinned="{{cell.pinned}}" ?data-numeric="{{cell.numeric}}" title="{{cell.title}}">
                      <if condition="cell.id == 'method'"><button type="button" class="session-link" @click="{selectWithButton(session,e)}">{{cell.text}}</button></if>
                      <if condition="cell.id != 'method'"><span class="cell-value" data-tone="{{cell.tone}}">{{cell.text}}</span></if>
                      <if condition="session.autoResponse && cell.id == 'status'"><span class="auto-badge" title="Served by an auto-response rule">AUTO</span></if>
                      <if condition="session.loss && cell.id == 'state'"><span title="Some exchange evidence was omitted"> · loss</span></if>
                    </td>
                  </for>
                </tr>
              </for>
            </tbody>
          </table>
        </div>
        <div class="traffic-undo" ?hidden="{{!trafficUndoText}}"><span role="status">{{trafficUndoText}}</span><button w-ref="{trafficUndoButton}" type="button" class="secondary compact-button" @click="{undoTrafficRemoval()}" ?disabled="{{removingTraffic}}">Undo traffic removal</button></div>
        <div class="list-footer">
          <span>{{followText}}</span>
          <div class="list-footer-actions">
            <if condition="updatesPending"><button type="button" class="new-traffic-button compact-button" @click="{showUpdates()}"><if condition="newTrafficCount">{{newTrafficCount}} new · </if>Show updates</button></if>
            <button type="button" class="secondary compact-button" @click="{resumeLatest()}" ?disabled="{{followLatest}}">Follow live</button>
            <span class="page-controls" ?hidden="{{totalMatched <= pageLimit}}"><button type="button" class="secondary compact-button" @click="{navigatePage(-1)}" ?disabled="{{pageIndex == 0}}">Previous</button><button type="button" class="secondary compact-button" @click="{navigatePage(1)}" ?disabled="{{pageEnd >= totalMatched}}">Next</button></span>
            <button type="button" class="secondary compact-button" @click="{exportLiveCapture()}">Export TMCap</button>
          </div>
        </div>
      </section>
      <pane-divider orientation="{{dividerOrientation}}" label="Resize traffic list and inspector" value="{{preferences.listSplit}}" initial="45" @pane-resize="{resizeList(e)}"></pane-divider>
      <section class="details-pane" aria-labelledby="inspector-heading">
        <header class="selection-bar">
          <span class="method-badge">{{selectedMethodText}}</span><button id="inspector-heading" class="selected-url" type="button" title="Show full URL" popovertarget="selected-url-full" ?disabled="{{!selectedSessionId}}">{{selectedUrlText}}</button><span class="status-badge" data-tone="{{selectedTone}}">{{selectedStatusText}}</span>
          <div class="selection-actions"><button type="button" class="secondary compact-button" @click="{replaySelected()}" ?disabled="{{!selectedDetail}}">Edit and replay</button><button type="button" class="secondary compact-button" title="{{reuseTitle}}" @click="{beginAutoResponseFromSelected()}" ?disabled="{{reuseDisabled}}">Create auto-response</button><button type="button" class="secondary compact-button" @click="{showMatchedAutoResponse()}" ?hidden="{{!matchedRuleId}}">{{matchedRuleLabel}}</button></div>
        </header>
        <div class="inspector-side-tabs" role="group" aria-label="Message to inspect"><button type="button" ?data-selected="{{inspectorSide == 'request'}}" @click="{showInspectorSide('request')}">Request</button><button type="button" ?data-selected="{{inspectorSide == 'response'}}" @click="{showInspectorSide('response')}">Response</button></div>
        <div class="exchange-inspector" data-side="{{inspectorSide}}" data-request-share="{{requestShare}}" @inspector-resize="{resizeMessage(e)}">
          <message-inspector side="request" split="{{preferences.requestBodySplit}}" :detail="{{selectedDetail}}"></message-inspector>
          <pane-divider orientation="vertical" label="Resize request and response inspectors" value="{{preferences.requestSplit}}" initial="45" @pane-resize="{resizeRequest(e)}"></pane-divider>
          <message-inspector side="response" split="{{preferences.responseBodySplit}}" :detail="{{selectedDetail}}"></message-inspector>
        </div>
      </section>
    </div>

    <div id="selected-url-full" class="table-popover url-popover" popover="auto"><strong>Selected URL</strong><p class="full-value">{{selectedUrlText}}</p><button type="button" @click="{copyUrl()}">Copy URL</button></div>
    <div id="traffic-entry-menu" w-ref="{trafficMenu}" class="table-popover traffic-entry-menu" data-x="{{trafficMenuX}}" data-y="{{trafficMenuY}}" popover="auto"><strong>{{trafficSelectionText}}</strong><button type="button" @click="{selectedResponses()}">{{trafficCreateLabel}}</button><button type="button" @click="{copyRequest('curl')}" ?disabled="{{selectedTrafficCount != 1 || commandBusy}}">Copy as cURL</button><if condition="windowsCommands"><button type="button" @click="{copyRequest('powershell')}" ?disabled="{{selectedTrafficCount != 1 || commandBusy}}">Copy as PowerShell</button></if><button type="button" @click="{copyAllHeaders()}" ?disabled="{{selectedTrafficCount != 1 || commandBusy}}">Copy all headers</button><button type="button" @click="{replaySelected()}" ?disabled="{{selectedTrafficCount != 1}}">Edit and replay</button><button type="button" @click="{removeSelectedTraffic()}" ?disabled="{{removingTraffic}}">Remove from Traffic <kbd>Del</kbd></button><button type="button" @click="{clearTrafficSelection()}">Clear selection</button><p class="field-help">Shift selects a range; Ctrl adds entries. Removal preserves saved responses and capture files.</p></div>

    <dialog w-ref="{commandDialog}" class="request-command-dialog" aria-labelledby="command-heading">
      <h2 id="command-heading">{{commandTitle}}</h2>
      <p class="field-help">This only copies text. Transmog never runs the generated command.</p>
      <for each="notice in commandNotices"><p key="{{notice.id}}" class="field-help">{{notice.text}}</p></for>
      <if condition="commandFileRequired"><p>This command uses a file containing the complete original request body.</p><button type="button" @click="{saveRequestBody()}" ?disabled="{{commandBusy || !commandFileAvailable}}">Save as…</button><if condition="!commandFileAvailable"><p class="field-help">Complete bytes are unavailable. You can supply your own body file.</p></if></if>
      <textarea w-ref="{commandPreview}" aria-label="Generated command" readonly spellcheck="false"></textarea>
      <p role="status">{{commandStatus}}</p>
      <footer class="actions"><button type="button" @click="{copyCommand()}" ?disabled="{{commandBusy || !commandText}}">Copy command</button><button type="button" class="secondary" @click="{closeCommand()}">Close</button></footer>
    </dialog>

    <div id="column-actions" class="table-popover column-menu" w-ref="{columnMenu}" popover="auto" data-x="{{menuX}}" data-y="{{menuY}}">
      <strong class="popover-title">{{menuColumn.label}}</strong>
      <button type="button" autofocus @click="{applySort('ascending')}">↑ {{ascendingLabel}}</button>
      <button type="button" @click="{applySort('descending')}">↓ {{descendingLabel}}</button>
      <if condition="menuColumn.id == 'process'"><button type="button" @click="{applySort('ascending','pid')}">Sort by PID</button></if>
      <button type="button" @click="{clearSort()}">Reset to newest first</button>
      <form class="column-filter" @submit="{applyFilter(e)}">
        <label>Filter {{menuColumn.label}}<select w-ref="{filterOperator}" aria-label="Filter comparison"><option value="contains" ?hidden="{{menuColumn.numeric}}">Contains</option><option value="equals">Equals</option><option value="minimum" ?hidden="{{!menuColumn.numeric}}">At least</option><option value="maximum" ?hidden="{{!menuColumn.numeric}}">At most</option></select></label>
        <input w-ref="{filterInput}" aria-label="Column filter value" placeholder="{{menuColumn.placeholder}}" maxlength="255"><button type="submit">Apply filter</button>
      </form>
      <button type="button" @click="{pinColumn()}">{{pinLabel}}</button><button type="button" @click="{hideColumn()}">Hide column</button>
      <div class="column-menu-moves"><button type="button" @click="{moveColumn(-1)}">Move left</button><button type="button" @click="{moveColumn(1)}">Move right</button></div>
    </div>
    <div id="filter-fields" class="table-popover filter-menu" popover="auto"><strong class="popover-title">Filter by</strong><for each="column in settingsColumns"><button key="{{column.id}}" type="button" popovertarget="column-actions" @click="{openColumnMenu(column.id,e)}">{{column.label}}</button></for></div>
    <div id="table-settings" class="table-popover table-settings" popover="auto">
      <strong class="popover-title">Table settings</strong><label>Layout <select aria-label="Traffic layout" @change="{setLayout(e)}"><option value="stacked" ?selected="{{preferences.layout == 'stacked'}}">List above inspector</option><option value="side-by-side" ?selected="{{preferences.layout == 'side-by-side'}}">List beside inspector</option></select></label>
      <label><input type="checkbox" ?checked="{{preferences.wrapCells}}" @change="{setWrap(e)}"> Wrap cells</label><label><input type="checkbox" ?checked="{{preferences.compactRows}}" @change="{setCompact(e)}"> Compact rows</label>
      <strong class="popover-title">Columns</strong><for each="column in settingsColumns"><label key="{{column.id}}"><input type="checkbox" ?checked="{{column.visible}}" @change="{setVisible(column.id,e)}"> {{column.label}}</label></for>
      <p class="column-hint">Drag headers to reorder. Drag their edges to resize; double-click an edge to fit.</p><button type="button" @click="{resetColumns()}">Reset columns</button><button type="button" @click="{resetLayout()}">Restore default layout and columns</button>
    </div>
  </section>
</template>
