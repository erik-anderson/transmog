<template>
  <section id="traffic" class="app-view traffic-view" aria-labelledby="traffic-heading" ?hidden="{{view != 'traffic'}}" ?data-active="{{view == 'traffic'}}">
    <div class="traffic-toolbar-stack"><header class="view-toolbar">
      <div class="view-title"><h1 id="traffic-heading">Traffic</h1></div>
      <form w-ref="{filterForm}" class="filters" @submit="{runContentSearch(e)}">
        <label class="traffic-search"><span class="sr-only">Search traffic</span><input w-ref="{searchInput}" name="search" type="search" placeholder="Search captured traffic" maxlength="4096" @input="{searchChanged(e)}"></label>
        <button type="submit" class="secondary compact-button" ?disabled="{{searchingTraffic}}">Search</button><button type="button" class="secondary compact-button" popovertarget="traffic-search-options" aria-label="Search options" title="Search options">⋯</button>
      </form>
      <div class="traffic-tools">
        <if condition="!viewerMode"><autoresponse-switch :state="{{autoresponseState}}" :busy="{{autoresponsePending}}"></autoresponse-switch></if>
        <button type="button" class="secondary compact-button" @click="{openSavedTrace(false)}" ?disabled="{{importingTrace}}">Import…</button>
        <button type="button" class="secondary compact-button" popovertarget="trace-files-menu">Files</button>
        <button type="button" class="secondary compact-button" popovertarget="filter-fields">Filter <if condition="filters.length">({{filters.length}})</if></button>
        <button type="button" class="secondary compact-button" popovertarget="table-settings">Table settings</button>
      </div>
    </header>
    <if condition="contentSearchStatus"><div class="content-search-status"><span role="status">{{contentSearchStatus}}</span><if condition="searchingTraffic"><button type="button" class="secondary compact-button" @click="{cancelContentSearch()}">Cancel search</button></if></div></if>
    <if condition="contentSearchActive"><div class="content-search-results"><span class="search-result-label" title="{{contentSearchLabel}}">Search results: {{contentSearchLabel}}</span><button type="button" class="secondary compact-button" @click="{selectAllSearchMatches()}" ?disabled="{{searchingTraffic}}">Select all {{contentMatchCount}} matches</button><button type="button" class="secondary compact-button" @click="{clearContentSearch()}">Clear search</button><span class="field-help"><if condition="viewerMode">Search again after importing more traffic.</if><if condition="!viewerMode">Search again to include newly captured traffic.</if></span></div></if>
    <if condition="importStatus"><div class="trace-import-status"><span role="status">{{importStatus}}</span><if condition="importingTrace"><progress aria-label="Indexing saved traffic" value="{{importPercent}}" max="100"></progress><button type="button" class="secondary compact-button" @click="{cancelImport()}">Cancel import</button></if></div></if>
    <div class="traffic-summary"><output class="session-status" data-kind="{{sessionKind}}">{{sessionText}}</output><span class="sort-summary">{{sortLabel}}</span></div>
    <if condition="filters.length">
      <div class="filter-chips"><for each="filter in filters"><button key="{{filter.label}}" type="button" class="filter-chip" aria-label="Remove {{filter.label}} filter" @click="{removeFilter(filter.column,filter.operator)}">{{filter.label}} ×</button></for><button type="button" class="clear-filters" @click="{clearFilters()}">Clear filters</button></div>
    </if>
    </div><div class="traffic-workspace" data-layout="{{preferences.layout}}" data-list-share="{{listShare}}">
      <section class="session-list-pane" aria-label="Captured traffic" @keydown="{listKeyboard(e)}">
        <div class="traffic-selection-bar" ?hidden="{{!selectedTrafficCount && !contentSearchActive}}"><span role="status">{{trafficSelectionText}}</span><button type="button" class="secondary compact-button" ?hidden="{{viewerMode}}" @click="{selectedResponses()}" ?disabled="{{removingTraffic || !selectedTrafficCount}}">{{trafficCreateLabel}}</button><button type="button" class="secondary compact-button" popovertarget="traffic-entry-menu" @click="{positionTrafficMenu(e)}">More</button></div>
        <div w-ref="{sessionScroller}" class="table-wrap" @scroll="{sessionScrolled()}">
          <table w-ref="{trafficTable}" class="traffic-table" role="grid" aria-multiselectable="true" aria-label="Traffic entries" data-width="{{tableWidth}}" ?data-wrap="{{preferences.wrapCells}}" ?data-compact="{{preferences.compactRows}}">
            <colgroup><for each="column in columns"><col key="{{column.id}}" data-width="{{column.widthCss}}"></for></colgroup>
            <thead><tr><for each="column in columns">
              <th key="{{column.id}}" id="header-{{column.id}}" scope="col" data-column-id="{{column.id}}" ?data-pinned="{{column.pinned}}" data-offset="{{column.offsetCss}}" aria-sort="{{column.sortDirection}}" ?data-dragging="{{column.id == draggingColumn}}" ?data-drop-target="{{column.id == dropColumnId}}" data-drop-placement="{{dropPlacement}}">
                <button type="button" class="column-trigger" popovertarget="column-actions" @click="{openColumnMenu(column.id,e)}" @pointerdown="{startColumnDrag(column.id,e)}" @pointermove="{moveColumnDrag(e)}" @pointerup="{finishColumnDrag(e)}" @pointercancel="{cancelColumnDrag(e)}" @lostpointercapture="{cancelColumnDrag(e)}" @keydown="{cancelColumnDrag(e)}" title="Click to sort or filter; drag to move {{column.label}}"><span class="column-label">{{column.label}}</span><span class="sort-arrow">{{column.sortArrow}}</span><span class="column-caret" aria-hidden="true">⌄</span></button>
                <span class="column-resizer" role="separator" tabindex="0" aria-orientation="vertical" aria-label="Resize {{column.label}} column" aria-valuemin="32" aria-valuemax="1200" aria-valuenow="{{column.width}}" @pointerdown="{startColumnResize(column.id,e)}" @pointermove="{resizeColumn(e)}" @pointerup="{finishColumnResize(e)}" @pointercancel="{cancelColumnResize(e)}" @keydown="{resizeColumnWithKeyboard(column.id,e)}" @dblclick="{fitColumn(column.id)}"></span>
              </th>
            </for></tr></thead>
            <tbody>
              <if condition="!sessions.length"><tr><td colspan="{{columns.length}}" class="empty-cell">No matching exchanges.<br>Capture traffic or adjust your filters.</td></tr></if>
              <for each="session in sessions">
                <tr key="{{session.id}}" id="session-{{session.id}}" tabindex="0" aria-label="{{session.rowLabel}}" data-session-id="{{session.id}}" data-tone="{{session.tone}}" ?data-selected="{{session.selectionState == 'true'}}" aria-selected="{{session.selectionState}}" @click="{selectTraffic(session,e)}" @keydown="{selectWithKeyboard(session,e)}" @contextmenu="{openTrafficMenu(session,e)}">
                  <for each="cell in session.cells">
                    <td key="{{cell.id}}" data-column-id="{{cell.id}}" data-offset="{{cell.offsetCss}}" ?data-pinned="{{cell.pinned}}" ?data-numeric="{{cell.numeric}}" title="{{cell.title}}">
                      <if condition="cell.id == 'method'"><button type="button" class="session-link" @click="{selectWithButton(session,e)}">{{cell.text}}</button></if>
                      <if condition="cell.id != 'method'"><span class="cell-value" data-tone="{{cell.tone}}">{{cell.text}}</span></if>
                      <if condition="session.autoResponse && cell.id == 'status'"><span class="auto-badge" title="Served by an auto-response rule">AUTO</span></if>
                      <if condition="session.loss && cell.id == 'state'"><span title="Some exchange evidence was omitted"> · loss</span></if>
                    </td>
                  </for>
                </tr>
              </for>
            </tbody>
          </table>
        </div>
        <div class="traffic-undo" ?hidden="{{!trafficUndoText}}"><span role="status">{{trafficUndoText}}</span><button w-ref="{trafficUndoButton}" type="button" class="secondary compact-button" @click="{undoTrafficRemoval()}" ?disabled="{{removingTraffic}}">Undo traffic removal</button></div>
        <div class="list-footer">
          <span>{{followText}}</span>
          <div class="list-footer-actions">
            <if condition="updatesPending"><button type="button" class="new-traffic-button compact-button" @click="{showUpdates()}"><if condition="newTrafficCount">{{newTrafficCount}} new · </if>Show updates</button></if>
            <button type="button" class="secondary compact-button" ?hidden="{{viewerMode}}" @click="{resumeLatest()}" ?disabled="{{followLatest}}">Follow live</button>
            <span class="page-controls" ?hidden="{{totalMatched <= pageLimit}}"><button type="button" class="secondary compact-button" @click="{navigatePage(-1)}" ?disabled="{{pageIndex == 0}}">Previous</button><button type="button" class="secondary compact-button" @click="{navigatePage(1)}" ?disabled="{{pageEnd >= totalMatched}}">Next</button></span>
            <button type="button" class="secondary compact-button" @click="{showSaveTrace()}" ?disabled="{{savingTrace}}">Save trace…</button>
          </div>
        </div>
      </section>
      <pane-divider orientation="{{dividerOrientation}}" label="Resize traffic list and inspector" value="{{preferences.listSplit}}" initial="45" @pane-resize="{resizeList(e)}"></pane-divider>
      <section class="details-pane" aria-labelledby="inspector-heading">
        <header class="selection-bar">
          <span class="method-badge">{{selectedMethodText}}</span><button id="inspector-heading" class="selected-url" type="button" title="Show full URL" popovertarget="selected-url-full" ?disabled="{{!selectedSessionId}}">{{selectedUrlText}}</button><span class="status-badge" data-tone="{{selectedTone}}">{{selectedStatusText}}</span>
          <div class="selection-actions"><if condition="windowsCommands"><button type="button" class="secondary compact-button" @click="{showCapturedPage()}" ?disabled="{{!selectedDetail || !previewPageAvailable || previewPageBusy}}" title="Select a complete retained HTML response to preview captured resources">Preview page…</button></if><button type="button" class="secondary compact-button" @click="{showTimings()}" ?disabled="{{!selectedDetail}}">Timings</button><button type="button" class="secondary compact-button" ?hidden="{{!selectedDetail || !selectedDetail.traceId}}" @click="{showTraceMetadata(selectedDetail.traceId)}">Trace metadata</button><button type="button" class="secondary compact-button" @click="{replaySelected()}" ?disabled="{{!selectedDetail}}">Edit and replay</button><button type="button" class="secondary compact-button" ?hidden="{{viewerMode}}" title="{{reuseTitle}}" @click="{beginAutoResponseFromSelected()}" ?disabled="{{reuseDisabled}}">Create auto-response</button><button type="button" class="secondary compact-button" @click="{showMatchedAutoResponse()}" ?hidden="{{!matchedRuleId}}">{{matchedRuleLabel}}</button></div>
        </header>
        <div class="inspector-side-tabs" role="group" aria-label="Message to inspect"><button type="button" ?data-selected="{{inspectorSide == 'request'}}" @click="{showInspectorSide('request')}">Request</button><button type="button" ?data-selected="{{inspectorSide == 'response'}}" @click="{showInspectorSide('response')}">Response</button></div>
        <div class="exchange-inspector" data-side="{{inspectorSide}}" data-request-share="{{requestShare}}" @inspector-resize="{resizeMessage(e)}">
          <message-inspector side="request" split="{{preferences.requestBodySplit}}" :detail="{{selectedDetail}}"></message-inspector>
          <pane-divider orientation="vertical" label="Resize request and response inspectors" value="{{preferences.requestSplit}}" initial="45" @pane-resize="{resizeRequest(e)}"></pane-divider>
          <message-inspector side="response" split="{{preferences.responseBodySplit}}" :detail="{{selectedDetail}}"></message-inspector>
        </div>
      </section>
    </div>

    <div id="selected-url-full" class="table-popover url-popover" popover="auto"><strong>Selected URL</strong><p class="full-value">{{selectedUrlText}}</p><button type="button" @click="{copyUrl()}">Copy URL</button></div>
    <div id="traffic-entry-menu" w-ref="{trafficMenu}" class="table-popover traffic-entry-menu" data-x="{{trafficMenuX}}" data-y="{{trafficMenuY}}" popover="auto"><strong>{{trafficSelectionText}}</strong><button type="button" @click="{selectedResponses()}">{{trafficCreateLabel}}</button><button type="button" @click="{copyRequest('curl')}" ?disabled="{{selectedTrafficCount != 1 || commandBusy}}">Copy as cURL</button><if condition="windowsCommands"><button type="button" @click="{copyRequest('powershell')}" ?disabled="{{selectedTrafficCount != 1 || commandBusy}}">Copy as PowerShell</button></if><button type="button" @click="{showTimings()}" ?disabled="{{selectedTrafficCount != 1}}">Timings and transport…</button><button type="button" @click="{copyAllHeaders()}" ?disabled="{{selectedTrafficCount != 1 || commandBusy}}">Copy all headers</button><button type="button" @click="{replaySelected()}" ?disabled="{{selectedTrafficCount != 1}}">Edit and replay</button><button type="button" @click="{removeSelectedTraffic()}" ?disabled="{{removingTraffic || !selectedTrafficCount}}">Remove selected entries <kbd>Del</kbd></button><button type="button" @click="{removeUnselectedTraffic()}" ?disabled="{{removingTraffic}}">Remove unselected entries</button><button type="button" @click="{clearTrafficSelection()}">Clear selection</button><p class="field-help">Shift selects a range; Ctrl adds entries. Removal preserves saved responses and capture files.</p></div>

    <div id="trace-files-menu" class="table-popover" popover="auto"><strong>Saved traffic</strong><button type="button" @click="{openSavedTrace(true)}">Open in a separate viewer…</button><button type="button" @click="{showTraceMetadata()}">Trace metadata…</button><p class="field-help">Drop a SAZ, TMCap or compressed .tmcap.gz file onto the traffic list to import it into this session.</p></div>
    <dialog w-ref="{openTraceDialog}" class="trace-open-dialog" aria-labelledby="trace-open-heading" @cancel="{cancelOpenedTrace(e)}">
      <h2 id="trace-open-heading">Open saved traffic</h2><p class="full-value">{{openedTraceName}}</p><p>Import this capture into the current session, or open it in a separate capture viewer?</p>
      <footer class="actions"><button type="button" @click="{chooseOpenedTrace(false)}">Import into this session</button><button type="button" class="secondary" @click="{chooseOpenedTrace(true)}">Open separate viewer</button><button type="button" class="secondary" @click="{cancelOpenedTrace()}">Cancel</button></footer>
    </dialog>
    <dialog w-ref="{previewPageDialog}" class="captured-page-warning" aria-labelledby="captured-page-heading" @cancel="{closeCapturedPageWarning()}">
      <h2 id="captured-page-heading">Preview captured page</h2><p class="full-value">{{previewPageUrl}}</p><p>Captured content may be malicious. Open content from a source you trust; enabling scripts increases the risk.</p><p class="field-help">The page uses responses already captured in this trace. Missing requests return an empty 404. The preview has a separate browser profile and works while the proxy is stopped.</p><label class="checkbox-label"><input w-ref="{previewPageScripts}" type="checkbox" ?disabled="{{previewPageBusy}}"> Enable scripts for this preview</label><details><summary>What may look different</summary><p class="field-help">Uses the nearest captured response for each method and URL. Missing, incomplete or large resources may be unavailable. Service workers, WebSockets, live connections, downloads and device permissions are disabled.</p></details><if condition="previewPageStatus"><p role="status">{{previewPageStatus}}</p></if><footer class="actions"><button type="button" @click="{openCapturedPage()}" ?disabled="{{previewPageBusy}}">Open preview</button><button type="button" class="secondary" @click="{closeCapturedPageWarning()}">Cancel</button></footer>
    </dialog>
    <dialog w-ref="{saveTraceDialog}" class="trace-save-dialog" aria-labelledby="save-trace-heading">
      <h2 id="save-trace-heading">Save traffic trace</h2><p class="field-help">Save all retained entries in this window, including entries outside the current page or search. Removed entries are excluded. Original source metadata stays associated with each request.</p>
      <form w-ref="{saveTraceForm}" @submit="{saveTrafficTrace(e)}"><fieldset ?disabled="{{savingTrace}}"><label class="checkbox-label"><input name="compress" type="checkbox" checked> Compress for sharing (.tmcap.gz)</label><label class="checkbox-label"><input name="networkContext" type="checkbox"> Include this computer’s network configuration</label><p class="field-help">Network configuration includes adapter addresses, DNS settings and computer names. It is stored separately from imported traces’ original context.</p><p class="field-help">Captured headers and bodies may contain private data. Active or unavailable bodies are marked incomplete.</p></fieldset><if condition="saveTraceStatus"><p role="status">{{saveTraceStatus}}</p></if><footer class="actions"><button type="submit" ?disabled="{{savingTrace}}">Save as…</button><button type="button" class="secondary" @click="{closeSaveTrace()}">Close</button></footer></form>
    </dialog>
    <dialog w-ref="{timingDialog}" class="timing-dialog" aria-labelledby="timing-heading" @close="{timingsClosed()}">
      <h2 id="timing-heading">{{timingTitle}}</h2><p class="field-help">{{timingSummary}}</p><p role="status">{{timingError}}</p>
      <div class="timing-scroll">
        <if condition="timingSaved.length"><details ?open="{{!timingRows.length}}"><summary>Original imported timing and session evidence</summary><p class="field-help">These are the source capture's original attributes. Their names and clocks belong to that capture; missing or unset values are not inferred.</p><dl class="timing-facts"><for each="field in timingSaved"><div key="{{field.id}}"><dt>{{field.label}}</dt><dd>{{field.value}}</dd></div></for></dl></details></if>
        <if condition="timingRows.length">
        <if condition="timingWaterfall.length"><h3>Request waterfall</h3><p class="field-help">Rows can overlap. Solid bars are elapsed intervals; dashed windows show repeated calls, with measured call time listed separately.</p><div class="waterfall-axis"><span>0 ms · request headers</span><span>{{timingRange}}</span></div><div class="waterfall-rows"><for each="row in timingWaterfall"><div key="{{row.id}}" class="waterfall-row"><span title="{{row.label}}">{{row.label}}</span><svg class="waterfall-bar" viewBox="0 0 1000 18" preserveAspectRatio="none" role="img" aria-label="{{row.note}}"><rect class="waterfall-track" x="0" y="2" width="1000" height="14"></rect><rect class="waterfall-span" ?data-repeated="{{row.repeated}}" x="{{row.start}}" y="3" width="{{row.width}}" height="12"></rect><if condition="row.width == 0"><circle class="waterfall-zero" cx="{{row.start}}" cy="9" r="2"></circle></if></svg><span>{{row.value}}</span></div></for></div></if><h3>Latency phases</h3><p class="field-help">Phases can overlap. Unavailable means this point was not measured; zero is a measured duration.</p>
        <dl class="timing-facts"><for each="phase in timingPhases"><div key="{{phase.id}}"><dt>{{phase.label}}</dt><dd>{{phase.value}}<small>{{phase.note}}</small></dd></div></for></dl>
        <if condition="timingRows.length"><h3>Proxy timeline</h3><div class="timing-table-scroll"><table><thead><tr><th scope="col">Observation</th><th scope="col">UTC time</th><th scope="col">From headers</th></tr></thead><tbody><for each="point in timingRows"><tr key="{{point.id}}"><th scope="row">{{point.label}}</th><td>{{point.time}}</td><td>{{point.offset}}</td></tr></for></tbody></table></div></if>
        </if>
<if condition="timingWork.length"><details><summary>Measured proxy work</summary><p class="field-help">Call time includes waits and nested work; it does not measure CPU usage. Repeated calls are aggregated without counting gaps between calls.</p><dl class="timing-facts"><for each="field in timingWork"><div key="{{field.id}}"><dt>{{field.label}}</dt><dd>{{field.value}}<small>{{field.note}}</small></dd></div></for></dl></details></if>
        <h3>Physical connections</h3><p class="field-help">Setup waits belong to this request; notes preserve the original connection phases. Socket counters include every HTTP stream on the connection. TCP counts socket payload, including TLS, without IP/TCP headers or kernel retransmissions. Kernel TCP statistics are shown when supported. Retransmissions are connection totals, not proof of where packets were lost. Socket writes and flushes show local acceptance, not client receipt.</p>
        <if condition="!timingTransports.length"><p>No physical connection measurements were saved.</p></if>
        <for each="transport in timingTransports"><details key="{{transport.id}}"><summary>{{transport.title}}</summary><p class="field-help full-value">{{transport.summary}}</p><dl class="timing-facts"><for each="field in transport.fields"><div key="{{field.id}}"><dt>{{field.label}}</dt><dd>{{field.value}}<small>{{field.note}}</small></dd></div></for></dl></details></for>

<details ?open="{{timingReportVisible}}"><summary>Report text</summary><textarea class="timing-report" aria-label="Timing report" readonly w-ref="{timingReportPreview}" rows="12"></textarea></details>
      </div><p role="status">{{timingStatus}}</p><footer class="actions"><button type="button" class="secondary" @click="{copyTimings()}" ?disabled="{{timingBusy || !timingReportText}}">Copy report</button><button type="button" class="secondary" @click="{refreshTimings()}" ?disabled="{{timingBusy}}">Refresh measurements</button><button type="button" class="secondary" @click="{closeTimings()}">Close</button></footer>
    </dialog>
    <dialog w-ref="{metadataDialog}" class="trace-metadata-dialog" aria-labelledby="trace-metadata-heading">
      <h2 id="trace-metadata-heading">Trace metadata</h2><p class="field-help">Original context belongs to its source capture. Requests imported from different files keep their own trace association.</p>
      <label>Source trace<select w-ref="{metadataSelector}" @change="{changeMetadataTrace(e)}" ?disabled="{{metadataBusy || !traceMetadataRows.length}}"><for each="trace in metadataTraceOptions"><option key="{{trace.id}}" value="{{trace.id}}">{{trace.label}}</option></for></select></label>
      <h3>{{metadataTraceName}}</h3><p class="full-value">{{metadataSummary}}</p><p role="status">{{metadataError}}</p><if condition="metadataNetworkTitle"><h3>{{metadataNetworkTitle}}</h3><p class="field-help">{{metadataNetworkSummary}}</p><if condition="metadataNetworkContext"><pre class="trace-context">{{metadataNetworkContext}}</pre></if><if condition="!metadataNetworkContext"><p>No network configuration output was available.</p></if></if><if condition="metadataContext"><pre class="trace-context">{{metadataContext}}</pre></if>
      <for each="note in metadataNotes"><p key="{{note.id}}" class="field-help">{{note.text}}</p></for><footer class="actions"><button type="button" class="secondary" @click="{closeMetadata()}">Close</button></footer>
    </dialog>
    <div id="traffic-search-options" class="table-popover search-options" popover="auto"><strong>Search options</strong>
      <label>Match mode<select aria-label="Match mode" @change="{setSearchMode(e)}"><option value="text" ?selected="{{searchMode == 'text'}}">Text</option><option value="regex" ?selected="{{searchMode == 'regex'}}">Regular expression</option></select></label>
      <label><input type="checkbox" ?checked="{{searchCaseSensitive}}" @change="{setSearchOption('searchCaseSensitive',e)}"> Case sensitive</label><label><input type="checkbox" ?checked="{{searchIgnoreAccents}}" ?disabled="{{searchMode == 'regex'}}" @change="{setSearchOption('searchIgnoreAccents',e)}"> Ignore accents (text mode)</label>
      <strong>Search in</strong><label><input type="checkbox" ?checked="{{searchMetadata}}" @change="{setSearchOption('searchMetadata',e)}"> URL, method, process, PID and status</label><label><input type="checkbox" ?checked="{{searchHeaders}}" @change="{setSearchOption('searchHeaders',e)}"> Request and response headers</label><label><input type="checkbox" ?checked="{{searchBodies}}" @change="{setSearchOption('searchBodies',e)}"> Decoded text response bodies</label>
      <label><input type="checkbox" ?checked="{{selectSearchMatches}}" @change="{setSearchOption('selectSearchMatches',e)}"> Select all matches after searching</label><p class="field-help">Each search resets the selection. Binary bodies are skipped. Text bodies are searched within a 16 MiB limit.</p>
    </div>
    <dialog w-ref="{commandDialog}" class="request-command-dialog" aria-labelledby="command-heading">
      <h2 id="command-heading">{{commandTitle}}</h2>
      <p class="field-help">This only copies text. Transmog never runs the generated command.</p>
      <for each="notice in commandNotices"><p key="{{notice.id}}" class="field-help">{{notice.text}}</p></for>
      <if condition="commandFileRequired"><p>This command uses a file containing the complete original request body.</p><button type="button" @click="{saveRequestBody()}" ?disabled="{{commandBusy || !commandFileAvailable}}">Save as…</button><if condition="!commandFileAvailable"><p class="field-help">Complete bytes are unavailable. You can supply your own body file.</p></if></if>
      <textarea w-ref="{commandPreview}" aria-label="Generated command" readonly spellcheck="false"></textarea>
      <p role="status">{{commandStatus}}</p>
      <footer class="actions"><button type="button" @click="{copyCommand()}" ?disabled="{{commandBusy || !commandText}}">Copy command</button><button type="button" class="secondary" @click="{closeCommand()}">Close</button></footer>
    </dialog>

    <div id="column-actions" class="table-popover column-menu" w-ref="{columnMenu}" popover="auto" data-x="{{menuX}}" data-y="{{menuY}}">
      <strong class="popover-title">{{menuColumn.label}}</strong>
      <button type="button" autofocus @click="{applySort('ascending')}">↑ {{ascendingLabel}}</button>
      <button type="button" @click="{applySort('descending')}">↓ {{descendingLabel}}</button>
      <if condition="menuColumn.id == 'process'"><button type="button" @click="{applySort('ascending','pid')}">Sort by PID</button></if>
      <button type="button" @click="{clearSort()}">Reset to newest first</button>
      <form class="column-filter" @submit="{applyFilter(e)}">
        <label>Filter {{menuColumn.label}}<select w-ref="{filterOperator}" aria-label="Filter comparison"><option value="contains" ?hidden="{{menuColumn.numeric}}">Contains</option><option value="equals">Equals</option><option value="minimum" ?hidden="{{!menuColumn.numeric}}">At least</option><option value="maximum" ?hidden="{{!menuColumn.numeric}}">At most</option></select></label>
        <input w-ref="{filterInput}" aria-label="Column filter value" placeholder="{{menuColumn.placeholder}}" maxlength="255"><button type="submit">Apply filter</button>
      </form>
      <button type="button" @click="{pinColumn()}">{{pinLabel}}</button><button type="button" @click="{hideColumn()}">Hide column</button>
      <div class="column-menu-moves"><button type="button" @click="{moveColumn(-1)}">Move left</button><button type="button" @click="{moveColumn(1)}">Move right</button></div>
    </div>
    <div id="filter-fields" class="table-popover filter-menu" popover="auto"><strong class="popover-title">Filter by</strong><for each="column in settingsColumns"><button key="{{column.id}}" type="button" popovertarget="column-actions" @click="{openColumnMenu(column.id,e)}">{{column.label}}</button></for></div>
    <div id="table-settings" class="table-popover table-settings" popover="auto">
      <strong class="popover-title">Table settings</strong><label>Layout <select aria-label="Traffic layout" @change="{setLayout(e)}"><option value="stacked" ?selected="{{preferences.layout == 'stacked'}}">List above inspector</option><option value="side-by-side" ?selected="{{preferences.layout == 'side-by-side'}}">List beside inspector</option></select></label>
      <label><input type="checkbox" ?checked="{{preferences.wrapCells}}" @change="{setWrap(e)}"> Wrap cells</label><label><input type="checkbox" ?checked="{{preferences.compactRows}}" @change="{setCompact(e)}"> Compact rows</label>
      <strong class="popover-title">Columns</strong><for each="column in settingsColumns"><label key="{{column.id}}"><input type="checkbox" ?checked="{{column.visible}}" @change="{setVisible(column.id,e)}"> {{column.label}}</label></for>
      <p class="column-hint">Drag headers to reorder. Drag their edges to resize; double-click an edge to fit.</p><button type="button" @click="{resetColumns()}">Reset columns</button><button type="button" @click="{resetLayout()}">Restore default layout and columns</button>
    </div>
  </section>
</template>
