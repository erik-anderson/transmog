<template>
  <form w-ref="{certificatePolicyForm}" @submit="{save(e)}" @keydown="{keyboard(e)}" class="certificate-policy">
    <p class="field-help">Certificates identify you to a server. Transmog considers one only after that verified server requests it. Supported software identities come from your Windows user store; private keys remain in Windows.</p>
    <fieldset ?disabled="{{certificateSettingsBusy}}">
      <label>For hosts without an enabled rule <select name="default" aria-label="Default client certificate action" @change="{setDefault(e)}"><option value="noCertificate" ?selected="{{certificateDefault == 'noCertificate'}}">Continue without a certificate</option><option value="prompt" ?selected="{{certificateDefault == 'prompt'}}">Prompt · pause for selection</option></select></label>
      <p class="field-help">Prompt pauses the connection and shows a blocked-connection indicator. Servers may close it while waiting. Continuing without a certificate still lets the server decide whether to accept the connection.</p>
      <div class="actions"><button type="button" @click="{addRule()}" ?disabled="{{certificateRules.length >= 256}}">Add host rule</button><button type="button" class="secondary" @click="{undoRemove()}" ?disabled="{{!certificateUndoAvailable}}">Undo removal</button></div>
      <p class="field-help">The first enabled exact host and port match wins. Drag the handle or use Move up / Move down. Editing takes effect only after Save certificate settings.</p>
      <div class="certificate-rules" w-ref="{certificateRuleList}" aria-label="Client certificate host rules">
        <if condition="!certificateRules.length"><p class="field-help">No host rules. The default above applies.</p></if>
        <for each="rule in certificateRules"><div class="certificate-rule" key="{{rule.id}}" ?data-selected="{{rule.id == certificateSelectedId}}" @dragover="{dragOver(e)}" @drop="{dropRule(rule.id,e)}">
          <button type="button" class="secondary compact-button drag-handle" draggable="true" aria-label="Reorder {{rule.label}}" @dragstart="{dragStart(rule.id,e)}" @dragend="{dragEnd()}">↕</button>
          <label class="checkbox-label"><input type="checkbox" aria-label="Enable {{rule.label}}" ?checked="{{rule.enabled}}" @change="{setEnabled(rule.id,e)}"></label>
          <button type="button" class="rule-select secondary" @click="{chooseRule(rule.id)}"><strong>{{rule.label}}</strong><span>{{rule.actionLabel}}</span></button>
          <button type="button" class="secondary compact-button" aria-label="Move {{rule.label}} up" ?disabled="{{!rule.up}}" @click="{moveRule(rule.id,-1)}">↑</button><button type="button" class="secondary compact-button" aria-label="Move {{rule.label}} down" ?disabled="{{!rule.down}}" @click="{moveRule(rule.id,1)}">↓</button>
        </div></for>
      </div>
      <if condition="certificateSelectedId"><section class="certificate-rule-editor" aria-label="Selected host rule">
        <div class="host-fields"><label>HTTPS host <input name="host" aria-label="Client certificate HTTPS host" value="{{certificateHost}}" required maxlength="253" placeholder="api.example.com" @input="{setField('host',e)}"></label><label>Port <input name="port" aria-label="Client certificate HTTPS port" type="number" min="1" max="65535" required value="{{certificatePort}}" @input="{setField('port',e)}"></label></div>
        <p class="field-help">Use an exact hostname or IP address, without a scheme, path or wildcard.</p>
        <label>When this host requests a certificate <select name="action" aria-label="Host client certificate action" @change="{setField('action',e)}"><option value="noCertificate" ?selected="{{certificateAction == 'noCertificate'}}">Continue without a certificate</option><option value="prompt" ?selected="{{certificateAction == 'prompt'}}">Prompt · pause for selection</option><option value="automatic" ?selected="{{certificateAction == 'automatic'}}">Automatically select a certificate</option></select></label>
        <if condition="certificateAction == 'automatic'"><label>Select by <select name="selector" aria-label="Certificate selector mode" @change="{setField('selector',e)}"><option value="identity" ?selected="{{certificateSelectorMode == 'identity'}}">Exact certificate</option><option value="attributes" ?selected="{{certificateSelectorMode == 'attributes'}}">Subject and issuer attributes · supports renewal</option></select></label>
          <if condition="certificateSelectorMode == 'identity'"><label>Certificate <select name="identity" aria-label="Automatic client certificate" @change="{setField('identity',e)}" required><option value="" ?selected="{{!certificateIdentity}}">Choose a certificate</option><if condition="certificateIdentityMissing"><option value="{{certificateIdentity}}" selected>Configured certificate is unavailable</option></if><for each="identity in certificateIdentities"><option value="{{identity.id}}" ?selected="{{identity.id == certificateIdentity}}">{{identity.subject}} · expires {{identity.validUntil}} · {{identity.fingerprint}}</option></for></select></label></if>
          <if condition="certificateSelectorMode == 'attributes'"><details open><summary>Certificate attributes</summary><div class="certificate-attributes"><for each="attribute in certificateAttributes"><label>Subject {{attribute.label}} <input name="{{attribute.name}}-subject" value="{{attribute.subject}}" maxlength="512" @input="{setSelectorAttribute(attribute.name,'subject',e)}"></label><label>Issuer {{attribute.label}} <input name="{{attribute.name}}-issuer" value="{{attribute.issuer}}" maxlength="512" @input="{setSelectorAttribute(attribute.name,'issuer',e)}"></label></for></div></details></if>
          <p class="field-help">The selector must identify exactly one certificate compatible with the actual server request. Missing, expired, incompatible or ambiguous matches continue without a certificate. Other rules are never tried.</p>
        </if>
        <button type="button" class="secondary" @click="{removeRule()}">Remove selected host rule</button>
      </section></if>
    </fieldset>
    <div class="actions"><button type="button" class="secondary" @click="{refreshIdentities()}" ?disabled="{{certificateInventoryBusy}}">Refresh Windows certificates</button><span role="status" ?hidden="{{!certificateInventoryBusy}}">Reading certificate inventory…</span></div>
    <p class="field-error" role="status" ?hidden="{{!certificateInventoryError}}">{{certificateInventoryError}}</p>
    <button type="button" class="secondary compact-button" @click="{dismissErrors()}" ?hidden="{{!certificateSettingsError && !certificateInventoryError}}">Dismiss certificate error</button>
    <footer class="certificate-settings-save"><div class="actions"><button type="submit" ?disabled="{{certificateSettingsBusy || !certificateSettingsDirty}}">Save certificate settings</button><button type="button" class="secondary" @click="{load()}" ?disabled="{{certificateSettingsBusy || !certificateSettingsDirty}}">Revert certificate changes</button><span role="status">{{certificateSettingsText}}</span></div><p class="field-error" role="status" ?hidden="{{!certificateSettingsError}}">{{certificateSettingsError}}</p></footer>
  </form>
</template>
