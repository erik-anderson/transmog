<template>
  <dialog w-ref="{caseDialog}" class="portable-dialog" aria-labelledby="case-heading" @cancel="{close(e)}">
    <header><h2 id="case-heading"><if condition="caseStage == 'author' || caseStage == 'export'">Save case</if><if condition="caseStage != 'author' && caseStage != 'export'">Case</if></h2><p role="status" aria-live="polite">{{caseStatus}}</p></header>
    <div class="case-scroll" w-ref="{caseScroll}" ?inert="{{caseBusy}}">
      <form ?hidden="{{caseStage != 'author'}}" id="case-author" w-ref="{authorForm}" @submit="{prepare(e)}">
        <label>Title<input name="title" required maxlength="512" value="Investigation"></label>
        <label>Traffic to include<select name="scope" aria-label="Traffic to include" @change="{refreshChoices()}"><for each="scope in caseScopes"><option key="{{scope.value}}" value="{{scope.value}}">{{scope.label}}</option></for></select></label>
        <p role="status">{{caseChoiceMessage}}</p>
        <label class="check"><input type="checkbox" name="context" checked>Include saved context and configuration output</label>
        <details><summary>Rules and experiments · {{caseSelectedCount}} selected</summary><p>Choose individual rules or whole experiment versions. Matches describe captured requests, not which rules ran.</p>
          <if condition="caseChoicesBusy"><p role="status">Checking included requests…</p></if>
          <if condition="caseChoiceFilterAvailable"><label class="check"><input type="checkbox" ?checked="{{caseShowAll}}" @change="{setShowAll(e)}">Show all</label></if>
          <if condition="caseChoiceError"><p role="alert">{{caseChoiceError}}</p><button type="button" class="secondary" ?disabled="{{caseChoicesBusy}}" @click="{refreshChoices()}">Retry matching</button></if>
          <for each="choice in caseRuleChoices"><label key="{{choice.id}}" class="check case-choice"><input type="checkbox" ?checked="{{choice.selected}}" ?disabled="{{caseChoicesBusy}}" @change="{setChoice(choice.id,e)}"><span>{{choice.label}}<small>{{choice.kindLabel}} · {{choice.matchLabel}}</small></span></label></for>
          <if condition="!caseChoicesBusy && !caseRuleChoices.length"><if condition="caseChoiceFilterAvailable"><p>No matches found. Show all to choose other rules or versions.</p></if><if condition="!caseChoiceFilterAvailable"><p>No saved rules or experiment versions in this window.</p></if></if>
        </details>
        <if condition="caseComparisons.length"><details w-ref="{comparisonChoices}"><summary>Comparisons · {{caseComparisonCount}} selected</summary><p>Selecting a comparison also includes all requests it needs, even outside the traffic selection above.</p><for each="comparison in caseComparisons"><label class="check"><input type="checkbox" name="comparison" value="{{comparison.id}}" ?checked="{{comparison.included}}" @change="{refreshChoices()}">{{comparison.label}}</label></for></details></if>
        <label>Notes<textarea name="notes" rows="3" maxlength="65536" placeholder="Steps to reproduce, expected result and what happened"></textarea></label>
        <p class="privacy-note">Included traffic, notes and context may contain secrets. Preparing a case creates temporary unencrypted copies. You can protect the saved file with a password.</p>
      </form>
      <if condition="caseStage == 'preview'"><form id="case-preview" w-ref="{previewForm}" @submit="{preview(e)}"><h4>Preview saved responses</h4><p>Opens in a separate InPrivate window without contacting captured sites. Missing resources fail as network requests.</p><label>Page<select aria-label="HTML document" required @change="{setPreviewDocument(e)}"><for each="page in casePreviewPages"><option value="{{page.id}}" ?selected="{{page.id == casePreviewDocument}}">{{page.url}}</option></for></select></label><label>Resources from<select name="scope" aria-label="Case resource source"><option value="original-trace">This document’s capture</option><option value="all-loaded">All opened captures in this case (may mix captures)</option></select></label><label>Responses<select aria-label="Responses" @change="{setPreviewVariant(e)}"><for each="variant in casePreviewVariants"><option value="{{variant.value}}" ?selected="{{variant.value == casePreviewVariant}}" ?disabled="{{!variant.available}}">{{variant.label}}</option></for></select></label><p>Uses saved responses without enabling rules. Versions requiring live transformations are unavailable.</p><label class="check"><input type="checkbox" name="scripts">Enable scripts for this preview</label><details><summary>Preview details</summary><p>Pages may contain private information or imitate sign-in forms. Open additional captures in Traffic to use their resources.</p></details></form></if>
      <if condition="caseStage != 'author' && caseStage != 'preview'"><h3>{{caseTitle}}</h3><p class="case-summary">{{caseSummary}}</p>
        <details><summary>Content details</summary><dl><for each="fact in caseFacts"><div><dt>{{fact.label}}</dt><dd>{{fact.value}}</dd></div></for></dl></details>
        <if condition="caseInspection && caseSources.length"><label>Capture<select aria-label="Capture" @change="{selectSource(e)}"><for each="source in caseSources"><option value="{{source.id}}" ?selected="{{source.id == caseSelectedSource}}">{{source.label}} · {{source.summary}}</option></for></select></label><p>{{caseSourceStatus}}</p><details><summary>Capture details</summary><for each="source in caseSources"><div class="case-row"><strong>{{source.label}}</strong><span>{{source.summary}}</span><p>{{source.completenessLabel}}</p><if condition="source.dependency.reason"><p>{{source.dependency.reason}}</p></if></div></for></details></if>
        <if condition="!caseSources.length"><p>No captured traffic is included.</p></if>
        <if condition="!caseInspection"><for each="source in caseSources"><div class="case-row"><strong>{{source.label}}</strong><span>{{source.summary}}</span><if condition="source.dependency.reason"><p>{{source.dependency.reason}}</p></if></div></for></if>
        <for each="note in caseNotes"><div class="case-row"><strong>Notes</strong><p class="note-text">{{note.text}}</p><if condition="caseInspection && note.source"><button type="button" class="secondary" @click="{inspectNote(note.id)}">Open linked request</button></if></div></for>
        <if condition="caseInspection && caseContexts.length"><details><summary>Saved context</summary><for each="context in caseContexts"><div class="case-row"><strong>{{context.kind}}</strong><button type="button" class="secondary" ?disabled="{{!context.available}}" @click="{inspectContext(context.id)}">View context</button></div></for><if condition="caseContextText"><h4>{{caseContextLabel}}</h4><pre tabindex="0">{{caseContextText}}</pre></if></details></if>
        <if condition="caseInspection && caseExperiments.length"><if condition="viewerMode || !caseImportAvailable"><details><summary>Experiments</summary><if condition="viewerMode"><p>Open this case in the main window to import supported experiments.</p></if><for each="experiment in caseExperiments"><div class="case-row"><strong>{{experiment.label}}</strong><span>{{experiment.state}}</span><if condition="experiment.reason"><p>{{experiment.reason}}</p></if></div></for></details></if></if>
        <if condition="caseSavedComparisons.length"><h4>Saved comparisons</h4><for each="comparison in caseSavedComparisons"><div class="case-row"><strong>{{comparison.label}}</strong><p>Saved result · {{comparison.recordedSummary}}</p><if condition="caseInspection"><button type="button" class="secondary" @click="{openComparison(comparison.id)}">Recompute comparison</button></if></div></for></if>
        <if condition="caseCaptureFacts.length"><details><summary>Capture observations</summary><dl><for each="fact in caseCaptureFacts"><div><dt>{{fact.label}}</dt><dd>{{fact.value}}</dd></div></for></dl><p>Stream events are normal for streaming connections. Missing body content may reflect capture settings or protocol behavior; these counts alone do not indicate an export failure.</p></details></if>
        <details><summary>Technical manifest (JSON)</summary><p>File identifiers, checksums and source history. Checksums detect corruption, not publisher identity. Open captures in Traffic to inspect requests.</p><pre tabindex="0">{{caseManifestText}}</pre></details>
        <details><summary>Excluded content</summary><ul><for each="item in caseExcluded"><li>{{item.text}}</li></for></ul></details>
      </if>
      <form ?hidden="{{caseStage != 'export' && caseStage != 'copy'}}" id="case-save" w-ref="{saveForm}" @submit="{save(e)}">
        <label class="check"><input type="checkbox" name="encrypt">Protect the saved file with a password</label><p>Without a password, anyone with the file can read its contents.</p>
      </form>
      <if condition="caseStage == 'inspect' && !viewerMode && caseImportAvailable"><details><summary>Import rules and experiments</summary><form id="case-import" w-ref="{importForm}" @submit="{reviewImport(e)}">
        <if condition="!caseIsCase"><p>Imports this rule collection and its response files.</p></if><if condition="caseIsCase"><if condition="caseOrdinaryRules"><label class="check"><input type="checkbox" name="ordinary">Saved rules</label></if><for each="experiment in caseExperiments"><label class="check"><input type="checkbox" name="experiment" value="{{experiment.id}}" ?disabled="{{!experiment.available}}">{{experiment.label}} · {{experiment.state}}</label><if condition="experiment.reason"><p>{{experiment.reason}}</p></if></for></if>
        <p>Imported rules start turned off. Existing rules are kept.</p><button type="submit" class="secondary">Review rule import</button>
      </form></details></if>
      <if condition="caseStage == 'import'"><h4>Rules to import</h4><p>{{caseImportSummary}}</p><for each="item in caseImportItems"><div class="case-row"><strong>{{item.label}}</strong><span>{{item.description}}</span><details><summary>Identity details</summary><p>{{item.kind}} · {{item.portableId}} · {{item.state}}</p><code>{{item.localId}}</code></details></div></for><p>Imported rules start turned off; experiments start paused. Existing rules are kept.</p></if>
    </div>
    <footer class="actions">
      <if condition="caseBusy"><button type="button" class="secondary" @click="{cancel()}">Cancel operation</button></if>
      <if condition="!caseBusy">
        <if condition="caseStage == 'author'"><button type="submit" form="case-author" ?disabled="{{caseChoicesBusy}}">Review selected content</button></if>
        <if condition="caseStage == 'export'"><button type="button" class="secondary" @click="{back()}">Change selection</button><button type="submit" form="case-save">Save case…</button></if>
        <if condition="caseStage == 'copy'"><button type="button" class="secondary" @click="{back()}">Back to case</button><button type="submit" form="case-save">Save a copy…</button></if>
        <if condition="caseStage == 'import'"><button type="button" class="secondary" @click="{back()}">Back to case</button><button type="button" @click="{importRules()}">Import rules</button></if>
        <if condition="caseStage == 'preview'"><button type="button" class="secondary" @click="{back()}">Back to case</button><button type="submit" form="case-preview" ?disabled="{{!casePreviewDocument}}">Open preview</button></if>
        <if condition="caseStage == 'inspect'">
          <if condition="caseSources.length"><button type="button" ?disabled="{{!caseSourceAvailable}}" @click="{inspectTraffic(caseSelectedSource)}">Open in Traffic</button><if condition="caseIsCase"><button type="button" class="secondary" ?disabled="{{!caseSourceAvailable}}" @click="{choosePreview(caseSelectedSource)}">Preview…</button></if></if>
          <button type="button" class="secondary case-more-button" w-ref="{caseMoreButton}" popovertarget="case-more">More</button>
          <div id="case-more" w-ref="{caseMore}" popover="auto" class="case-menu">
            <button type="button" class="secondary" @click="{showSaveCopy()}">Save a copy…</button>
            <if condition="casePreviewAvailable"><button type="button" class="secondary" @click="{previewDiagnostics()}">Preview diagnostics…</button></if>
            <if condition="caseIsCase"><details><summary>Extract to a folder</summary><p>Includes decrypted traffic, notes and context. Anyone with access to the folder can read them.</p><button type="button" class="secondary" @click="{workingCopy()}">Save unencrypted folder…</button></details></if>
            <button type="button" class="secondary" @click="{closePackage()}">Unload case</button>
          </div>
        </if>
      </if>
      <button type="button" class="secondary" @click="{close()}">Close</button>
    </footer>
  </dialog>
</template>
