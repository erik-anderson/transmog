<template>
  <dialog w-ref="{caseDialog}" class="portable-dialog" aria-labelledby="case-heading" @cancel="{close(e)}">
    <header><h2 id="case-heading">Portable case</h2><p role="status" aria-live="polite">{{caseStatus}}</p></header>
    <div class="case-scroll" w-ref="{caseScroll}" ?inert="{{caseBusy}}">
      <form ?hidden="{{caseStage != 'author'}}" id="case-author" w-ref="{authorForm}" @submit="{prepare(e)}">
        <label>Title<input name="title" required maxlength="512" value="Portable investigation"></label>
        <label>Evidence<select name="scope" aria-label="Evidence" @change="{refreshChoices()}"><for each="scope in caseScopes"><option key="{{scope.value}}" value="{{scope.value}}">{{scope.label}}</option></for></select></label>
        <label class="check"><input type="checkbox" name="context" checked>Include source context and configuration output</label>
        <details open><summary>Rules and experiments (optional)</summary><p>Select individual rules or whole experiment versions. Matches describe recorded conditions, not which rules ran.</p>
          <if condition="caseChoicesBusy"><p role="status">Checking included requests…</p></if>
          <if condition="!caseChoicesBusy"><p>{{caseChoiceMessage}}</p></if>
          <if condition="caseChoiceFilterAvailable"><label class="check"><input type="checkbox" ?checked="{{caseShowAll}}" @change="{setShowAll(e)}">Show all</label></if>
          <if condition="caseChoiceError"><p role="alert">{{caseChoiceError}}</p><button type="button" class="secondary" ?disabled="{{caseChoicesBusy}}" @click="{refreshChoices()}">Retry matching</button></if>
          <for each="choice in caseRuleChoices"><label key="{{choice.id}}" class="check case-choice"><input type="checkbox" ?checked="{{choice.selected}}" ?disabled="{{caseChoicesBusy}}" @change="{setChoice(choice.id,e)}"><span>{{choice.label}}<small>{{choice.kindLabel}} · {{choice.matchLabel}}</small></span></label></for>
          <if condition="!caseChoicesBusy && !caseRuleChoices.length"><if condition="caseChoiceFilterAvailable"><p>No matches found. Show all to choose other rules or versions, including those that could not be assessed.</p></if><if condition="!caseChoiceFilterAvailable"><p>No saved rules or experiment versions in this window.</p></if></if>
        </details>
        <if condition="caseComparisons.length"><details open><summary>Saved comparisons</summary><p>Includes comparison settings, request selections, manual pairs and recorded findings. Include all required requests in Evidence.</p><for each="comparison in caseComparisons"><label class="check"><input type="checkbox" name="comparison" value="{{comparison.id}}" ?checked="{{comparison.included}}">{{comparison.label}}</label></for></details></if>
        <label>Notes<textarea name="notes" rows="5" maxlength="65536" placeholder="Steps to reproduce, expected result and what happened"></textarea></label>
        <p class="privacy-note">The case copies your selection, including any secrets in traffic, notes and context. Review prepares temporary unencrypted copies; you can password-protect the saved file.</p>
      </form>
      <if condition="caseStage == 'preview'"><form id="case-preview" w-ref="{previewForm}" @submit="{preview(e)}"><h4>Preview frozen responses</h4><p>Opens captured content in a separate InPrivate window with no access to captured sites. Pages may contain private information or imitate sign-in forms. Missing resources fail as network requests.</p><label>HTML document<select aria-label="HTML document" required @change="{setPreviewDocument(e)}"><for each="page in casePreviewPages"><option value="{{page.id}}" ?selected="{{page.id == casePreviewDocument}}">{{page.url}}</option></for></select></label><label>Resources from<select name="scope" aria-label="Case resource source"><option value="original-trace">This document’s capture</option><option value="all-loaded">All opened captures in this case (may mix captures)</option></select></label><label>Responses<select aria-label="Responses" @change="{setPreviewVariant(e)}"><for each="variant in casePreviewVariants"><option value="{{variant.value}}" ?selected="{{variant.value == casePreviewVariant}}" ?disabled="{{!variant.available}}">{{variant.label}}</option></for></select></label><p>Uses saved response bytes without importing or enabling rules. Versions that need live transformations are unavailable. Open additional captures in Traffic to use their resources.</p><label class="check"><input type="checkbox" name="scripts">Enable scripts for this preview</label></form></if>
      <if condition="caseStage != 'author' && caseStage != 'preview'"><h3>{{caseTitle}}</h3>
        <dl><for each="fact in caseFacts"><div><dt>{{fact.label}}</dt><dd>{{fact.value}}</dd></div></for></dl>
        <if condition="viewerMode"><h4>Experiments</h4><for each="experiment in caseExperiments"><div class="case-row"><strong>{{experiment.label}}</strong><span>{{experiment.state}}</span><p>{{experiment.reason}}</p></div></for></if><h4>Captures</h4><if condition="!caseSources.length"><p>No captured evidence is included.</p></if><if condition="caseInspection && caseSources.length"><p>Open a capture in Traffic to inspect its individual requests.</p></if><for each="source in caseSources"><div class="case-row"><strong>{{source.label}}</strong><span>{{source.summary}}</span><if condition="source.dependency.reason"><p>{{source.dependency.reason}}</p></if><details><summary>Capture details</summary><p>{{source.completenessLabel}}</p></details><if condition="caseInspection"><button type="button" class="secondary" ?disabled="{{!source.available}}" @click="{inspectTraffic(source.id)}">Inspect in Traffic</button><if condition="caseIsCase"><button type="button" class="secondary" ?disabled="{{!source.available}}" @click="{choosePreview(source.id)}">Preview case…</button></if></if></div></for>
        <for each="note in caseNotes"><div class="case-row"><strong>Authored note</strong><p class="note-text">{{note.text}}</p><if condition="caseInspection && note.source"><button type="button" class="secondary" @click="{inspectNote(note.id)}">Inspect linked request</button></if></div></for>
        <if condition="caseInspection"><for each="context in caseContexts"><div class="case-row"><strong>{{context.kind}}</strong><span>{{context.content.state}} · {{context.completeness}}</span><button type="button" class="secondary" ?disabled="{{!context.available}}" @click="{inspectContext(context.id)}">View context</button></div></for><if condition="caseContextText"><h4>Original context · {{caseContextLabel}}</h4><pre tabindex="0">{{caseContextText}}</pre></if></if>
        <if condition="caseSavedComparisons.length"><h4>Saved comparisons</h4><for each="comparison in caseSavedComparisons"><div class="case-row"><strong>{{comparison.label}}</strong><p>Historical finding · {{comparison.recordedSummary}}</p><if condition="caseInspection"><button type="button" class="secondary" @click="{openComparison(comparison.id)}">Recompute comparison</button></if></div></for></if>

        <if condition="caseCaptureFacts.length"><details><summary>Capture observations</summary><dl><for each="fact in caseCaptureFacts"><div><dt>{{fact.label}}</dt><dd>{{fact.value}}</dd></div></for></dl><p>Stream events are normal for streaming connections. Body counts cover request and response records; one request may have several. Content may be absent because of capture settings or protocol behavior. These counts alone do not indicate an export failure.</p></details></if>
        <details><summary>Technical manifest (JSON)</summary><p>File identifiers, checksums and source history. Checksums detect corruption; they do not identify the publisher. Captured requests are stored inside the capture files, not listed individually here.</p><pre tabindex="0">{{caseManifestText}}</pre></details>
        <details><summary>Excluded from this transfer</summary><ul><for each="item in caseExcluded"><li>{{item.text}}</li></for></ul></details>
        <p class="privacy-note">Included traffic, notes and context may contain secrets. Opening the case does not contact captured sites or enable its rules.</p>
      </if>
      <form ?hidden="{{caseStage == 'author' || caseStage == 'import' || caseStage == 'preview'}}" id="case-save" w-ref="{saveForm}" @submit="{save(e)}">
        <label>File format<select name="format" aria-label="File format" @change="{setFormat(e)}"><option value="native">Transmog package (compressed)</option><option value="bare-zip">ZIP package (for tools)</option></select></label>
        <if condition="caseFormat == 'bare-zip'"><p>Contains a JSON manifest and binary capture/response files for compatible tools. It is not a readable traffic export. ZIP packages are uncompressed and cannot be password-protected.</p></if>
        <label class="check"><input type="checkbox" name="encrypt" ?disabled="{{caseFormat == 'bare-zip'}}" @change="{setEncryption(e)}">Protect the saved file with a password</label>
        <p>Without a password, anyone with the file can read its contents.</p>
      </form>
      <if condition="caseStage == 'inspect'"><if condition="caseIsCase"><details><summary>Save working copy</summary><p>Copies the case into a new unencrypted folder, including any decrypted evidence. Anyone with access to the folder can read it.</p><button type="button" class="secondary" @click="{workingCopy()}">Save unencrypted folder…</button></details></if>
        <if condition="!viewerMode"><form id="case-import" w-ref="{importForm}" @submit="{reviewImport(e)}"><h4>Copy selected rules into this workbench</h4>
          <if condition="!caseIsCase"><p>This rule collection is reviewed as one complete dependency graph.</p></if><if condition="caseIsCase"><if condition="caseOrdinaryRules"><label class="check"><input type="checkbox" name="ordinary">Ordinary saved rules</label></if>
          <for each="experiment in caseExperiments"><label class="check"><input type="checkbox" name="experiment" value="{{experiment.id}}" ?disabled="{{!experiment.available}}">{{experiment.label}} · {{experiment.state}}</label><p>{{experiment.reason}}</p></for>
          </if><p>Import creates disabled rules and paused experiments. Existing drafts and activation remain in place.</p>
          <if condition="!caseImportAvailable"><p>No supported rules or experiments are available to import.</p></if><button type="submit" class="secondary" ?disabled="{{!caseImportAvailable}}">Review rule import</button>
        </form></if>
      </if>
      <if condition="caseStage == 'import'"><h4>Reviewed local identities</h4><for each="item in caseImportItems"><div class="case-row"><strong>{{item.kind}} · {{item.portableId}}</strong><span>{{item.state}}</span><code>{{item.localId}}</code></div></for><p>All imported rules start disabled. No script or captured page executes.</p></if>
    </div>
    <footer class="actions">
      <if condition="caseBusy"><button type="button" class="secondary" @click="{cancel()}">Cancel operation</button></if>
      <if condition="!caseBusy"><if condition="caseStage == 'author'"><button type="submit" form="case-author" ?disabled="{{caseChoicesBusy}}">Review selected content</button></if><if condition="caseStage == 'export'"><button type="button" class="secondary" @click="{back()}">Change selection</button><button type="submit" form="case-save">Save portable case…</button></if><if condition="caseStage == 'import'"><button type="button" class="secondary" @click="{back()}">Back to inventory</button><button type="button" @click="{importRules()}">Import rules disabled</button></if><if condition="caseStage == 'preview'"><button type="button" class="secondary" @click="{back()}">Back to inventory</button><button type="submit" form="case-preview" ?disabled="{{!casePreviewDocument}}">Open case preview</button></if><if condition="caseStage == 'inspect'"><if condition="casePreviewAvailable"><button type="button" class="secondary" @click="{previewDiagnostics()}">Preview diagnostics…</button></if><button type="submit" form="case-save">Save transfer as…</button></if><if condition="caseStage == 'inspect'"><button type="button" class="secondary" @click="{openPackage()}">Open another package…</button><button type="button" class="secondary" @click="{closePackage()}">Close package</button></if></if>
      <button type="button" class="secondary" @click="{close()}">Close review</button>
    </footer>
  </dialog>
</template>
