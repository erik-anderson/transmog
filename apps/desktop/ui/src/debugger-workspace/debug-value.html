<template shadowrootmode="open">
  <if condition="value">
    <div class="heading" tabindex="0" @contextmenu="{menu(e)}" @keydown="{menu(e)}">
      <if condition="value.value.handle"
        ><button
          type="button"
          ?disabled="{{value.expired}}"
          aria-expanded="{{value.expanded}}"
          @click="{toggle()}"
        >
          <if condition="value.expanded"><span aria-hidden="true">▾ </span></if
          ><if condition="!value.expanded"><span aria-hidden="true">▸ </span></if>{{value.label}}
        </button></if
      >
      <if condition="!value.value.handle"><span>{{value.label}}:</span></if>
      <span>{{value.value.display}}</span><if condition="value.expired"><small>Expired</small></if
      ><if condition="value.value.truncated"><small>Shortened</small></if>
    </div>
    <if condition="value.expanded"
      ><table aria-busy="{{value.loading}}">
        <tbody>
          <for each="property in value.rows"
            ><tr key="{{property.key}}" tabindex="0" @contextmenu="{menu(e,property)}" @keydown="{menu(e,property)}">
              <th data-depth="{{property.depth}}" title="{{property.name}}">
                <if condition="property.expandable">
                  <button type="button" aria-disabled="{{value.loading}}" aria-expanded="{{property.expanded}}" @click="{toggle(property)}">
                    <if condition="property.expanded"><span aria-hidden="true">▾ </span></if><if condition="!property.expanded"><span aria-hidden="true">▸ </span></if><span class="property-label">{{property.label}}</span>
                  </button>
                </if>
                <if condition="property.offset"><button type="button" data-more data-row-key="{{property.key}}" aria-disabled="{{value.loading}}" @click="{toggle(property)}">{{property.label}}</button></if>
                <if condition="!property.expandable && property.offset == undefined"><span>{{property.label}}</span></if>
              </th>
              <td><span class="property-preview" data-kind="{{property.value.kind}}" title="{{property.value.display}}">{{property.preview}}<if condition="property.value.truncated"> …</if></span></td>
            </tr></for
          >
        </tbody>
      </table>
      <if condition="value.issue"><p role="status">{{value.issue}}</p></if
      ><if condition="!value.rows.length && !value.issue"><p>No properties</p></if></if
    >
  </if>
</template>
