<template shadowrootmode="open" @keydown="{keyboard(e)}">
 <link w-ref="{sourceStyles}" rel="stylesheet" href="/monaco.css">
 <section class="workspace" aria-label="Debugger" data-console-share="{{debuggerConsoleShare}}">
  <header class="toolbar">
   <strong>Debugger</strong>
   <span class="debug-tool"><button type="button" class="secondary debug-icon-button" aria-label="Continue (F8)" ?disabled="{{!debuggerPaused}}" @click="{resume('continue')}"><debug-icon name="continue" aria-hidden="true"></debug-icon></button><span class="debug-tooltip" role="tooltip">Continue <kbd>F8</kbd> / <kbd>Ctrl+\</kbd> (also F5)</span></span>
   <span class="debug-tool"><button type="button" class="secondary debug-icon-button" aria-label="Step over (F10)" ?disabled="{{!debuggerPaused}}" @click="{resume('over')}"><debug-icon name="step-over" aria-hidden="true"></debug-icon></button><span class="debug-tooltip" role="tooltip">Step over <kbd>F10</kbd></span></span>
   <span class="debug-tool"><button type="button" class="secondary debug-icon-button" aria-label="Step into (F11)" ?disabled="{{!debuggerPaused}}" @click="{resume('into')}"><debug-icon name="step-into" aria-hidden="true"></debug-icon></button><span class="debug-tooltip" role="tooltip">Step into <kbd>F11</kbd></span></span>
   <span class="debug-tool"><button type="button" class="secondary debug-icon-button" aria-label="Step out (Shift+F11)" ?disabled="{{!debuggerPaused}}" @click="{resume('out')}"><debug-icon name="step-out" aria-hidden="true"></debug-icon></button><span class="debug-tooltip" role="tooltip">Step out <kbd>Shift+F11</kbd></span></span>
   <span class="debug-tool"><button type="button" class="secondary debug-icon-button" aria-label="Restart" ?disabled="{{!debuggerRestartable}}" @click="{restart()}"><debug-icon name="restart" aria-hidden="true"></debug-icon></button><span class="debug-tooltip" role="tooltip">Restart selected worker · aborts current work</span></span>
   <span class="debug-tool"><button type="button" class="secondary debug-icon-button" aria-label="Stop (Shift+F5)" ?disabled="{{debuggerClosed}}" @click="{stop()}"><debug-icon name="stop" aria-hidden="true"></debug-icon></button><span class="debug-tooltip" role="tooltip">Stop <kbd>Shift+F5</kbd> · aborts selected work</span></span>
   <span class="debug-tool"><button type="button" class="secondary debug-icon-button" aria-label="Continue and detach" @click="{place('closed')}"><debug-icon name="detach" aria-hidden="true"></debug-icon></button><span class="debug-tooltip" role="tooltip">Continue all workers and close debugger</span></span>
   <label class="exception-policy">Exceptions <select aria-label="Pause on exceptions" ?disabled="{{debuggerClosed}}" value="{{debuggerExceptions}}" @change="{policy(e)}"><option value="none">Do not pause</option><option value="uncaught">Uncaught</option><option value="all">All</option></select></label>
   <span class="spacer"></span>
   <button type="button" class="secondary" popovertarget="debugger-placement">Dock</button>
   <span class="debug-tool"><button type="button" class="secondary debug-icon-button" aria-label="Close debugger and continue execution" aria-keyshortcuts="F12" @click="{place('closed')}"><debug-icon name="close" aria-hidden="true"></debug-icon></button><span class="debug-tooltip" role="tooltip">Close debugger <kbd>F12</kbd> · continues paused work</span></span>
   <div id="debugger-placement" class="placement" popover="auto">
    <button type="button" @click="{place('bottom')}" popovertarget="debugger-placement">Dock to bottom</button>
    <button type="button" @click="{place('right')}" popovertarget="debugger-placement">Dock to right</button>
    <button type="button" @click="{place('window')}" popovertarget="debugger-placement">Open separate window</button>
   </div>
  </header>
  <div class="status"><span role="status">{{debuggerStatus}}</span><label>Worker <select aria-label="Debugger worker" value="{{debuggerTarget}}" @change="{targetChanged(e)}"><option value="">Select a worker</option><for each="target in debuggerTargets"><option value="{{target.session}}">{{target.mode}} · {{target.label}}</option></for></select></label></div>
  <p class="error" role="alert" ?hidden="{{!debuggerError}}">{{debuggerError}}</p>
  <div class="panes">
   <nav class="sources" aria-label="Script sources">
    <h3>Sources</h3>
    <if condition="!debuggerSources.length"><p>Saved scripts and installed extension sources appear here.</p></if>
    <for each="group in debuggerSources"><details ?open="{{group.open}}" @toggle="{sourceGroupToggled(group,e)}"><summary>{{group.label}}</summary><for each="file in group.files"><button type="button" class="source" title="{{file.artifact}}" @click="{openFile(file)}">{{file.path}} <small>{{file.state}}</small></button></for></details></for>
    <details class="breakpoints" open><summary>Breakpoints</summary><if condition="!debuggerPoints.length"><p>Click beside a line number to add a breakpoint. Right-click for conditions.</p></if><for each="point in debuggerPoints"><div class="breakpoint"><button type="button" class="secondary" title="{{point.breakpoint.condition}}" @click="{showPoint(point)}">{{point.label}}</button><button type="button" class="secondary" aria-label="Remove breakpoint" @click="{removePoint(point)}">×</button></div></for></details>
   </nav>
   <section class="source-pane" aria-label="Source code"><header><span class="source-label" title="{{debuggerSourceLabel}}">{{debuggerSourceLabel}}</span><select aria-label="Source representation" ?disabled="{{!debuggerCanSwitch}}" value="{{debuggerRepresentation}}" @change="{switchRepresentation(e)}"><option value="typescript">TypeScript</option><option value="javascript">JavaScript</option></select></header><div w-ref="{sourceHost}" class="editor"></div></section>
   <aside class="variables" aria-label="Call stack and variables"><h3>Call stack</h3><if condition="!debuggerPaused"><p>Stack and variables appear when execution pauses.</p></if><select aria-label="Stack frame" ?hidden="{{!debuggerPaused}}" value="{{debuggerFrame}}" @change="{frameChanged(e)}"><for each="frame in debuggerFrames"><option value="{{frame.index}}">{{frame.function}} · {{frame.location.line}}</option></for></select><if condition="debuggerStackTruncated"><p>Call stack shortened at the capture limit.</p></if><h3>Scope</h3><div class="scopes"><for each="scope in debuggerScopes"><button type="button" class="secondary" ?disabled="{{!scope.handle}}" @click="{selectScope(scope.handle)}">{{scope.kind}}</button></for></div><table><tbody><for each="property in debuggerProperties"><tr key="{{property.key}}" data-depth="{{property.depth}}"><th data-depth="{{property.depth}}"><if condition="property.offset != undefined"><button type="button" class="property secondary" @click="{expandProperty(property)}">{{property.name}}</button></if><if condition="property.offset == undefined"><button type="button" class="property secondary" ?disabled="{{!property.expandable}}" aria-expanded="{{property.expanded}}" @click="{expandProperty(property)}"><if condition="property.expandable"><if condition="property.expanded">▾ </if><if condition="!property.expanded">▸ </if></if>{{property.name}}</button></if></th><td>{{property.value.display}}<if condition="property.value.truncated"> … [shortened]</if></td></tr></for></tbody></table></aside>
  </div>
  <pane-divider class="console-divider" orientation="horizontal" label="Resize debugger console" value="{{debuggerConsoleSplit}}" initial="70" @pane-resize="{resizeConsole(e)}"></pane-divider>
  <section class="console" aria-label="Console and immediate commands"><header><strong>Console</strong><span>{{debuggerScope}}</span><button type="button" class="secondary" @click="{clearConsole()}">Clear</button></header><div w-ref="{consoleOutput}" class="console-output" tabindex="0" data-copy-surface><script-diagnostics w-ref="{diagnostics}" expanded navigate-sources :evidence="{{debuggerEvidence}}" @diagnostic-source="{navigateSource(e)}"></script-diagnostics><if condition="debuggerSummary"><p>{{debuggerSummary}}</p></if><if condition="debuggerResult"><details><summary>Fixture result</summary><pre>{{debuggerResult}}</pre></details></if><for each="row in debuggerConsole"><div class="command"><pre>› {{row.input}}</pre><pre ?data-thrown="{{row.thrown}}">{{row.output}}</pre></div></for></div><form @submit="{submitConsole(e)}"><textarea aria-label="Immediate expression" placeholder="Run JavaScript · Enter to execute, Shift+Enter for a new line" rows="1" maxlength="8192" value="{{debuggerInput}}" @input="{consoleInput(e)}" @keydown="{consoleKey(e)}"></textarea><button type="submit" ?disabled="{{debuggerClosed || debuggerSubmitting || !debuggerTarget || !debuggerInput}}">Run</button></form></section>
 </section>
 <dialog w-ref="{conditionDialog}" aria-labelledby="debug-condition-heading"><form @submit="{saveCondition(e)}"><h2 id="debug-condition-heading">Breakpoint condition</h2><p class="condition-source">{{debuggerConditionSource}}</p><label>Pause when this expression is true<input aria-label="Breakpoint condition" autofocus maxlength="4096" value="{{debuggerCondition}}" @input="{conditionInput(e)}"></label><p>Conditions must be free of side effects. An empty condition always pauses.</p><p class="error" role="alert" ?hidden="{{!debuggerError}}">{{debuggerError}}</p><footer><button type="button" class="secondary" @click="{closeCondition()}">Cancel</button><button type="submit">Save</button></footer></form></dialog>
</template>
