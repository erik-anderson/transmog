<template>
<section class="variant-workspace" aria-label="Response experiments" aria-busy="{{variantBusy}}">
  <header><h2>Response experiments</h2><button type="button" @click="{newExperiment()}" ?disabled="{{variantBusy}}">New from selected response</button></header>
  <p ?hidden="{{experimentItems.length}}">Select a captured response in Traffic and choose Create experiment. Keep named alternatives here, then deliberately activate one revision.</p>
  <div class="variant-content" ?hidden="{{!experimentItems.length}}">
    <div class="variant-pickers"><label>Experiment <select w-ref="{experimentSelect}" aria-label="Experiment" @change="{selectExperiment(e)}" ?disabled="{{variantBusy}}"><for each="item in experimentItems"><option value="{{item.id}}" ?selected="{{item.id == experimentId}}">{{item.name}}</option></for></select></label><label>Variant <select w-ref="{variantSelect}" aria-label="Variant" @change="{selectVariant(e)}" ?disabled="{{variantBusy}}"><for each="item in variantItems"><option value="{{item.id}}" ?selected="{{item.id == variantId}}">{{item.name}}</option></for></select></label><label>Revision <select aria-label="Variant revision" @change="{selectRevision(e)}" ?disabled="{{variantBusy}}"><for each="revision in revisionItems"><option value="{{revision}}" ?selected="{{revision == variantRevision}}">{{revision}}</option></for></select></label></div>
    <p role="status">{{variantLiveText}}</p>
    <p ?hidden="{{variantLatest}}">Earlier saved revision. Duplicate it to edit, or preview and activate these exact definitions. A new preview of a linked file reads its current bytes; retained Traffic keeps earlier served bytes.</p>
    <div class="variant-rule-list"><p ?hidden="{{variantRules.length}}">No rules in this revision. Baseline removes this experiment’s rules from live traffic; unrelated automation still participates.</p><ol><for each="rule in variantRules"><li key="{{rule.id}}"><div><strong>{{rule.name}}</strong><details><summary>Saved response reference</summary><small>{{rule.asset}}</small></details><span><if condition="rule.enabled">Included</if><if condition="!rule.enabled">Excluded</if></span></div><div class="actions"><button type="button" class="secondary" @click="{editRule(rule.id)}" ?disabled="{{variantBusy}}"><if condition="variantLatest">Edit response</if><if condition="!variantLatest">Inspect response</if></button><button type="button" class="secondary" @click="{changeRule(rule.id,'toggle')}" ?disabled="{{variantBusy || !variantLatest || variantArchived || experimentArchived}}">Include / exclude</button><button type="button" class="secondary" aria-label="Move {{rule.name}} earlier" @click="{changeRule(rule.id,'up')}" ?disabled="{{variantBusy || !variantLatest || variantArchived || experimentArchived}}">↑</button><button type="button" class="secondary" aria-label="Move {{rule.name}} later" @click="{changeRule(rule.id,'down')}" ?disabled="{{variantBusy || !variantLatest || variantArchived || experimentArchived}}">↓</button><button type="button" class="secondary" @click="{changeRule(rule.id,'remove')}" ?disabled="{{variantBusy || !variantLatest || variantArchived || experimentArchived}}">Remove from variant</button></div></li></for></ol></div>
    <div class="actions"><button type="button" class="secondary" @click="{addResponse()}" ?disabled="{{variantBusy || !variantLatest || variantId == 'baseline' || variantArchived || experimentArchived}}">Add selected response</button><button type="button" class="secondary" @click="{previewVariant()}" ?disabled="{{variantBusy}}">Preview saved revision…</button></div>
    <details><summary>Activation order</summary><p>First matching response wins across experiments and ordinary rules. Save a new revision before or after other live rules to resolve a priority conflict; then activate it explicitly.</p><div class="actions"><button type="button" class="secondary" @click="{positionVariant(true)}" ?disabled="{{variantBusy || !variantLatest || variantArchived || experimentArchived || !variantRules.length}}">Save before other live rules</button><button type="button" class="secondary" @click="{positionVariant(false)}" ?disabled="{{variantBusy || !variantLatest || variantArchived || experimentArchived || !variantRules.length}}">Save after other live rules</button></div></details><details><summary>Names, duplicates and archive</summary><div class="variant-names"><label>Experiment name <input w-ref="{experimentName}" maxlength="128" ?disabled="{{variantBusy}}"></label><button type="button" class="secondary" @click="{rename(false)}" ?disabled="{{variantBusy}}">Save experiment name</button><label>Variant name <input w-ref="{variantName}" maxlength="128" ?disabled="{{variantBusy || variantId == 'baseline'}}"></label><button type="button" class="secondary" @click="{rename(true)}" ?disabled="{{variantBusy || variantId == 'baseline'}}">Save variant name</button><label>Duplicate name <input w-ref="{duplicateName}" maxlength="128" ?disabled="{{variantBusy}}" placeholder="Patched script"></label><button type="button" class="secondary" @click="{duplicate()}" ?disabled="{{variantBusy}}">Duplicate saved revision</button></div><div class="actions"><button type="button" class="secondary" @click="{archive(true)}" ?disabled="{{variantBusy || variantId == 'baseline'}}"><if condition="variantArchived">Restore variant (Undo archive)</if><if condition="!variantArchived">Archive variant</if></button><button type="button" class="secondary" @click="{archive(false)}" ?disabled="{{variantBusy}}"><if condition="experimentArchived">Restore experiment (Undo archive)</if><if condition="!experimentArchived">Archive experiment</if></button></div></details>
  </div>
  <footer ?hidden="{{!experimentItems.length}}"><ul class="variant-overlaps" ?hidden="{{!variantWarnings.length}}"><for each="warning in variantWarnings"><li>{{warning}}</li></for></ul><p role="status" class="field-error" ?hidden="{{!variantError}}">{{variantError}}</p><p role="status" ?hidden="{{!variantMessage}}">{{variantMessage}}</p><div class="actions"><button type="button" @click="{activate()}" ?disabled="{{variantBusy || variantArchived || experimentArchived}}"><if condition="variantWarnings.length">Activate despite overlaps</if><if condition="!variantWarnings.length">Use saved revision for live traffic</if></button><button type="button" class="secondary" @click="{pause()}" ?disabled="{{variantBusy || experimentArchived}}"><if condition="variantPaused">Resume experiment</if><if condition="!variantPaused">Pause experiment</if></button><button type="button" class="secondary" @click="{undoActivation()}" ?disabled="{{variantBusy || !variantUndoAvailable}}">Undo activation</button></div><small>Activation replaces only this experiment’s rules. Global auto-response pause is preserved. Undo is available until another automation change.</small></footer>
</section>
</template>
