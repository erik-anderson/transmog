<template>
<section class="variant-workspace" aria-label="Response sets" aria-busy="{{variantBusy}}" @keydown="{guideKeyboard(e)}" ?data-touring="{{tourStep}}">
  <header><h2>Response sets</h2><div class="actions"><button w-ref="{guideHelpButton}" type="button" class="secondary" aria-expanded="{{helpOpen}}" @click="{showGuideHelp()}">How response sets work</button><button w-ref="{newExperimentButton}" type="button" @click="{newExperiment()}" ?disabled="{{tourStep > 0 || variantBusy}}">New response set</button></div></header>
  <if condition="helpOpen"><dialog open w-ref="{guideHelpPanel}" class="response-set-help" aria-modal="false" aria-label="How response sets work" tabindex="-1">
    <p>Organize related response changes, save alternatives, and preview them before choosing what to use for live traffic.</p>
    <p ?hidden="{{experimentItems.length}}">Save your first response set to take the tour.</p>
    <div class="actions"><button w-ref="{guideStartButton}" type="button" @click="{startGuide()}" ?disabled="{{!experimentItems.length || variantBusy || !preferencesReady}}" aria-disabled="{{guidePending}}" aria-busy="{{guidePending}}"><if condition="guideHistory == 'started'">Replay tour</if><if condition="guideHistory != 'started'">Take a quick tour</if></button><button type="button" class="secondary" @click="{closeGuideHelp()}">Close</button></div>
  </dialog></if>
  <if condition="invitationVisible && !helpOpen && tourStep == 0"><section class="response-set-invitation" aria-label="Response sets tour invitation"><p><strong>New to response sets?</strong><br>Take a quick tour of variants, previews, and live traffic.</p><div class="actions"><button type="button" @click="{startGuide()}" ?disabled="{{tourStep > 0 || variantBusy}}" aria-disabled="{{guidePending}}" aria-busy="{{guidePending}}">Take a quick tour</button><button type="button" class="secondary" @click="{dismissGuideInvitation()}">Not now</button></div></section></if>
  <p role="status" class="field-error" ?hidden="{{!guideError}}">{{guideError}}</p>
  <p ?hidden="{{experimentItems.length}}">Group related response changes and keep saved alternatives. Select a response in Traffic, then choose Create response set.</p>
  <div class="variant-content" ?hidden="{{!experimentItems.length}}">
    <div class="variant-pickers" ?data-tour-target="{{tourStep == 1}}"><label>Response set <select w-ref="{experimentSelect}" aria-label="Response set" @change="{selectExperiment(e)}" ?disabled="{{variantBusy}}"><for each="item in experimentItems"><option value="{{item.id}}" ?selected="{{item.id == experimentId}}">{{item.name}}</option></for></select></label><label>Variant <select w-ref="{variantSelect}" aria-label="Variant" @change="{selectVariant(e)}" ?disabled="{{variantBusy}}"><for each="item in variantItems"><option value="{{item.id}}" ?selected="{{item.id == variantId}}">{{item.name}}</option></for></select></label><label>Revision <select aria-label="Variant revision" @change="{selectRevision(e)}" ?disabled="{{variantBusy}}"><for each="revision in revisionItems"><option value="{{revision}}" ?selected="{{revision == variantRevision}}">{{revision}}</option></for></select></label></div>
    <if condition="tourStep == 1"><response-set-tour w-ref="{tourPanel}" :stepNumber="{{stepNumber}}" :stepTitle="{{stepTitle}}" :stepCopy="{{stepCopy}}" :stepLast="{{stepLast}}" :tourContext="{{tourContext}}" @tour-next="{nextTourStep()}" @tour-back="{previousTourStep()}" @tour-end="{endGuide()}"></response-set-tour></if>
    <div class="variant-state" role="status"><p><strong>Viewing</strong> {{variantViewingText}}</p><p><strong>Live traffic</strong> {{variantLiveText}}</p><small>Saving a revision does not activate it.</small></div>
    <div class="variant-page"><strong>Page:</strong><div><if condition="pageUrl"><p class="variant-page-url">{{pageUrl}}</p><small>{{pageIdentity}}</small><small role="status">{{pageAvailability}}</small></if><if condition="!pageUrl"><p>No page chosen</p></if></div><button type="button" class="secondary" @click="{changePage()}" ?disabled="{{tourStep > 0 || variantBusy}}"><if condition="pageUrl">Change…</if><if condition="!pageUrl">Choose page…</if></button></div>
    <div class="actions variant-preview-actions" ?data-tour-target="{{tourStep == 3}}"><button type="button" @click="{previewVariant()}" ?disabled="{{tourStep > 0 || variantBusy}}" aria-describedby="variant-preview-prerequisite">Preview saved revision…</button><small id="variant-preview-prerequisite">Uses this set’s chosen captured page.</small><button type="button" class="secondary" @click="{showPreviewDiagnostics()}" ?hidden="{{!previewReportAvailable || previewReportSetId != experimentId}}">Last preview diagnostics</button><button type="button" class="secondary" @click="{addResponse()}" ?disabled="{{tourStep > 0 || variantBusy || !variantLatest || variantId == 'baseline' || variantArchived || experimentArchived}}">Add selected response</button></div>
    <if condition="tourStep == 3"><response-set-tour w-ref="{tourPanel}" :stepNumber="{{stepNumber}}" :stepTitle="{{stepTitle}}" :stepCopy="{{stepCopy}}" :stepLast="{{stepLast}}" :tourContext="{{tourContext}}" @tour-next="{nextTourStep()}" @tour-back="{previousTourStep()}" @tour-end="{endGuide()}"></response-set-tour></if>
    <p ?hidden="{{variantLatest}}">Earlier saved revision. Create a variant copy to edit, or preview and activate these exact definitions. A new preview of a linked file reads its current bytes; retained Traffic keeps earlier served bytes.</p>
    <div class="variant-rule-list"><p ?data-tour-target="{{tourStep == 2 && !variantRules.length}}" ?hidden="{{variantRules.length}}">No rules in this revision. Baseline removes this response set’s rules from live traffic; unrelated automation still participates.</p><if condition="tourStep == 2 && !variantRules.length"><response-set-tour w-ref="{tourPanel}" :stepNumber="{{stepNumber}}" :stepTitle="{{stepTitle}}" :stepCopy="{{stepCopy}}" :stepLast="{{stepLast}}" :tourContext="{{tourContext}}" @tour-next="{nextTourStep()}" @tour-back="{previousTourStep()}" @tour-end="{endGuide()}"></response-set-tour></if><ol><for each="rule in variantRules"><li key="{{rule.id}}"><div><strong>{{rule.name}}</strong><details><summary>Saved response reference</summary><small>{{rule.asset}}</small></details><span><if condition="rule.enabled">Included</if><if condition="!rule.enabled">Excluded</if></span></div><div class="actions" ?data-tour-target="{{tourStep == 2 && rule.id == tourRuleId}}"><button type="button" class="secondary" @click="{editRule(rule.id)}" ?disabled="{{tourStep > 0 || variantBusy}}"><if condition="variantLatest">Edit response</if><if condition="!variantLatest">Inspect response</if></button><button type="button" class="secondary" @click="{changeRule(rule.id,'toggle')}" ?disabled="{{tourStep > 0 || variantBusy || !variantLatest || variantArchived || experimentArchived}}"><if condition="rule.enabled">Exclude</if><if condition="!rule.enabled">Include</if></button><button type="button" class="secondary" aria-label="Move {{rule.name}} earlier" @click="{changeRule(rule.id,'up')}" ?disabled="{{tourStep > 0 || variantBusy || !variantLatest || variantArchived || experimentArchived}}">↑</button><button type="button" class="secondary" aria-label="Move {{rule.name}} later" @click="{changeRule(rule.id,'down')}" ?disabled="{{tourStep > 0 || variantBusy || !variantLatest || variantArchived || experimentArchived}}">↓</button><button type="button" class="secondary" @click="{changeRule(rule.id,'remove')}" ?disabled="{{tourStep > 0 || variantBusy || !variantLatest || variantArchived || experimentArchived}}">Remove from variant</button></div><if condition="tourStep == 2 && rule.id == tourRuleId"><response-set-tour w-ref="{tourPanel}" :stepNumber="{{stepNumber}}" :stepTitle="{{stepTitle}}" :stepCopy="{{stepCopy}}" :stepLast="{{stepLast}}" :tourContext="{{tourContext}}" @tour-next="{nextTourStep()}" @tour-back="{previousTourStep()}" @tour-end="{endGuide()}"></response-set-tour></if></li></for></ol></div>

    <details><summary>Activation order</summary><p>First matching response wins across response sets and ordinary rules. Save a new revision before or after other live rules to resolve a priority conflict; then activate it explicitly.</p><div class="actions"><button type="button" class="secondary" @click="{positionVariant(true)}" ?disabled="{{tourStep > 0 || variantBusy || !variantLatest || variantArchived || experimentArchived || !variantRules.length}}">Save before other live rules</button><button type="button" class="secondary" @click="{positionVariant(false)}" ?disabled="{{tourStep > 0 || variantBusy || !variantLatest || variantArchived || experimentArchived || !variantRules.length}}">Save after other live rules</button></div></details><button w-ref="{copyButton}" type="button" class="secondary" @click="{duplicate()}" ?disabled="{{tourStep > 0 || variantBusy}}" aria-disabled="{{copyPending}}" aria-busy="{{copyPending}}">Create variant copy…</button><details><summary>Names and archive</summary><div class="variant-names"><label>Response set name <input w-ref="{experimentName}" maxlength="128" ?disabled="{{tourStep > 0 || variantBusy}}"></label><button type="button" class="secondary" @click="{rename(false)}" ?disabled="{{tourStep > 0 || variantBusy}}" aria-label="Save response set name">Save name</button><label>Variant name <input w-ref="{variantName}" maxlength="128" ?disabled="{{tourStep > 0 || variantBusy || variantId == 'baseline'}}"></label><button type="button" class="secondary" @click="{rename(true)}" ?disabled="{{tourStep > 0 || variantBusy || variantId == 'baseline'}}">Save variant name</button></div><div class="actions"><button type="button" class="secondary" @click="{archive(true)}" ?disabled="{{tourStep > 0 || variantBusy || variantId == 'baseline'}}"><if condition="variantArchived">Restore variant (Undo archive)</if><if condition="!variantArchived">Archive variant</if></button><button type="button" class="secondary" @click="{archive(false)}" ?disabled="{{tourStep > 0 || variantBusy}}"><if condition="experimentArchived">Restore response set</if><if condition="!experimentArchived">Archive response set</if></button></div></details>
  </div>
  <footer ?hidden="{{!experimentItems.length}}"><ul class="variant-overlaps" ?hidden="{{!variantWarnings.length}}"><for each="warning in variantWarnings"><li>{{warning}}</li></for></ul><p role="status" class="field-error" ?hidden="{{!variantError}}">{{variantError}}</p><p role="status" ?hidden="{{!variantMessage}}">{{variantMessage}}</p><if condition="variantUndoAvailable"><div class="activation-feedback" role="status"><span>{{activationOutcome}}</span><button w-ref="{undoButton}" type="button" class="secondary compact-button" @click="{undoActivation()}" ?disabled="{{tourStep > 0}}" aria-disabled="{{variantBusy}}" aria-busy="{{variantBusy}}">Undo last activation</button><small>{{activationRestore}}</small></div></if><div class="actions" ?data-tour-target="{{tourStep == 4}}"><button w-ref="{activationButton}" type="button" @click="{activate()}" ?disabled="{{tourStep > 0 || variantBusy || variantArchived || experimentArchived}}"><if condition="variantWarnings.length">Activate despite overlaps</if><if condition="!variantWarnings.length">Use saved revision for live traffic</if></button><button type="button" class="secondary" @click="{pause()}" ?disabled="{{tourStep > 0 || variantBusy || experimentArchived}}"><if condition="variantPaused">Resume response set</if><if condition="!variantPaused">Pause response set</if></button></div><if condition="tourStep == 4"><response-set-tour w-ref="{tourPanel}" :stepNumber="{{stepNumber}}" :stepTitle="{{stepTitle}}" :stepCopy="{{stepCopy}}" :stepLast="{{stepLast}}" :tourContext="{{tourContext}}" @tour-next="{nextTourStep()}" @tour-back="{previousTourStep()}" @tour-end="{endGuide()}"></response-set-tour></if><small>Activation replaces only this response set’s rules. Saved-response pause is preserved. Undo is available until another automation change.</small></footer>

<dialog w-ref="{copyDialog}" class="variant-copy-dialog" aria-labelledby="variant-copy-title" @cancel="{closeCopy(e)}">
  <h2 id="variant-copy-title">Create variant copy</h2><p class="copy-source">{{copySource}}</p>
  <form @submit="{createCopy(e)}"><label>New variant name <input w-ref="{copyName}" maxlength="128" required ?readonly="{{copyPending || copyCompleted}}"></label>
    <p>Copies the selected saved revision. Live traffic is unchanged.</p>
    <p role="status" class="field-error" ?hidden="{{!copyError}}">{{copyError}}</p>
    <p role="status" ?hidden="{{!copyPending}}">Creating copy… You can close this dialog; creation will continue.</p>
    <p role="status" ?hidden="{{!copyCompleted}}">Variant copy created. Live traffic is unchanged.</p>
    <div class="actions"><button w-ref="{copyCreateButton}" type="submit" @pointerdown="{copyPointerDown(e)}" ?disabled="{{copyCompleted}}" aria-disabled="{{copyPending || copyCompleted}}" aria-busy="{{copyPending}}">Create copy</button><button w-ref="{copyCloseButton}" type="button" class="secondary" @click="{closeCopy()}"><if condition="copyPending || copyCompleted">Close</if><if condition="!copyPending && !copyCompleted">Cancel</if></button></div>
  </form>
</dialog>
</section>
</template>
