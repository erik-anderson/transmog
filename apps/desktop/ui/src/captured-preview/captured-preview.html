<template>
<dialog w-ref="{previewPageDialog}" class="captured-page-warning" aria-labelledby="captured-page-heading" @cancel="{closeCapturedPageWarning()}">
      <h2 id="captured-page-heading"><if condition="controller.previewSavedDemoName">Open saved demo</if><if condition="!controller.previewSavedDemoName">Preview captured page</if></h2><p ?hidden="{{!controller.previewSavedDemoName}}"><strong>{{controller.previewSavedDemoName}}</strong> · Frozen captured page and response changes. This demo retains its saved resource source and exact bytes.</p><p class="field-help">Every opened preview starts a fresh InPrivate browser profile with separate cache, cookies and storage. F5 reloads this run's frozen responses within its current browser session. Decoded response data can remain in temporary files after an abrupt exit; InPrivate does not protect those files.</p><if condition="controller.previewDocumentChoices.length"><label>Captured page<select aria-label="Captured page" @change="{previewDocumentChanged(e)}" ?disabled="{{controller.previewPageBusy}}"><for each="page in controller.previewDocumentChoices"><option key="{{page.id}}" value="{{page.id}}" ?selected="{{page.id == controller.previewPageId}}">{{page.label}}</option></for></select></label><p class="field-help">{{controller.previewDocumentNote}}</p></if><p data-copy-text data-copy-surface tabindex="0" class="full-value">{{controller.previewPageUrl}}</p><p>Captured content may be malicious. Open content from a source you trust; enabling scripts increases the risk.</p><p class="field-help">The page uses frozen captured responses and any selected saved responses. Missing requests return a network failure. The preview has a separate browser profile and works while the proxy is stopped.</p><p class="field-help" ?hidden="{{!controller.previewReusesScene}}">Uses the same frozen captured scene as the last preview.</p><label>Resource source <select aria-label="Resource source" @change="{setPreviewScope(e)}" ?disabled="{{controller.previewPageBusy || controller.previewReusesScene || controller.previewSavedDemoName}}"><option value="original-trace" ?selected="{{controller.previewPageScope == 'original-trace'}}">Selected trace / current capture</option><option value="all-loaded" ?selected="{{controller.previewPageScope == 'all-loaded'}}">All loaded traffic in this window</option></select></label><p class="field-help" ?hidden="{{controller.previewPageScope != 'all-loaded'}}">This may mix content from different captures or users. The selected captured document stays fixed as fallback.</p><if condition="!controller.viewerMode && !controller.previewSavedDemoName"><label>Responses <select aria-label="Responses" @change="{setPreviewMode(e)}" ?disabled="{{controller.previewPageBusy}}"><option value="captured" ?selected="{{controller.previewPageMode == 'captured'}}">Captured</option><option value="modified" ?selected="{{controller.previewPageMode == 'modified'}}">Captured with saved responses</option></select></label><if condition="controller.previewPageMode == 'modified'"><p class="field-help">For this preview only. The first participating matching rule wins, even when live saved responses are paused. Live rule states stay unchanged. Only saved versions are used.</p><p role="status" ?hidden="{{!controller.previewRulesBusy}}">Loading saved rules…</p><p class="field-error" ?hidden="{{!controller.previewRulesError}}">{{controller.previewRulesError}}</p><p class="field-help preview-rule-name">{{controller.previewRuleSummary}}</p><details><summary>Select saved rules in priority order</summary><div class="preview-rule-picker"><for each="rule in controller.previewRules"><label key="{{rule.id}}" class="checkbox-label"><input type="checkbox" ?checked="{{rule.included}}" @change="{setPreviewRule(rule.id,e)}" ?disabled="{{controller.previewPageBusy || controller.previewVariantLocked}}"><span class="preview-rule-name">{{rule.name}}<small>{{rule.state}}</small></span></label></for></div><p class="field-help" ?hidden="{{controller.previewRules.length}}">No saved responses. Create a rule in Automation, then reopen this dialog.</p></details><if condition="controller.previewDraftDirty"><label class="checkbox-label"><input type="checkbox" ?checked="{{controller.previewDraftExcluded}}" @change="{excludePreviewDraft(e)}" ?disabled="{{controller.previewPageBusy}}"> Exclude unsaved editor changes and use the selected saved versions</label></if></if></if><p class="field-help">Navigation starts with GET, including a selected POST response. Authored POST-only rules do not match that GET; edit the method explicitly if needed.</p><label class="checkbox-label"><input w-ref="{previewPageScripts}" type="checkbox" ?disabled="{{controller.previewPageBusy}}"> Enable scripts for this preview</label><details><summary>What may look different</summary><p class="field-help">Matches captured responses by method and URL. Prefers recorded browser/process, request body, Origin/Referer, Sec- headers and navigation timing. Repeated requests advance through captured responses; header and body mismatches can fall back to available bytes. The selected HTML is used for initial GET navigation. Missing, incomplete or large resources may be unavailable. Service workers, WebSockets, live connections, downloads and device permissions are disabled.</p></details><if condition="controller.previewPageStatus"><p role="status">{{controller.previewPageStatus}}</p></if><footer class="actions"><button type="button" @click="{openCapturedPage()}" aria-disabled="{{controller.previewPageBusy}}" aria-busy="{{controller.previewPageBusy}}">Open preview</button><button type="button" class="secondary" @click="{closeCapturedPageWarning()}">Cancel</button></footer>
    <inspection-copy-menu></inspection-copy-menu></dialog>
<dialog w-ref="{previewReportDialog}" class="captured-preview-report" aria-labelledby="preview-report-heading" @cancel="{closePreviewReport(e)}"><h3 id="preview-report-heading">Captured preview diagnostics</h3><div class="preview-report-scroll"><p data-copy-text data-copy-surface tabindex="0" class="full-value">{{controller.previewReportUrl}}</p><p role="status">{{controller.previewReportSummary}}</p><details ?hidden="{{!controller.previewVariantText}}"><summary>Saved variant identity</summary><p data-copy-text data-copy-surface tabindex="0" class="full-value">{{controller.previewVariantText}}</p></details><p class="field-error" ?hidden="{{!controller.previewReportError}}">{{controller.previewReportError}}</p><p class="field-help">Frozen captured bytes and selected saved responses are served. Rules match the actual browser method, URL and explicit headers before captured fallback; captured Vary is never a rule condition. Navigation starts with GET, even for a selected POST response. Missing requests return a network failure. Request bodies and recorded client/header context are preferences. Responses progress in capture order for repeated URLs; reload resets that sequence. Captured fallback requires only method and URL; Vary is a preference. Refresh after navigating the preview. Diagnostics show up to 256 resource decisions and the last 256 requests, with shortened URLs; counters include all requests.</p><if condition="controller.previewSavedDemoOrigin"><p>{{controller.previewSavedDemoOrigin}}. Current rule edits and linked files cannot change this saved playback. Reopen it from Saved demos for a new browser session.</p></if><if condition="controller.previewCaseOrigin"><p>These rules belong to the frozen case. Their definitions remain in its package inventory; workbench rules are separate.</p></if><if condition="controller.previewRuleRows.length"><h4>Frozen saved responses · first match wins</h4><div class="preview-request-list"><for each="rule in controller.previewRuleRows"><div key="{{rule.id}}"><strong>{{rule.name}} · Revision {{rule.revision}}</strong><span>Asset {{rule.asset}} · {{rule.bytes}} bytes</span><code data-copy-surface class="full-value">SHA-256 {{rule.sha256}}</code><span ?hidden="{{!rule.shadowedBy}}">Shadowed by {{rule.shadowedBy}}</span><button type="button" class="secondary compact-button" ?disabled="{{controller.previewCaseOrigin || controller.previewSavedDemoOrigin}}" @click="{showPreviewRule(rule.id)}">Show saved rule</button></div></for></div></if><if condition="controller.previewComparisonBaselineLabel"><p>Response comparison baseline: {{controller.previewComparisonBaselineLabel}} <button type="button" class="secondary compact-button" @click="{clearPreviewResponseBaseline()}">Clear response baseline</button></p></if><h4>Browser requests</h4><if condition="controller.previewReportLoaded && !controller.previewRequestRows.length"><p>No browser requests have been recorded yet.</p></if><div class="preview-request-list"><for each="row in controller.previewRequestRows"><div key="{{row.id}}"><strong>{{row.outcome}} · {{row.method}}</strong><span data-copy-text data-copy-surface tabindex="0" class="full-value">{{row.url}}</span><small>{{row.reason}}</small><code data-copy-surface class="full-value" ?hidden="{{!row.sha256}}">SHA-256 {{row.sha256}}</code><button type="button" class="secondary compact-button" ?disabled="{{!row.comparable}}" @click="{comparePreviewResponse(row.id,row.sourceId,row.ruleId)}">Compare response</button><button type="button" class="secondary compact-button" ?disabled="{{!row.comparable}}" @click="{setPreviewResponseBaseline(row.id)}">Set response baseline</button><button type="button" class="secondary compact-button" ?hidden="{{!row.sourceId}}" @click="{showPreviewSource(row.sourceId)}">Show captured source</button><button type="button" class="secondary compact-button" ?hidden="{{!row.ruleId}}" ?disabled="{{controller.previewCaseOrigin || controller.previewSavedDemoOrigin}}" @click="{showPreviewRule(row.ruleId)}">Show winning saved rule</button></div></for></div><details><summary>Captured resource versions</summary><div class="preview-request-list"><for each="row in controller.previewResourceRows"><div key="{{row.id}}"><strong>{{row.method}} · {{row.source}}</strong><span data-copy-text data-copy-surface tabindex="0" class="full-value">{{row.url}}</span><small>{{row.size}} · {{row.time}}</small><span>{{row.decision}}</span><button type="button" class="secondary compact-button" ?hidden="{{!row.sourceAvailable}}" @click="{showPreviewSource(row.sourceId)}">Show source in Traffic</button></div></for></div></details></div><footer class="actions"><button type="button" class="secondary" ?disabled="{{!controller.previewSceneAvailable || controller.previewPageBusy}}" @click="{showRelatedPreview('captured')}">Open baseline…</button><button type="button" class="secondary" ?hidden="{{controller.viewerMode}}" ?disabled="{{!controller.previewSceneAvailable || controller.previewPageBusy}}" @click="{showRelatedPreview('modified')}">Open updated preview…</button><button type="button" class="secondary" @click="{refreshPreviewReport()}" ?disabled="{{controller.previewReportBusy}}">Refresh diagnostics</button><button type="button" class="secondary" @click="{closePreviewReport()}">Close</button></footer><inspection-copy-menu></inspection-copy-menu></dialog>
</template>
