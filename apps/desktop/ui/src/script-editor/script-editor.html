<template>
<if condition="editorLoaded"><link w-ref="{monacoStyles}" rel="stylesheet" href="/monaco.css"></if>
<section class="script-workspace" aria-labelledby="script-heading" @keydown="{scriptKeyboard(e)}">
  <editor-surface :label="{{sourceLabel}}" @editor-expanded="{focusEditor()}" @editor-restored="{focusEditor()}">
    <h2 slot="title" id="script-heading">Traffic scripts</h2>
    <div slot="header-actions" class="script-header-actions">
      <button w-ref="{sourceButton}" type="button" class="secondary script-menu-trigger source-trigger" popovertarget="script-source-menu" aria-label="{{sourceLabel}} options" ?disabled="{{scriptBusy || !scriptReady}}"><if condition="reviewingTypeScript">Retained TypeScript</if><if condition="!reviewingTypeScript && language == 'typescript'">TypeScript</if><if condition="!reviewingTypeScript && language == 'javascript'">JavaScript</if></button>
      <div id="script-source-menu" w-ref="{sourceMenu}" class="table-popover script-command-menu" popover="auto" @toggle="{menuToggled(e)}" @keydown="{menuKeyboard(e)}" aria-label="Source options">
        <button type="button" autofocus ?disabled="{{reviewingTypeScript}}" @click="{validateScript()}">Validate only</button>
        <if condition="language == 'typescript'"><button type="button" @click="{editJavaScript()}">Edit JavaScript</button></if>
        <if condition="language == 'javascript'"><button type="button" ?disabled="{{reviewingTypeScript || retainedSource == null}}" @click="{reviewTypeScript()}">Return to TypeScript…</button></if>
        <if condition="scriptActive || canResume"><hr></if>
        <if condition="scriptActive"><button type="button" ?disabled="{{reviewingTypeScript}}" @click="{compareActiveScript()}">Compare with active</button></if>
        <if condition="scriptActive || canResume"><button type="button" @click="{viewAppliedJavaScript()}">View applied JavaScript</button></if>
      </div>
      <button w-ref="{handlerButton}" type="button" class="secondary script-menu-trigger handler-trigger" aria-expanded="{{handlerMenuOpen}}" aria-controls="script-handlers-menu" ?disabled="{{!scriptReady || scriptBusy || reviewingTypeScript || conflictVisible}}" @click="{toggleHandlers()}">Handlers</button>
      <div id="script-handlers-menu" w-ref="{handlerMenu}" class="table-popover script-command-menu handler-menu" popover="auto" @toggle="{menuToggled(e)}" @keydown="{menuKeyboard(e)}" aria-label="Add or go to a handler">
        <for each="group in handlerGroups"><section><h3>{{group.label}}</h3><for each="item in group.items"><button type="button" class="secondary" @click="{chooseHandler(item.name)}"><span>{{item.label}}</span><small>{{item.action}}</small></button></for></section></for>
      </div>
      <button w-ref="{debugMenuButton}" type="button" class="secondary script-menu-trigger debug-trigger" popovertarget="script-debug-menu">Debug</button>
      <div id="script-debug-menu" w-ref="{debugMenu}" class="table-popover script-command-menu" popover="auto" @toggle="{menuToggled(e)}" @keydown="{menuKeyboard(e)}" aria-label="Debug commands">
        <button type="button" autofocus aria-keyshortcuts="F12" @click="{showDebugger()}">Open debugger for live traffic <kbd aria-hidden="true">F12</kbd></button>
        <hr>
        <button type="button" ?disabled="{{scriptBusy || !scriptReady || reviewingTypeScript}}" @click="{testScript(e)}">Test in sandbox</button>
        <button type="button" ?disabled="{{scriptBusy || !scriptReady || reviewingTypeScript}}" @click="{debugTest(e)}">Run sandbox test in debugger</button>
      </div>
      <button w-ref="{scriptHelpButton}" type="button" class="secondary" ?disabled="{{!apiRevision}}" @click="{openScriptHelp()}">Open API docs</button>
    </div>
    <div slot="actions" class="script-toolbar">
      <div class="script-actions actions">
        <button type="button" ?disabled="{{scriptBusy || !scriptReady || reviewingTypeScript || conflictVisible}}" ?hidden="{{scriptActive}}" @click="{primaryAction()}">Save &amp; enable</button><button type="button" ?disabled="{{scriptBusy || !scriptReady || !scriptUnapplied || reviewingTypeScript || conflictVisible}}" ?hidden="{{!scriptActive}}" @click="{primaryAction()}">Save &amp; apply</button>
        <if condition="canResume"><button type="button" class="secondary" ?disabled="{{scriptBusy || !scriptReady}}" @click="{resumeScript()}">Resume applied script</button></if>
        <if condition="scriptActive"><button type="button" class="secondary" ?disabled="{{scriptBusy || !scriptReady}}" @click="{disableScript()}">Pause script</button></if>
        <button type="button" class="secondary" ?disabled="{{scriptBusy || !scriptReady || !scriptDirty}}" @click="{saveScript()}">Save draft</button><button type="button" class="secondary" ?disabled="{{scriptBusy || !scriptReady || !scriptDirty}}" @click="{discardScript()}">Discard changes</button>
        <div class="script-state"><span role="status">{{activeScriptText}}<if condition="scriptActive && scriptUnapplied"> · Unapplied changes</if></span><draft-status :dirty="{{scriptDirty}}" :newDraft="{{newScriptDraft}}"></draft-status></div>
      </div>
      <p class="field-help">{{appliedBuildText}}</p>
      <p class="field-help script-scope">Draft traffic scope: {{draftScope}}</p>
      <if condition="runtimeIssue"><section class="script-recovery" role="alert"><p>Applied script unavailable: {{runtimeIssue}}</p><button type="button" class="secondary" ?disabled="{{scriptBusy}}" @click="{retryScript()}">Retry applied script</button><span>Pause script stops its effects while you repair it.</span></section></if>
      <script-diagnostics :evidence="{{runtimeDetails}}"></script-diagnostics>
      <script-diagnostics :evidence="{{operationDetails}}"></script-diagnostics>
      <if condition="conflictVisible"><section class="script-recovery" role="alert"><p>The saved script changed in another window. Your draft is preserved. Compare both versions before replacing either.</p><button type="button" class="secondary" ?disabled="{{scriptBusy}}" @click="{compareSavedScript()}">Compare with saved script</button></section></if>
      <if condition="canUndoSavedLoad"><button type="button" class="secondary" ?disabled="{{scriptBusy}}" @click="{restorePreviousDraft()}">Restore my previous draft</button></if>
      <if condition="reviewingTypeScript"><div class="actions"><button type="button" class="secondary" ?disabled="{{scriptBusy}}" @click="{compareTypeScriptOutput()}">Compare generated JavaScript</button><button type="button" class="secondary" ?disabled="{{scriptBusy}}" @click="{keepJavaScript()}">Keep JavaScript</button></div></if>
      <if condition="historyEntries.length"><details class="script-history" ?open="{{historyOpen}}" @toggle="{historyToggled(e)}"><summary>Previous JavaScript drafts ({{historyEntries.length}})</summary><for each="item in historyEntries"><details><summary>{{item.label}}</summary><pre tabindex="0" data-copy-surface>{{item.source}}</pre><div class="actions"><button type="button" class="secondary" ?disabled="{{scriptBusy || reviewingTypeScript}}" @click="{restoreJavaScriptDraft(item.index)}">Restore {{item.label}}</button><button type="button" class="secondary" ?disabled="{{scriptBusy || reviewingTypeScript}}" @click="{removeJavaScriptDraft(item.index)}">Remove {{item.label}}</button></div></details></for></details></if>
      <if condition="canUndoHistoryRemoval"><button type="button" class="secondary" ?disabled="{{scriptBusy}}" @click="{undoJavaScriptRemoval()}">Undo draft removal</button></if>
      <output class="operation-status" data-kind="{{statusKind}}" aria-live="polite" ?hidden="{{!scriptText}}">{{scriptText}}</output>
    </div>
    <div w-ref="{scriptEditor}" class="monaco-editor-host" aria-label="Traffic script source editor"></div>
    <div slot="feedback" class="script-authoring-feedback">
      <if condition="sourceEmpty"><div class="script-start"><span>Choose a handler above to start, or write your own.</span><button w-ref="{sampleButton}" type="button" class="secondary" @click="{openScriptHelp(true)}">View full sample</button></div></if>
      <if condition="handlerHint"><p class="handler-hint">{{handlerHint}} <if condition="handlerSetting"><button type="button" class="secondary" @click="{showHandlerSetting()}">Review settings</button></if></p></if>
      <p class="field-help">{{bodyProcessing}}</p>
      <p class="field-help" role="status">{{authoringStatus}}</p>
      <if condition="typeScriptIssue"><section class="script-recovery" aria-label="TypeScript issues"><p>Choose an issue to jump to its source. Fix all errors before applying TypeScript. You can still save the draft.</p><ul><for each="item in typeScriptIssues"><li><button type="button" class="script-issue" @click="{goToTypeScriptIssue(item)}">Line {{item.line}}:{{item.column}} - {{item.message}}</button></li></for></ul><div class="actions"><button type="button" class="secondary" ?disabled="{{scriptBusy}}" @click="{retryTypeScriptCheck()}">Check TypeScript again</button><if condition="language == 'typescript'"><button type="button" class="secondary" ?disabled="{{scriptBusy}}" @click="{editJavaScript()}">Edit JavaScript</button></if></div></section></if>
    </div>
  </editor-surface>
  <details class="script-build"><summary>{{sourceAlignment}}</summary><pre tabindex="0" data-copy-surface>{{buildInfo}}</pre></details>
  <p class="editor-label">Ctrl+S saves the draft. Ctrl+M toggles Tab movement in the editor.</p>
  <details class="script-settings">
    <summary>Filters, capabilities, and parameters</summary>
    <form w-ref="{scriptForm}" @submit="{validateScript(e)}" @input="{markScriptChanged()}" class="script-form">
      <label>Host filter (optional) <input name="scriptHost" value="example.test" maxlength="255" ?disabled="{{!scriptReady}}"></label>
      <label>Method filter (optional) <input name="scriptMethod" maxlength="32" placeholder="GET" ?disabled="{{!scriptReady}}"></label>
      <label>Path-prefix filter (optional) <input name="scriptPath" maxlength="2048" placeholder="/api" ?disabled="{{!scriptReady}}"></label>
      <label>Writable headers <input name="scriptHeaders" value="user-agent" maxlength="4096" ?disabled="{{!scriptReady}}"></label>
      <label>Request body media types <input name="requestTypes" placeholder="application/json" maxlength="4096" ?disabled="{{!scriptReady}}"></label>
      <label>Response body media types <input name="responseTypes" placeholder="application/json" maxlength="4096" ?disabled="{{!scriptReady}}"></label>
      <label>Response body statuses <input name="responseStatuses" placeholder="200, 201" maxlength="2048" ?disabled="{{!scriptReady}}"></label>
      <label><input name="includeLocal" type="checkbox" ?disabled="{{!scriptReady}}"> Run response body handlers on local responses</label>
      <p class="field-help script-filter-help">Body media types and statuses use comma-separated exact values; empty permits all. onResponseBody waits for the complete body; onResponseChunk processes incrementally. Unmatched bodies keep streaming.</p>
      <fieldset ?disabled="{{!scriptReady}}">
        <legend>Capabilities</legend>
        <label><input name="rewriteRequest" type="checkbox"> Rewrite request method and URL</label>
        <label><input name="reroute" type="checkbox"> Allow cross-origin URL changes</label>
        <label><input name="writeStatus" type="checkbox"> Change response status</label>
        <label><input name="annotate" type="checkbox"> Add saved traffic annotations</label>
        <label><input name="readBodies" type="checkbox"> Read bounded bodies</label>
        <label><input name="writeBody" type="checkbox"> Replace bodies</label>
        <label><input name="respond" type="checkbox"> Return responses or select assets</label>
        <label><input name="abort" type="checkbox" checked> Abort requests</label>
        <label><input name="sensitive" type="checkbox"> Read sensitive headers</label>
      </fieldset>
      <fieldset class="script-parameters" ?disabled="{{!scriptReady}}">
        <legend>Parameters</legend>
        <p class="field-help">Saved with each applied build. Read values from event.parameters; choose whether to use each default or override it.</p>
        <for each="item in parameterRows"><fieldset key="{{item.id}}" class="script-parameter"><legend>Parameter {{item.name}}</legend>
          <label>Name <input value="{{item.name}}" maxlength="64" @input="{changeParameter(item.id, 'name', e)}"></label>
          <label>Label <input value="{{item.label}}" maxlength="128" @input="{changeParameter(item.id, 'label', e)}"></label>
          <label>Type <select aria-label="Type" @input="{changeParameter(item.id, 'type', e)}"><option value="string" ?selected="{{item.type == 'string'}}">Text</option><option value="boolean" ?selected="{{item.type == 'boolean'}}">Boolean</option><option value="integer" ?selected="{{item.type == 'integer'}}">Integer</option></select></label>
          <if condition="item.type == 'boolean'"><label>Default <select aria-label="Default" @input="{changeParameter(item.id, 'defaultValue', e)}"><option value="false" ?selected="{{item.defaultValue == 'false'}}">False</option><option value="true" ?selected="{{item.defaultValue == 'true'}}">True</option></select></label><label>Override <select aria-label="Override" @input="{changeParameter(item.id, 'override', e)}"><option value="" ?selected="{{item.override == ''}}">Use default</option><option value="false" ?selected="{{item.override == 'false'}}">False</option><option value="true" ?selected="{{item.override == 'true'}}">True</option></select></label></if>
          <if condition="item.type != 'boolean'"><label>Default <input value="{{item.defaultValue}}" maxlength="4096" @input="{changeParameter(item.id, 'defaultValue', e)}"></label><label><input type="checkbox" ?checked="{{item.useDefault}}" @input="{changeParameter(item.id, 'useDefault', e)}"> Use default</label><label>Override <input value="{{item.override}}" ?disabled="{{item.useDefault}}" maxlength="4096" @input="{changeParameter(item.id, 'override', e)}"></label></if>
          <if condition="item.type == 'integer'"><label>Minimum <input value="{{item.min}}" @input="{changeParameter(item.id, 'min', e)}"></label><label>Maximum <input value="{{item.max}}" @input="{changeParameter(item.id, 'max', e)}"></label></if>
          <if condition="item.type == 'string'"><label>Choices (optional, comma-separated) <input value="{{item.choices}}" maxlength="65536" @input="{changeParameter(item.id, 'choices', e)}"></label></if>
          <button type="button" class="secondary" @click="{removeParameter(item.id)}">Remove parameter</button>
        </fieldset></for>
        <button type="button" class="secondary" ?disabled="{{parameterRows.length >= 64}}" @click="{addParameter()}">Add parameter</button>
      </fieldset>
      <if condition="settingsError"><p class="operation-status" role="status">{{settingsError}}</p></if>
    </form>
  </details>
  <details class="script-test" @input="{markTestChanged(e)}" @change="{markTestChanged(e)}">
    <summary>Sandbox input and results</summary>
    <label>Test mode <select aria-label="Test mode" @change="{changeTestMode(e)}"><option value="callback">Single callback</option><option value="scenario">Exchange scenario</option></select></label>
    <if condition="testMode == 'callback'"><p class="field-help">Invokes one callback in a fresh host with empty exchange state. Draft parameters and capability checks apply; request and body filters are bypassed.</p></if>
    <if condition="testMode == 'scenario'"><p class="field-help">Runs selected callbacks in order with native filters, edits and shared exchange state. Bodies are decoded fixtures; omit Content-Encoding. Routes, saved assets and transport remain unverified. No request is sent.</p></if>
    <div class="script-test-fields">
      <label>Test URL <input w-ref="{scriptTestUrl}" type="url" value="https://example.test/" maxlength="8192"></label>
      <label>Method <input w-ref="{scriptTestMethod}" value="GET" maxlength="32"></label>
      <label ?hidden="{{testMode != 'callback'}}">Handler <select w-ref="{scriptTestHandler}" @change="{changeTestHandler()}"><for each="item in testHandlers"><option key="{{item.name}}">{{item.name}}</option></for></select></label>
      <label ?hidden="{{testMode != 'callback' || !testStream}}"><input w-ref="{scriptTestEnd}" type="checkbox" checked> End of response body</label>
      <label ?hidden="{{testMode != 'callback' || !testStream}}"><input w-ref="{scriptTestHeaderEdits}" type="checkbox"> Headers held for initial inspection</label>
      <label ?hidden="{{testMode != 'scenario'}}">Scenario outcome <select w-ref="{scriptScenarioOutcome}" aria-label="Scenario outcome" @input="{changeScenarioOutcome(e)}"><option value="response">Response</option><option value="failure">Upstream failure</option></select></label>
      <label>Fixture protocol <select w-ref="{scriptScenarioProtocol}" aria-label="Fixture protocol"><option value="Http1">HTTP/1.1</option><option value="Http2">HTTP/2</option><option value="Http3">HTTP/3</option></select></label>
      <label ?hidden="{{testMode != 'scenario'}}">Scenario duration (ms) <input w-ref="{scriptScenarioDuration}" type="number" value="100" min="0" max="86400000"></label>
      <div><header-editor w-ref="{scriptTestHeaders}" label="Request headers" maxlength="65536" @header-change="{testHeadersChanged(e)}"></header-editor></div>
      <label ?hidden="{{testMode == 'scenario' && scenarioOutcome == 'failure'}}">Response status <input w-ref="{scriptTestStatus}" type="number" value="200" min="100" max="599"></label>
      <div ?hidden="{{testMode == 'scenario' && scenarioOutcome == 'failure'}}"><header-editor w-ref="{scriptTestResponseHeaders}" label="Response headers" maxlength="65536" @header-change="{testHeadersChanged(e)}"></header-editor></div>
      <label ?hidden="{{testMode == 'scenario' && scenarioOutcome == 'failure'}}"><input w-ref="{scriptTestLocal}" type="checkbox"> Local response</label>
      <label ?hidden="{{testMode == 'scenario' && scenarioOutcome != 'failure'}}">Failure category (onFailed) <select w-ref="{scriptTestFailure}" aria-label="Failure category (onFailed)" @input="{changeTestFailure(e)}"><for each="category in failureCategories"><option value="{{category}}" ?selected="{{category == testFailure}}">{{category}}</option></for></select></label>
      <label><if condition="testMode == 'callback'">Body</if><if condition="testMode == 'scenario'">Request body</if> <textarea w-ref="{scriptTestBody}" rows="4" maxlength="1048576">editor test body</textarea></label>
      <label ?hidden="{{testMode != 'scenario' || scenarioOutcome == 'failure'}}">Response body <textarea w-ref="{scriptScenarioResponseBody}" rows="4" maxlength="1048576"></textarea></label>
      <label ?hidden="{{testMode != 'scenario' || scenarioOutcome == 'failure'}}">Response chunk byte counts (optional) <input w-ref="{scriptScenarioChunkSizes}" maxlength="1024" placeholder="For example: 2, 4, 1"></label>
      <label ?hidden="{{testMode != 'scenario' || scenarioOutcome == 'failure'}}">Delay between chunks (ms, simulated) <input w-ref="{scriptScenarioChunkDelay}" type="number" value="0" min="0" max="86400000"></label>
    </div>
    <div class="actions"><button type="button" class="secondary" @click="{useSelectedTestRequest()}" ?disabled="{{!selection}}">Use selected Traffic request</button><span class="field-help">Copies the URL, method, and nonsensitive headers. Body input is cleared.</span></div>
    <if condition="testResult"><section class="script-test-result" aria-label="Sandbox result"><p>{{testResult}}<if condition="testOutdated"> · Outdated: source, settings, or input changed</if></p><if condition="scenarioHeaders"><p>{{scenarioHeaders}}</p></if><if condition="streamTimeline.length"><details><summary>Streaming callbacks</summary><div class="script-help-table" tabindex="0" aria-label="Streaming callback timeline"><table><thead><tr><th>Time</th><th>Pending input</th><th>Action</th><th>Header edits</th></tr></thead><tbody><for each="call in streamTimeline"><tr key="{{call.index}}"><td>{{call.time}}</td><td>{{call.input}}</td><td>{{call.action}}</td><td>{{call.headers}}</td></tr></for></tbody></table></div></details></if><script-diagnostics :evidence="{{sandboxDetails}}"></script-diagnostics><details><summary>Test input and returned changes</summary><pre tabindex="0" data-copy-surface>{{testEvidence}}</pre></details></section></if>
  </details>
  <if condition="testResult"><p class="script-test-summary" role="status">{{testResult}}<if condition="testOutdated"> · Outdated</if></p></if>

  <editor-surface :label="{{diffLabel}}" ?hidden="{{!diffVisible}}">
    <div slot="actions" class="script-comparison-toolbar"><div class="actions"><if condition="conflictVisible"><button type="button" ?disabled="{{scriptBusy || !conflictReviewed}}" @click="{keepMyDraft()}">Keep my draft</button><button type="button" class="secondary" ?disabled="{{scriptBusy || !conflictReviewed}}" @click="{loadSavedDraft()}">Load saved draft</button></if><if condition="reviewingTypeScript"><button type="button" ?disabled="{{scriptBusy || !returnReady}}" @click="{useTypeScriptOutput()}">Use TypeScript output</button></if><button type="button" class="secondary" @click="{closeComparison()}">Close comparison</button><if condition="diffStale"><span>Active script or draft changed since this comparison. Compare again to refresh.</span></if></div><if condition="activeSettings"><details class="script-settings-diff"><summary>Compare settings and retained drafts</summary><div class="script-settings-columns"><section><h3>Left settings</h3><pre tabindex="0" data-copy-surface>{{activeSettings}}</pre></section><section><h3>Right settings</h3><pre tabindex="0" data-copy-surface>{{draftSettings}}</pre></section></div></details></if></div>
    <div w-ref="{scriptDiffEditor}" class="monaco-editor-host diff-editor" aria-label="Active and draft script comparison"></div>
  </editor-surface>
  <dialog w-ref="{scriptHelpDialog}" class="script-help-dialog" aria-labelledby="script-help-heading" @keydown="{scriptHelpKeyboard(e)}" @close="{scriptHelpClosed()}">
    <header><h2 id="script-help-heading">Script API · revision {{apiRevision}}</h2><button type="button" class="secondary" @click="{closeScriptHelp()}">Close</button></header>
    <label>Search Script API <input w-ref="{scriptHelpSearch}" type="search" value="{{helpSearch}}" @input="{searchScriptHelp(e)}"></label>
    <div w-ref="{scriptHelpContent}" class="script-help-content">
      <if condition="!helpSections.length"><p>No matching help. Try a handler, capability or helper name.</p></if>
      <for each="section in helpSections"><details key="{{section.id}}" ?open="{{helpSearch != ''}}" @toggle="{syncApiReference(section.id)}"><summary>{{section.title}}</summary>
        <for each="paragraph in section.paragraphs"><p>{{paragraph}}</p></for>
        <if condition="section.phases.length"><div class="script-help-table" tabindex="0" aria-label="Handler contract"><table><thead><tr><th>Handler</th><th>Additional input</th><th>Decisions</th></tr></thead><tbody><for each="phase in section.phases"><tr><td><code>{{phase.handler}}</code></td><td>{{phase.input}}</td><td>{{phase.decisions}}</td></tr></for></tbody></table></div></if>
        <if condition="section.id == 'evidence'"><p>Failure categories:</p><ul><for each="category in failureCategories"><li><code>{{category}}</code></li></for></ul></if>
        <if condition="section.id == 'api-reference'"><div w-ref="{scriptApiEditor}" class="script-api-editor" aria-label="API reference editor"></div></if>
        <if condition="section.id != 'api-reference'"><for each="example in section.examples"><h3>{{example.title}}</h3><p>{{example.settings}}</p><pre tabindex="0" data-copy-surface>{{example.code}}</pre></for></if>
      </details></for>
    </div>
  </dialog>
</section>
</template>
