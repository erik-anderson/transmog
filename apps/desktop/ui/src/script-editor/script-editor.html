<template>
<if condition="editorLoaded"><link w-ref="{monacoStyles}" rel="stylesheet" href="/monaco.css"></if>
<section class="script-workspace" aria-labelledby="script-heading" @keydown="{scriptKeyboard(e)}">
  <header class="script-state"><h2 id="script-heading">Traffic scripts</h2><span>{{activeScriptText}}<if condition="scriptActive && scriptUnapplied"> · Unapplied changes</if></span><draft-status :dirty="{{scriptDirty}}"></draft-status></header>
  <editor-surface :label="{{sourceLabel}}" @editor-expanded="{focusEditor()}" @editor-restored="{focusEditor()}">
    <div slot="actions" class="script-toolbar">
      <div class="script-actions actions">
        <button type="button" ?disabled="{{scriptBusy || !scriptReady || reviewingTypeScript || conflictVisible}}" ?hidden="{{scriptActive}}" @click="{primaryAction()}">Save &amp; enable</button><button type="button" ?disabled="{{scriptBusy || !scriptReady || !scriptUnapplied || reviewingTypeScript || conflictVisible}}" ?hidden="{{!scriptActive}}" @click="{primaryAction()}">Save &amp; apply</button>
        <if condition="canResume"><button type="button" class="secondary" ?disabled="{{scriptBusy || !scriptReady}}" @click="{resumeScript()}">Resume applied script</button></if>
        <if condition="scriptActive"><button type="button" class="secondary" ?disabled="{{scriptBusy || !scriptReady}}" @click="{disableScript()}">Pause script</button></if>
        <button type="button" class="secondary" ?disabled="{{scriptBusy || !scriptReady || !scriptDirty}}" @click="{saveScript()}">Save draft</button><button type="button" class="secondary" ?disabled="{{scriptBusy || !scriptReady || !scriptDirty}}" @click="{discardScript()}">Discard changes</button>
        <button type="button" class="secondary" ?disabled="{{scriptBusy || !scriptReady}}" @click="{testScript()}" ?hidden="{{reviewingTypeScript}}">Test in sandbox</button>
        <button w-ref="{scriptMore}" type="button" class="secondary" popovertarget="script-actions-menu" ?disabled="{{scriptBusy || !scriptReady}}">More</button>
        <div id="script-actions-menu" w-ref="{scriptMenu}" class="table-popover script-menu" popover="auto" @toggle="{menuClosed(e)}"><button type="button" ?disabled="{{reviewingTypeScript}}" @click="{validateScript()}">Validate only</button><if condition="scriptActive"><button type="button" ?disabled="{{reviewingTypeScript}}" @click="{compareActiveScript()}">Compare with active</button></if><if condition="language == 'typescript'"><button type="button" @click="{editJavaScript()}">Edit JavaScript</button></if><if condition="language == 'javascript'"><button type="button" ?disabled="{{reviewingTypeScript || retainedSource == null}}" @click="{reviewTypeScript()}">Return to TypeScript…</button></if><button type="button" ?disabled="{{!scriptActive && !canResume}}" @click="{viewAppliedJavaScript()}">View applied JavaScript</button></div>
      </div>
      <p class="field-help">{{appliedBuildText}}</p>
      <if condition="runtimeIssue"><section class="script-recovery" role="alert"><p>Applied script unavailable: {{runtimeIssue}}</p><button type="button" class="secondary" ?disabled="{{scriptBusy}}" @click="{retryScript()}">Retry applied script</button><span>Pause script stops its effects while you repair it.</span></section></if>
      <if condition="conflictVisible"><section class="script-recovery" role="alert"><p>The saved script changed in another window. Your draft is preserved. Compare both versions before replacing either.</p><button type="button" class="secondary" ?disabled="{{scriptBusy}}" @click="{compareSavedScript()}">Compare with saved script</button></section></if>
      <if condition="canUndoSavedLoad"><button type="button" class="secondary" ?disabled="{{scriptBusy}}" @click="{restorePreviousDraft()}">Restore my previous draft</button></if>
      <p class="field-help">Changes are validated before they apply to new requests. Save draft keeps edits without enabling them.</p>
      <p class="field-help" role="status">{{authoringStatus}}</p>
      <if condition="typeScriptIssue"><section class="script-recovery" aria-label="TypeScript issues"><p>Choose an issue to jump to its source. All errors must be fixed before publishing TypeScript.</p><ul><for each="item in typeScriptIssues"><li><button type="button" class="script-issue" @click="{goToTypeScriptIssue(item)}">Line {{item.line}}:{{item.column}} - {{item.message}}</button></li></for></ul><div class="actions"><button type="button" class="secondary" ?disabled="{{scriptBusy}}" @click="{retryTypeScriptCheck()}">Check TypeScript again</button><if condition="language == 'typescript'"><button type="button" class="secondary" ?disabled="{{scriptBusy}}" @click="{editJavaScript()}">Edit JavaScript</button></if></div></section></if>
      <if condition="reviewingTypeScript"><div class="actions"><button type="button" class="secondary" ?disabled="{{scriptBusy}}" @click="{compareTypeScriptOutput()}">Compare generated JavaScript</button><button type="button" class="secondary" ?disabled="{{scriptBusy}}" @click="{keepJavaScript()}">Keep JavaScript</button></div></if>
      <if condition="historyEntries.length"><details class="script-history" ?open="{{historyOpen}}" @toggle="{historyToggled(e)}"><summary>Previous JavaScript drafts ({{historyEntries.length}})</summary><for each="item in historyEntries"><details><summary>{{item.label}}</summary><pre tabindex="0" data-copy-surface>{{item.source}}</pre><div class="actions"><button type="button" class="secondary" ?disabled="{{scriptBusy || reviewingTypeScript}}" @click="{restoreJavaScriptDraft(item.index)}">Restore {{item.label}}</button><button type="button" class="secondary" ?disabled="{{scriptBusy || reviewingTypeScript}}" @click="{removeJavaScriptDraft(item.index)}">Remove {{item.label}}</button></div></details></for></details></if>
      <if condition="canUndoHistoryRemoval"><button type="button" class="secondary" ?disabled="{{scriptBusy}}" @click="{undoJavaScriptRemoval()}">Undo draft removal</button></if>
      <output class="operation-status" data-kind="{{statusKind}}" aria-live="polite">{{scriptText}}</output>
    </div>
    <div w-ref="{scriptEditor}" class="monaco-editor-host" aria-label="Traffic script source editor"></div>
  </editor-surface>
  <details class="script-build"><summary>{{sourceAlignment}}</summary><pre tabindex="0" data-copy-surface>{{buildInfo}}</pre></details>
  <p class="editor-label">Ctrl+S saves the draft. Ctrl+M toggles Tab movement in the editor.</p>
  <details class="script-settings">
    <summary>Filters and capabilities</summary>
    <form w-ref="{scriptForm}" @submit="{validateScript(e)}" @input="{markScriptChanged()}" class="script-form">
      <label>Host filter (optional) <input name="scriptHost" value="example.test" maxlength="255" ?disabled="{{!scriptReady}}"></label>
      <label>Path-prefix filter (optional) <input name="scriptPath" maxlength="2048" placeholder="/api" ?disabled="{{!scriptReady}}"></label>
      <label>Writable headers <input name="scriptHeaders" value="user-agent" maxlength="4096" ?disabled="{{!scriptReady}}"></label>
      <fieldset ?disabled="{{!scriptReady}}">
        <legend>Capabilities</legend>
        <label><input name="readBodies" type="checkbox"> Read bounded bodies</label>
        <label><input name="writeBody" type="checkbox"> Replace bodies</label>
        <label><input name="respond" type="checkbox"> Select response assets</label>
        <label><input name="abort" type="checkbox" checked> Abort requests</label>
        <label><input name="sensitive" type="checkbox"> Read sensitive headers</label>
      </fieldset>
    </form>
  </details>
  <details class="script-test" @input="{markTestChanged()}" @change="{markTestChanged()}">
    <summary>Sandbox input and results</summary>
    <p class="field-help">Test this input without sending a request. Response handlers use a 200 response with no response headers.</p>
    <div class="script-test-fields">
      <label>Test URL <input w-ref="{scriptTestUrl}" type="url" value="https://example.test/" maxlength="8192"></label>
      <label>Method <input w-ref="{scriptTestMethod}" value="GET" maxlength="32"></label>
      <label>Handler <select w-ref="{scriptTestHandler}"><for each="item in testHandlers"><option key="{{item.name}}">{{item.name}}</option></for></select></label>
      <label>Request headers <textarea w-ref="{scriptTestHeaders}" rows="3" maxlength="65536"></textarea></label>
      <label>Body <textarea w-ref="{scriptTestBody}" rows="4" maxlength="1048576">editor test body</textarea></label>
    </div>
    <div class="actions"><button type="button" class="secondary" @click="{useSelectedTestRequest()}" ?disabled="{{!selection}}">Use selected Traffic request</button><span class="field-help">Copies the URL, method, and nonsensitive headers. Body input is cleared.</span></div>
    <if condition="testResult"><section class="script-test-result" aria-label="Sandbox result"><p>{{testResult}}<if condition="testOutdated"> · Outdated: source, settings, or input changed</if></p><details><summary>Test input and returned changes</summary><pre tabindex="0" data-copy-surface>{{testEvidence}}</pre></details></section></if>
  </details>
  <if condition="testResult"><p class="script-test-summary" role="status">{{testResult}}<if condition="testOutdated"> · Outdated</if></p></if>
  <editor-surface :label="{{diffLabel}}" ?hidden="{{!diffVisible}}">
    <div slot="actions" class="script-comparison-toolbar"><div class="actions"><if condition="conflictVisible"><button type="button" ?disabled="{{scriptBusy || !conflictReviewed}}" @click="{keepMyDraft()}">Keep my draft</button><button type="button" class="secondary" ?disabled="{{scriptBusy || !conflictReviewed}}" @click="{loadSavedDraft()}">Load saved draft</button></if><if condition="reviewingTypeScript"><button type="button" ?disabled="{{scriptBusy || !returnReady}}" @click="{useTypeScriptOutput()}">Use TypeScript output</button></if><button type="button" class="secondary" @click="{closeComparison()}">Close comparison</button><if condition="diffStale"><span>Active script or draft changed since this comparison. Compare again to refresh.</span></if></div><if condition="activeSettings"><details class="script-settings-diff"><summary>Compare settings and retained drafts</summary><div class="script-settings-columns"><section><h3>Left settings</h3><pre tabindex="0" data-copy-surface>{{activeSettings}}</pre></section><section><h3>Right settings</h3><pre tabindex="0" data-copy-surface>{{draftSettings}}</pre></section></div></details></if></div>
    <div w-ref="{scriptDiffEditor}" class="monaco-editor-host diff-editor" aria-label="Active and draft script comparison"></div>
  </editor-surface>
</section>
</template>
