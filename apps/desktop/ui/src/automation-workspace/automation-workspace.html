<template>
<section id="automation" class="app-view tool-view" aria-labelledby="automation-heading" ?hidden="{{view != 'automation'}}" ?data-active="{{view == 'automation'}}">
  <div class="automation-page">
    <header class="workspace-header"><h1 id="automation-heading">Automation</h1><nav class="workspace-tabs" aria-label="Automation tools"><button type="button" ?data-selected="{{automationSection == 'responses'}}" @click="{showAutomationSection('responses')}">Auto-responses</button><button type="button" ?data-selected="{{automationSection == 'experiments'}}" @click="{showAutomationSection('experiments')}">Experiments</button><button type="button" ?data-selected="{{automationSection == 'header-rules'}}" @click="{showAutomationSection('header-rules')}">Header rules</button><button type="button" ?data-selected="{{automationSection == 'response-text'}}" @click="{showAutomationSection('response-text')}">Response edits</button><button type="button" ?data-selected="{{automationSection == 'headers'}}" @click="{showAutomationSection('headers')}">UA header overrides<if condition="headerOverrideCount"><span class="automation-enabled-badge" title="Enabled UA header override rules" aria-label="{{headerOverrideCount}} enabled UA header override rules">{{headerOverrideCount}}</span></if></button><button type="button" ?data-selected="{{automationSection == 'scripts'}}" @click="{showAutomationSection('scripts')}">Scripts</button></nav></header>
    <div class="automation-panel" ?hidden="{{automationSection != 'responses'}}">
      <section class="auto-response-workspace" aria-labelledby="autoresponder-heading">
        <header class="auto-response-header">
          <div>
            <h2 id="autoresponder-heading" class="sr-only">Auto-responses</h2>

          </div>
          <div class="actions">
            <autoresponse-switch :state="{{autoresponseState}}" :busy="{{autoresponsePending}}"></autoresponse-switch>
            <button w-ref="{newResponseButton}" class="capture-response-button" type="button" @click="{beginCapturedResponseFlow()}" ?disabled="{{savingAutoResponse || changingAutoResponse}}"><if condition="selection.reusable">Use selected response</if><if condition="!selection.reusable">Choose responses in Traffic</if></button>
            <button w-ref="{newResponseOptionsButton}" type="button" class="secondary compact-button" aria-label="More autoresponse options" popovertarget="new-response-menu" @click="{positionRuleMenu(e)}" ?disabled="{{savingAutoResponse || changingAutoResponse}}">More</button>
          </div>
        </header>
        <div class="auto-response-start-hint" ?hidden="{{rules.length}}">
          Select one or more captured responses in Traffic, then choose “Create autoresponses…”.
        </div>
        <div class="auto-response-manager" ?data-detail="{{!editorHidden || !batchReviewHidden}}" data-list-share="{{ruleListShare}}">
          <div class="rule-list-pane" @keydown="{listKeyboard(e)}">
            <div class="rule-list-tools"><label><span class="sr-only">Search rules</span><input type="search" placeholder="Search rules" aria-label="Search rules" @input="{searchRules(e)}"></label><select aria-label="Filter rules" @change="{filterRules(e)}"><option value="all">All rules</option><option value="enabled">Enabled</option><option value="disabled">Disabled</option><option value="shadowed">Shadowed</option></select></div>
            <div class="rule-selection-toolbar"><span role="status"><if condition="ruleDragText">{{ruleDragText}}</if><if condition="!ruleDragText">{{ruleSelectionText}}</if></span><button type="button" class="secondary compact-button" w-ref="{ruleMoreButton}" popovertarget="rule-actions-menu" @click="{positionRuleMenu(e)}" ?disabled="{{!ruleSelectionCount || ruleDragging}}">More</button></div>
            <div w-ref="{autoResponseList}" class="auto-response-list" ?data-dragging="{{ruleDragging}}" @pointermove="{moveRulePointer(e)}" @pointerup="{endRulePointer(e)}" @pointercancel="{cancelRulePointer()}" @lostpointercapture="{lostRulePointer(e)}">
              <table class="rule-table" role="grid" aria-label="Autoresponse rules in first-match order" aria-multiselectable="true"><thead><tr><th><input type="checkbox" aria-label="Select all visible rules" ?checked="{{allRulesSelected}}" @change="{selectAllRules(e)}"></th><th scope="col">#</th><th scope="col">Rule / match</th><th scope="col">State</th><th scope="col">Response</th></tr></thead><tbody>
                <if condition="!visibleRules.length"><tr><td colspan="5" class="auto-response-empty"><if condition="!rules.length">No rules yet. Add a saved response from Traffic.</if><if condition="rules.length">No matching rules. Adjust the search or filter.</if></td></tr></if>
                <for each="rule in visibleRules"><tr key="{{rule.id}}" id="rule-{{rule.id}}" class="auto-response-rule" tabindex="{{rule.tabIndex}}" data-rule-id="{{rule.id}}" ?data-disabled="{{!rule.enabled}}" ?data-selected="{{rule.selected}}" ?data-dragging="{{ruleDragging && rule.selected}}" ?data-drop-before="{{rule.id == ruleDropId && !ruleDropAfter}}" ?data-drop-after="{{rule.id == ruleDropId && ruleDropAfter}}" ?data-matched="{{rule.id == highlightedRuleId}}" aria-selected="{{rule.selectionState}}" aria-label="{{rule.name}}, {{rule.state}}, priority {{rule.order}}" @click="{ruleClick(rule,e)}" @keydown="{ruleKeyboard(rule,e)}" @contextmenu="{openRuleMenu(rule,e)}" @pointerdown="{beginRulePointer(rule.id,e)}"><td><input type="checkbox" tabindex="-1" aria-label="Select {{rule.name}}" ?checked="{{rule.selected}}" @click="{selectRuleCheckbox(rule,e)}"></td><td><span class="rule-drag-grip" aria-hidden="true" title="Drag to change priority">⠿</span><span class="rule-order">{{rule.order}}</span></td><td class="rule-description"><strong title="{{rule.name}}">{{rule.name}}</strong><span class="rule-criteria" title="{{rule.criteria}}">{{rule.criteria}}</span></td><td><span class="rule-state">{{rule.state}}</span><if condition="rule.diagnostic"><span class="rule-warning" title="Always superseded by {{rule.shadowedName}}">{{rule.diagnostic}}</span></if></td><td class="rule-response">{{rule.responseText}}</td></tr></for>
              </tbody></table>
            </div><div class="rule-drag-preview" data-x="{{ruleDragX}}" data-y="{{ruleDragY}}" ?hidden="{{!ruleDragging}}" aria-hidden="true">{{ruleDragLabel}}</div>
            <div class="auto-response-undo" ?hidden="{{!undoRemoveText}}"><span role="status">{{undoRemoveText}}</span><button w-ref="{undoRemoveButton}" type="button" class="secondary compact-button" @click="{undoRemoveAutoResponse()}" ?disabled="{{savingAutoResponse || changingAutoResponse}}">Undo</button></div>
            <details class="list-help"><summary>Selection and priority</summary><p>First enabled match wins. Search and filters preserve priority. Shift selects a range; Ctrl adds rules. Del removes selected rules; Ctrl+Z undoes a list action. Drag above or below a rule to change priority; hold near the list’s top or bottom to scroll. Escape cancels a drag. More or Ctrl+Alt+↑/↓ moves selected rules.</p></details>
          </div>
          <pane-divider orientation="vertical" label="Resize rule list and properties" value="{{ruleListSplit}}" initial="45" @pane-resize="{resizeRuleList(e)}"></pane-divider>
          <div class="rule-properties-pane"><button type="button" class="secondary compact-button rule-back" @click="{backToRules()}">← Back to rules</button>
            <div class="rule-properties-empty" ?hidden="{{!editorHidden || !batchReviewHidden}}"><strong>{{ruleSelectionText}}</strong><p>Select one rule to edit its properties. Select several to enable, disable, duplicate, reorder or remove them together.</p><div class="actions" ?hidden="{{!ruleSelectionCount}}"><button type="button" class="secondary compact-button" @click="{mutateSelectedRules('enable')}">Enable selected</button><button type="button" class="secondary compact-button" @click="{mutateSelectedRules('disable')}">Disable selected</button></div></div>
            <section class="batch-review" ?hidden="{{batchReviewHidden}}">
              <header class="batch-header"><h3>Create auto-response rules</h3><p role="status">{{batchReviewText}}</p></header>
              <div class="batch-review-list"><table class="batch-table"><thead><tr><th>Use</th><th>#</th><th>Response / match</th><th>State</th><th>Actions</th></tr></thead><tbody><for each="row in batchRows"><tr key="{{row.id}}" tabindex="0" ?data-excluded="{{!row.included}}" @keydown="{batchKeyboard(row.id,e)}"><td><input type="checkbox" aria-label="Include {{row.name}}" ?checked="{{row.included}}" ?disabled="{{!row.eligible || batchLoading || savingAutoResponse}}" @change="{includeBatchRow(row.id,e)}"></td><td>{{row.order}}</td><td><strong>{{row.name}}</strong><small>{{row.reason}}</small><small class="rule-warning" ?hidden="{{!row.duplicate}}">{{row.duplicate}}</small></td><td><if condition="row.included && row.eligible">Ready</if><if condition="!row.included && row.eligible">Excluded</if><if condition="!row.eligible">Unavailable</if></td><td><button type="button" class="secondary compact-button" aria-label="Actions for {{row.name}}" popovertarget="batch-row-menu" @click="{openBatchMenu(row.id,e)}">More</button></td></tr></for></tbody></table></div>
              <details class="batch-duplicates"><summary>Duplicate choices</summary><p>First enabled match wins. Keep all responses, or include only one per identical match.</p><div class="actions"><button type="button" class="secondary compact-button" @click="{keepNewestBatchMatches()}">Keep most recent</button><button type="button" class="secondary compact-button" @click="{keepFirstBatchMatches()}">Keep earliest</button></div></details>
              <p class="field-error" role="status" ?hidden="{{!batchError}}">{{batchError}}</p>
              <div class="auto-response-editor-actions"><div class="actions"><button type="button" @click="{createBatchRules()}" ?disabled="{{batchLoading || savingAutoResponse || !batchEligibleCount}}">Create {{batchEligibleCount}} <if condition="batchEligibleCount == 1">rule</if><if condition="batchEligibleCount != 1">rules</if></button><button type="button" class="secondary" @click="{cancelBatch()}" ?disabled="{{savingAutoResponse}}">Cancel batch</button><button type="button" class="secondary compact-button" ?disabled="{{batchLoading || savingAutoResponse}}" @click="{reviewBatchAgain()}">Refresh review</button></div></div>
            </section>
        <form w-ref="{autoResponseForm}" @submit="{saveAutoResponse(e)}" @input="{markDraftDirty(e)}" @change="{markDraftDirty(e)}" @keydown="{formKeyboard(e)}" class="auto-response-editor" ?hidden="{{editorHidden}}" aria-busy="{{savingAutoResponse}}">
          <fieldset class="auto-response-fields" aria-label="Auto-response rule" ?disabled="{{savingAutoResponse}}">
          <header>
            <div><span class="section-label">Properties <if condition="draftDirty">· Unsaved changes</if></span><h3>{{editorTitle}}</h3></div>

          </header>
          <label>Rule name <input name="name" maxlength="128" required placeholder="Offline account response"></label>
          <label>Method <select w-ref="{autoResponseMethod}" name="method" @change="{updateAutoResponseHeaderFilterState()}"><option>GET</option><option>POST</option><option>PUT</option><option>PATCH</option><option>DELETE</option><option>HEAD</option><option>OPTIONS</option><option value="ANY">Any method</option><option value="CUSTOM">Custom method…</option></select></label><label class="wide-field" ?hidden="{{customMethodHidden}}">Custom method <input w-ref="{autoResponseCustomMethod}" name="customMethod" maxlength="32" ?required="{{!customMethodHidden}}"></label>
          <button type="button" class="secondary wide-field" ?hidden="{{!responseExperiment}}" @click="{showVariants()}">Versions and history…</button><p class="field-help wide-field" role="status" ?hidden="{{!responseExperiment}}">{{experimentStateText}}</p><label class="wide-field" ?hidden="{{responseExperiment}}"><input w-ref="{autoResponseEnabled}" type="checkbox" name="enabled" checked ?disabled="{{changingAutoResponse || loadingSavedResponse}}" @change="{setEditorEnabled()}"> Rule enabled <small>Changes apply immediately to saved rules. Disabled rules retain their properties and priority.</small></label>
          <small class="rule-usage wide-field" ?hidden="{{!ruleUsageText}}">{{ruleUsageText}}</small>
          <aside class="rule-diagnostic wide-field" ?hidden="{{!ruleDiagnosticText}}"><p>{{ruleDiagnosticText}}</p><button type="button" class="secondary compact-button" @click="{showMatchedRule(ruleSupersededBy)}">Show earlier rule</button></aside>
          <match-editor w-ref="{matchEditor}" class="wide-field" :condition="{{matcherCondition}}" @matcher-change="{onMatcherChange()}"></match-editor>
          <details class="wide-field" ?open="{{requestHeadersOpen}}"><summary>Request header conditions</summary><label><span>Headers that must match <small>(one <code>Name: value</code> per line)</small></span><textarea name="requestHeaders" placeholder="Content-Type: application/json" @input="{clearHeaderError('requestHeaders')}" aria-describedby="auto-request-headers-error"></textarea><span id="auto-request-headers-error" class="field-error" ?hidden="{{!requestHeadersError}}">{{requestHeadersError}}</span></label></details>
          <details class="wide-field" ?hidden="{{!advancedMatcherText}}"><summary>Additional matching conditions</summary><pre>{{advancedMatcherText}}</pre><p class="field-help">These existing conditions remain active when you edit the URL or exact headers.</p><button type="button" class="secondary compact-button" @click="{removeAdvancedConditions()}">Remove additional conditions</button></details>
          <details class="wide-field matcher-test" data-matcher-test="true"><summary>Test matching</summary>
            <section class="match-test-request" aria-labelledby="match-request-heading"><h4 id="match-request-heading">Test request</h4>
              <label>Test URL <input w-ref="{matchTestUrl}" type="text" placeholder="Paste a URL or use the captured request" @input="{testRequestChanged()}"></label>
              <label>Test method <input w-ref="{matchTestMethod}" value="GET" maxlength="32" @input="{testRequestChanged()}"></label>
              <details class="match-test-headers"><summary>Test request headers</summary><label>Headers <textarea w-ref="{matchTestHeaders}" rows="3" @input="{testRequestChanged()}"></textarea></label></details>
              <div class="actions"><button type="button" class="secondary compact-button" @click="{testMatcher()}" ?disabled="{{matcherTestBusy}}"><if condition="matcherTestBusy">Checking…</if><if condition="!matcherTestBusy">Check match</if></button><small>Checks the draft without sending a request.</small></div>
            </section>
            <section class="match-test-result" aria-labelledby="match-result-heading"><h4 id="match-result-heading">Result</h4>
              <p class="field-error" role="status" ?hidden="{{!matcherTestError}}">{{matcherTestError}}</p>
              <if condition="!matchTestResult"><p class="field-help">Enter a test request to check the current rule.</p></if>
              <if condition="matchTestResult"><p class="match-outcome" role="status"><strong><if condition="matchTestResult.test.matched">Matches</if><if condition="!matchTestResult.test.matched">Does not match</if></strong></p>
                <p>{{matchTestResult.explanation}}</p><small class="normalized-test-url">Normalized URL: {{matchTestResult.test.normalizedUrl}}</small>
                <ul class="match-checks"><for each="check in matchTestResult.test.checks"><li ?data-passed="{{check.matched}}"><if condition="check.matched">✓</if><if condition="!check.matched">×</if> {{check.label}} · {{check.detail}}</li></for><for each="capture in matchTestResult.test.captures"><li>{{capture.label}} = {{capture.value}}</li></for></ul>
                <div class="match-case-actions"><label>Expected result <select aria-label="Expected result" @change="{changeMatchExpectation(e)}"><option value="match" ?selected="{{matchExpected == 'match'}}">Matches</option><option value="nonmatch" ?selected="{{matchExpected == 'nonmatch'}}">Does not match</option></select></label><button type="button" class="secondary compact-button" @click="{addMatchExample()}" ?disabled="{{matcherTestBusy}}">Add test case</button></div>
              </if>
            </section>
            <section class="match-saved-cases" aria-labelledby="match-cases-heading"><h4 id="match-cases-heading">Saved test cases <span>({{matchExamples.length}}/32)</span></h4>
              <p class="field-help">Tests check your rule after edits. They do not change which requests match. Cases are saved with the rule.</p>
              <if condition="!matchExamples.length"><p class="field-help">Add the request above as a test case to check future changes.</p></if>
              <ul class="match-case-list"><for each="example in matchCaseRows"><li class="match-case" ?data-passed="{{example.passed}}" ?data-checked="{{example.checked}}">
                <div class="match-case-heading"><strong>{{example.method}} {{example.url}}</strong><button type="button" class="secondary compact-button" @click="{removeMatchExample(example.index)}">Remove test case</button></div>
                <details ?hidden="{{!example.headers}}"><summary>Request headers</summary><pre>{{example.headers}}</pre></details>
                <dl class="match-case-outcomes"><div><dt>Expected</dt><dd>{{example.expected}}</dd></div><div><dt>Actual</dt><dd>{{example.actual}}</dd></div><div><dt>Test</dt><dd>{{example.result}}</dd></div></dl>
              </li></for></ul>
            </section>
          </details>
          <details class="response-group wide-field" ?open="{{responseOpen}}" @toggle="{responseToggled(e)}"><summary>Response</summary><div class="response-properties">
          <label ?hidden="{{responseFieldsHidden}}">Response status <input w-ref="{autoResponseStatus}" ?readonly="{{responseReadOnly}}" name="status" @invalid="{openResponseForError()}" type="number" min="200" max="599" value="200" required></label>
          <label ?hidden="{{responseFieldsHidden}}">Content type <input w-ref="{autoResponseMediaType}" ?readonly="{{responseReadOnly}}" name="mediaType" value="text/plain; charset=utf-8" maxlength="256"></label>
          <div class="wide-field" ?hidden="{{responseHeadersHidden}}"><label><span>Headers <small>(one <code>Name: value</code> per line)</small></span><textarea name="responseHeaders" rows="10" @invalid="{openResponseForError()}" ?readonly="{{responseReadOnly}}" @input="{clearHeaderError('responseHeaders')}" aria-describedby="auto-response-headers-help auto-response-headers-error"></textarea><small id="auto-response-headers-help">Content-Length is computed from the returned bytes. Content-Encoding follows the body’s compression; pasted values for these headers are ignored. Set Content-Type in the field above.</small><span id="auto-response-headers-error" class="field-error" ?hidden="{{!responseHeadersError}}">{{responseHeadersError}}</span></label></div>
          <section class="auto-response-source wide-field">
            <strong><if condition="sourceSessionId">Original response context</if><if condition="!sourceSessionId">Response details</if></strong>
            <if condition="sourceSessionId"><p><if condition="sourceAvailable"><a href="#traffic" title="Show original request in Traffic" @click="{showSourceTraffic(e)}">{{sourceLabel}}</a></if><if condition="!sourceAvailable"><span>{{sourceLabel}}</span></if></p><p aria-live="polite" ?hidden="{{!sourceAvailabilityText}}">{{sourceAvailabilityText}}</p></if>
            <p>{{sourceText}}</p>
          </section>
          </div></details>
          <section class="response-body-section wide-field" ?hidden="{{bodyHidden}}" ?data-file="{{responseBodyFile}}">
            <p class="field-help" ?hidden="{{!responseCopiedFrom || responseBodyFile}}">Saved copy from <span class="response-file-path">{{responseCopiedFrom}}</span>. External edits do not change these saved bytes.</p><div class="body-view-controls" data-body-view="true" ?hidden="{{responseBodyFile}}"><label>View <select aria-label="Response body view" @change="{changeBodyMode(e)}" ?disabled="{{editBodyDisabled || responseBodyFile}}"><option value="text" ?selected="{{bodyMode == 'text'}}">Text</option><option value="hex" ?selected="{{bodyMode == 'hex'}}">Hex</option></select></label><small aria-live="polite">{{bodyByteSummary}}</small></div>
            <label ?hidden="{{responseBodyFile}}"><span>Response body <if condition="bodyReadOnly"><small>(preview)</small></if></span><textarea w-ref="{autoResponseBody}" ?readonly="{{bodyReadOnly}}" ?disabled="{{responseBodyFile}}" name="body" rows="12" spellcheck="false" @input="{updateBodySummary()}" aria-describedby="auto-response-body-help"></textarea><small id="auto-response-body-help" aria-live="polite">{{bodyStatusText}}</small></label>
            <if condition="responseBodyFile"><div class="response-file-overlay"><strong>Response body from file</strong><span class="response-file-path">{{responseBodyFile}}</span><label>File use<select name="bodyFileMode" aria-label="File use" @change="{changeResponseBodyFileMode(e)}" ?disabled="{{fileChoiceBusy}}"><option value="copy" ?selected="{{responseBodyFileMode == 'copy'}}">Copy into response</option><option value="linked" ?selected="{{responseBodyFileMode == 'linked'}}">Read file on each request</option></select></label><small>{{responseBodyFileDetails}}</small><p role="status" ?hidden="{{!fileChoiceBusy}}">Checking file…</p><p class="field-error" role="status" ?hidden="{{!responseBodyFileError}}">{{responseBodyFileError}}</p><div class="actions"><button type="button" class="secondary compact-button" @click="{refreshResponseFile()}" ?disabled="{{fileChoiceBusy}}">Check file</button><button type="button" class="secondary compact-button" @click="{clearResponseBodyFile()}">Clear file choice</button></div></div></if>
          </section>
          <div  class="captured-response-options wide-field" ?hidden="{{capturedOptionsHidden}}">
            <label><input w-ref="{autoResponseEditBody}" ?disabled="{{editBodyDisabled}}" name="editBody" type="checkbox" @change="{updateAutoResponseBodyEditState()}"> Edit response body</label>
          </div>
          <label class="wide-field" ?hidden="{{encodingOptionsHidden}}"><input w-ref="{autoResponsePreserveEncoding}" ?disabled="{{preserveEncodingDisabled}}" name="preserveEncoding" type="checkbox" checked> Apply original compression type ({{compressionType}})<small ?hidden="{{!compressionUnavailableText}}">{{compressionUnavailableText}}</small></label>
          <div class="actions wide-field"><button w-ref="{bodyDialogButton}" type="button" class="secondary compact-button" @click="{openBodyDialog()}" ?disabled="{{editBodyDisabled || loadingSavedResponse || fileChoiceBusy || responseBodyFile}}">Edit in dialog…</button><button type="button" class="secondary compact-button" @click="{chooseResponseBody()}" ?disabled="{{fileChoiceBusy || savingAutoResponse || loadingSavedResponse}}"><if condition="!responseBodyFile">Serve response body from file…</if><if condition="responseBodyFile">Choose another file…</if></button></div>
          <div class="auto-response-editor-actions wide-field">
            <output class="field-error" aria-live="polite" ?hidden="{{!autoResponseError}}">{{autoResponseError}}</output>
            <div class="actions"><button type="submit" ?disabled="{{changingAutoResponse || loadingSavedResponse || fileChoiceBusy || variantHistorical}}"><if condition="savingAutoResponse">Saving…</if><if condition="!savingAutoResponse"><if condition="responseExperiment">Save experiment</if><if condition="!responseExperiment">Save rule</if></if></button>
            <button type="button" class="secondary" @click="{cancelAutoResponseEdit()}">Cancel</button>
            <button type="button" class="secondary compare-response-trigger" w-ref="{compareResponseButton}" popovertarget="compare-response-menu" ?disabled="{{loadingSavedResponse || changingAutoResponse}}">Compare…</button>
            <div id="compare-response-menu" w-ref="{compareResponseMenu}" class="response-action-menu" popover="auto"><button type="button" @click="{compareResponseDraft('saved')}">Draft with saved response</button><button type="button" @click="{compareResponseDraft('source')}">With captured source</button><button type="button" ?hidden="{{!existingResponse}}" @click="{compareResponseDraft('previous')}">With previous saved revision</button></div>
            <button type="button" class="secondary preview-response-trigger" w-ref="{previewResponseButton}" popovertarget="preview-response-menu" ?disabled="{{!editingAutoResponseId || changingAutoResponse}}">Preview…</button>
            <div id="preview-response-menu" w-ref="{previewResponseMenu}" class="response-action-menu" popover="auto"><button type="button" ?hidden="{{!responseExperiment}}" ?disabled="{{draftDirty}}" @click="{previewSavedRule('captured')}">Captured baseline…</button><button type="button" @click="{previewSavedRule()}">With saved changes…</button></div>
            <button type="button" class="secondary" ?hidden="{{!responseExperiment}}" ?disabled="{{!existingResponse || experimentLive || draftDirty || changingAutoResponse || loadingSavedResponse}}" @click="{useExperimentForLive()}">Use for live traffic</button><button type="button" class="secondary" ?hidden="{{!draftDirty}}" @click="{revertAutoResponse()}">Revert</button>
            </div>
          </div>
          </fieldset>
        </form>
          <response-body-editor w-ref="{bodyEditor}" theme="{{theme}}" @body-commit="{commitBodyDialog(e)}" @body-editor-closed="{bodyDialogClosed()}"></response-body-editor>
          </div>
        </div>
        <div id="batch-row-menu" class="table-popover rule-menu" data-x="{{ruleMenuX}}" data-y="{{ruleMenuY}}" popover="auto"><button type="button" @click="{moveBatchRow(batchActionId,-1)}">Move earlier</button><button type="button" @click="{moveBatchRow(batchActionId,1)}">Move later</button><button type="button" @click="{skipBatchRow(batchActionId)}">Exclude response <kbd>Del</kbd></button></div>
        <div id="new-response-menu" w-ref="{newRuleMenu}" class="table-popover rule-menu" data-x="{{ruleMenuX}}" data-y="{{ruleMenuY}}" popover="auto"><button type="button" @click="{beginScratchAutoResponse()}">Create from scratch</button></div>
        <div id="rule-actions-menu" w-ref="{ruleMenu}" class="table-popover rule-menu" data-x="{{ruleMenuX}}" data-y="{{ruleMenuY}}" popover="auto"><strong>{{ruleSelectionText}}</strong><button type="button" @click="{mutateSelectedRules('enable')}">Enable selected</button><button type="button" @click="{mutateSelectedRules('disable')}">Disable selected</button><button type="button" @click="{mutateSelectedRules('up')}">Move earlier</button><button type="button" @click="{mutateSelectedRules('down')}">Move later</button><button type="button" @click="{mutateSelectedRules('duplicate')}">Duplicate as disabled copies</button><button type="button" @click="{mutateSelectedRules('remove')}">Remove selected <kbd>Del</kbd></button></div>
        <dialog w-ref="{unsavedDialog}" class="unsaved-rule-dialog" @cancel="{unsavedCancelled(e)}"><h3>Save changes to this rule?</h3><p>Your current edits have not been saved.</p><div class="actions"><button type="button" @click="{resolveUnsaved('save')}">Save and continue</button><button type="button" class="secondary" @click="{resolveUnsaved('discard')}">Discard changes</button><button type="button" class="secondary" autofocus @click="{resolveUnsaved('stay')}">Keep editing</button></div></dialog>
      </section>
    </div>
    <section class="automation-panel" ?hidden="{{automationSection != 'experiments'}}"><experiment-variants w-ref="{experimentVariants}" :status="{{autoresponseState}}" @variant-status="{onVariantStatus(e)}" @variant-edit="{editVariant(e)}" @variant-preview="{previewVariant(e)}" @variant-new="{newNamedExperiment()}"></experiment-variants></section>
    <section class="automation-panel" ?hidden="{{automationSection != 'header-rules'}}"><header-rules editor-kind="headers" :headerState="{{autoresponseState}}" :selection="{{selection}}" ?active="{{view == 'automation' && automationSection == 'header-rules'}}" @header-rules-state="{onHeaderRulesState(e)}"></header-rules></section>
    <section class="automation-panel" ?hidden="{{automationSection != 'response-text'}}"><header-rules w-ref="{responseTextEditor}" editor-kind="response-text" :headerState="{{autoresponseState}}" :selection="{{selection}}" ?active="{{view == 'automation' && automationSection == 'response-text'}}" @header-rules-state="{onHeaderRulesState(e)}"></header-rules></section>
    <section class="automation-panel override-panel" ?hidden="{{automationSection != 'headers'}}"><user-agent-overrides w-ref="{userAgentOverrides}" :uaState="{{autoresponseState}}"></user-agent-overrides></section>
    <section class="automation-panel script-panel" ?hidden="{{automationSection != 'scripts'}}"><script-editor w-ref="{scriptEditor}" :selection="{{selection}}" theme="{{theme}}" ?active="{{view == 'automation' && automationSection == 'scripts'}}"></script-editor></section>
  </div>
</section>

</template>
