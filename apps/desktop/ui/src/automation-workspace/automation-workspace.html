<template>
<section id="automation" class="app-view tool-view" aria-labelledby="automation-heading" ?hidden="{{view != 'automation'}}" ?data-active="{{view == 'automation'}}">
  <div class="tool-page">
    <p class="section-label">Traffic actions</p>
    <h1 id="automation-heading">Automation</h1>
    <p>Enable common actions with simple request filters. Transmog handles validation and records each change in the session audit history.</p>
    <div class="automation-stack">
      <details class="automation-card" open>
        <summary><span><strong>Override User-Agent</strong><small>Replace the outgoing User-Agent on matching requests.</small></span></summary>
        <form w-ref="{automationForm}" @submit="{activateUserAgentRule(e)}" class="composer-form">
          <label>User-Agent value <input name="userAgent" maxlength="4096" value="Transmog/1.0" required></label>
          <label>Host filter (optional) <input name="host" maxlength="255" placeholder="example.test"></label>
          <label>Path-prefix filter (optional) <input name="path" maxlength="2048" placeholder="/api"></label>
          <div class="actions">
            <autoresponse-switch :state="{{autoresponseState}}" :busy="{{autoresponsePending}}"></autoresponse-switch>
            <button type="submit">Enable override</button>
            <button type="button" class="secondary" @click="{disableBuiltInAutomation('desktop-user-agent')}">Disable</button>
          </div>
        </form>
      </details>
      <section class="auto-response-workspace" aria-labelledby="autoresponder-heading">
        <header class="auto-response-header">
          <div>
            <h2 id="autoresponder-heading">Auto-responses</h2>
            <p>Serve a saved response without contacting the origin. Rules are checked from top to bottom; the first enabled match wins.</p>
          </div>
          <div class="actions">
            <button type="button" @click="{beginAutoResponseFromSelected()}" ?disabled="{{!selection.reusable || savingAutoResponse}}">Use selected response</button>
            <button w-ref="{newResponseButton}" type="button" class="secondary" @click="{beginScratchAutoResponse()}" ?disabled="{{savingAutoResponse}}">Create from scratch</button>
          </div>
        </header>
        <div @dragover="{allowSessionDrop(e)}" @drop="{dropSession(e)}" class="auto-response-drop-zone" tabindex="0">
          Drop a captured request here, or select one in Traffic and choose “Create auto-response”.
        </div>
        <div w-ref="{autoResponseList}" class="auto-response-list" aria-live="polite">
    <if condition="!rules.length"><p class="auto-response-empty">No auto-responses yet. The easiest starting point is a completed request in Traffic.</p></if>
    <for each="rule in rules">
      <article key="{{rule.id}}" id="rule-{{rule.id}}" class="auto-response-rule" tabindex="-1" draggable="true" data-rule-id="{{rule.id}}" ?data-disabled="{{!rule.enabled}}" ?data-matched="{{rule.id == highlightedRuleId}}" @dragstart="{dragRule(rule.id, e)}" @dragover="{allowRuleDrop(rule.id, e)}" @drop="{dropRule(rule.id, e)}" @dragend="{finishRuleDrag()}">
        <span class="drag-handle" title="Drag to change first-match order">⋮⋮</span><span class="rule-order">{{rule.order}}</span>
        <div class="rule-description"><strong title="{{rule.name}}">{{rule.name}}</strong><details class="rule-criteria"><summary title="{{rule.criteria}}">{{rule.criteria}}</summary><p>{{rule.criteria}}</p></details></div><span class="rule-state">{{rule.state}}</span>
        <div class="rule-actions"><button type="button" class="secondary compact-button" @click="{editAutoResponse(rule)}" ?disabled="{{savingAutoResponse || changingAutoResponse}}">Edit criteria</button><button type="button" class="secondary compact-button" @click="{mutateAutoResponse(rule.id, 'toggle')}" ?disabled="{{savingAutoResponse || changingAutoResponse}}">{{rule.toggleLabel}}</button><button type="button" class="secondary compact-button" aria-label="Move {{rule.name}} up" title="Move up" ?disabled="{{rule.first || savingAutoResponse || changingAutoResponse}}" @click="{mutateAutoResponse(rule.id, 'up')}">↑</button><button type="button" class="secondary compact-button" aria-label="Move {{rule.name}} down" title="Move down" ?disabled="{{rule.last || savingAutoResponse || changingAutoResponse}}" @click="{mutateAutoResponse(rule.id, 'down')}">↓</button><button type="button" class="secondary compact-button" @click="{mutateAutoResponse(rule.id, 'remove')}" ?disabled="{{savingAutoResponse || changingAutoResponse}}">Remove</button></div>
      </article>
    </for>
  </div>
        <div class="auto-response-undo" ?hidden="{{!undoRemoveText}}"><span role="status">{{undoRemoveText}}</span><button w-ref="{undoRemoveButton}" type="button" class="secondary compact-button" @click="{undoRemoveAutoResponse()}" ?disabled="{{savingAutoResponse || changingAutoResponse}}">Undo removal</button></div>
        <form w-ref="{autoResponseForm}" @submit="{saveAutoResponse(e)}" class="auto-response-editor" ?hidden="{{editorHidden}}" aria-busy="{{savingAutoResponse}}">
          <fieldset class="auto-response-fields" aria-label="Auto-response rule" ?disabled="{{savingAutoResponse}}">
          <header>
            <div><span class="section-label">Rule editor</span><h3>{{editorTitle}}</h3></div>
            <button type="button" class="secondary compact-button" @click="{cancelAutoResponseEdit()}">Cancel</button>
          </header>
          <label>Rule name <input name="name" maxlength="128" required placeholder="Offline account response"></label>
          <label>Method <select w-ref="{autoResponseMethod}" name="method" @change="{updateAutoResponseHeaderFilterState()}"><option>GET</option><option>POST</option><option>PUT</option><option>PATCH</option><option>DELETE</option><option>HEAD</option><option>OPTIONS</option><option value="ANY">Any method</option></select></label>
          <label class="wide-field"><input w-ref="{autoResponseEnabled}" type="checkbox" name="enabled" checked> Rule enabled <small>Disabled rules retain their properties and place in the list.</small></label>
          <match-editor w-ref="{matchEditor}" class="wide-field" :condition="{{matcherCondition}}" @matcher-change="{onMatcherChange()}"></match-editor>
          <details class="wide-field" ?open="{{requestHeadersOpen}}"><summary>Request header conditions</summary><label><span>Headers that must match <small>(one <code>Name: value</code> per line)</small></span><textarea name="requestHeaders" placeholder="Content-Type: application/json" @input="{clearHeaderError('requestHeaders')}" aria-describedby="auto-request-headers-error"></textarea><span id="auto-request-headers-error" class="field-error" ?hidden="{{!requestHeadersError}}">{{requestHeadersError}}</span></label></details>
          <details class="wide-field matcher-test" data-matcher-test="true"><summary>Test matching</summary><label>Test URL <input w-ref="{matchTestUrl}" type="url" placeholder="Paste a URL or use the captured request" @input="{onMatcherChange()}"></label><details><summary>Test request headers</summary><label>Headers <textarea w-ref="{matchTestHeaders}" rows="3" @input="{onMatcherChange()}"></textarea></label></details><div class="actions"><button type="button" class="secondary compact-button" @click="{testMatcher()}" ?disabled="{{matcherTestBusy}}">Check match</button><button type="button" class="secondary compact-button" @click="{addMatchExample(true)}">Remember as a match</button><button type="button" class="secondary compact-button" @click="{addMatchExample(false)}">Remember as a nonmatch</button></div><p class="field-error" role="status" ?hidden="{{!matcherTestError}}">{{matcherTestError}}</p><if condition="matchTestResult"><p role="status">{{matchTestResult.explanation}}</p><small>Normalized URL: {{matchTestResult.test.normalizedUrl}}</small><ul class="match-checks"><for each="check in matchTestResult.test.checks"><li ?data-passed="{{check.matched}}"><if condition="check.matched">✓</if><if condition="!check.matched">×</if> {{check.label}} · {{check.detail}}</li></for><for each="capture in matchTestResult.test.captures"><li>{{capture.label}} = {{capture.value}}</li></for></ul><for each="example in matchTestResult.examples"><p ?data-passed="{{example.passed}}"><if condition="example.passed">✓</if><if condition="!example.passed">×</if> {{example.url}} <button type="button" class="secondary compact-button" @click="{removeMatchExample(example.url)}">Remove example</button></p></for></if><p class="field-help">Testing evaluates the draft and rule order without sending a request.</p></details>
          <section class="auto-response-source wide-field">
            <strong>Response source</strong>
            <if condition="sourceSessionId"><p><if condition="sourceAvailable"><a href="#traffic" title="Show original request in Traffic" @click="{showSourceTraffic(e)}">{{sourceLabel}}</a></if><if condition="!sourceAvailable"><span>{{sourceLabel}}</span></if></p><p aria-live="polite" ?hidden="{{!sourceAvailabilityText}}">{{sourceAvailabilityText}}</p></if>
            <p>{{sourceText}}</p>
            <small ?hidden="{{!ruleUsageText}}">{{ruleUsageText}}</small>
          </section>
          <label ?hidden="{{responseFieldsHidden}}">Response status <input w-ref="{autoResponseStatus}" ?readonly="{{responseReadOnly}}" name="status" type="number" min="200" max="599" value="200" required></label>
          <label ?hidden="{{responseFieldsHidden}}">Content type <input w-ref="{autoResponseMediaType}" ?readonly="{{responseReadOnly}}" name="mediaType" value="text/plain; charset=utf-8" maxlength="256"></label>
          <label ?hidden="{{responseHeadersHidden}}" class="wide-field"><span>Response headers <small>(one <code>Name: value</code> per line)</small></span><textarea name="responseHeaders" @input="{clearHeaderError('responseHeaders')}" aria-describedby="auto-response-headers-error"></textarea><span id="auto-response-headers-error" class="field-error" ?hidden="{{!responseHeadersError}}">{{responseHeadersError}}</span></label>
          <label class="wide-field" ?hidden="{{bodyHidden}}"><span>Response body <if condition="bodyReadOnly"><small>(read-only)</small></if></span><textarea w-ref="{autoResponseBody}" ?readonly="{{bodyReadOnly}}" name="body" rows="12" maxlength="16777216" aria-describedby="auto-response-body-help"></textarea><small id="auto-response-body-help" aria-live="polite">{{bodyStatusText}}</small></label>
          <div  class="captured-response-options wide-field" ?hidden="{{capturedOptionsHidden}}">
            <label><input w-ref="{autoResponseEditBody}" ?disabled="{{editBodyDisabled}}" name="editBody" type="checkbox" @change="{updateAutoResponseBodyEditState()}"> Edit response body</label>
          </div>
          <label class="wide-field" ?hidden="{{encodingOptionsHidden}}"><input w-ref="{autoResponsePreserveEncoding}" ?disabled="{{preserveEncodingDisabled}}" name="preserveEncoding" type="checkbox" checked> Keep original compression</label>
          <div class="actions wide-field" ?hidden="{{!capturedOptionsHidden}}"><button type="button" class="secondary compact-button" @click="{chooseResponseBody()}">Replace body from file…</button><if condition="responseBodyFile"><span>{{responseBodyFile}} · served without compression</span><button type="button" class="secondary compact-button" @click="{clearResponseBodyFile()}">Clear file choice</button></if></div>
          <div class="auto-response-editor-actions wide-field">
            <output class="field-error" aria-live="polite" ?hidden="{{!autoResponseError}}">{{autoResponseError}}</output>
            <div class="actions"><button type="submit" ?disabled="{{changingAutoResponse}}"><if condition="savingAutoResponse">Saving…</if><if condition="!savingAutoResponse">Save rule</if></button>
            <button type="button" class="secondary" @click="{cancelAutoResponseEdit()}">Cancel</button>
            </div>
          </div>
          </fieldset>
        </form>
      </section>
    </div>
    <output class="operation-status" data-kind="{{automationKind}}" aria-live="polite">{{automationText}}</output>
    <script-editor theme="{{theme}}" ?active="{{view == 'automation'}}"></script-editor>
  </div>
</section>

</template>
