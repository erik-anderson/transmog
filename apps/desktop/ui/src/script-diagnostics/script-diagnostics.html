<template>
  <if condition="hasEvidence"><details class="developer-details"><summary>Developer details · exceptions and console</summary>
    <p class="field-help">Script-authored text may contain sensitive values. These details are local and temporary.</p>
    <div class="developer-actions"><label>Console level <select aria-label="Console level" @change="{changeLevel(e)}"><option value="all" ?selected="{{level == 'all'}}">All levels</option><option value="debug" ?selected="{{level == 'debug'}}">Debug</option><option value="info" ?selected="{{level == 'info'}}">Info</option><option value="warn" ?selected="{{level == 'warn'}}">Warning</option><option value="error" ?selected="{{level == 'error'}}">Error</option><option value="trace" ?selected="{{level == 'trace'}}">Trace</option></select></label><button type="button" class="secondary compact-button" @click="{clearLogs()}">Clear displayed logs</button><button type="button" class="secondary compact-button" @click="{copyEvidence()}">Copy developer details</button></div>
    <p role="status" ?hidden="{{!copyStatus}}">{{copyStatus}}</p>
    <for each="exception in exceptions"><section class="developer-exception"><strong>{{exception.label}}</strong><pre tabindex="0" data-copy-surface>{{exception.title}}</pre><if condition="exception.unavailable"><p>Some thrown-value properties were unavailable without executing script code.</p></if><if condition="exception.truncated"><p>Exception details shortened at the capture limit.</p></if>
      <if condition="!exception.frames.length"><p>Call stack unavailable for this thrown value.</p></if><ol class="developer-frames"><for each="frame in exception.frames"><li><span>{{frame.function}}</span><button type="button" class="secondary developer-frame" ?disabled="{{!frame.artifact || !frame.location}}" @click="{openSource(frame,false,e)}">{{frame.label}}</button><if condition="frame.generatedLabel"><button type="button" class="secondary developer-frame" ?disabled="{{!frame.artifact}}" @click="{openSource(frame,true,e)}">Generated: {{frame.generatedLabel}}</button></if><if condition="frame.mapping"><span class="field-help">{{frame.mapping}} · showing generated position</span></if><if condition="!frame.artifact"><span class="field-help">Source snapshot unavailable</span></if></li></for></ol>
    </section></for>
    <for each="message in messages"><p data-copy-surface><strong>{{message.label}} · Returned diagnostic:</strong> {{message.text}}</p></for>
    <for each="loss in losses"><p class="developer-loss" data-copy-surface>{{loss}}</p></for>
    <if condition="logCount"><p>{{logCount}} console records match this level.</p></if>
    <div class="developer-console"><for each="record in logRows"><section class="developer-record" key="{{record.key}}" data-level="{{record.level}}"><div><strong>{{record.level}}</strong> <time>{{record.time}}</time><details><summary>Operation</summary><p>{{record.context}}</p></details></div><pre tabindex="0" data-copy-surface>{{record.text}}</pre><if condition="record.truncated"><p>Record shortened at the capture limit.</p></if><ol class="developer-frames"><for each="frame in record.frames"><li>{{frame.function}}<button type="button" class="secondary developer-frame" ?disabled="{{!frame.artifact || !frame.location}}" @click="{openSource(frame,false,e)}">{{frame.label}}</button><if condition="frame.generatedLabel"><button type="button" class="secondary developer-frame" @click="{openSource(frame,true,e)}">Generated: {{frame.generatedLabel}}</button></if><if condition="frame.mapping"><span class="field-help">{{frame.mapping}}</span></if></li></for></ol></section></for></div>
    <if condition="previousPage || nextPage"><div class="developer-actions"><button type="button" class="secondary compact-button" ?disabled="{{!previousPage}}" @click="{movePage(-1)}">Previous console page</button><button type="button" class="secondary compact-button" ?disabled="{{!nextPage}}" @click="{movePage(1)}">Next console page</button></div></if>
  </details></if>
  <dialog w-ref="{sourceDialog}" class="developer-source-dialog" aria-label="Executing source snapshot" @close="{sourceClosed()}" @keydown="{sourceKey(e)}"><header><strong>Executing source snapshot</strong><button type="button" class="secondary" autofocus @click="{closeSource()}">Close</button></header><p role="status">{{sourceStatus}}</p><if condition="sourcePage"><p class="developer-source-identity">{{sourcePage.source}} · line {{sourcePage.line}}, column {{sourcePage.column}} · {{sourcePage.totalLines}} lines</p><details><summary>Artifact identity</summary><p class="developer-source-identity">{{sourcePage.artifact}}</p></details><div class="developer-source-lines" tabindex="0" aria-label="Read-only source excerpt" data-copy-surface><for each="line in sourcePage.lines"><div ?data-current="{{line.number == sourcePage.line}}"><span class="developer-line-number">{{line.number}}</span><code><if condition="line.startColumn > 1">…</if>{{line.text}}<if condition="line.shortened"> … [line preview shortened]</if></code></div></for></div></if></dialog>
</template>
