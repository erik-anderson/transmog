<template>
  <dialog w-ref="{exemptionDialog}" class="loopback-dialog" aria-labelledby="loopback-heading" aria-describedby="loopback-help" @close="{closed()}">
    <header><h2 id="loopback-heading">AppContainer loopback exemptions</h2><button type="button" class="secondary" @click="{close()}">Close</button></header>
    <p id="loopback-help" class="field-help">Allow selected Windows apps to connect to a proxy on this computer. Exemptions apply to the AppContainer SID and its users. Windows asks for administrator approval. Use checkboxes, Ctrl-click or Shift-click to select several rows.</p>
    <div class="loopback-toolbar"><label>Filter AppContainers <input type="search" value="{{loopbackQuery}}" @input="{search(e)}" placeholder="Name, package, SID or user" autofocus></label><button type="button" class="secondary" ?disabled="{{loopbackBusy}}" @click="{refresh()}">Refresh</button><button type="button" class="secondary" ?disabled="{{loopbackBusy || !loopbackRows.length}}" @click="{selectVisible()}">Select visible</button><button type="button" class="secondary" ?disabled="{{loopbackBusy || !loopbackSelected}}" @click="{clearSelection()}">Clear selection</button></div>
    <div class="loopback-feedback"><p role="status" aria-live="polite">{{loopbackCountText}} · {{loopbackSelectionText}}</p><p role="status" ?hidden="{{!loopbackStatus}}">{{loopbackStatus}}</p><p class="field-error" role="alert" ?hidden="{{!loopbackError}}">{{loopbackError}}</p></div>
    <div class="loopback-table-scroll" tabindex="0" aria-label="Scrollable AppContainer inventory">
      <table w-ref="{containerTable}" class="loopback-table" role="grid" aria-multiselectable="true" aria-label="Windows AppContainers" aria-busy="{{loopbackBusy}}">
        <thead><tr><th scope="col">Select</th><th scope="col" aria-sort="{{loopbackSortStates.exempt}}"><button type="button" aria-label="Loopback access" @click="{sortBy('exempt')}">Loopback access</button></th><th scope="col" aria-sort="{{loopbackSortStates.displayName}}"><button type="button" aria-label="Display Name" @click="{sortBy('displayName')}">Display Name</button></th><th scope="col" aria-sort="{{loopbackSortStates.description}}"><button type="button" aria-label="Description" @click="{sortBy('description')}">Description</button></th><th scope="col" aria-sort="{{loopbackSortStates.package}}"><button type="button" aria-label="Package" @click="{sortBy('package')}">Package</button></th><th scope="col" aria-sort="{{loopbackSortStates.name}}"><button type="button" aria-label="AppContainer name" @click="{sortBy('name')}">AppContainer name</button></th><th scope="col" aria-sort="{{loopbackSortStates.sid}}"><button type="button" aria-label="AppContainer SID" @click="{sortBy('sid')}">AppContainer SID</button></th><th scope="col" aria-sort="{{loopbackSortStates.users}}"><button type="button" aria-label="AppContainer user(s)" @click="{sortBy('users')}">AppContainer user(s)</button></th></tr></thead>
        <tbody><for each="row in loopbackRows"><tr key="{{row.sid}}" data-appcontainer-sid="{{row.sid}}" ?data-selected="{{row.selected}}" aria-selected="{{row.selectionState}}" tabindex="{{row.tabIndex}}" @click="{rowClick(e,row.sid)}" @keydown="{rowKey(e,row.sid)}"><td><input type="checkbox" aria-label="{{row.selectionLabel}}" ?checked="{{row.selected}}" ?disabled="{{loopbackBusy}}" @change="{toggle(e,row.sid)}"></td><td>{{row.exemptionText}}</td><td>{{row.displayName}}</td><td>{{row.description}}</td><td>{{row.package}}</td><td>{{row.name}}</td><td class="loopback-sid">{{row.sid}}</td><td class="loopback-users">{{row.usersText}}</td></tr></for><if condition="!loopbackRows.length && !loopbackBusy"><tr><td colspan="8">No AppContainers match. Clear the filter or refresh the inventory.</td></tr></if></tbody>
      </table>
    </div>
    <footer class="actions"><button type="button" ?disabled="{{loopbackBusy || !loopbackCurrent || !loopbackSelected}}" @click="{apply(true)}">Exempt selected</button><button type="button" class="secondary" ?disabled="{{loopbackBusy || !loopbackCurrent || !loopbackSelected}}" @click="{apply(false)}">Remove exemptions</button></footer>
  </dialog>
</template>
