<template shadowrootmode="open">
  <div class="shell">
    <header class="masthead">
      <div>
        <p class="eyebrow">Transmog</p>
        <h1>{{heading}}</h1>
        <p class="lede">{{summary}}</p>
      </div>
      <div class="status" data-lifecycle="{{lifecycleKind}}" aria-live="polite">
        <span class="status-dot" aria-hidden="true"></span>
        <span w-ref="{statusLabel}">{{lifecycleLabel}}</span>
      </div>
    </header>

    <nav aria-label="Primary">
      <a href="#traffic" aria-current="page">Traffic</a>
      <a href="#breakpoints">Breakpoints</a>
      <a href="#automation">Automation</a>
      <a href="#composer">Composer</a>
      <a href="#captures">Captures</a>
      <a href="#settings">Settings &amp; support</a>
    </nav>

    <main>
      <section id="traffic" class="workspace" aria-labelledby="traffic-heading">
        <div>
          <p class="section-label">Live workspace</p>
          <h2 id="traffic-heading">Sessions</h2>
          <p>Authoritative session queries will appear here as the proxy starts.</p>
          <form w-ref="{proxyForm}" @submit="{startProxy(event)}">
            <label>CA certificate <input name="certificate" value="transmog-ca.pem" required></label>
            <label>CA private key <input name="privateKey" value="transmog-ca.key" required></label>
            <label>CA SHA-256 <input w-ref="{caThumbprint}" name="thumbprint" pattern="[0-9A-Fa-f]{64}" placeholder="Created or existing certificate thumbprint"></label>
            <label><input name="systemProxy" type="checkbox"> Configure the current-user system proxy</label>
            <div class="actions">
              <button type="button" class="secondary" @click="{createCa()}">Create durable CA</button>
              <button type="button" class="secondary" @click="{installCa()}">Trust public CA</button>
              <button type="button" class="secondary" @click="{removeCa()}">Remove exact CA</button>
              <button type="submit">Start proxy</button>
              <button type="button" class="secondary" @click="{stopProxy()}">Stop</button>
              <button type="button" class="secondary" @click="{recoverProxy()}">Recover host settings</button>
            </div>
          </form>
          <form w-ref="{filterForm}" @submit="{refreshSessions(event)}" class="filters">
            <label>Method <input name="method" maxlength="32" placeholder="GET"></label>
            <label>Host <input name="host" maxlength="255" placeholder="example.test"></label>
            <button type="submit" class="secondary">Refresh sessions</button>
            <button type="button" class="secondary" @click="{watchSessions()}">Watch live</button>
          </form>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Method</th><th>Host</th><th>Path</th><th>Protocol</th><th>Status</th><th>Duration</th><th>Bytes</th><th>State</th></tr></thead>
              <tbody w-ref="{sessionRows}"><tr><td colspan="8">No sessions loaded.</td></tr></tbody>
            </table>
          </div>
          <button w-ref="{nextButton}" type="button" class="secondary" @click="{nextSessions()}" disabled>Next page</button>
          <section class="inspector" aria-labelledby="inspector-heading">
            <h3 id="inspector-heading">Inspector</h3>
            <pre w-ref="{inspectorOutput}" tabindex="0">Select a session to inspect bounded evidence.</pre>
            <div class="filters" aria-label="Response body representation">
              <label>Boundary <select w-ref="{bodyBoundary}" aria-label="Body boundary"><option value="">Select a session first</option></select></label>
              <label>View <select w-ref="{bodyRepresentation}"><option value="auto">Auto</option><option value="original-text">Original text</option><option value="formatted">Formatted</option><option value="bytes">Bytes</option><option value="metadata">Metadata only</option><option value="image">Image</option></select></label>
              <label>Preview bytes <input w-ref="{bodyMaxBytes}" type="number" min="1" max="16777216" value="262144"></label>
              <label><input w-ref="{bodyDecoded}" type="checkbox"> Decode content coding</label>
              <button type="button" class="secondary" @click="{inspectBody()}">Inspect body</button>
            </div>
            <pre w-ref="{bodyPreviewOutput}" tabindex="0">No body selected.</pre>
          </section>
        </div>
        <dl>
          <div><dt>Listener</dt><dd w-ref="{listenerValue}">{{listener}}</dd></div>
          <div><dt>Retention</dt><dd>Responses · circular · 1 GiB</dd></div>
        </dl>
      </section>
      <section id="breakpoints" class="workspace full" aria-labelledby="breakpoints-heading">
        <div>
          <p class="section-label">Hooks v2</p>
          <h2 id="breakpoints-heading">Break and modify</h2>
          <p>Paused exchanges fail closed on timeout, controller loss, or window closure. Every edit is attributed to <code>transmog.session.interactive-control</code>.</p>
          <form w-ref="{breakpointForm}" @submit="{enableBreakpoints(event)}" class="phase-form">
            <label><input name="requestHead" type="checkbox" checked> Request head</label>
            <label><input name="requestBody" type="checkbox"> Request body</label>
            <label><input name="responseHead" type="checkbox" checked> Response head</label>
            <label><input name="responseBody" type="checkbox"> Response body</label>
            <button type="submit">Enable selected phases</button>
            <button type="button" class="secondary" @click="{disableBreakpoints()}">Disable</button>
            <button type="button" class="secondary" @click="{refreshBreakpoints()}">Refresh paused</button>
          </form>
          <div w-ref="{pausedList}" class="paused-list" aria-live="polite">No paused exchanges.</div>
        </div>
      </section>
      <section id="automation" class="workspace full" aria-labelledby="automation-heading">
        <div>
          <p class="section-label">Native Hooks v2 rules</p>
          <h2 id="automation-heading">Conditional automation</h2>
          <p>Validate first, then atomically activate for newly admitted exchanges. Active exchanges keep their original rule snapshot and audit IDs include the exact rule revision.</p>
          <form w-ref="{automationForm}" @submit="{activateUserAgentRule(event)}" class="composer-form">
            <label>Rule ID <input name="ruleId" value="conditional-user-agent" pattern="[A-Za-z0-9._-]+" maxlength="128" required></label>
            <label>Revision <input name="revision" type="number" min="1" value="1" required></label>
            <label>Host (optional) <input name="host" maxlength="255" placeholder="example.test"></label>
            <label>Path prefix (optional) <input name="path" maxlength="2048" placeholder="/api"></label>
            <label>User-Agent value <input name="userAgent" maxlength="4096" value="Transmog/1.0" required></label>
            <button type="submit">Validate and activate</button>
            <button type="button" class="secondary" @click="{refreshAutomation()}">Refresh active rules</button>
          </form>
          <pre w-ref="{automationOutput}" tabindex="0">No native rules are active.</pre>
        </div>
      </section>
      <section id="composer" class="workspace full" aria-labelledby="composer-heading">
        <div>
          <p class="section-label">Canonical replay</p>
          <h2 id="composer-heading">Composer</h2>
          <form w-ref="{composerForm}" @submit="{executeComposer(event)}" class="composer-form">
            <label>Method <input name="method" value="GET" maxlength="32" required></label>
            <label>Absolute URL <input name="url" type="url" value="https://example.com/" required></label>
            <label>Headers (one <code>Name: value</code> per line) <textarea name="headers"></textarea></label>
            <label>Body <textarea name="body"></textarea></label>
            <label><input name="bodyHex" type="checkbox"> Body is hexadecimal</label>
            <label><input name="nonIdempotent" type="checkbox"> I acknowledge non-idempotent replay risk</label>
            <label><input name="credentials" type="checkbox"> I explicitly supplied and authorize credential headers</label>
            <button type="submit">Execute replay</button>
          </form>
          <pre w-ref="{composerOutput}" tabindex="0">No replay executed.</pre>
        </div>
      </section>
      <section id="captures" class="workspace full" aria-labelledby="captures-heading">
        <div>
          <p class="section-label">Durable evidence</p>
          <h2 id="captures-heading">Capture, import, and export</h2>
          <form w-ref="{captureForm}" @submit="{startCapture(event)}">
            <label>Native capture path <input name="capturePath" value="session.tmcap" required></label>
            <label>Quota bytes <input name="quota" type="number" min="1025" max="4294967296" value="1073741824" required></label>
            <label><input name="bodies" type="checkbox"> Retain bounded redacted body samples</label>
            <div class="actions">
              <button type="submit">Start capture</button>
              <button type="button" class="secondary" @click="{stopCapture()}">Seal capture</button>
              <button type="button" class="secondary" @click="{refreshCapture()}">Status</button>
            </div>
          </form>
          <form w-ref="{artifactForm}" @submit="{inspectCapture(event)}">
            <label>Native source <input name="source" value="session.tmcap" required></label>
            <label>Export destination <input name="destination" value="session.jsonl" required></label>
            <label>Format <select name="format"><option value="json-lines">JSON lines</option><option value="saz-strict">SAZ strict</option><option value="saz-extended">SAZ extended</option></select></label>
            <div class="actions">
              <button type="submit" class="secondary">Inspect/recover</button>
              <button type="button" @click="{exportCapture()}">Export create-new</button>
            </div>
          </form>
          <pre w-ref="{captureOutput}" tabindex="0">Capture is idle.</pre>
        </div>
      </section>
      <section id="settings" class="workspace full" aria-labelledby="settings-heading">
        <div>
          <p class="section-label">Local product state</p>
          <h2 id="settings-heading">Settings and support</h2>
          <p>Only versioned preferences, window state, explicit privacy choices, and opted-in recent artifact references are persisted. Live traffic and breakpoint decisions are never settings.</p>
          <form w-ref="{settingsForm}" @submit="{saveSettings(event)}">
            <label>Theme <select name="theme"><option value="system">System</option><option value="light">Light</option><option value="dark">Dark</option></select></label>
            <label>Session page size <input name="pageSize" type="number" min="10" max="200" value="100" required></label>
            <label><input name="defaultSystemProxy" type="checkbox"> Configure the system proxy by default</label>
            <label><input name="defaultBodies" type="checkbox" checked> Retain response bodies in the one-GiB circular cache</label>
            <label><input name="rememberArtifacts" type="checkbox"> Remember recent artifact paths locally</label>
            <label><input name="supportPaths" type="checkbox"> Permit opted-in paths in support bundles</label>
            <div class="actions">
              <button type="button" class="secondary" @click="{loadSettings()}">Load settings</button>
              <button type="submit">Save settings</button>
            </div>
          </form>
          <form w-ref="{supportForm}" @submit="{createSupportBundle(event)}">
            <label>New support bundle <input name="destination" value="transmog-support.zip" required></label>
            <label><input name="includePaths" type="checkbox"> Include recent paths if the saved privacy setting permits it</label>
            <div class="actions">
              <button type="button" class="secondary" @click="{refreshDiagnostics()}">Refresh redacted diagnostics</button>
              <button type="button" class="secondary" @click="{prepareUpdate()}">Prepare safe update handoff</button>
              <button type="submit">Create support bundle</button>
            </div>
          </form>
          <pre w-ref="{supportOutput}" tabindex="0">Diagnostics have not been loaded.</pre>
        </div>
      </section>
      <section class="diagnostics" aria-labelledby="diagnostics-heading">
        <h2 id="diagnostics-heading">Diagnostics</h2>
        <output w-ref="{diagnostics}" aria-live="polite">Application facade ready.</output>
        <button type="button" @click="{refreshStatus()}">Refresh status</button>
      </section>
    </main>
  </div>
</template>
