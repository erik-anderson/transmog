<template shadowrootmode="open" @save-comparison-case="{onSaveComparisonCase(e)}" @case-comparison-request="{onCaseComparison(e)}" @comparison-source-request="{onComparisonSource(e)}" @comparison-request="{onComparison(e)}" @capture-comparison-request="{onCaptureComparison(e)}" @trace-import-request="{onTraceImport(e)}" @operation-error="{onOperationError(e)}" @trace-password-request="{onTracePasswordRequest(e)}" @diagnostic="{onDiagnostic(e)}" @breakpoint-state-change="{onBreakpointState(e)}" @reset-workspace="{resetWorkspace()}" @notice="{onNotice(e)}" @dismiss-notice="{dismissNotice()}" @navigate="{onNavigate(e)}" @status-changed="{onStatus(e)}" @preferences-changed="{onPreferences(e)}" @proxy-ready="{onProxyReady()}" @proxy-operation="{onProxyOperation(e)}" @workspace-change="{onWorkspaceChange(e)}" @selection-changed="{onSelection(e)}" @autoresponse-request="{onAutoResponse(e)}" @traffic-rule-request="{onTrafficRule(e)}" @response-text-request="{onResponseText(e)}" @source-traffic-request="{onSourceTraffic(e)}" @traffic-refreshed="{onTrafficRefreshed()}" @preview-options-request="{onPreviewOptions()}" @page-association-request="{onPageAssociation(e)}" @preview-state-change="{onPreviewStateChange()}" @preview-source-request="{onPreviewSource(e)}" @preview-report-request="{showPreviewDiagnostics()}" @page-preview-request="{onPagePreview(e)}" @saved-demo-preview="{onSavedDemoPreview(e)}" @matched-rule-request="{onMatchedRule(e)}" @replay-request="{onReplay(e)}" @automation-state-change="{onAutomationState(e)}" @script-activity-change="{onScriptActivity(e)}" @toggle-autoresponses="{toggleAutoresponses()}" @autoresponse-batch-request="{onAutoResponseBatch(e)}" @response-set-intake-request="{onResponseSetIntake(e)}" @response-set-open-request="{onResponseSetOpen(e)}" @update-state-change="{onUpdateState(e)}" @install-update="{onInstallUpdate(e)}">
  <div class="shell" data-lifecycle="{{lifecycleKind}}">
    <response-set-page-picker w-ref="{responseSetPagePicker}" @preview-page-status="{onPreviewPageStatus(e)}" @page-traffic-request="{previewGoToTraffic()}"></response-set-page-picker>
    <header class="topbar">
      <div class="brand" aria-label="Transmog">
        <img class="brand-mark" src="/transmog-icon.svg" alt="">
        <span>Transmog</span>
      </div>
      <span class="top-spacer"></span>
      <div class="connection-status">
      <client-certificate-requests ?viewer-mode="{{viewerMode}}" @client-certificate-settings-request="{openClientCertificateSettings()}" @client-certificate-panel-closed="{certificatePanelClosed()}"></client-certificate-requests>
      <if condition="!viewerMode"><div class="listener-status status" data-lifecycle="{{lifecycleKind}}" aria-live="polite">
        <span class="status-dot" aria-hidden="true"></span>
        <strong>{{lifecycleLabel}}</strong>
        <button type="button" class="listener-copy" title="Copy proxy address" @click="{copyListener()}">{{listener}}</button><button type="button" class="secondary status-tools" aria-label="Proxy status and tools" title="Proxy status and tools" popovertarget="proxy-status-tools">⋯</button>
      </div>
      </if><if condition="viewerMode"><strong class="viewer-mode-label">Capture viewer</strong></if>
      </div>
      <if condition="!viewerMode">
      <div class="top-actions">
        <button type="button" class="secondary update-toggle" ?hidden="{{!updateToolbarVisible}}" @click="{openAbout()}">{{updateToolbarLabel}}</button>
        <proxy-toggle lifecycle="{{lifecycleKind}}" pending="{{proxyPending}}" ?ready="{{proxyReady}}" @toggle-proxy="{toggleProxy()}"></proxy-toggle>
      </div>
      </if><if condition="viewerMode"><button type="button" class="secondary" @click="{openMainWindow()}">Open main window</button></if>
    </header>

    <section class="notice" role="alert" aria-live="assertive" ?hidden="{{!noticeVisible}}">
      <div>
        <strong>{{noticeTitleText}}</strong>
        <p>{{noticeMessageText}}</p>
      </div>
      <button type="button" ?hidden="{{!noticeActionLabel}}" @click="{runNoticeAction()}">{{noticeActionLabel}}</button>
      <button type="button" class="secondary compact-button" aria-label="Dismiss notification" @click="{dismissNotice()}">Dismiss</button>
    </section>

    <div class="app-body" ?data-collapsed="{{workspace.sidebarCollapsed}}">
      <nav class="rail" aria-label="Primary">
        <button type="button" class="rail-toggle" title="Toggle navigation labels" aria-label="Toggle navigation labels" aria-expanded="{{navigationExpanded}}" @click="{toggleNavigation()}">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="4" width="18" height="16" rx="2"></rect><path d="M9 4v16"></path><path class="rail-toggle-chevron" d="m16 9-3 3 3 3"></path></svg>
        </button>
        <a href="#traffic" title="Traffic" data-view="traffic" ?data-active="{{activeView == 'traffic'}}" aria-current="{{currentNavigation.traffic}}" @click="{showView(e)}">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 7h17m-4-4 4 4-4 4M21 17H4m4-4-4 4 4 4"></path></svg>
          <span class="nav-label">Traffic</span>
        </a>
        <if condition="!viewerMode"><a href="#breakpoints" title="Breakpoints" data-view="breakpoints" ?data-active="{{activeView == 'breakpoints'}}" aria-current="{{currentNavigation.breakpoints}}" @click="{showView(e)}">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M8 3h8l5 5v8l-5 5H8l-5-5V8Z M9.5 8.5v7m5-7v7"></path></svg>
          <span class="nav-label">Breakpoints</span><span class="nav-count" aria-label="{{pausedCount}} paused requests" ?hidden="{{!pausedCount}}">{{pausedCount}}</span>
        </a></if>
        <if condition="!viewerMode"><a href="#automation" title="Automation" data-view="automation" ?data-active="{{activeView == 'automation'}}" aria-current="{{currentNavigation.automation}}" @click="{showView(e)}">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="9" width="6" height="6" rx="1.5"></rect><rect x="15" y="3" width="6" height="6" rx="1.5"></rect><rect x="15" y="15" width="6" height="6" rx="1.5"></rect><path d="M9 12h3m3-6h-1a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h1"></path></svg>
          <span class="nav-label">Automation</span><if condition="automationEnabledCount"><span class="nav-count" title="{{automationEnabledLabel}}" aria-label="{{automationEnabledLabel}}">{{automationEnabledCount}}</span></if>
        </a></if>
        <a href="#composer" title="Composer" data-view="composer" ?data-active="{{activeView == 'composer'}}" aria-current="{{currentNavigation.composer}}" @click="{showView(e)}">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M11 4H5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h13a2 2 0 0 0 2-2v-6M16 7l3 3M9 14l-1 4 4-1 8-8a2.12 2.12 0 0 0-3-3Z"></path></svg>
          <span class="nav-label">Composer</span>
        </a>
        <if condition="!viewerMode"><a href="#captures" title="Capture tools" data-view="captures" ?data-active="{{activeView == 'captures'}}" aria-current="{{currentNavigation.captures}}" @click="{showView(e)}">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="3" width="18" height="5" rx="1.5"></rect><path d="M5 8v11a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8m-10 5h6"></path></svg>
          <span class="nav-label">Capture tools</span>
        </a></if>
        <span class="nav-spacer"></span>
        <if condition="!viewerMode"><a href="#settings" title="Settings (Ctrl+,)" aria-keyshortcuts="Control+," data-view="settings" ?data-active="{{activeView == 'settings'}}" aria-current="{{currentNavigation.settings}}" @click="{showView(e)}">
          <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M10.5 3h3l.5 2 1.5.6 1.8-1 2.1 2.1-1 1.8.6 1.5 2 .5v3l-2 .5-.6 1.5 1 1.8-2.1 2.1-1.8-1-1.5.6-.5 2h-3l-.5-2-1.5-.6-1.8 1-2.1-2.1 1-1.8-.6-1.5-2-.5v-3l2-.5.6-1.5-1-1.8 2.1-2.1 1.8 1 1.5-.6Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          <span class="nav-label">Settings</span>
        </a></if>
      </nav>

      <main w-ref="{workspaceContent}" tabindex="-1">
        <traffic-workspace ?viewer-mode="{{viewerMode}}" w-ref="{traffic}" view="{{activeView}}" lifecycle="{{lifecycleKind}}" pending="{{proxyPending}}" :preferences="{{workspace}}" :autoresponseState="{{autoresponseState}}" :autoresponsePending="{{autoresponsePending}}"></traffic-workspace>
        <if condition="!viewerMode"><breakpoint-workspace view="{{activeView}}" theme="{{theme}}"></breakpoint-workspace></if>
        <if condition="!viewerMode"><automation-workspace :previewReportSetId="{{capturedPreviewController.previewReportSetId}}" :previewReportAvailable="{{capturedPreviewController.previewReportAvailable}}" :enabledScriptCount="{{enabledScriptCount}}" w-ref="{automation}" view="{{activeView}}" theme="{{theme}}" :selection="{{selection}}" :autoresponseState="{{autoresponseState}}" :autoresponsePending="{{autoresponsePending}}" :preferences="{{workspace}}" :preferencesReady="{{workspaceLoaded}}"></automation-workspace></if>
        <composer-workspace w-ref="{composer}" view="{{activeView}}"></composer-workspace>
        <if condition="!viewerMode"><capture-workspace view="{{activeView}}" lifecycle="{{lifecycleKind}}" @status-changed="{onCaptureStatus(e)}"></capture-workspace></if>
        <if condition="!viewerMode"><settings-workspace w-ref="{settings}" view="{{activeView}}" @check-updates="{checkUpdates()}"></settings-workspace></if>
        <comparison-workspace w-ref="{comparison}"></comparison-workspace>
        <if condition="!viewerMode"><response-set-intake w-ref="{responseSetIntake}"></response-set-intake></if>
        <captured-preview w-ref="{capturedPreviewSurface}" :controller="{{capturedPreviewController}}"></captured-preview>
      </main>
    </div>

    <footer class="app-footer" ?hidden="{{!diagnosticText}}">
      <output class="global-diagnostics" aria-live="polite">{{diagnosticText}}</output>
      <button type="button" class="secondary compact-button diagnostic-close" aria-label="Dismiss status message" @click="{dismissDiagnostic()}">×</button>
    </footer>
    <dialog w-ref="{previewPrerequisiteDialog}" class="operation-error-dialog preview-prerequisite-dialog" aria-labelledby="preview-prerequisite-title" aria-describedby="preview-prerequisite-message" @close="{previewPrerequisiteClosed()}">
      <h2 id="preview-prerequisite-title">A captured page is needed</h2>
      <p ?hidden="{{!previewLookupFailed}}">Captured pages could not be checked. Try again, or select a page in Traffic.</p>
      <p id="preview-prerequisite-message">Page previews need a captured HTML page. In Traffic, start the proxy and visit the page through it, or import saved traffic containing the page. Select its HTML response, then return here and retry.</p>
      <div class="actions"><button type="button" data-traffic @click="{previewGoToTraffic()}">Go to Traffic</button><button type="button" data-close class="secondary" autofocus @click="{closePreviewPrerequisite()}">Close</button></div>
    </dialog>
    <dialog w-ref="{errorDialog}" class="operation-error-dialog" role="alertdialog" aria-labelledby="operation-error-title" aria-describedby="operation-error-message" @close="{operationErrorClosed()}">
      <h2 id="operation-error-title">{{errorTitle}}</h2>
      <p id="operation-error-message">{{errorMessage}}</p>
      <div class="actions"><button type="button" autofocus @click="{closeOperationError()}">Close</button></div>
    </dialog>
    <dialog w-ref="{updateDraftDialog}" class="update-drafts-dialog" aria-labelledby="update-drafts-heading" @cancel="{cancelUpdateDrafts(e)}"><h2 id="update-drafts-heading">Unsaved work</h2><p>{{updateDraftSummary}}</p><div class="actions"><button type="button" class="secondary" autofocus @click="{resolveUpdateDraftsChoice(false)}">Keep working</button><button type="button" @click="{resolveUpdateDraftsChoice(true)}">Discard drafts and update</button></div></dialog>
    <dialog w-ref="{passwordDialog}" class="trace-password-dialog" aria-labelledby="trace-password-title" @close="{tracePasswordClosed()}">
      <h2 id="trace-password-title">{{passwordTitle}}</h2>
      <form w-ref="{passwordForm}" @submit="{submitTracePassword(e)}">
        <label>Password <input name="password" type="password" autocomplete="off" required maxlength="1024"></label>
        <label ?hidden="{{!passwordConfirm}}">Confirm password <input name="confirmPassword" type="password" autocomplete="off" ?required="{{passwordConfirm}}" ?disabled="{{!passwordConfirm}}" maxlength="1024"></label>
        <label class="checkbox-label"><input type="checkbox" @change="{setPasswordVisible(e)}"> Show password</label>
        <p class="field-help">Passwords are kept in memory for this operation and never saved in settings.</p>
        <p class="field-help" ?hidden="{{!passwordConfirm}}">Keep this password to reopen the capture. Transmog cannot recover it.</p>
        <p class="field-error" role="status" ?hidden="{{!passwordError}}">{{passwordError}}</p>
        <footer class="actions"><button type="submit">Continue</button><button type="button" class="secondary" @click="{cancelTracePassword()}">Cancel</button></footer>
      </form>
    </dialog>
    <div id="proxy-status-tools" class="table-popover proxy-status-popover" popover="auto"><strong class="popover-title">{{lifecycleLabel}}</strong><p class="full-value">{{listener}}</p><button type="button" @click="{refreshStatus()}" popovertarget="proxy-status-tools" popovertargetaction="hide">Refresh status</button><button type="button" @click="{openConnectionSettings()}" popovertarget="proxy-status-tools" popovertargetaction="hide">Connection settings</button></div>
  </div>
</template>
