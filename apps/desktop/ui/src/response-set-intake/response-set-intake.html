<template>
<dialog class="response-set-intake-dialog" w-ref="{intakeDialog}" aria-labelledby="set-intake-title" @cancel="{close(e)}" @keydown="{keyboard(e)}" aria-busy="{{intakeSaving}}">
  <header><h2 id="set-intake-title">Add to response set</h2><p>Keep useful response changes together. Adding responses saves the destination without applying it to live traffic.</p></header>
  <if condition="!intakeCompleted"><div class="intake-content">
    <fieldset ?disabled="{{intakeSaving || intakeReviewBusy}}" ?hidden="{{intakeReview.rows.length}}"><legend><if condition="intakeSource == 'traffic'">Captured traffic</if><if condition="intakeSource == 'rules'">Existing saved-response rules</if></legend>
      <div class="intake-source-tools"><label>Search responses <input w-ref="{sourceSearch}" type="search" value="{{intakeSearch}}" @input="{sourceSearchChanged(e)}"></label><span role="status">{{intakeSelectedCount}} selected</span><button type="button" class="secondary compact-button" @click="{clearSelection()}" ?disabled="{{!intakeSelectedCount}}">Clear selection</button></div>
      <p ?hidden="{{!intakeLoading}}" role="status">Checking retained responses…</p><p ?hidden="{{intakeRows.length || intakeLoading}}">No eligible responses match. <if condition="intakeSource == 'rules'">Only ordinary saved-response rules can be collected here.</if><if condition="intakeSource == 'traffic'">Capture responses or import traffic, then retry.</if></p>
      <div class="intake-source-list"><table role="grid" aria-label="Responses to collect" aria-multiselectable="true"><thead><tr><th>Select</th><th>Response / URL match</th><th>State</th></tr></thead><tbody><for each="row in intakeRows"><tr key="{{row.id}}" id="intake-source-{{row.id}}" tabindex="{{row.tabIndex}}" ?data-selected="{{row.selected}}" aria-selected="{{row.selected}}" @click="{selectRow(row.id,e)}" @keydown="{rowKeyboard(row.id,e)}"><td><input type="checkbox" aria-label="Select {{row.name}}" ?checked="{{row.selected}}" ?disabled="{{!row.eligible && !row.selected}}" @click="{selectRow(row.id,e,true)}"></td><td><strong>{{row.name}}</strong><span>{{row.method}} {{row.url}}</span><small>{{row.bodySource}}</small></td><td><span>{{row.response}}</span><small>{{row.reason}}</small></td></tr></for></tbody></table></div>
      <button type="button" class="secondary compact-button" ?hidden="{{!intakeMore}}" ?disabled="{{intakeLoading}}" @click="{loadSources(true)}">Load more responses</button>
      <p class="field-help">Select up to 1,000 responses. Names, matches, bodies, inclusion and relative order are preserved. Ctrl or Shift selects several; Ctrl+A selects the listed eligible responses.</p>
    </fieldset>
    <fieldset ?disabled="{{intakeSaving || intakeReviewBusy}}" ?hidden="{{intakeReview.rows.length}}"><legend>Destination</legend><label>Response set <select aria-label="Response set" w-ref="{destinationSelect}" value="{{intakeDestination}}" @change="{changeDestination(e)}"><option value="" ?selected="{{!intakeDestination}}">Choose a response set…</option><for each="set in intakeDestinations"><option value="{{set.id}}" ?selected="{{set.id == intakeDestination}}">{{set.name}}</option></for><option value="__new" ?selected="{{intakeDestination == '__new'}}">Create new response set…</option></select></label><div class="intake-new" ?hidden="{{intakeDestination != '__new'}}"><label>Response set name <input w-ref="{intakeNameInput}" value="{{intakeName}}" @input="{changeMetadata('name',e)}"></label><label>Notes <textarea rows="2" w-ref="{intakeNotesInput}" @input="{changeMetadata('notes',e)}"></textarea></label></div>
      <div ?hidden="{{intakeSource != 'rules'}}" class="intake-mode"><label><input type="radio" name="set-intake-mode" value="copy" ?checked="{{intakeMode == 'copy'}}" @change="{changeMode(e)}">Copy rules <small>Keep the original rules in Rules.</small></label><label><input type="radio" name="set-intake-mode" value="move" ?checked="{{intakeMode == 'move'}}" @change="{changeMode(e)}">Move rules <small>Remove the original rules after saving them in this response set.</small></label></div>
    </fieldset>
    <if condition="intakeReview.rows.length"><section class="intake-review" aria-label="Review collected responses"><h3>Review responses</h3><p><strong>{{intakeReviewSummary}}</strong></p><p>{{intakeReview.destinationCount}} existing responses will be kept. These responses will be appended in this order.</p><ol><for each="row in intakeReview.rows"><li key="{{row.id}}"><strong>{{row.name}}</strong><span>{{row.method}} {{row.url}}</span><small>{{row.response}} · <if condition="row.included">Included</if><if condition="!row.included">Excluded</if> · {{row.bodySource}}</small></li></for></ol>
      <p class="intake-warning" ?hidden="{{intakeMode != 'move'}}"><if condition="intakeReview.activeCount == 1">1 selected rule is active.</if><if condition="intakeReview.activeCount > 1">{{intakeReview.activeCount}} selected rules are active.</if><if condition="intakeReview.activeCount"> Moving them will stop their live effects until you apply this response set.</if><if condition="!intakeReview.activeCount">The selected rules currently have no live effects. Moving removes them from Rules.</if></p>
      <if condition="intakeReview.warnings.length"><details open class="intake-overlaps"><summary>Review overlapping matches</summary><ul><for each="warning in intakeReview.warnings"><li>{{warning}}</li></for></ul></details><label class="intake-acknowledge"><input type="checkbox" ?checked="{{intakeAcknowledged}}" @change="{acknowledge(e)}" ?disabled="{{intakeSaving}}">Keep all responses with these overlapping matches</label></if>
    </section></if>
  </div></if>
  <p class="field-error" role="alert" ?hidden="{{!intakeError}}">{{intakeError}}</p><p role="status" ?hidden="{{!intakeSaving}}">Saving responses… You can close this dialog; the operation will continue.</p><p role="status" ?hidden="{{!intakeCompleted}}">{{intakeResult}}</p>
  <footer><button type="button" ?hidden="{{intakeReview.rows.length || intakeCompleted}}" @click="{review()}" aria-disabled="{{intakeLoading || intakeReviewBusy}}" ?disabled="{{!intakeSelectedCount}}"><if condition="intakeReviewBusy">Reviewing…</if><if condition="!intakeReviewBusy">Review responses</if></button><button w-ref="{submitButton}" type="button" ?hidden="{{!intakeReview.rows.length || intakeCompleted}}" @click="{submit()}" aria-disabled="{{intakeSaving}}" ?disabled="{{intakeReview.warnings.length > 0 && !intakeAcknowledged}}">{{intakeSubmitLabel}}</button><button type="button" class="secondary" ?hidden="{{!intakeReview.rows.length || intakeCompleted}}" ?disabled="{{intakeSaving}}" @click="{back()}">Back</button><button type="button" ?hidden="{{!intakeCompleted}}" @click="{openResult()}">Open response set</button><button w-ref="{closeButton}" type="button" class="secondary" @click="{close()}"><if condition="intakeSaving || intakeCompleted">Close</if><if condition="!intakeSaving && !intakeCompleted">Cancel</if></button></footer>
</dialog>
<div class="intake-result" ?hidden="{{!intakeResult || intakeOpen}}"><span role="status">{{intakeResult}}</span><button type="button" class="secondary compact-button" @click="{openResult()}">Open response set</button><button type="button" class="secondary compact-button" @click="{dismissResult()}">Dismiss</button></div>
</template>
