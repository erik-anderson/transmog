<template>
<section id="settings" class="app-view tool-view" aria-labelledby="settings-heading" ?hidden="{{view != 'settings'}}" ?data-active="{{view == 'settings'}}">
 <div class="settings-page">
  <header class="workspace-header"><h1 id="settings-heading">Settings</h1><nav class="settings-tabs" aria-label="Settings sections"><button type="button" ?data-selected="{{settingsSection == 'preferences'}}" @click="{showSettingsSection('preferences')}">Preferences</button><button type="button" ?data-selected="{{settingsSection == 'connection'}}" @click="{showSettingsSection('connection')}">Connection</button><button type="button" ?data-selected="{{settingsSection == 'support'}}" @click="{showSettingsSection('support')}">Support</button></nav></header>
  <div class="settings-content">
   <section ?hidden="{{settingsSection != 'preferences'}}"><form w-ref="{settingsForm}" @submit="{saveSettings(e)}" @input="{markSettingsDirty()}" @change="{markSettingsDirty()}" @keydown="{settingsKeyboard(e)}" class="preferences-form"><fieldset ?disabled="{{settingsBusy}}"><legend>Appearance and lists</legend><div class="preference-row"><label>Theme <select name="theme" aria-label="Theme"><option value="system">Use system setting</option><option value="light">Light</option><option value="dark">Dark</option></select></label><label>Entries per page <input name="pageSize" type="number" min="10" max="200" value="100" required></label></div></fieldset><fieldset ?disabled="{{settingsBusy}}"><legend>Retention</legend><label><input name="requestBodies" type="checkbox" checked> Keep request bodies for copying and replay</label><label><input name="defaultBodies" type="checkbox" checked> Keep response bodies for inspection and reuse</label><p class="field-help">The circular request and response cache holds up to 1 GiB.</p><label><input name="captureBodies" type="checkbox" checked> Include body samples in automatic captures</label><p class="field-help">TMCap files include bounded body samples when this is enabled.</p></fieldset><fieldset ?disabled="{{settingsBusy}}"><legend>Privacy</legend><label><input name="redactHeaders" type="checkbox"> Redact Authorization, Proxy-Authorization, Cookie and Set-Cookie values</label><p class="field-help">Applies to newly received headers. Header names and original sizes remain available. Existing captures keep their recorded values.</p><label><input name="rememberArtifacts" type="checkbox"> Remember recent artifact paths locally</label><label><input name="supportPaths" type="checkbox"> Allow opted-in paths in support bundles</label><p class="field-help">Captured traffic and pending breakpoint decisions are kept separately from preferences.</p></fieldset><footer class="settings-save"><div class="actions"><button type="submit" ?disabled="{{settingsBusy || !settingsDirty}}">Save settings</button><button type="button" class="secondary" @click="{loadSettings()}" ?disabled="{{settingsBusy || !settingsDirty}}">Revert changes</button><span role="status">{{settingsText}}</span></div><p class="field-error" role="status" ?hidden="{{!settingsError}}">{{settingsError}}</p></footer></form></section>
   <section ?hidden="{{settingsSection != 'connection'}}" class="connection-panel"><h2>Proxy and HTTPS interception</h2><output class="operation-status" data-kind="{{proxyKind}}" aria-live="polite">{{proxyText}}</output><form w-ref="{proxyForm}" @submit="{startProxy(e)}"><fieldset class="proxy-controls" ?disabled="{{!proxyReady}}"><div class="actions"><button type="button" ?hidden="{{certificateReady || certificateRecovery}}" ?disabled="{{proxyPending}}" @click="{setupCa()}">Set up HTTPS interception</button><if condition="certificateRecovery"><button type="button" ?disabled="{{proxyPending || proxyLifecycle == 'running' || proxyLifecycle == 'stopping'}}" @click="{resetCa()}">Reset certificate and set up again</button></if><proxy-toggle lifecycle="{{proxyLifecycle}}" pending="{{proxyPending}}" ?ready="{{proxyReady}}" @toggle-proxy="{toggleProxy()}"></proxy-toggle><button type="button" class="secondary" ?hidden="{{!hostRecoveryPending}}" ?disabled="{{proxyPending}}" @click="{recoverProxy()}">Recover host settings</button></div><p class="field-help">Starting applies the current-user Windows proxy settings. Stopping or closing restores the prior settings.</p><details class="connection-advanced"><summary>Advanced certificate settings</summary><label>CA certificate <input value="{{certificatePath}}" name="certificate" ?readonly="{{proxyPending}}" required></label><label>CA private key <input value="{{privateKeyPath}}" name="privateKey" ?readonly="{{proxyPending}}" required></label><label>CA SHA-256 <input value="{{caSha256}}" name="thumbprint" ?readonly="{{proxyPending}}" pattern="[0-9A-Fa-f]{64}" placeholder="Recorded certificate thumbprint"></label><div class="actions"><button type="button" class="secondary" ?disabled="{{proxyPending}}" @click="{setupCa()}">Check certificate setup</button><button type="button" class="secondary" ?disabled="{{proxyPending}}" @click="{removeCa()}">Remove exact CA</button><if condition="!certificateRecovery"><button type="button" class="secondary" ?disabled="{{proxyPending || proxyLifecycle == 'running' || proxyLifecycle == 'stopping'}}" @click="{resetCa()}">Reset certificate and set up again</button></if></div></details></fieldset></form></section>
   <section ?hidden="{{settingsSection != 'support'}}"><h2>Diagnostics and support</h2><form w-ref="{supportForm}" @submit="{createSupportBundle(e)}"><label>New support bundle <span class="file-field"><input name="destination" aria-label="New support bundle" value="transmog-support.zip" required ?readonly="{{supportBusy}}"><button type="button" class="secondary" @click="{chooseSupportPath()}" ?disabled="{{supportBusy}}">Choose…</button></span></label><label><input name="includePaths" type="checkbox" ?disabled="{{supportBusy || !supportPathsAllowed}}"> Include recent artifact paths</label><p class="field-help" ?hidden="{{supportPathsAllowed}}">Enable path sharing in Privacy before including paths.</p><div class="actions"><button type="submit" ?disabled="{{supportBusy}}">Create support bundle</button><button type="button" class="secondary" @click="{refreshDiagnostics()}" ?disabled="{{supportBusy}}">Refresh diagnostics</button><button type="button" class="secondary" @click="{prepareUpdate()}" ?disabled="{{supportBusy}}">Prepare for update</button></div></form><output class="operation-status" aria-live="polite">{{supportText}}</output><dl class="support-facts" ?hidden="{{!supportFacts.length}}"><for each="fact in supportFacts"><div key="{{fact.label}}"><dt>{{fact.label}}</dt><dd>{{fact.value}}</dd></div></for></dl><details><summary>Technical details and log location</summary><p>Diagnostic log: <code>{{diagnosticsPathText}}</code></p><pre tabindex="0">{{supportDetails}}</pre></details></section>
  </div>
 </div>
</section>
</template>
