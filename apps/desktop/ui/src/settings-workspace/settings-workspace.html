<template>
<section id="settings" class="app-view tool-view" aria-labelledby="settings-heading" ?hidden="{{view != 'settings'}}" ?data-active="{{view == 'settings'}}">
 <div class="settings-page">
  <header class="workspace-header"><h1 id="settings-heading">Settings</h1><button type="button" class="secondary compact-button" @click="{showCredits()}">Credits</button><nav class="settings-tabs" aria-label="Settings sections"><button type="button" ?data-selected="{{settingsSection == 'preferences'}}" @click="{showSettingsSection('preferences')}">Preferences</button><button type="button" ?data-selected="{{settingsSection == 'connection'}}" @click="{showSettingsSection('connection')}">Connection</button><button type="button" ?data-selected="{{settingsSection == 'support'}}" @click="{showSettingsSection('support')}">Support</button></nav></header>
  <div class="settings-content">
   <section ?hidden="{{settingsSection != 'preferences'}}"><form w-ref="{settingsForm}" @submit="{saveSettings(e)}" @input="{markSettingsDirty()}" @change="{markSettingsDirty()}" @keydown="{settingsKeyboard(e)}" class="preferences-form"><fieldset ?disabled="{{settingsBusy}}"><legend>Appearance and lists</legend><div class="preference-row"><label>Theme <select name="theme" aria-label="Theme"><option value="system">Use system setting</option><option value="light">Light</option><option value="dark">Dark</option></select></label></div><button type="button" class="secondary" @click="{resetWorkspace()}">Reset layout and columns</button><p class="field-help">Restore panel sizes, navigation and traffic columns to their defaults.</p></fieldset><fieldset ?disabled="{{settingsBusy}}"><legend>Retention</legend><label><input name="limitEntries" type="checkbox" @change="{updateEntryLimit()}"> Limit number of live entries</label><label ?hidden="{{!entryLimitEnabled}}">Maximum live entries <input name="maxEntries" type="number" min="1" step="1" value="10000" required ?disabled="{{!entryLimitEnabled}}"></label><p class="field-help">No entry limit by default. With a limit, older completed entries drop off; active requests can temporarily exceed it. Imported traces are unaffected.</p><label>Circular buffer limit <select name="bufferMode" aria-label="Circular buffer limit" @change="{updateBufferMode()}"><option value="automatic">Automatic — half installed RAM</option><option value="custom">Custom maximum</option><option value="unlimited">No max size (writes to disk)</option></select></label><label ?hidden="{{bufferMode != 'custom'}}">Maximum size (GiB) <input name="bufferSize" type="number" min="0.001" max="1048576" step="any" value="1" required ?disabled="{{bufferMode != 'custom'}}"></label><p class="field-help">{{bufferSummary}}</p><p class="field-help">Older completed bodies are removed as the buffer fills. Limits up to half installed RAM stay in memory; larger or unlimited limits write to disk. Saving a trace or starting a recording writes a file. Changes apply to new bodies; existing memory bodies are never moved to disk.</p><label><input name="requestBodies" type="checkbox" checked> Keep request bodies for copying and replay</label><label>Request body limit <select name="requestBodyLimit" aria-label="Request body limit"><option value="25000000">25 MB per request (default)</option><option value="unlimited">Unlimited (circular buffer limit still applies)</option></select></label><label><input name="defaultBodies" type="checkbox" checked> Keep response bodies for inspection and reuse</label><label><input name="captureBodies" type="checkbox" checked> Include request and response bodies by default when recording</label><p class="field-help">TMCap files use the request body limit above and have no file-size ceiling. Forwarding continues when capture retention reaches its limit.</p></fieldset><fieldset ?disabled="{{settingsBusy}}"><legend>Privacy</legend><label><input name="redactHeaders" type="checkbox"> Redact Authorization, Proxy-Authorization, Cookie and Set-Cookie values</label><p class="field-help">Off by default. When enabled, applies to newly received headers in Traffic and recordings. Header names and original sizes remain available. Existing captures keep their recorded values.</p><label><input name="rememberArtifacts" type="checkbox"> Remember recent artifact paths locally</label><label><input name="supportPaths" type="checkbox"> Allow sharing saved file locations in support bundles</label><p class="field-help">Allows the Support page to include remembered capture and export filenames and folders when you check its file-location option. These paths may reveal your username or project names; file contents are never included.</p><p class="field-help">Traffic is kept only for this app session unless you save a trace or explicitly record to a file.</p></fieldset><footer class="settings-save"><div class="actions"><button type="submit" ?disabled="{{settingsBusy || !settingsDirty}}">Save settings</button><button type="button" class="secondary" @click="{loadSettings()}" ?disabled="{{settingsBusy || !settingsDirty}}">Revert changes</button><span role="status">{{settingsText}}</span></div><p class="field-error" role="status" ?hidden="{{!settingsError}}">{{settingsError}}</p></footer></form></section>
   <section ?hidden="{{settingsSection != 'connection'}}" class="connection-panel"><h2>Proxy and HTTPS interception</h2><output class="operation-status" data-kind="{{proxyKind}}" aria-live="polite">{{proxyText}}</output><form w-ref="{proxyForm}" @submit="{startProxy(e)}"><fieldset class="proxy-controls" ?disabled="{{!proxyReady}}"><div class="actions"><button type="button" ?hidden="{{certificateReady || certificateRecovery}}" ?disabled="{{proxyPending}}" @click="{setupCa()}">Set up HTTPS interception</button><if condition="certificateRecovery"><button type="button" ?disabled="{{proxyPending || proxyLifecycle == 'running' || proxyLifecycle == 'draining' || proxyLifecycle == 'stopping'}}" @click="{resetCa()}">Reset certificate and set up again</button></if><proxy-toggle lifecycle="{{proxyLifecycle}}" pending="{{proxyPending}}" ?ready="{{proxyReady}}" @toggle-proxy="{toggleProxy()}"></proxy-toggle><button type="button" class="secondary" ?hidden="{{!hostRecoveryPending}}" ?disabled="{{proxyPending}}" @click="{recoverProxy()}">Recover host settings</button></div><p class="field-help">Starting applies the current-user Windows proxy settings. Stopping or closing restores the prior settings.</p><details class="connection-advanced"><summary>Advanced certificate settings</summary><label>CA certificate <input value="{{certificatePath}}" name="certificate" ?readonly="{{proxyPending}}" required></label><label>CA private key <input value="{{privateKeyPath}}" name="privateKey" ?readonly="{{proxyPending}}" required></label><label>CA SHA-256 <input value="{{caSha256}}" name="thumbprint" ?readonly="{{proxyPending}}" pattern="[0-9A-Fa-f]{64}" placeholder="Recorded certificate thumbprint"></label><div class="actions"><button type="button" class="secondary" ?disabled="{{proxyPending}}" @click="{setupCa()}">Check certificate setup</button><button type="button" class="secondary" ?disabled="{{proxyPending}}" @click="{removeCa()}">Remove exact CA</button><if condition="!certificateRecovery"><button type="button" class="secondary" ?disabled="{{proxyPending || proxyLifecycle == 'running' || proxyLifecycle == 'draining' || proxyLifecycle == 'stopping'}}" @click="{resetCa()}">Reset certificate and set up again</button></if></div></details></fieldset></form></section>
   <section ?hidden="{{settingsSection != 'support'}}"><h2>Diagnostics and support</h2><button type="button" class="secondary" @click="{checkUpdates()}">Check for updates</button><form w-ref="{supportForm}" @submit="{createSupportBundle(e)}"><p class="field-help">Save diagnostics, app version and settings to a ZIP file you can share. Captured headers and bodies are excluded. Choose its destination when creating the bundle.</p><label><input name="includePaths" type="checkbox" ?disabled="{{supportBusy || !supportPathsAllowed}}"> Include remembered capture and export file locations</label><p class="field-help" ?hidden="{{supportPathsAllowed}}">File-location sharing is off. Enable “Allow sharing saved file locations in support bundles” in Preferences → Privacy, then save settings.</p><div class="actions"><button type="submit" ?disabled="{{supportBusy}}">Create support bundle…</button><button type="button" class="secondary" @click="{refreshDiagnostics()}" ?disabled="{{supportBusy}}">Refresh diagnostics</button><button type="button" class="secondary" @click="{prepareUpdate()}" ?disabled="{{supportBusy}}">Prepare for update</button></div></form><output class="operation-status" aria-live="polite">{{supportText}}</output><dl class="support-facts" ?hidden="{{!supportFacts.length}}"><for each="fact in supportFacts"><div key="{{fact.label}}"><dt>{{fact.label}}</dt><dd>{{fact.value}}</dd></div></for></dl><details><summary>Technical details and log location</summary><p>Diagnostic log: <code>{{diagnosticsPathText}}</code></p><pre tabindex="0">{{supportDetails}}</pre></details></section>
  </div>
 </div>
</section>
<dialog w-ref="{creditsDialog}" class="credits-dialog" aria-labelledby="credits-heading">
 <h2 id="credits-heading">Credits and third-party notices</h2><p role="status">{{creditsStatus}}</p>
 <p>Expand a dependency to read its license and copyright notices.</p>
 <div class="credits-scroll"><details><summary>Dependency inventory and bundled native code</summary><pre>{{creditsSummary}}</pre></details><for each="credit in credits"><details key="{{credit.id}}"><summary>{{credit.name}} {{credit.version}} · {{credit.license}}</summary><pre>{{credit.text}}</pre></details></for></div>
 <footer class="actions"><button type="button" class="secondary" @click="{closeCredits()}">Close</button></footer>
</dialog>
</template>
