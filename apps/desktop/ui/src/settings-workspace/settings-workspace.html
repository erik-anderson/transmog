<template>
<section id="settings" class="app-view tool-view" aria-labelledby="settings-heading" ?hidden="{{view != 'settings'}}" ?data-active="{{view == 'settings'}}">
 <div class="settings-page">
  <header class="workspace-header">
   <h1 id="settings-heading">Settings</h1>
   <nav class="settings-tabs" aria-label="Settings sections">
    <button type="button" ?data-selected="{{currentSettings.preferences == 'page'}}" aria-current="{{currentSettings.preferences}}" @click="{showSettingsSection('preferences')}">Preferences</button>
    <button type="button" ?data-selected="{{currentSettings.connection == 'page'}}" aria-current="{{currentSettings.connection}}" @click="{showSettingsSection('connection')}">Connection</button>
    <button type="button" ?data-selected="{{currentSettings.integrations == 'page'}}" aria-current="{{currentSettings.integrations}}" @click="{showSettingsSection('integrations')}">Integrations</button>
    <button type="button" ?data-selected="{{currentSettings.extensions == 'page'}}" aria-current="{{currentSettings.extensions}}" @click="{showSettingsSection('extensions')}">Extensions</button>
    <button type="button" ?data-selected="{{currentSettings.support == 'page'}}" aria-current="{{currentSettings.support}}" @click="{showSettingsSection('support')}">Support</button>
    <button type="button" ?data-selected="{{currentSettings.about == 'page'}}" aria-current="{{currentSettings.about}}" @click="{showSettingsSection('about')}">About</button>
   </nav>
  </header>
  <div class="settings-content">
   <section ?hidden="{{settingsSection != 'integrations'}}"><mcp-settings ?active="{{view == 'settings' && settingsSection == 'integrations'}}"></mcp-settings></section>
   <section ?hidden="{{settingsSection != 'extensions'}}"><extension-settings w-ref="{extensionsEditor}" ?active="{{view == 'settings' && settingsSection == 'extensions'}}"></extension-settings></section>
   <section ?hidden="{{settingsSection != 'preferences'}}" class="settings-editor" @keydown="{settingsKeyboard(e, 'preferences')}">
    <form id="preferences-form" w-ref="{settingsForm}" @submit="{saveSettings(e, 'preferences')}" @input="{markSettingsDirty()}" @change="{markSettingsDirty()}" class="settings-editor">
     <div class="settings-fields preferences-fields">
      <fieldset class="appearance-settings" ?disabled="{{settingsBusy || !proxyReady || !settingsLoaded}}"><legend>Appearance and lists</legend><div class="preference-row"><label>Theme <select name="theme" aria-label="Theme"><option value="system">Use system setting</option><option value="light">Light</option><option value="dark">Dark</option></select></label></div><button type="button" class="secondary" @click="{resetWorkspace()}">Reset layout and columns</button><p class="field-help">Restore panel sizes, navigation and traffic columns to their defaults.</p></fieldset>
      <fieldset ?disabled="{{settingsBusy || !proxyReady || !settingsLoaded}}"><legend>Retention</legend><label><input name="terminateWebsocketsOnClear" type="checkbox"> Terminate open WebSockets when clearing Traffic</label><p class="field-help">Off by default: open WebSockets stay visible when you clear or remove entries. When enabled, those actions close the affected WebSockets before removing them. Undo restores their evidence, not their connections.</p><label><input name="limitEntries" type="checkbox" @change="{updateEntryLimit()}"> Limit number of live entries</label><label ?hidden="{{!entryLimitEnabled}}">Maximum live entries <input name="maxEntries" type="number" min="1" step="1" value="10000" required ?disabled="{{!entryLimitEnabled}}"></label><p class="field-help">No entry limit by default. With a limit, older completed entries drop off; active requests can temporarily exceed it. Imported traces are unaffected.</p><label>Circular buffer limit <select name="bufferMode" aria-label="Circular buffer limit" @change="{updateBufferMode()}"><option value="automatic">Automatic — half installed RAM</option><option value="custom">Custom maximum</option><option value="unlimited">No max size (writes to disk)</option></select></label><label ?hidden="{{bufferMode != 'custom'}}">Maximum size (GiB) <input name="bufferSize" type="number" min="0.001" max="1048576" step="any" value="1" required ?disabled="{{bufferMode != 'custom'}}"></label><p class="field-help">{{bufferSummary}}</p><p class="field-help">Older completed bodies are removed as the buffer fills. Limits up to half installed RAM stay in memory; larger or unlimited limits write to disk. Saving a trace or starting a recording writes a file. Changes apply to new bodies; existing memory bodies are never moved to disk.</p><label><input name="requestBodies" type="checkbox" checked> Keep request bodies for copying and replay</label><label>Request body limit <select name="requestBodyLimit" aria-label="Request body limit" @change="{updateRequestBodyLimit()}"><option value="25000000">25 MB per request (default)</option><option value="unlimited">Unlimited (circular buffer limit still applies)</option><option value="custom">Custom limit</option></select></label><label ?hidden="{{requestBodyMode != 'custom'}}">Limit (MB) <input name="customRequestBodyLimit" type="number" min="1" max="1000000" step="any" value="25" required ?disabled="{{requestBodyMode != 'custom'}}"></label><p class="field-help" ?hidden="{{requestBodyMode != 'custom'}}">From 1 MB to 1,000,000 MB (1 TB). Decimal values are allowed; 1 MB is 1,000,000 bytes.</p><label><input name="defaultBodies" type="checkbox" checked> Keep response bodies for inspection and reuse</label><label><input name="captureBodies" type="checkbox" checked> Include request and response bodies by default when recording</label><p class="field-help">TMCap files use the request body limit above and have no file-size ceiling. Forwarding continues when capture retention reaches its limit.</p></fieldset>
      <fieldset ?disabled="{{settingsBusy || !proxyReady || !settingsLoaded}}"><legend>Privacy</legend><label><input name="redactHeaders" type="checkbox"> Redact Authorization, Proxy-Authorization, Cookie and Set-Cookie values</label><p class="field-help">Off by default. When enabled, applies to newly received headers in Traffic and recordings. Header names and original sizes remain available. Existing captures keep their recorded values.</p><label><input name="rememberArtifacts" type="checkbox"> Remember recent artifact paths locally</label><label><input name="supportPaths" type="checkbox"> Allow sharing saved file locations in support bundles</label><p class="field-help">Allows the Support page to include remembered capture and export filenames and folders when you check its file-location option. These paths may reveal your username or project names; file contents are never included.</p><p class="field-help">Traffic is kept only for this app session unless you save a trace or explicitly record to a file.</p></fieldset>
     </div>
     <footer class="settings-save">
      <div class="actions"><button type="submit" ?disabled="{{!proxyReady || !settingsLoaded || settingsBusy || proxyPending || !settingsDirty}}">Save settings</button><button type="button" class="secondary" @click="{loadSettings('preferences')}" ?disabled="{{!proxyReady || !settingsLoaded || settingsBusy || proxyPending || !settingsDirty}}">Revert changes</button><span role="status">{{settingsText}}</span></div>
      <div class="settings-load-error" ?hidden="{{!settingsLoadError}}"><p class="field-error" role="status">{{settingsLoadError}}</p><button type="button" class="secondary" ?disabled="{{!proxyReady || settingsBusy || proxyPending}}" @click="{retryProductSettings('preferences')}">Retry loading settings</button></div>
      <p class="field-error" role="status" ?hidden="{{!settingsError}}">{{settingsError}}</p>
     </footer>
    </form>
   </section>
   <section ?hidden="{{settingsSection != 'client-certificates'}}">
    <div class="actions"><h2>Client certificates</h2><button type="button" class="secondary compact-button" w-ref="{clientCertificateBackButton}" @click="{backToConnection()}">Back to Connection</button></div>
    <client-certificate-settings w-ref="{clientCertificates}" ?active="{{settingsSection == 'client-certificates'}}"></client-certificate-settings>
   </section>
   <section ?hidden="{{settingsSection != 'connection'}}" class="connection-panel settings-editor" @keydown="{settingsKeyboard(e, 'connection')}">
    <div class="settings-fields connection-fields">
     <section aria-labelledby="proxy-setup-heading">
      <h2 id="proxy-setup-heading">Proxy setup</h2>
      <div class="actions">
       <proxy-toggle lifecycle="{{proxyLifecycle}}" pending="{{proxyPending}}" ?ready="{{proxyReady && !routingSavePending && !settingsBusy}}" @toggle-proxy="{toggleProxy()}"></proxy-toggle>
       <button type="button" class="secondary" ?hidden="{{!hostRecoveryPending}}" ?disabled="{{!proxyReady || proxyPending || settingsBusy || routingSavePending}}" @click="{recoverProxy()}">Recover host settings</button>
      </div>
      <output class="operation-status" data-kind="{{proxyKind}}" aria-live="polite" ?hidden="{{!proxyText}}">{{proxyText}}</output>
      <p class="field-help"><if condition="connectionUsesSystemProxy">System proxy runs apply the current-user Windows proxy settings and restore them when you stop or close Transmog.</if><if condition="!connectionUsesSystemProxy">Set the HTTP and HTTPS proxy in the app you want to inspect. <span ?hidden="{{!listenerOnAllInterfaces}}">From another device, use this computer’s LAN address and the same port.</span></if></p>
      <details class="connection-advanced" w-ref="{listenerOptions}">
       <summary>Advanced proxy setup</summary>
       <fieldset class="connection-controls" aria-label="Proxy listener" ?disabled="{{!proxyReady || settingsBusy || !settingsLoaded}}" @input="{markConnectionDirty('listener')}" @change="{markConnectionDirty('listener')}">
        <label><input name="allowRemoteClients" form="connection-form" type="checkbox"> Allow remote computers to connect</label>
        <label><input name="customProxyPort" form="connection-form" type="checkbox" @change="{updateProxyPortMode()}"> Use a specific proxy port</label>
        <label ?hidden="{{!customPortEnabled}}">Proxy port <input name="proxyPort" form="connection-form" type="number" min="1" max="65535" step="1" value="8080" required ?disabled="{{!customPortEnabled}}" @invalid="{showInvalidPort()}"></label>
        <p class="field-help">Remote access and port changes apply on the next new proxy start. Automatic port selection uses an available port.</p>
       </fieldset>
       <div class="loopback-settings">
        <p class="field-help">Windows apps in AppContainers need a loopback exemption to use the proxy.</p>
        <button type="button" class="secondary" @click="{openLoopback(e)}">Manage loopback exemptions…</button>
       </div>
      </details>
     </section>
     <section aria-labelledby="traffic-inspection-heading">
      <h2 id="traffic-inspection-heading">Traffic inspection</h2>
      <fieldset class="connection-controls" aria-label="Inspection policy" ?disabled="{{!proxyReady || settingsBusy || !settingsLoaded}}">
       <label class="decrypt-https"><input w-ref="{decryptInput}" name="decryptHttps" form="connection-form" ?disabled="{{!proxyReady || settingsBusy || routingSavePending || proxyPending}}" @change="{markConnectionDirty('https')}" type="checkbox" checked> Decrypt HTTPS traffic</label>
       <p class="field-help">Save applies to new HTTPS connections. In-flight requests finish.</p>
       <details class="https-disclosure"><summary>HTTPS tunnel mode</summary><p class="field-help">With decryption off, HTTPS uses encrypted tunnels and records the destination and outcome for selected processes. Plain HTTP is still inspected. Existing tunnels stay encrypted until the client reconnects.</p></details>
      </fieldset>
      <form class="certificate-form" w-ref="{proxyForm}">
       <fieldset class="certificate-controls" aria-label="Interception certificate setup" ?disabled="{{!proxyReady || settingsBusy || routingSavePending}}">
        <div class="actions">
         <if condition="!certificateDetailsOpen">
          <if condition="!certificateReady || httpsEnableError">
           <if condition="!certificateRecovery"><button type="button" ?disabled="{{proxyPending}}" @click="{setupCa()}"><if condition="connectionUsesSystemProxy">Set up HTTPS interception</if><if condition="!connectionUsesSystemProxy">Create interception certificate</if></button></if>
           <if condition="certificateRecovery"><button type="button" ?disabled="{{proxyPending || proxyLifecycle == 'running' || proxyLifecycle == 'draining' || proxyLifecycle == 'stopping'}}" @click="{resetCa()}">Reset certificate and set up again</button></if>
          </if>
         </if>
         <button type="button" class="secondary" ?hidden="{{!interceptionCertificateUnavailable || proxyLifecycle == 'running' || proxyLifecycle == 'draining' || proxyLifecycle == 'stopping'}}" ?disabled="{{proxyPending}}" @click="{startHttpsTunnels()}">Start with HTTPS tunnels</button>
        </div>
        <details class="interception-certificate" ?open="{{certificateDetailsOpen}}" @toggle="{certificateDisclosureChanged(e)}"><summary w-ref="{interceptionSummary}">Interception certificate</summary>
        <p class="field-help">{{interceptionCertificateStatus}}</p>
        <div class="actions"><if condition="publicCertificateAvailable"><button type="button" class="secondary" ?disabled="{{proxyPending}}" @click="{copyPublicCertificatePath()}">Copy public certificate path</button><button type="button" class="secondary" aria-disabled="{{windowsCertificateTrusted}}" ?disabled="{{proxyPending}}" @click="{installCa()}"><if condition="windowsCertificateTrusted">Trusted for this Windows account</if><if condition="!windowsCertificateTrusted">Trust for my Windows account…</if></button></if>
         <if condition="!publicCertificateAvailable && !certificateRecovery"><button type="button" ?disabled="{{proxyPending}}" @click="{setupCa()}"><if condition="connectionUsesSystemProxy">Set up interception certificate</if><if condition="!connectionUsesSystemProxy">Create interception certificate</if></button></if><button type="button" class="secondary" ?disabled="{{proxyPending}}" @click="{removeCa()}">Remove exact CA</button><button type="button" class="secondary" ?disabled="{{proxyPending || proxyLifecycle == 'running' || proxyLifecycle == 'draining' || proxyLifecycle == 'stopping'}}" @click="{resetCa()}">Reset certificate and set up again</button>
        </div>
        <label>Public CA certificate <input value="{{certificatePath}}" name="certificate" ?readonly="{{proxyPending}}" required></label>
        <label>CA private key <input value="{{privateKeyPath}}" name="privateKey" ?readonly="{{proxyPending}}" required></label>
        <label>CA SHA-256 <input value="{{caSha256}}" name="thumbprint" ?readonly="{{proxyPending}}" pattern="[0-9A-Fa-f]{64}" placeholder="Recorded certificate thumbprint"></label>
       </details>
       </fieldset>
      </form>
      <fieldset class="connection-controls process-settings" aria-label="Process inspection" ?disabled="{{!proxyReady || settingsBusy || !settingsLoaded}}">
       <process-inspection-settings w-ref="{processInspectionEditor}" @process-inspection-change="{markConnectionDirty('processes')}"></process-inspection-settings>
      </fieldset>
     </section>
     <section aria-labelledby="outbound-connections-heading">
      <h2 id="outbound-connections-heading">Outbound connections</h2>
      <network-profile-settings></network-profile-settings>
      <fieldset class="connection-controls outbound-isolation" aria-label="Outbound connection isolation" ?disabled="{{!proxyReady || settingsBusy || !settingsLoaded}}">
       <label><input name="isolateOutbound" form="connection-form" type="checkbox" checked @change="{markConnectionDirty('isolation')}"> Isolate outbound connections by caller process</label>
       <p class="field-help">Applies to later requests. Also separates HTTP/2 browser sessions. Uses the caller’s source IP when its process is unavailable.</p>
      </fieldset>
      <button w-ref="{clientCertificateSettingsButton}" type="button" class="secondary" @click="{openClientCertificateSettings()}">Client certificates…</button>
      <p class="field-help">Client certificates authenticate Transmog to servers.</p>
     </section>
    </div>
    <form id="connection-form" w-ref="{connectionForm}" class="settings-save" @submit="{saveSettings(e, 'connection')}">
     <div class="actions"><button type="submit" ?disabled="{{!proxyReady || !settingsLoaded || settingsBusy || proxyPending || !connectionDirty}}">Save settings</button><button type="button" class="secondary" @click="{loadSettings('connection')}" ?disabled="{{!proxyReady || !settingsLoaded || settingsBusy || proxyPending || !connectionDirty}}">Revert changes</button><span role="status">{{connectionText}}</span></div>
     <div class="settings-load-error" ?hidden="{{!settingsLoadError}}"><p class="field-error" role="status">{{settingsLoadError}}</p><button type="button" class="secondary" ?disabled="{{!proxyReady || settingsBusy || proxyPending}}" @click="{retryProductSettings('connection')}">Retry loading settings</button></div>
     <p class="field-error" role="status" ?hidden="{{!connectionError}}">{{connectionError}}</p>
     <button type="button" class="secondary compact-button" ?hidden="{{!httpsEnableError}}" @click="{openInterceptionCertificate()}">Interception certificate…</button>
    </form>
   </section>
   <section ?hidden="{{settingsSection != 'about'}}" class="about-panel"><h2>Transmog</h2><p>A workbench for recording, inspecting and editing HTTP traffic.</p><p><a href="https://transmog.net" @click="{openWebsite(e)}">transmog.net</a></p><app-updates w-ref="{aboutUpdates}"></app-updates><button type="button" class="secondary" @click="{showCredits()}">Credits</button></section>
   <section ?hidden="{{settingsSection != 'support'}}"><h2>Diagnostics and support</h2><form w-ref="{supportForm}" @submit="{createSupportBundle(e)}"><p class="field-help">Save diagnostics, app version and settings to a ZIP file you can share. Captured headers and bodies are excluded. Choose its destination when creating the bundle.</p><label><input name="includePaths" type="checkbox" ?disabled="{{supportBusy || !supportPathsAllowed}}"> Include remembered capture and export file locations</label><p class="field-help" ?hidden="{{supportPathsAllowed}}">File-location sharing is off. Enable “Allow sharing saved file locations in support bundles” in Preferences → Privacy, then save settings.</p><div class="actions"><button type="submit" ?disabled="{{supportBusy}}">Create support bundle…</button><button type="button" class="secondary" @click="{refreshDiagnostics()}" ?disabled="{{supportBusy}}">Refresh diagnostics</button><button type="button" class="secondary" @click="{prepareUpdate()}" ?disabled="{{supportBusy}}">Prepare for update</button></div></form><output class="operation-status" aria-live="polite">{{supportText}}</output><dl data-copy-surface class="support-facts" ?hidden="{{!supportFacts.length}}"><for each="fact in supportFacts"><div key="{{fact.label}}"><dt>{{fact.label}}</dt><dd tabindex="0">{{fact.value}}</dd></div></for></dl><details><summary>Technical details and log location</summary><p>Diagnostic log: <code data-copy-surface>{{diagnosticsPathText}}</code></p><pre data-copy-surface tabindex="0">{{supportDetails}}</pre></details></section>
  </div>
 </div>
</section>
<dialog w-ref="{creditsDialog}" class="credits-dialog" aria-labelledby="credits-heading">
 <h2 id="credits-heading">Credits and third-party notices</h2><p role="status">{{creditsStatus}}</p>
 <p>Expand a dependency to read its license and copyright notices.</p>
 <div class="credits-scroll"><details><summary>Dependency inventory and bundled native code</summary><pre tabindex="0" data-copy-surface>{{creditsSummary}}</pre></details><for each="credit in credits"><details key="{{credit.id}}"><summary>{{credit.name}} {{credit.version}} · {{credit.license}}</summary><pre tabindex="0" data-copy-surface>{{credit.text}}</pre></details></for></div>
 <footer class="actions"><button type="button" class="secondary" @click="{closeCredits()}">Close</button></footer>
<inspection-copy-menu></inspection-copy-menu></dialog>
<loopback-exemptions w-ref="{loopbackManager}"></loopback-exemptions>
</template>
