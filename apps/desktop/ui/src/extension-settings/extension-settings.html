<template>
<section aria-labelledby="extensions-heading" class="extension-panel">
 <header class="extension-panel-heading"><h2 id="extensions-heading">Extensions</h2>
 <div class="actions extension-actions"><button type="button" @click="{install()}" ?disabled="{{extensionsBusy || extensionsBlocked}}">Install extension…</button><button type="button" class="secondary" @click="{unpacked()}" ?disabled="{{extensionsBusy || extensionsBlocked}}">Load unpacked…</button><button type="button" class="secondary" @click="{refresh()}" ?disabled="{{extensionsBusy}}">Refresh</button></div></header>
 <p class="field-help">Install read-only visualizers and header classification columns. Scripts run only when you choose a visualizer, with no network access.</p>
 <div class="extension-feedback"><output role="status" aria-live="polite">{{extensionsText}}</output><button type="button" class="secondary compact-button" ?hidden="{{!extensionsText && !extensionsError}}" @click="{dismiss()}" ?disabled="{{extensionsBusy}}">Dismiss</button></div>
 <p role="status" class="field-error" ?hidden="{{!extensionsError}}">{{extensionsError}}</p>
 <p role="status" class="field-error" ?hidden="{{!extensionsWarning}}">{{extensionsWarning}}</p>
 <p ?hidden="{{!extensionsLoaded || extensionsEntries.length || extensionsWarning}}" class="field-help">No extensions installed. Install a .tmext package or load an unpacked development folder.</p>
 <div class="extension-list" aria-busy="{{extensionsBusy}}">
  <for each="extension in extensionsEntries"><article key="{{extension.id}}" class="extension-entry" aria-label="{{extension.name}}">
   <div class="extension-heading"><div><h3>{{extension.name}}</h3><p class="extension-origin">{{extension.version}} · {{extension.origin}}</p></div><label class="extension-enable"><input type="checkbox" ?checked="{{extension.enabled}}" aria-label="Enable {{extension.name}}" @change="{enabled(extension.id,e)}" ?disabled="{{extensionsBusy || extensionsBlocked}}"> Enabled</label><button type="button" class="secondary" aria-label="Uninstall {{extension.name}}" ?hidden="{{extension.bundled}}" @click="{uninstall(extension.id)}" ?disabled="{{extensionsBusy || extensionsBlocked}}">Uninstall</button></div>
   <if condition="extension.development"><div class="extension-development"><label class="extension-reload"><input type="checkbox" ?checked="{{extension.hotReload}}" aria-label="Hot reload {{extension.name}}" @change="{hotReload(extension.id,e)}" ?disabled="{{extensionsBusy || extensionsBlocked}}"> Hot reload active visualizers</label><button type="button" class="secondary compact-button" aria-label="Reload active visualizers for {{extension.name}}" @click="{reload(extension.id)}" ?disabled="{{extensionsBusy || extensionsBlocked || !extension.enabled}}">Reload active visualizers</button><button type="button" class="secondary compact-button" aria-label="Package {{extension.name}}" @click="{package(extension.id)}" ?disabled="{{extensionsBusy || extensionsBlocked}}">Package extension…</button></div></if>
   <details class="extension-declarations"><summary>Visualizers and declared inputs</summary>
    <button type="button" class="secondary compact-button" aria-label="Save {{extension.name}} to folder" @click="{exportFolder(extension.id)}" ?disabled="{{extensionsBusy || extensionsBlocked}}">Save to folder…</button>
    <if condition="extension.development"><p class="field-help">Source changes reload all active instances in every window when hot reload is on. Hidden visualizers stay unloaded.</p><p class="extension-folder"><code>{{extension.directory}}</code></p></if>
    <p class="extension-id"><code>{{extension.id}}</code> · {{extension.runtime}}</p>
    <for each="visualizer in extension.visualizers"><section key="{{visualizer.id}}" class="extension-contribution"><h4>{{visualizer.name}} <span>{{visualizer.surfaces}}</span></h4><dl><dt>Request headers</dt><dd><code>{{visualizer.requestHeaders}}</code></dd><dt>Request body</dt><dd>{{visualizer.requestBody}}</dd><dt>Response headers</dt><dd><code>{{visualizer.responseHeaders}}</code></dd><dt>Response body</dt><dd>{{visualizer.responseBody}}</dd><dt>Matching messages</dt><dd><if condition="visualizer.matches.length > 2"><details class="extension-matches"><summary>{{visualizer.matches.length}} matching rules</summary><for each="match in visualizer.matches"><p>{{match}}</p></for></details></if><if condition="visualizer.matches.length <= 2"><for each="match in visualizer.matches"><p>{{match}}</p></for></if></dd><dt>Live updates</dt><dd>{{visualizer.live}}</dd><dt>Related context</dt><dd>{{visualizer.context}}</dd></dl></section></for>
    <p class="extension-id">Revision <code>{{extension.revision}}</code></p>
   </details>
   <if condition="extension.columns.length"><details class="extension-declarations"><summary>Traffic columns and header rules</summary><p class="field-help">Fixed labels from retained headers. No body access or extension scripts.</p><for each="column in extension.columns"><section key="{{column.id}}" class="extension-contribution"><h4>{{column.name}}</h4><dl><dt>Request headers</dt><dd><code>{{column.requestHeaders}}</code></dd><dt>Response headers</dt><dd><code>{{column.responseHeaders}}</code></dd><for each="value in column.values"><dt>{{value.value}}</dt><dd><for each="match in value.matches"><p>{{match}}</p></for></dd></for></dl></section></for></details></if>
  </article></for>
 </div>
 <p class="field-help extension-help">Disabling stops active visualizers in every window. Uninstalling an unpacked extension leaves its source files in place.</p>
</section>
</template>
