<template>
  <section class="certificate-inspector">
    <label>Connection<select aria-label="Certificate connection" @change="{changeConnection(e)}" ?disabled="{{certificateBusy}}"><for each="connection in certificateConnections"><option key="{{connection.id}}" value="{{connection.id}}" ?selected="{{connection.selected}}">{{connection.title}}</option></for></select></label>
    <div class="certificate-scroll">
      <if condition="certificateConnectionSummary"><p class="certificate-tls-summary" aria-label="Recorded TLS summary">{{certificateConnectionSummary}}</p></if>
      <p class="field-help">Verification and trust describe the original connection. Opening this viewer does not verify the chain against this computer’s current trust.</p>
      <for each="error in certificateErrors"><p key="{{error.id}}" class="certificate-error">{{error.text}}</p></for>
      <details ?hidden="{{section == 'certificates'}}" ?open="{{section == 'connection' || !certificateServerChain.length}}"><summary>Negotiation and verification</summary><dl data-copy-surface class="certificate-facts"><for each="field in certificateConnectionFields"><div key="{{field.id}}"><dt>{{field.label}}</dt><dd tabindex="0">{{field.displayValue}}<if condition="field.displayNote"><small>{{field.displayNote}}</small></if></dd></div></for></dl></details>
      <if condition="alpsRecorded"><details class="certificate-alps" ?hidden="{{section == 'certificates'}}"><summary>Server ALPS contents · {{alpsPeerBytes}} bytes</summary><p class="field-help">Received during TLS negotiation. Client Hint preferences are shown for inspection and do not change forwarded requests.</p><for each="note in alpsNotes"><p key="{{note.id}}" class="certificate-error">{{note.text}}</p></for><dl data-copy-surface class="certificate-facts"><for each="field in alpsFields"><div key="{{field.id}}"><dt>{{field.label}}</dt><dd tabindex="0">{{field.displayValue}}<if condition="field.displayNote"><small>{{field.displayNote}}</small></if></dd></div></for></dl><if condition="alpsHex"><details class="certificate-alps-raw" ?open="{{alpsHexOpen}}" @toggle="{toggleAlpsHex(e)}"><summary>Original ALPS bytes (Hex)</summary><if condition="alpsHexOpen"><div class="certificate-hex"><hex-viewer :preview="{{alpsHex}}"></hex-viewer></div></if></details></if></details></if>
      <if condition="certificatePolicyFields.length"><details ?hidden="{{section == 'certificates'}}"><summary>Connection and recorded policy</summary><dl data-copy-surface class="certificate-facts"><for each="field in certificatePolicyFields"><div key="{{field.id}}"><dt>{{field.label}}</dt><dd tabindex="0">{{field.displayValue}}<if condition="field.displayNote"><small>{{field.displayNote}}</small></if></dd></div></for></dl></details></if>
      <if condition="certificateDiagnosticFields.length"><details ?hidden="{{section == 'certificates'}}"><summary>Additional recorded metadata</summary><dl data-copy-surface class="certificate-facts"><for each="field in certificateDiagnosticFields"><div key="{{field.id}}"><dt>{{field.label}}</dt><dd tabindex="0">{{field.displayValue}}<if condition="field.displayNote"><small>{{field.displayNote}}</small></if></dd></div></for></dl></details></if>
      <div ?hidden="{{section == 'connection'}}"><if condition="certificateServerChain.length"><h3>Server certificate chain</h3><div class="certificate-chain"><for each="certificate in certificateServerChain"><button key="{{certificate.id}}" type="button" class="secondary" ?data-selected="{{certificate.selected}}" @click="{selectCertificate(certificate.id)}">{{certificate.label}}</button></for></div></if>
      <if condition="certificateClientChain.length"><h3>Client authentication certificate chain</h3><div class="certificate-chain"><for each="certificate in certificateClientChain"><button key="{{certificate.id}}" type="button" class="secondary" ?data-selected="{{certificate.selected}}" @click="{selectCertificate(certificate.id)}">{{certificate.label}}</button></for></div></if>
      <h3 class="certificate-subject">{{certificateSubject}}</h3><if condition="certificateUnavailable"><p>{{certificateUnavailable}}</p></if>
      <nav class="certificate-tabs" aria-label="Certificate representation"><button type="button" class="secondary" ?data-selected="{{certificateTab == 'details'}}" @click="{showTab('details')}">Details</button><button type="button" class="secondary" ?data-selected="{{certificateTab == 'pem'}}" ?disabled="{{!certificateHasBytes}}" @click="{showTab('pem')}">PEM</button><button type="button" class="secondary" ?data-selected="{{certificateTab == 'hex'}}" ?disabled="{{!certificateHasBytes}}" @click="{showTab('hex')}">Hex</button></nav>
      <div w-ref="{certificateRepresentation}" class="certificate-representation"><if condition="certificateTab == 'details'"><dl data-copy-surface class="certificate-facts"><for each="field in certificateFields"><div key="{{field.id}}"><dt>{{field.label}}</dt><dd tabindex="0">{{field.displayValue}}<if condition="field.displayNote"><small>{{field.displayNote}}</small></if></dd></div></for></dl></if>
      <if condition="certificateTab == 'pem'"><pre data-copy-surface class="certificate-pem" tabindex="0">{{certificatePem}}</pre></if>
      <if condition="certificateTab == 'hex'"><div class="certificate-hex"><hex-viewer :preview="{{certificateHex}}"></hex-viewer></div></if></div>
      </div>
    </div>
    <p role="status">{{certificateStatus}}</p><button type="button" class="secondary compact-button" ?hidden="{{section == 'connection'}}" @click="{copyPem()}" ?disabled="{{!certificateHasBytes || certificateBusy}}">Copy PEM</button>
  </section>
</template>
