<template>

<section class="incident-intake" aria-label="Trace markers">

 <div class="marker-review-grid">
  <div class="incident-marker-list" aria-label="Markers"><for each="marker in intakeMarkers"><button key="{{marker.id}}" type="button" class="marker-location secondary" ?data-selected="{{marker.id == selectedMarkerId}}" aria-label="Go to {{marker.timeLabel}}" @click="{selectMarker(marker.id)}"><strong>{{marker.timeLabel}}</strong><span>{{marker.note}}</span><if condition="!marker.note"><span>No note</span></if></button></for><if condition="!intakeMarkers.length"><p>No markers in this trace.</p></if></div>
  <div class="marker-detail"><if condition="activeMarker.id"><small>{{activeMarker.originLabel}}<if condition="activeMarker.edited"> · Edited note</if></small><if condition="!editingMarkerId"><p class="marker-note">{{activeMarker.note}}<if condition="!activeMarker.note">No note</if></p><div class="marker-actions"><button type="button" class="secondary compact-button" @click="{showMarker(activeMarker.id)}" ?disabled="{{intakeBusy}}">Show nearby requests</button><button type="button" class="secondary compact-button" @click="{editMarker(activeMarker.id)}" ?disabled="{{intakeBusy}}">Edit note</button><details><summary>More</summary><button type="button" class="secondary compact-button" @click="{changeMarker('edit',activeMarker.id,'')}" ?disabled="{{intakeBusy}}">Clear note</button><button type="button" class="secondary compact-button" @click="{changeMarker('delete',activeMarker.id)}" ?disabled="{{intakeBusy}}">Delete marker</button></details></div></if></if>
  <if condition="editingMarkerId"><div class="marker-editor"><label>Note<textarea aria-label="Note" w-ref="{markerEditor}" rows="2" @input="{draftInput(e)}">{{markerDraft}}</textarea></label><div class="marker-actions"><button type="button" @click="{applyPending()}" ?disabled="{{intakeBusy}}">Apply</button><button type="button" class="secondary" @click="{cancelEdit()}" ?disabled="{{intakeBusy}}">Cancel</button></div></div></if></div>
 </div>
 <div class="marker-actions marker-shared-actions"><button type="button" class="secondary compact-button" @click="{showMarker('')}" ?disabled="{{intakeBusy || !traceId}}">Show full trace</button><button type="button" class="secondary compact-button" @click="{changeMarker('undo')}" ?disabled="{{intakeBusy || !markerCanUndo}}">Undo</button><details><summary>Time range</summary><div class="incident-window-controls"><label>Before (seconds)<input type="number" min="0" max="86400" value="{{incidentBefore}}" @input="{setInterval('before',e)}"></label><label>After (seconds)<input type="number" min="0" max="86400" value="{{incidentAfter}}" @input="{setInterval('after',e)}"></label><label><input type="checkbox" ?checked="{{incidentRelevantOnly}}" @change="{setRelevant(e)}" ?disabled="{{!intakeHosts.length}}"> Suggested hosts only</label></div></details><span role="status">{{intakeStatus}}</span>
 <details><summary>Capture details</summary><if condition="intakeTitle"><h3>{{intakeTitle}}</h3></if><if condition="intakeInstructions"><p class="incident-instructions">{{intakeInstructions}}</p></if><ol><for each="step in intakeSteps"><li key="{{step.id}}">{{step.text}}</li></for></ol><dl><for each="fact in intakeFacts"><div key="{{fact.label}}"><dt>{{fact.label}}</dt><dd>{{fact.value}}</dd></div></for></dl><if condition="intakeHosts.length"><p>Suggested hosts:</p><ul><for each="host in intakeHosts"><li key="{{host.id}}">{{host.text}}</li></for></ul></if><p>{{intakeNote}}</p></details></div>
</section>
</template>
