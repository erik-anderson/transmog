<template>
<section class="incident-intake" aria-label="Incident intake">
 <h3>{{intakeTitle}}</h3><p role="status">{{intakeStatus}}</p>
 <if condition="intakeInstructions"><p class="incident-instructions">{{intakeInstructions}}</p></if>
 <if condition="intakeSteps.length"><ol><for each="step in intakeSteps"><li key="{{step.id}}">{{step.text}}</li></for></ol></if>
 <if condition="intakeMarkers.length"><div class="incident-window-controls"><label>Seconds before<input type="number" min="0" max="86400" value="{{incidentBefore}}" @input="{setInterval('before',e)}"></label><label>Seconds after<input type="number" min="0" max="86400" value="{{incidentAfter}}" @input="{setInterval('after',e)}"></label></div><label><input type="checkbox" ?checked="{{incidentRelevantOnly}}" @change="{setRelevant(e)}" ?disabled="{{!intakeHosts.length}}"> Limit navigation to relevant-host hints</label><p class="field-help">This restricts inspection of saved evidence. The profile did not restrict which traffic was recorded.</p><div class="incident-marker-list"><for each="marker in intakeMarkers"><article key="{{marker.id}}"><strong>{{marker.timeLabel}}</strong><small>{{marker.originLabel}}</small><p>{{marker.note}}</p><button type="button" class="secondary compact-button" @click="{showMarker(marker.id)}">Show surrounding requests</button></article></for></div></if>
 <button type="button" class="secondary compact-button" @click="{showMarker('')}" ?disabled="{{intakeBusy || !traceId}}">Show source traffic</button>
 <details><summary>Collection context and limitations</summary><dl><for each="fact in intakeFacts"><div key="{{fact.label}}"><dt>{{fact.label}}</dt><dd>{{fact.value}}</dd></div></for></dl><if condition="intakeHosts.length"><p>Advisory relevant hosts:</p><ul><for each="host in intakeHosts"><li key="{{host.id}}">{{host.text}}</li></for></ul></if><p>{{intakeNote}}</p></details>
</section>
</template>
