<template>
<section class="debugger" aria-label="Script debugger" tabindex="0" @keydown="{keyboard(e)}">
 <header><div><h3>{{sessionInfo.mode}} · {{sessionInfo.label}}</h3><p role="status">{{status}}</p><p>{{lease}}</p><if condition="outdated"><p>Draft edits are newer than this executing snapshot. Close and Debug test again to run them.</p></if></div><button type="button" class="secondary" @click="{close()}">Close debugger</button></header>
 <div class="debug-controls actions"><button type="button" ?disabled="{{!paused || closed}}" @click="{resume('continue')}">Continue <kbd>F5</kbd></button><button type="button" class="secondary" ?disabled="{{!paused || closed}}" @click="{resume('over')}">Step over <kbd>F10</kbd></button><button type="button" class="secondary" ?disabled="{{!paused || closed}}" @click="{resume('into')}">Step into <kbd>F11</kbd></button><button type="button" class="secondary" ?disabled="{{!paused || closed}}" @click="{resume('out')}">Step out <kbd>Shift F11</kbd></button><button type="button" class="secondary" ?disabled="{{closed}}" @click="{stop()}">Stop <kbd>Shift F5</kbd></button><button type="button" class="secondary" ?disabled="{{closed || !attached || !idle}}" @click="{detach()}">Detach</button><label>Exceptions <select ?disabled="{{closed}}" value="{{exceptions}}" @change="{policy(e)}"><option value="none">Do not pause</option><option value="uncaught">Uncaught</option><option value="all">All</option></select></label></div>
 <if condition="issue"><p role="alert">{{issue}}</p></if>
 <div class="debug-grid"><section class="debug-source" aria-label="Executing source"><label>Source <select value="{{sourceName}}" @change="{changeSource(e)}"><option value="{{sessionInfo.source}}">{{sessionInfo.source}}</option><for each="source in sources"><option value="{{source.source}}">{{source.source}}</option></for></select></label><p>{{sourceStatus}}</p><div class="source-code" tabindex="0" data-copy-surface><for each="line in sourceLines"><div class="{{line.className}}"><button type="button" class="gutter" aria-label="Toggle breakpoint at line {{line.number}}" aria-pressed="{{line.breakpoint}}" title="{{line.breakpointStatus}}" ?disabled="{{closed || !attached}}" @click="{toggleBreakpoint(line.number)}"><span aria-hidden="true"><if condition="line.bound">●</if><if condition="line.pending">○</if><if condition="!line.breakpoint">{{line.number}}</if></span></button><code>{{line.text}}<if condition="line.shortened"> … [line shortened]</if></code></div></for></div><div class="actions"><button type="button" class="secondary" ?disabled="{{!previousSource}}" @click="{sourcePrevious()}">Previous source lines</button><button type="button" class="secondary" ?disabled="{{!nextSource}}" @click="{sourceNext()}">Next source lines</button><span>{{breakpointCount}} requested breakpoints</span></div><details><summary>Breakpoint resolution</summary><if condition="!resolutions.length"><p>No resolved breakpoints yet. Click a source gutter to request one.</p></if><for each="resolution in resolutions"><p>{{resolution.label}}</p></for></details></section>
 <section class="debug-values" aria-label="Stack and variables"><h4>Call stack</h4><if condition="!frames.length"><p>Stack frames appear when execution pauses.</p></if><if condition="frameLimit"><p>Additional frames omitted at the stack limit.</p></if><ol><for each="frame in frames"><li><button type="button" class="secondary frame" aria-pressed="{{frame.selected}}" ?disabled="{{!paused}}" @click="{selectFrame(frame.index)}">{{frame.label}}<if condition="frame.unavailable"> · some scopes unavailable</if></button></li></for></ol><h4>Lexical scopes</h4><div class="scopes"><for each="scope in scopes"><button type="button" class="secondary" aria-pressed="{{scope.selected}}" ?disabled="{{!scope.available || !paused}}" @click="{selectScope(scope)}">{{scope.label}}</button></for></div><p>{{valuesLabel}}</p><p class="field-help">Read-only own data properties. Accessors, proxies and optimized values may be unavailable.</p><div class="property-page" tabindex="0"><table><thead><tr><th>Name</th><th>Type</th><th>Value</th></tr></thead><tbody><for each="property in properties"><tr><td>{{property.name}}</td><td class="value-type">{{property.value.kind}}</td><td><if condition="property.expandable"><button type="button" class="secondary" @click="{expand(property)}">{{property.value.display}}</button></if><if condition="!property.expandable">{{property.value.display}}</if><if condition="property.value.truncated"> … [shortened]</if></td></tr></for></tbody></table></div><div class="actions"><button type="button" class="secondary" ?disabled="{{!canBack || !paused}}" @click="{back()}">Parent value</button><button type="button" class="secondary" ?disabled="{{!nextProperties || !paused}}" @click="{moreProperties()}">Next properties</button></div></section></div>
 <script-diagnostics :evidence="{{details}}"></script-diagnostics><if condition="result"><details><summary>Test result</summary><pre tabindex="0" data-copy-surface>{{result}}</pre></details></if>
</section>
</template>
