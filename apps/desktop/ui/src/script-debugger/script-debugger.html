<template>
<dialog w-ref="{surface}" class="debugger" aria-label="Script debugger" tabindex="-1" @cancel="{hide(e)}" @keydown="{keyboard(e)}">
 <header class="debug-heading"><h3>{{sessionInfo.mode}} · {{sessionInfo.label}}</h3><button type="button" class="secondary compact-button" @click="{hide()}">Return to editor</button><span class="debug-tool"><button type="button" class="secondary debug-icon-button" aria-label="{{closeLabel}}" ?disabled="{{busy}}" @click="{close()}"><debug-icon name="close" aria-hidden="true"></debug-icon></button><span class="debug-tooltip" role="tooltip"><if condition="closed">Close debugger</if><if condition="!closed">Stop and close debugger · aborts active work</if></span></span></header>
 <div class="debug-controls" role="toolbar" aria-label="Debugger controls">
  <span class="debug-tool"><button type="button" class="secondary debug-icon-button debug-continue" aria-label="Continue (F8)" ?disabled="{{!paused || closed || busy}}" @click="{resume('continue')}"><debug-icon name="continue" aria-hidden="true"></debug-icon></button><span class="debug-tooltip" role="tooltip">Continue <kbd>F8</kbd> / <kbd>Ctrl+\</kbd> (also F5)</span></span>
  <span class="debug-tool"><button type="button" class="secondary debug-icon-button" aria-label="Step over (F10)" ?disabled="{{!paused || closed || busy}}" @click="{resume('over')}"><debug-icon name="step-over" aria-hidden="true"></debug-icon></button><span class="debug-tooltip" role="tooltip">Step over <kbd>F10</kbd></span></span>
  <span class="debug-tool"><button type="button" class="secondary debug-icon-button" aria-label="Step into (F11)" ?disabled="{{!paused || closed || busy}}" @click="{resume('into')}"><debug-icon name="step-into" aria-hidden="true"></debug-icon></button><span class="debug-tooltip" role="tooltip">Step into <kbd>F11</kbd></span></span>
  <span class="debug-tool"><button type="button" class="secondary debug-icon-button" aria-label="Step out (Shift+F11)" ?disabled="{{!paused || closed || busy}}" @click="{resume('out')}"><debug-icon name="step-out" aria-hidden="true"></debug-icon></button><span class="debug-tooltip" role="tooltip">Step out <kbd>Shift+F11</kbd></span></span>
  <if condition="restartable"><span class="debug-tool"><button type="button" class="secondary debug-icon-button" aria-label="{{restartLabel}}" ?disabled="{{busy}}" @click="{restart()}"><debug-icon name="restart" aria-hidden="true"></debug-icon></button><span class="debug-tooltip" role="tooltip">{{restartLabel}} · stops this run</span></span></if>
  <span class="debug-tool"><button type="button" class="secondary debug-icon-button" aria-label="Stop (Shift+F5)" ?disabled="{{closed || busy}}" @click="{stop()}"><debug-icon name="stop" aria-hidden="true"></debug-icon></button><span class="debug-tooltip" role="tooltip">Stop <kbd>Shift+F5</kbd> · aborts active work</span></span>
  <span class="debug-tool"><button type="button" class="secondary debug-icon-button" aria-label="Continue and detach" ?disabled="{{closed || !attached || busy || detaching}}" @click="{continueAndDetach()}"><debug-icon name="detach" aria-hidden="true"></debug-icon></button><span class="debug-tooltip" role="tooltip">Continue and detach · finish without further pauses, retain healthy worker</span></span>
  <label>Exceptions <select aria-label="Pause on exceptions" ?disabled="{{closed || detaching}}" value="{{exceptions}}" @change="{policy(e)}"><option value="none">Do not pause</option><option value="uncaught">Uncaught</option><option value="all">All</option></select></label>
 </div>
 <div class="debug-state"><p role="status">{{status}}<if condition="detaching"> · Finishing before detach…</if></p><p class="debug-lease" title="Pause expiry stops active work.">{{lease}}</p><if condition="outdated"><p>Draft edits are newer than this executing snapshot. <if condition="restartable">Restart to run the current draft.</if><if condition="!restartable">Return to editor to save and apply the draft. Applying a revision ends this live debugger.</if></p></if><if condition="issue"><p role="alert">{{issue}}</p></if></div>
 <nav class="debug-tabs" aria-label="Debugger panes"><button type="button" class="secondary" aria-pressed="{{narrowTab == 'source'}}" @click="{selectTab('source')}">Source</button><button type="button" class="secondary" aria-pressed="{{narrowTab == 'variables'}}" @click="{selectTab('variables')}">Stack and variables</button></nav>
 <div class="debug-grid" data-pane="{{narrowTab}}" data-source-share="{{sourceShare}}">
  <section class="debug-source" aria-label="Executing source">
   <label>Source <select aria-label="Source" value="{{sourceName}}" @change="{changeSource(e)}"><option value="{{sessionInfo.source}}">{{sessionInfo.source}}</option><for each="source in sources"><option value="{{source.source}}">{{source.source}}</option></for></select></label><p class="source-status" title="{{sourceStatus}}">{{sourceStatus}}</p>
   <div w-ref="{sourceViewport}" class="source-code" tabindex="0" data-copy-surface><for each="line in sourceLines"><div class="{{line.className}}"><button type="button" class="gutter" aria-label="Toggle breakpoint at line {{line.number}}" aria-pressed="{{line.breakpoint}}" title="{{line.breakpointStatus}}" ?disabled="{{closed || !attached || detaching}}" @click="{toggleBreakpoint(line.number)}"><span aria-hidden="true"><if condition="line.bound">●</if><if condition="line.pending">○</if><if condition="!line.breakpoint">{{line.number}}</if></span></button><code>{{line.text}}<if condition="line.shortened"> … [line shortened]</if></code></div></for></div>
   <div class="source-paging actions"><button type="button" class="secondary compact-button" ?disabled="{{!previousSource}}" @click="{sourcePrevious()}">Previous lines</button><button type="button" class="secondary compact-button" ?disabled="{{!nextSource}}" @click="{sourceNext()}">Next lines</button><span>{{breakpointCount}} breakpoints</span></div>
   <details><summary>Breakpoints</summary><if condition="!resolutions.length"><p>Click a source gutter to request a breakpoint.</p></if><for each="resolution in resolutions"><p>{{resolution.label}}</p></for></details>
  </section>
  <pane-divider orientation="vertical" label="Resize source and variables" value="{{sourceSplit}}" initial="60" @pane-resize="{resizeSource(e)}"></pane-divider>
  <section class="debug-values" aria-label="Stack and variables">
   <h4>Call stack</h4><if condition="!frames.length"><p>Stack frames appear when execution pauses.</p></if><if condition="frameLimit"><p>Additional frames omitted at the stack limit.</p></if><ol><for each="frame in frames"><li><button type="button" class="secondary frame" aria-pressed="{{frame.selected}}" ?disabled="{{!paused}}" @click="{selectFrame(frame.index)}">{{frame.label}}<if condition="frame.unavailable"> · some scopes unavailable</if></button></li></for></ol>
   <h4>Scope</h4><div class="scopes"><for each="scope in scopes"><button type="button" class="secondary compact-button" aria-pressed="{{scope.selected}}" ?disabled="{{!scope.available || !paused}}" @click="{selectScope(scope)}">{{scope.label}}</button></for></div><p>{{valuesLabel}}</p>
   <div class="property-page" tabindex="0"><table><thead><tr><th>Name</th><th>Type</th><th>Value</th></tr></thead><tbody><for each="property in properties"><tr key="{{property.key}}" data-depth="{{property.depth}}"><td><if condition="property.more"><button type="button" class="secondary compact-button" @click="{expand(property)}">{{property.name}}</button></if><if condition="!property.more"><if condition="property.expandable"><button type="button" class="property-toggle secondary" aria-expanded="{{property.expanded}}" aria-label="{{property.name}}" @click="{expand(property)}"><if condition="property.expanded">▾</if><if condition="!property.expanded">▸</if> {{property.name}}</button></if><if condition="!property.expandable">{{property.name}}</if></if></td><td class="value-type">{{property.value.kind}}</td><td>{{property.value.display}}<if condition="property.value.truncated"> … [shortened]</if></td></tr></for></tbody></table></div>
  </section>
 </div>
 <footer class="debug-evidence"><details><summary>Console output and diagnostics</summary><p>Read-only inspection and console output. Expressions, getters and proxies are not evaluated. Pauses expire after 60 seconds and sessions after 10 minutes; expiry stops active work.</p><script-diagnostics :evidence="{{details}}"></script-diagnostics><if condition="result"><h4>Test result</h4><pre tabindex="0" data-copy-surface>{{result}}</pre></if></details></footer>
</dialog>
</template>
