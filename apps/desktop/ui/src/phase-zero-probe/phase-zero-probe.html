<template shadowrootmode="open">
  <section aria-labelledby="probe-heading">
    <div>
      <p class="eyebrow">Native delivery check</p>
      <h2 id="probe-heading">{{probeHeading}}</h2>
      <p>{{probeSummary}}</p>
    </div>
    <button type="button" @click="{runProbe()}">Run bridge probe</button>
    <output w-ref="{resultOutput}" aria-live="polite">Ready to run.</output>
  </section>
</template>
