<template>
<section class="header-rule-workspace" aria-label="Header rules" @keydown="{keyboard(e)}">
  <header><h2>Header rules</h2><div class="actions"><button type="button" w-ref="{hrNewButton}" @click="{newRule()}" ?disabled="{{hrBusy}}">New header rule</button><button type="button" class="secondary" @click="{refresh()}" ?disabled="{{hrBusy}}">Refresh rules</button></div></header>
  <p class="field-help">Change selected headers on current live requests or responses. Rules compose in order and keep unrelated fields and response bytes. Auto-response pause does not pause header rules.</p>
  <div class="header-rule-manager">
    <aside class="header-rule-list" aria-label="Saved header rules"><if condition="!hrRows.length"><p>No header rules. Add a rule, choose its match and phase, then test it without sending traffic.</p></if><for each="row in hrRows"><div key="{{row.id}}" class="header-rule-row" ?data-selected="{{row.selected}}"><button type="button" class="secondary header-rule-select" @click="{selectRule(row.id)}" ?disabled="{{hrBusy}}"><strong>{{row.name}}</strong><small>{{row.phase}} · {{row.state}}</small></button><button type="button" class="secondary" aria-label="Move {{row.name}} earlier" @click="{move(row.id,true)}" ?disabled="{{hrBusy || row.first}}">↑</button><button type="button" class="secondary" aria-label="Move {{row.name}} later" @click="{move(row.id,false)}" ?disabled="{{hrBusy || row.last}}">↓</button></div></for></aside>
    <div class="header-rule-properties"><if condition="!hrEditor"><p>Select a header rule to inspect its saved definition, or create a new rule. User-Agent policies remain in UA header overrides.</p></if>
      <form w-ref="{hrForm}" @submit="{save(e)}" ?hidden="{{!hrEditor}}" aria-busy="{{hrBusy}}">
        <fieldset ?disabled="{{hrBusy}}"><legend><if condition="hrId">Header rule properties</if><if condition="!hrId">New header rule</if><if condition="hrDirty"> · Unsaved changes</if></legend>
          <div class="header-rule-basics"><label>Rule name <input w-ref="{hrNameInput}" name="headerRuleName" value="{{hrName}}" @input="{edit('hrName',e)}" maxlength="128" required></label><label>Phase <select aria-label="Header rule phase" value="{{hrPhase}}" @change="{setPhase(e)}"><option value="request">Request headers</option><option value="response">Response headers</option></select></label><label>Method <input aria-label="Header rule method" value="{{hrMethod}}" @input="{edit('hrMethod',e)}" maxlength="32" placeholder="GET or ANY" required></label></div>
          <match-editor w-ref="{hrMatcher}" :condition="{{hrCondition}}" @matcher-change="{matcherChanged()}"></match-editor>
          <p ?hidden="{{!hrAdditional}}">Additional saved conditions are retained: {{hrAdditional}} <button type="button" class="secondary" @click="{clearAdditional()}">Clear additional conditions</button></p>
          <label class="checkbox-label"><input type="checkbox" ?checked="{{hrEnabled}}" @change="{setEnabled(e)}"> Enabled for new matching live requests when saved</label>
          <p class="field-help">Saving an enabled rule updates new requests after validation and persistence. In-flight requests keep their admitted rules. Selecting, editing and testing do not change live traffic.</p>
          <h3>Ordered operations</h3><p class="field-help">Set replaces all matching values, Append adds a field at the end, and Remove removes every matching field. Header names are case-insensitive. Untouched fields keep their value bytes and duplicate order.</p>
          <ol class="header-operations"><for each="row in hrOperations"><li key="{{row.id}}"><div class="header-operation-fields"><label>Operation <select aria-label="Header operation" value="{{row.operation}}" @change="{editOperation(row.id,'operation',e)}"><option value="set">Set</option><option value="append">Append</option><option value="remove">Remove</option></select></label><label>Header name <input aria-label="Operation header name" value="{{row.name}}" @input="{editOperation(row.id,'name',e)}" maxlength="256" required></label><label ?hidden="{{row.operation == 'remove'}}">Value format <select aria-label="Operation value format" value="{{row.encoding}}" @change="{changeEncoding(row.id,false,e)}"><option value="text">UTF-8 text</option><option value="hex">Hex bytes</option></select></label><label class="operation-value" ?hidden="{{row.operation == 'remove'}}">Header value <input aria-label="Operation header value" value="{{row.value}}" @input="{editOperation(row.id,'value',e)}" maxlength="196608" spellcheck="false"></label></div><div class="actions"><button type="button" class="secondary" aria-label="Move operation {{row.name}} earlier" @click="{moveOperation(row.id,-1)}">↑</button><button type="button" class="secondary" aria-label="Move operation {{row.name}} later" @click="{moveOperation(row.id,1)}">↓</button><button type="button" class="secondary" @click="{removeOperation(row.id)}">Remove operation</button></div></li></for></ol>
          <button type="button" class="secondary" @click="{addOperation()}">Add operation</button>
          <p class="field-help">Host, connection, framing and content-coding fields are managed by the proxy and cannot be changed here. Cache-Control, validators and policy fields remain explicit experiments. Changing a header does not rewrite body bytes or prove browser behavior.</p>
          <details><summary>Header conditions</summary><p>All conditions must match. Each field condition tests at least one value. Response conditions run on the current response after scripts and earlier header rules.</p><div class="header-rule-basics" ?hidden="{{hrPhase != 'response'}}"><label>Response status <input aria-label="Response status condition" value="{{hrStatusFilter}}" inputmode="numeric" @input="{edit('hrStatusFilter',e)}" placeholder="Any status"></label><label>Status class <select aria-label="Response status class" value="{{hrStatusClass}}" @change="{edit('hrStatusClass',e)}"><option value="">Any class</option><option value="1">1xx</option><option value="2">2xx</option><option value="3">3xx</option><option value="4">4xx</option><option value="5">5xx</option></select></label></div><for each="row in hrPredicates"><div key="{{row.id}}" class="header-predicate"><strong>{{row.phase}} header condition</strong><div class="header-operation-fields"><label>Header name <input aria-label="Condition header name" value="{{row.name}}" maxlength="256" @input="{editPredicate(row.id,'name',e)}" required></label><label>Condition <select aria-label="Header condition" value="{{row.kind}}" @change="{editPredicate(row.id,'kind',e)}"><option value="exists">Exists</option><option value="exact">Exact bytes</option><option value="prefix">Starts with</option><option value="suffix">Ends with</option><option value="regex">Rust byte regex</option></select></label><label ?hidden="{{row.kind == 'exists' || row.kind == 'regex'}}">Value format <select aria-label="Condition value format" value="{{row.encoding}}" @change="{changeEncoding(row.id,true,e)}"><option value="text">UTF-8 text</option><option value="hex">Hex bytes</option></select></label><label class="operation-value" ?hidden="{{row.kind == 'exists'}}">Value or pattern <input aria-label="Condition value" value="{{row.value}}" maxlength="196608" @input="{editPredicate(row.id,'value',e)}" spellcheck="false"></label></div><button type="button" class="secondary" @click="{removePredicate(row.id)}">Remove condition</button></div></for><div class="actions"><button type="button" class="secondary" @click="{addPredicate('request')}">Add request-header condition</button><button type="button" class="secondary" @click="{addPredicate('response')}" ?disabled="{{hrPhase != 'response'}}">Add response-header condition</button></div></details>
          <details><summary>Response policy examples</summary><p>Common operations: Remove Content-Security-Policy, Set Access-Control-Allow-Origin to a specific test origin, or Set Cache-Control to no-cache. Add these as operations above. Browser enforcement, credentials and existing page state still matter; header edits alone do not establish that a page is safe or that CORS succeeds.</p></details>
          <details><summary>Execution order and conflict repair</summary><p>Native request rules run in the order below, then scripts. Response scripts run first, then native response rules in the order below. Each rule's operations run top to bottom. A winning auto-response stops entry into later hooks, so later request and response edits and scripts do not run. Captured-page previews use saved responses and do not execute these header rules.</p><p>User-Agent policies replace existing fields only; their first matching policy wins. General header rules may add missing fields. Request conditions see edits made by earlier request rules; response request conditions see the final effective request.</p><ol class="header-native-order"><for each="row in hrOrder"><li key="{{row.id}}"><strong>{{row.name}}</strong> · {{row.state}}<small>{{row.kind}}</small></li></for></ol><label>Saved position <select aria-label="Header rule saved position" value="{{hrPlacement}}" @change="{edit('hrPlacement',e)}"><option value="keep">Keep position / append to header rules</option><option value="before">Before other native rules</option><option value="after">After other native rules</option></select></label><p>Equal-position rules that may write the same field require distinct positions or disjoint conditions. This choice moves only this rule; other automation is preserved. The list describes configuration. Traffic Details shows recorded execution and changes for a particular request.</p></details>
        </fieldset>
        <details class="header-draft-test"><summary>Test draft without sending traffic</summary><p>Supply the effective request/response at this rule's phase. This test evaluates only the draft. It does not run other rules or scripts, send traffic, or enable the rule.</p><div class="header-rule-basics"><label>Sample method <input value="{{hrSampleMethod}}" @input="{sample('hrSampleMethod',e)}" maxlength="32"></label><label class="sample-url">Sample URL <input value="{{hrSampleUrl}}" @input="{sample('hrSampleUrl',e)}" maxlength="16384"></label><label ?hidden="{{hrPhase != 'response'}}">Sample response status <input value="{{hrSampleStatus}}" @input="{sample('hrSampleStatus',e)}" inputmode="numeric"></label></div><label>Sample request headers <textarea value="{{hrSampleRequest}}" @input="{sample('hrSampleRequest',e)}" rows="3" spellcheck="false"></textarea></label><label ?hidden="{{hrPhase != 'response'}}">Sample response headers <textarea value="{{hrSampleResponse}}" @input="{sample('hrSampleResponse',e)}" rows="4" spellcheck="false"></textarea></label><button type="button" class="secondary" @click="{testDraft()}" ?disabled="{{hrBusy || hrTestBusy}}"><if condition="hrTestBusy">Testing…</if><if condition="!hrTestBusy">Test draft</if></button><p class="field-error" role="status" ?hidden="{{!hrTestError}}">{{hrTestError}}</p><p role="status">{{hrTestSummary}}</p><ul><for each="check in hrChecks"><li key="{{check.id}}"><strong>{{check.label}} · {{check.state}}</strong><span>{{check.detail}}</span></li></for></ul><ol><for each="result in hrResults"><li key="{{result.index}}">{{result.operation}} {{result.name}} · {{result.state}}</li></for></ol><if condition="hrTestSummary"><div class="header-sample-results"><div><h4>Before sample</h4><dl><for each="field in hrBefore"><div key="{{field.id}}"><dt>{{field.name}}</dt><dd>{{field.value}}</dd></div></for></dl></div><div><h4>After sample</h4><dl><for each="field in hrAfter"><div key="{{field.id}}"><dt>{{field.name}}</dt><dd>{{field.value}}</dd></div></for></dl></div></div></if></details>
        <footer class="header-rule-actions"><p class="field-error" ?hidden="{{!hrStale}}">The saved rule changed or was removed. Your opened revision is preserved. Reopen it, or save this draft as a new rule.</p><div class="actions"><button type="submit" ?disabled="{{hrBusy}}">Save rule</button><button type="button" @click="{save(e,true)}" ?disabled="{{hrBusy}}">Save and enable</button><button type="button" class="secondary" @click="{duplicateDraft()}" ?disabled="{{hrBusy}}">Copy draft to new rule</button><button type="button" class="secondary" @click="{discard()}" ?disabled="{{hrBusy || !hrDirty}}">Discard edits</button><button type="button" class="secondary" @click="{remove()}" ?hidden="{{!hrId}}" ?disabled="{{hrBusy}}">Remove rule</button></div></footer>
      </form>
    </div>
  </div>
  <footer><p class="field-error" role="status" ?hidden="{{!hrError}}">{{hrError}}</p><p role="status">{{hrMessage}}</p><button type="button" class="secondary" ?hidden="{{!hrUndo}}" @click="{undoRemove()}" ?disabled="{{hrBusy}}">Undo remove</button></footer>
  <dialog w-ref="{hrUnsaved}" class="header-unsaved" @cancel="{resolveUnsaved('stay',e)}"><h3>Save changes to this header rule?</h3><p>Your draft has unsaved changes.</p><div class="actions"><button type="button" @click="{resolveUnsaved('save')}">Save and continue</button><button type="button" class="secondary" @click="{resolveUnsaved('discard')}">Discard changes</button><button type="button" class="secondary" autofocus @click="{resolveUnsaved('stay')}">Keep editing</button></div></dialog>
</section>
</template>
