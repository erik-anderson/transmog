<template shadowrootmode="open">
  <section id="update-panel" class="update-panel" aria-labelledby="update-heading">
    <h2 id="update-heading">Software updates</h2>
    <p>Installed version: <if condition="updateState.currentVersion">{{updateState.currentVersion}}</if><if condition="!updateState.currentVersion">Loading…</if></p>
    <if condition="updateState.version"><p><strong>Stable release {{updateState.version}} is available.</strong></p></if>
    <p role="status" aria-live="polite">{{updateState.message}}</p>
    <p class="help" ?hidden="{{!updateLastCheckedText}}">{{updateLastCheckedText}}</p>
    <p ?hidden="{{!updateReminderText}}">{{updateReminderText}}</p>
    <if condition="updateState.notes"><details><summary>Release notes</summary><pre>{{updateState.notes}}</pre></details></if>
    <if condition="updateState.phase == 'downloading'"><if condition="updateState.totalBytes"><progress aria-label="Installer download" value="{{updateState.downloadedBytes}}" max="{{updateState.totalBytes}}"></progress></if><if condition="!updateState.totalBytes"><progress aria-label="Installer download"></progress></if><p>{{updateProgressText}}</p></if>
    <p class="error" role="status" ?hidden="{{!updateError}}">{{updateError}}</p>
    <div class="actions">
      <if condition="updateState.version && updateState.phase != 'ready' && updateState.phase != 'installing' && updateState.phase != 'downloading'">
        <button type="button" ?disabled="{{updateBusy}}" @click="{choose(false)}">Update now</button>
        <button type="button" class="secondary" ?disabled="{{updateBusy}}" @click="{choose(true)}">Update after this session ends</button>
        <button type="button" class="secondary" ?disabled="{{updateBusy}}" @click="{remind()}">Remind me in 30 days</button>
      </if>
      <if condition="updateState.phase == 'ready'"><button type="button" ?disabled="{{updateBusy}}" @click="{installReady()}">Install and reopen</button></if>
      <if condition="updateState.phase == 'downloading' || updateState.phase == 'ready'"><button type="button" class="secondary" @click="{cancel()}">Cancel update</button></if>
      <button type="button" class="secondary" ?disabled="{{updateBusy || updateState.scheduled}}" @click="{check(true)}">Check for updates</button>
    </div>
    <p class="help" ?hidden="{{!updateState.version}}">Updating closes Transmog after stopping capture and restoring Windows proxy settings. A deferred update runs when you quit the app.</p>
  </section>
</template>
