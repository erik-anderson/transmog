<template>
<div class="set-lifecycle" @keydown="{keyboard(e)}">
  <div class="set-live-controls"><span>{{stateText}}</span><button type="button" w-ref="{liveButton}" ?hidden="{{!canApply}}" @click="{apply()}" ?disabled="{{dirty || currentOutdated || locked || editorPending || tourStep > 0}}" aria-disabled="{{pending}}" aria-busy="{{pending}}">{{applyLabel}}</button><button type="button" ?hidden="{{!canPause}}" w-ref="{pauseButton}" @click="{participation('pause')}" ?disabled="{{locked || editorPending || tourStep > 0}}" aria-disabled="{{pending}}">Pause</button><button type="button" ?hidden="{{!canResume}}" w-ref="{resumeButton}" @click="{participation('resume')}" ?disabled="{{locked || editorPending || tourStep > 0}}" aria-disabled="{{pending}}">Resume</button><button type="button" class="secondary" w-ref="{tryButton}" popovertarget="set-try-menu" ?disabled="{{locked || editorPending || pending || tourStep > 0}}">Try changes…</button><button type="button" class="secondary" w-ref="{moreButton}" popovertarget="set-more-menu" ?disabled="{{locked || editorPending || pending || tourStep > 0}}">More…</button></div>
  <p class="field-help" ?hidden="{{!currentOutdated}}">The saved current collection changed elsewhere. Reopen this response set before applying it or saving a named version.</p><p class="field-help" ?hidden="{{!globallyPaused}}">Saved responses are paused globally.</p><p class="field-help" ?hidden="{{!dirty}}">Save changes before applying, previewing, or saving a demo. Live controls use saved responses.</p>
  <div class="set-live-undo" ?hidden="{{!undoDescription}}"><span>{{undoDescription}}</span><button type="button" class="secondary compact-button" @click="{participation('undo')}" ?disabled="{{locked || editorPending || tourStep > 0}}" aria-disabled="{{pending}}">Undo live change</button></div>
  <div class="set-lifecycle-feedback" ?hidden="{{!lifecycleMessage}}"><span role="status">{{lifecycleMessage}}</span><button type="button" class="secondary compact-button" @click="{dismissFeedback()}">Dismiss</button></div><div class="set-lifecycle-feedback" ?hidden="{{!lifecycleError}}"><span role="alert" class="field-error">{{lifecycleError}}</span><button type="button" class="secondary compact-button" @click="{dismissFeedback()}">Dismiss</button></div>
  <div id="set-try-menu" w-ref="{tryMenu}" popover="auto" class="response-action-menu"><button type="button" @click="{tryAction('live')}" ?disabled="{{!hasPage}}">Open live page…</button><p class="field-help">Response changes apply when requests pass through Transmog.</p><button type="button" @click="{tryAction('preview')}" ?disabled="{{dirty}}">Preview captured page…</button><button type="button" @click="{tryAction('save-demo')}" ?disabled="{{dirty}}">Save demo…</button><p class="field-help">Save a captured page and these response changes for later playback.</p><button type="button" @click="{tryAction('demos')}">Open saved demo</button><p class="field-help" ?hidden="{{hasPage}}">Choose a captured page to enable Open live page.</p></div>
  <div id="set-more-menu" w-ref="{moreMenu}" popover="auto" class="response-action-menu"><button type="button" @click="{showVersions()}">Versions…</button><button type="button" @click="{demos()}">Saved demos…</button><button type="button" @click="{help()}">How response sets work</button><button type="button" @click="{ask('delete-set')}">Delete response set…</button></div>
  <dialog w-ref="{overlapDialog}" class="set-lifecycle-dialog" aria-labelledby="set-overlap-title" @cancel="{finishOverlap(false,e)}"><h2 id="set-overlap-title">Review overlapping responses</h2><p>Existing live rules overlap this saved collection. The first matching response wins; applying this set may change which response is used.</p><ul><for each="overlap in overlapRows"><li>{{overlap}}</li></for></ul><label class="checkbox-label"><input w-ref="{overlapCheckbox}" type="checkbox" ?checked="{{overlapAcknowledged}}" @change="{acknowledgeOverlap(e)}"> I reviewed these overlaps and want to apply this set.</label><div class="actions"><button type="button" @click="{finishOverlap(true)}" ?disabled="{{!overlapAcknowledged}}">{{applyLabel}}</button><button type="button" class="secondary" @click="{finishOverlap(false)}">Cancel</button></div><inspection-copy-menu></inspection-copy-menu></dialog>
  <dialog w-ref="{versionsDialog}" class="set-lifecycle-dialog set-versions-dialog" aria-labelledby="set-versions-title" @cancel="{closeVersions(e)}"><h2 id="set-versions-title">Versions · {{ownerName}}</h2><p>Save a named version when you want to keep a milestone or alternative.</p><form class="set-version-save" @submit="{saveVersion(e)}"><label>Version name <input w-ref="{versionNameInput}" value="{{versionName}}" required @input="{versionNameInputChanged(e)}" ?readonly="{{pending}}"></label><button type="submit" aria-disabled="{{pending}}" ?disabled="{{currentOutdated}}">Save named version…</button></form><p class="field-help">Saves the current saved responses. Unsaved edits are excluded. Live traffic and saved demos stay as they are.</p><p role="status" ?hidden="{{versionRows.length}}">No named versions saved yet.</p><div class="set-versions-list"><for each="version in versionRows"><article key="{{version.id}}"><strong>{{version.name}}</strong><small>Saved revision {{version.revision}} · {{version.summary}}</small><div class="actions"><button type="button" class="secondary compact-button" @click="{viewVersion(version.id)}" ?disabled="{{pending}}">View version</button><button type="button" class="secondary compact-button" @click="{ask('restore',version.id)}" ?disabled="{{pending}}">Restore to current set…</button><button type="button" class="secondary compact-button" @click="{ask('delete-version',version.id)}" ?disabled="{{pending}}">Delete version…</button></div></article></for></div><p role="status" ?hidden="{{!versionMessage}}">{{versionMessage}}</p><p role="alert" class="field-error" ?hidden="{{!versionError}}">{{versionError}}</p><footer class="actions"><button type="button" class="secondary" @click="{closeVersions()}">Close</button></footer><inspection-copy-menu></inspection-copy-menu></dialog>
  <dialog w-ref="{versionViewDialog}" class="set-lifecycle-dialog set-version-view" aria-labelledby="set-version-view-title" @cancel="{closeVersionView(e)}"><h2 id="set-version-view-title">{{viewedVersionName}}</h2><p>Read-only saved responses.</p><p ?hidden="{{viewedVersionRules.length}}">This version contains no responses.</p><div class="set-version-inspection"><div class="set-version-response-list" aria-label="Version responses"><for each="rule in viewedVersionRules"><article key="{{rule.id}}"><button type="button" class="secondary" @click="{inspectVersionResponse(rule.id)}" aria-pressed="{{rule.id == selectedVersionResponseId}}">{{rule.name}}</button><small>{{rule.method}} · {{rule.url}} · <if condition="rule.included">Included</if><if condition="!rule.included">Excluded</if></small><details><summary>Saved rule definition</summary><pre tabindex="0" data-copy-surface>{{rule.definition}}</pre></details></article></for></div><section class="set-version-response" ?hidden="{{!selectedVersionResponseId}}" aria-label="Saved response" aria-busy="{{versionResponseLoading}}"><h3>{{versionResponseName}}</h3><p role="status" ?hidden="{{!versionResponseLoading}}">Loading saved response…</p><p role="alert" class="field-error" ?hidden="{{!versionResponseError}}">{{versionResponseError}}</p><p>{{versionResponseStatus}}</p><h4>Response headers</h4><pre tabindex="0" data-copy-surface class="version-response-headers">{{versionResponseHeaders}}</pre><h4>Response body</h4><p class="field-help">{{versionResponseDescription}}</p><pre tabindex="0" data-copy-surface class="version-response-body">{{versionResponseBody}}</pre></section></div><footer class="actions"><button type="button" class="secondary" @click="{closeVersionView()}">Close</button></footer><inspection-copy-menu></inspection-copy-menu></dialog>
  <dialog w-ref="{confirmDialog}" class="set-lifecycle-dialog" aria-labelledby="set-lifecycle-confirm-title" @cancel="{cancelConfirm(e)}"><h2 id="set-lifecycle-confirm-title">{{confirmTitle}}</h2><p>{{confirmBody}}</p><p role="alert" class="field-error" ?hidden="{{!confirmError}}">{{confirmError}}</p><p role="status" ?hidden="{{!confirmProgress}}">{{confirmProgress}}</p><p role="status" ?hidden="{{!pending}}">Updating this response set… You can close this dialog; the change will continue.</p><div class="actions"><button type="button" @click="{confirm()}" aria-disabled="{{pending}}" ?hidden="{{confirmCompleted}}">{{confirmLabel}}</button><button type="button" class="secondary" @click="{cancelConfirm()}"><if condition="!confirmCompleted">Cancel</if><if condition="confirmCompleted">Close</if></button></div><inspection-copy-menu></inspection-copy-menu></dialog>
</div>
</template>
