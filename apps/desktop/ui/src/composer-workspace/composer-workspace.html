<template>
<section id="composer" class="app-view tool-view" aria-labelledby="composer-heading" ?hidden="{{view != 'composer'}}" ?data-active="{{view == 'composer'}}">
 <div class="composer-page">
  <header class="workspace-header"><h1 id="composer-heading">Composer</h1><span ?hidden="{{!composerDirty}}">Edited request</span><div class="actions"><button type="button" class="secondary compact-button" ?hidden="{{!composerSourceLabel}}" w-ref="{composerSourceButton}" popovertarget="composer-source">Source</button><button type="button" class="secondary compact-button" @click="{returnToTraffic()}">Back to Traffic</button></div></header>
  <div id="composer-source" class="composer-source-popover" w-ref="{composerSourcePopover}" popover="auto" aria-label="Draft source"><p class="full-value" data-copy-text data-copy-surface tabindex="0">{{composerSourceLabel}}</p><button type="button" class="secondary compact-button" ?disabled="{{!composerSourceAvailable}}" @click="{showComposerSource()}">Show source in Traffic</button><p class="field-help" ?hidden="{{composerSourceAvailable}}">This source entry is no longer in Traffic. Its association is preserved.</p></div>
  <nav class="composer-pane-tabs" aria-label="Composer panes"><button type="button" ?data-selected="{{composerPane == 'request'}}" aria-pressed="{{composerPanePressed.request}}" @click="{showComposerPane('request')}">Draft</button><button type="button" ?data-selected="{{composerPane == 'response'}}" aria-pressed="{{composerPanePressed.response}}" @click="{showComposerPane('response')}">Result</button></nav>
  <div class="composer-layout" data-pane="{{composerPane}}">
   <form w-ref="{composerForm}" @submit="{executeComposer(e)}" @input="{markComposerDirty(e)}" @keydown="{composerKeydown(e)}" class="composer-request" aria-label="Request draft">
    <div class="composer-request-fields">
    <div class="composer-address"><label>Method <input name="method" value="GET" list="composer-methods" maxlength="32" pattern="[!#$%&amp;'*+.^_`\|~0-9A-Za-z\-]+" title="Enter an HTTP method, such as GET or POST. Custom methods are supported." required><datalist id="composer-methods"><option value="GET"></option><option value="POST"></option><option value="PUT"></option><option value="PATCH"></option><option value="DELETE"></option><option value="HEAD"></option><option value="OPTIONS"></option><option value="TRACE"></option><option value="CONNECT"></option></datalist></label><label>URL <input name="url" type="url" placeholder="https://example.com/" maxlength="8192" required></label></div>
    <query-editor w-ref="{queryEditor}" :value="{{composerUrl}}" @query-change="{queryChanged(e)}"></query-editor>
    <div class="composer-headers"><header-editor w-ref="{headerEditor}" allow-disable label="Request headers" maxlength="65536" @header-change="{headersChanged(e)}"></header-editor><p class="field-help" ?hidden="{{!composerFramingNotice}}">Content-Length is recalculated; Transfer-Encoding is removed when sending.</p></div>
    <div class="composer-body-controls"><label class="composer-body-source">Body <select name="bodyMode" aria-label="Body source"><option value="inline">Body editor</option><option value="captured" ?disabled="{{!capturedBodyAvailable}}">Complete captured body</option><option value="file">Replacement file</option></select></label><label ?hidden="{{composerBodyMode != 'inline'}}">View <select name="bodyView" aria-label="Request body view" @change="{changeBodyView(e)}"><option value="text" ?selected="{{!bodyHexMode}}">Text</option><option value="hex" ?selected="{{bodyHexMode}}">Hex</option></select></label><button type="button" class="secondary compact-button" ?hidden="{{composerBodyMode != 'inline'}}" @click="{expandBody(e)}">Expand editor</button><span class="field-help composer-byte-status" ?hidden="{{composerBodyMode != 'inline'}}">{{composerBodyByteStatus}}</span></div>
    <if condition="composerBodyMode == 'captured'"><p class="field-help">{{composerBodySizeLabel}}. Streams the original encoded bytes. To change them, select Body editor or Replacement file.</p></if>
    <if condition="composerBodyMode == 'file'"><div class="composer-file-body"><button type="button" class="secondary compact-button" @click="{chooseBodyFile()}">Choose body file…</button><span data-copy-text data-copy-surface tabindex="0" class="full-value">{{composerBodyFile}}</span><p class="field-help">The complete file will stream when you send. Supply already encoded bytes if you keep Content-Encoding.</p></div></if>
    <label class="composer-body" ?hidden="{{composerBodyMode != 'inline'}}"><span class="sr-only">Request body<if condition="bodyHexMode"> hex bytes</if><if condition="!bodyHexMode"> text</if></span><textarea name="body" rows="4" maxlength="{{composerBodyMaxLength}}" spellcheck="false" placeholder="Enter a request body"></textarea></label><p class="field-error composer-body-error" role="alert" ?hidden="{{!composerBodyError || composerBodyMode != 'inline'}}">{{composerBodyError}}</p>
    <if condition="composerBodyMissing"><p class="field-help">A complete body is required. Enter a replacement in Body editor, choose a body file, or use an empty body.</p><button type="button" class="secondary compact-button" @click="{useEmptyBody()}">Use an empty body</button></if>
    <div class="composer-acknowledgements"><label ?hidden="{{!needsNonIdempotent}}"><input name="nonIdempotent" type="checkbox" ?required="{{needsNonIdempotent}}" ?disabled="{{!needsNonIdempotent}}"> This method may change server state; send it anyway</label><label ?hidden="{{!needsCredentials}}"><input name="credentials" type="checkbox" ?required="{{needsCredentials}}" ?disabled="{{!needsCredentials}}"> Send the credential headers I supplied</label></div>
    </div>
    <footer class="composer-send"><button type="submit" title="Send request (Ctrl+Enter)" aria-keyshortcuts="Control+Enter" ?disabled="{{composerBusy || composerBodyMissing}}"><if condition="composerBusy">Sending…</if><if condition="!composerBusy">Send request</if></button><button type="button" class="secondary compact-button" ?hidden="{{!composerBusy}}" ?disabled="{{composerCancelBusy}}" @click="{cancelComposer()}"><if condition="composerCancelBusy">Canceling…</if><if condition="!composerCancelBusy">Cancel</if></button><kbd ?hidden="{{composerBusy}}">Ctrl+Enter</kbd><span class="field-help" ?hidden="{{!composerElapsed}}">{{composerElapsed}}</span></footer>
   </form>
   <section class="composer-response" aria-label="Composer result"><if condition="composerResult"><header class="composer-result-header"><div class="composer-result-main"><span class="status-badge" data-tone="{{resultTone}}">{{composerResult.status}}</span><strong title="{{resultRequestLabel}}">{{resultRequestLabel}}</strong><button type="button" class="secondary compact-button composer-result-actions" aria-haspopup="menu" @click="{openComposerActions('result',e)}">Actions</button></div><div class="composer-result-summary"><p class="composer-result-state"><if condition="resultMatchesDraft">Response for current draft</if><if condition="!resultMatchesDraft && !resultFromHistory">Response for an earlier draft · current request has changed</if><if condition="resultFromHistory">Earlier replay</if></p><p class="composer-result-stats" aria-label="Response elapsed time and encoded body size">{{resultStats}}</p></div></header><nav class="composer-message-tabs" aria-label="Replay evidence"><button type="button" class="secondary compact-button" ?data-selected="{{resultMessage == 'response'}}" aria-pressed="{{resultMessagePressed.response}}" @click="{showResultMessage('response')}">Response</button><button type="button" class="secondary compact-button" ?data-selected="{{resultMessage == 'request'}}" aria-pressed="{{resultMessagePressed.request}}" @click="{showResultMessage('request')}">{{resultRequestTitle}}</button></nav><p class="composer-request-evidence" ?hidden="{{resultMessage != 'request'}}">{{composerResult.sentRequest.note}}</p><message-inspector hide-heading pane="composer-response" side="{{resultMessage}}" :detail="{{resultInspectionDetail}}"></message-inspector></if><if condition="!composerResult"><p class="inspector-empty">Send a request to inspect its response here.</p></if></section>
  </div>
  <output class="composer-feedback" aria-live="polite" ?hidden="{{!composerText && !composerError}}">{{composerText}}<span class="field-error" ?hidden="{{!composerError}}">{{composerError}}</span></output>
  <details class="composer-history" @toggle="{historyToggled(e)}"><summary>History</summary><p class="field-help" ?hidden="{{!composerHistoryBusy}}">Loading history…</p><p class="field-error" ?hidden="{{!composerHistoryError}}">{{composerHistoryError}}</p><div class="composer-history-list"><for each="item in composerHistory"><div key="{{item.id}}" class="composer-history-row" ?data-selected="{{item.id == resultHistoryId}}"><button id="composer-history-{{item.id}}" type="button" class="composer-history-select" aria-pressed="{{item.pressed}}" ?disabled="{{!item.retained}}" title="{{item.label}} · {{item.sourceLabel}}" @click="{viewHistoryResponse(item.id)}" @keydown="{historyKeydown(item.id,e)}"><span class="status-badge">{{item.status}}</span><span class="composer-history-label">{{item.label}}</span><span class="composer-history-stats">{{item.stats}}</span><span class="composer-history-unavailable" ?hidden="{{item.retained}}">Evidence no longer retained</span></button><button type="button" class="secondary compact-button composer-history-actions" aria-label="Actions for {{item.label}}" aria-haspopup="menu" @click="{openComposerActions('history',e,item.id)}">Actions</button></div></for><if condition="!composerHistory.length && !composerHistoryBusy"><p>No replays in this window.</p></if></div></details>
  <div w-ref="{composerActionsMenu}" class="composer-actions-menu" popover="auto" role="menu" aria-label="Replay actions" aria-describedby="composer-action-source" data-x="{{composerMenuX}}" data-y="{{composerMenuY}}" @keydown="{composerActionsKeydown(e)}" @toggle="{composerActionsToggled(e)}"><p id="composer-action-source" class="field-help composer-action-source">{{composerAction.sourceLabel}}</p><button type="button" role="menuitem" ?disabled="{{!composerAction.retained}}" @click="{runComposerAction('edit')}">Edit again</button><button type="button" role="menuitem" ?disabled="{{!composerAction.retained || !composerAction.sourceId || !composerAction.entryId}}" @click="{runComposerAction('compare')}">Compare with source</button><button type="button" role="menuitem" ?hidden="{{!composerAction.sourceId}}" @click="{runComposerAction('source')}">Show source in Traffic</button><button type="button" role="menuitem" ?hidden="{{composerActionKind != 'result'}}" @click="{runComposerAction('certificates')}">Certificates…</button></div>
  <certificate-viewer w-ref="{certificateViewer}"></certificate-viewer>
  <response-body-editor w-ref="{bodyEditor}" theme="{{theme}}" @body-commit="{applyBodyEditor(e)}" @body-editor-closed="{bodyEditorClosed()}"></response-body-editor>
  <dialog w-ref="{replaceComposerDialog}" class="unsaved-rule-dialog" @cancel="{replacementCancelled(e)}"><h3>Replace the current request draft?</h3><p>The request you are editing has unsaved changes.</p><div class="actions"><button type="button" @click="{resolveComposerReplacement(true)}">Replace draft</button><button type="button" class="secondary" autofocus @click="{resolveComposerReplacement(false)}">Keep editing</button></div><inspection-copy-menu></inspection-copy-menu></dialog>
 </div>
</section>
</template>
