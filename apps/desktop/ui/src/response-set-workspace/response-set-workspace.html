<template>
<section class="response-set-library" ?hidden="{{setId}}" aria-label="Response sets">
  <header><div><h2>Response sets</h2><p>Save the response changes and context for a debugging task.</p></div><button w-ref="{newSetButton}" type="button" @click="{showCreate()}">New response set…</button></header>
  <label class="set-search">Search response sets <input type="search" value="{{search}}" @input="{searchInput(e)}"></label>
  <p ?hidden="{{rows.length || search}}">Keep useful debugging work together. Create an empty set, or add responses from Traffic or existing rules.</p>
  <p ?hidden="{{rows.length || !search}}">No response sets match your search.</p>
  <div class="set-library-scroll"><table><thead><tr><th>Name</th><th>Notes</th><th>Responses</th><th>Live state</th><th>Last modified</th></tr></thead><tbody><for each="row in rows"><tr key="{{row.id}}" @click="{requestOpen(row.id)}"><td><button type="button" class="set-open">{{row.name}}</button></td><td class="set-library-notes">{{row.notes}}</td><td>{{row.count}}</td><td>{{row.state}}</td><td>{{row.modified}}</td></tr></for></tbody></table></div>
  <p role="status" ?hidden="{{!message}}">{{message}}</p>
</section>
<section class="response-set-current" ?hidden="{{!setId}}" @keydown="{keyboard(e)}" aria-label="Current response set" aria-busy="{{busy}}">
  <header class="set-current-header">
    <div class="set-heading-actions"><button type="button" class="secondary" w-ref="{backButton}" @click="{requestBack()}" ?disabled="{{busy}}">← Response sets</button><span role="status"><if condition="busy">Saving…</if><if condition="!busy && dirty">Unsaved changes</if><if condition="!busy && !dirty">Saved</if></span><div class="actions" ?data-tour-target="{{tourStep == 3}}"><button type="button" @click="{save()}" ?disabled="{{!dirty || busy || responsePending || tourStep > 0}}">Save changes</button><button type="button" class="secondary" @click="{discard()}" ?disabled="{{!dirty || busy || responsePending || tourStep > 0}}">Discard changes</button></div></div>
    <div class="set-metadata" ?data-tour-target="{{tourStep == 1}}"><label>Response set name <input w-ref="{nameInput}" value="{{setName}}" required @input="{metadataChanged(e)}" ?disabled="{{busy || responsePending || tourStep > 0}}"></label><label>Notes <textarea w-ref="{notesInput}" aria-label="Notes" rows="2" @input="{metadataChanged(e)}" ?disabled="{{busy || responsePending || tourStep > 0}}"></textarea></label></div>
    <div class="set-secondary"><button w-ref="{addButton}" ?data-tour-target="{{tourStep == 2}}" type="button" popovertarget="set-add-menu" ?disabled="{{busy || responsePending || tourStep > 0}}">Add responses…</button><div id="set-add-menu" w-ref="{addMenu}" popover="auto" class="response-action-menu"><button type="button" @click="{add('captured')}">From captured traffic…</button><button type="button" @click="{add('rules')}">From existing rules…</button><button type="button" @click="{add('scratch')}">Create from scratch…</button><button type="button" @click="{add('file')}">From file…</button></div><response-set-lifecycle ?data-tour-target="{{tourStep == 4}}" w-ref="{lifecycle}" :status="{{status}}" :setId="{{setId}}" :baseRevision="{{draftRevision}}" :baseIncarnation="{{draftIncarnation}}" :visible="{{overviewVisible}}" :dirty="{{dirty}}" :locked="{{busy}}" :editorPending="{{responsePending}}" :tourStep="{{tourStep}}" @set-preview-request="{preview()}" @set-help-request="{showGuideHelp()}" @set-demo-request="{demoRequest(e)}"></response-set-lifecycle></div>
    <div class="set-page"><span><if condition="pageUrl"><strong>Captured page:</strong> {{pageUrl}} <small>{{pageIdentity}} · {{pageAvailability}}</small></if><if condition="!pageUrl">No captured page chosen</if></span><button type="button" class="secondary compact-button" @click="{changePage()}" ?disabled="{{busy || dirty || tourStep > 0}}"><if condition="pageUrl">Change…</if><if condition="!pageUrl">Choose page…</if></button><button type="button" class="secondary compact-button" @click="{showPreviewDiagnostics()}" ?hidden="{{!previewReportAvailable || previewReportSetId != setId}}">Last preview diagnostics</button></div>
    <p class="field-error" role="alert" ?hidden="{{!error}}">{{error}}</p>
    <if condition="helpOpen"><dialog open w-ref="{guideHelpPanel}" class="response-set-help" aria-modal="false" aria-label="How response sets work" tabindex="-1"><p>Keep a debugging task together, save a named milestone, and try changes live or in a captured demo.</p><div class="actions"><button type="button" w-ref="{guideStartButton}" @click="{startGuide()}" ?disabled="{{busy || !preferencesReady}}" aria-disabled="{{guidePending}}" aria-busy="{{guidePending}}">Replay tour</button><button type="button" class="secondary" @click="{closeGuideHelp()}">Close</button></div></dialog></if>
    <if condition="invitationVisible && !helpOpen && tourStep == 0"><div class="response-set-invitation"><span>New to response sets?</span><button type="button" @click="{startGuide()}" aria-disabled="{{guidePending}}">Take a quick tour</button><button type="button" class="secondary" @click="{dismissGuideInvitation()}">Not now</button></div></if>
    <if condition="tourStep"><response-set-tour w-ref="{tourPanel}" :stepNumber="{{stepNumber}}" :stepTitle="{{stepTitle}}" :stepCopy="{{stepCopy}}" :stepLast="{{stepLast}}" :tourContext="{{tourContext}}" @tour-next="{nextTourStep()}" @tour-back="{previousTourStep()}" @tour-end="{endGuide()}"></response-set-tour></if>
    <p class="field-error" role="status" ?hidden="{{!guideError}}">{{guideError}}</p>
  </header>
  <div class="set-response-list" aria-label="Responses" aria-busy="{{responsePending}}"><p role="status" ?hidden="{{!editorLoading && !addingResponse}}">Loading response…</p><p role="status" ?hidden="{{!fileBusy}}">Checking response file…</p>
    <p ?hidden="{{ruleRows.length}}">Add captured responses, existing rules, or create a response from scratch.</p>
    <table><thead><tr><th>Name / URL match</th><th>Method</th><th>Response</th><th>Included</th></tr></thead><tbody><for each="row in ruleRows"><tr key="{{row.id}}" ?data-selected="{{row.selected}}" @keydown="{rowKeyboard(row.id,e)}"><td><button class="set-open" type="button" @click="{edit(row.id)}" ?disabled="{{busy || tourStep > 0}}" aria-pressed="{{row.selected}}" aria-disabled="{{responsePending}}">{{row.name}}</button><small>{{row.url}}</small><div class="set-row-actions"><button type="button" class="secondary compact-button" aria-label="Move {{row.name}} earlier" @click="{changeRule(row.id,'up')}" ?disabled="{{row.first || busy || tourStep > 0}}">↑</button><button type="button" class="secondary compact-button" aria-label="Move {{row.name}} later" @click="{changeRule(row.id,'down')}" ?disabled="{{row.last || busy || tourStep > 0}}">↓</button><button type="button" class="secondary compact-button" aria-label="Remove {{row.name}}" @click="{changeRule(row.id,'remove')}" ?disabled="{{busy || responsePending || tourStep > 0}}">Remove</button></div></td><td>{{row.method}}</td><td>{{row.response}}</td><td><input type="checkbox" aria-label="Include {{row.name}}" ?checked="{{row.included}}" @change="{changeRule(row.id,'toggle')}" ?disabled="{{busy || responsePending || tourStep > 0}}"></td></tr></for></tbody></table>
  </div>
</section>
<dialog w-ref="{createDialog}" class="set-create-dialog" aria-labelledby="set-create-title" @cancel="{closeCreate(e)}"><h2 id="set-create-title">New response set</h2><form @submit="{create(e)}"><label>Response set name <input w-ref="{createName}" required ?readonly="{{createPending || createCompleted}}"></label><label>Notes <textarea w-ref="{createNotes}" rows="4" ?readonly="{{createPending || createCompleted}}"></textarea></label><p class="field-error" role="alert" ?hidden="{{!createError}}">{{createError}}</p><p role="status" ?hidden="{{!createPending}}">Creating response set… You can close this dialog; creation will continue.</p><p role="status" ?hidden="{{!createCompleted}}">Response set created.</p><div class="actions"><button type="button" ?hidden="{{!createCompleted}}" @click="{openCreated()}">Open response set</button><button type="submit" w-ref="{createButton}" ?disabled="{{createCompleted}}" aria-disabled="{{createPending || createCompleted}}" aria-busy="{{createPending}}">Create response set</button><button type="button" class="secondary" w-ref="{createCancel}" @click="{closeCreate()}"><if condition="createPending || createCompleted">Close</if><if condition="!createPending && !createCompleted">Cancel</if></button></div></form></dialog>
</template>
