<template>
  <section class="extension-visualizer" aria-label="Extension visualizer" aria-busy="{{visualizerBusy}}">
    <p class="visualizer-feedback" role="status" ?hidden="{{!visualizerBusy}}"><if condition="visualizerReloading">Reloading…</if><if condition="!visualizerReloading">Visualizing…</if></p>
    <p class="visualizer-feedback" role="status" ?hidden="{{!visualizerReloadNotice}}">{{visualizerReloadNotice}}</p>
    <div class="visualizer-feedback" ?hidden="{{!visualizerError}}"><p role="status">{{visualizerError}}</p><button type="button" class="secondary compact-button" @click="{retry()}"><if condition="visualizerPaused">Open visualizer</if><if condition="!visualizerPaused">Retry visualizer</if></button></div>
    <p class="visualizer-feedback" ?hidden="{{!visualizerFrozen}}">Showing the last result.</p>
    <if condition="visualizerTitle">
      <header class="visualizer-heading"><strong>{{visualizerTitle}}</strong><if condition="visualizerLiveSupported"><label class="visualizer-live"><input type="checkbox" checked="{{visualizerLive}}" ?disabled="{{visualizerBusy || visualizerFrozen || !visualizerLiveAvailable}}" @change="{setLive(e)}">Live updates</label></if><span class="status-badge">{{visualizerStatus}}</span><details><summary>About this result</summary><p>{{visualizerSummary}}</p><p>Read only · Extension supplied structured data. Transmog renders this view.</p><p ?hidden="{{!visualizerLiveSupported || visualizerLiveAvailable}}">Live updates need retained live traffic and an available conversation.</p><for each="item in visualizerDiagnostics"><p><strong>{{item.code}}</strong> {{item.message}}</p></for></details></header>
      <div class="visualizer-live-warning" ?hidden="{{!visualizerLiveWarning}}"><p role="status">{{visualizerLiveWarning}}</p><button type="button" class="secondary compact-button" ?disabled="{{visualizerBusy}}" @click="{reopenLive()}">Reopen visualizer</button></div>
    </if>
    <div class="visualizer-layout" ?hidden="{{!visualizerTitle}}">
      <div w-ref="{treeViewport}" class="visualizer-tree" role="tree" aria-label="Visualization structure" aria-activedescendant="{{visualizerActiveRow}}" tabindex="0" @keydown="{treeKey(e)}" @scroll="{windowRows()}">
        <div class="visualizer-canvas" data-height="{{visualizerCanvasHeight}}"><for each="row in visualizerRows"><div key="{{row.id}}" id="{{row.domId}}" class="visualizer-row" role="treeitem" aria-level="{{row.level}}" aria-posinset="{{row.position}}" aria-setsize="{{row.setSize}}" aria-expanded="{{row.expandedState}}" aria-selected="{{row.selected}}" data-indent="{{row.indent}}" data-top="{{row.top}}" @click="{clickNode(row.id)}"><button type="button" tabindex="-1" aria-label="{{row.toggleLabel}}" ?hidden="{{!row.expandable}}" ?disabled="{{visualizerBusy}}" @click="{toggleNode(row.id,e)}"><if condition="row.expanded">−</if><if condition="!row.expanded">+</if></button><span class="visualizer-toggle-space" ?hidden="{{row.expandable}}"></span><span class="visualizer-field" title="{{row.name}}">{{row.name}}</span><span class="visualizer-field-value" title="{{row.value}}">{{row.value}}</span></div></for></div>
      </div>
      <section class="visualizer-node" aria-label="Selected structure">
        <header class="visualizer-node-heading"><strong>{{visualizerSelectedName}}</strong><label>View <select aria-label="Structure view" @change="{changeMode(e)}"><option value="tree" ?selected="{{visualizerMode == 'tree'}}">Fields</option><option value="table" ?selected="{{visualizerMode == 'table'}}">Table</option><option value="text" ?selected="{{visualizerMode == 'text'}}">Text</option><option value="hex" ?selected="{{visualizerMode == 'hex'}}">Hex</option></select></label></header>
        <p class="visualizer-format" ?hidden="{{!visualizerFormat}}">{{visualizerFormat}}</p>
        <div class="visualizer-value" ?hidden="{{visualizerMode == 'hex' || visualizerMode == 'table'}}"><pre tabindex="0">{{visualizerValue}}</pre><p ?hidden="{{visualizerMode != 'tree'}}">Expand fields in the structure to inspect nested values.</p></div>
        <div class="visualizer-table" ?hidden="{{visualizerMode != 'table'}}"><table><thead><tr><th>Field / row</th><for each="column in visualizerTable.columns"><th key="{{column.id}}">{{column.name}}</th></for></tr></thead><tbody><for each="row in visualizerTable.rows"><tr key="{{row.id}}"><th><button type="button" class="secondary compact-button" @click="{selectNode(row.id)}">{{row.name}}</button></th><for each="cell in row.cells"><td>{{cell}}</td></for></tr></for></tbody></table><nav aria-label="Visualization table pages"><span>{{visualizerTable.text}}</span><button type="button" class="secondary compact-button" ?disabled="{{!visualizerTable.previous}}" @click="{tablePage(-1)}">Previous</button><button type="button" class="secondary compact-button" ?disabled="{{!visualizerTable.next}}" @click="{tablePage(1)}">Next</button></nav><p>Table values are shortened to 512 characters. Select a row and its fields for complete values.</p><p ?hidden="{{!visualizerTable.limited}}">The table shows the first 64 columns. All fields remain available in the structure.</p></div>
        <div class="visualizer-bytes" ?hidden="{{visualizerMode != 'hex'}}"><label>Byte source <select aria-label="Visualization byte source" ?disabled="{{visualizerFrozen}}" @change="{changeSource(e)}"><for each="source in visualizerSources"><option key="{{source.id}}" value="{{source.id}}" ?selected="{{source.id == visualizerSource}}">{{source.name}}</option></for></select></label><p class="visualizer-format">{{visualizerSourceText}}</p><if condition="visualizerHex"><hex-viewer :preview="{{visualizerHex}}"></hex-viewer></if><p ?hidden="{{visualizerHex}}">No byte source is associated with this result.</p></div>
        <details class="visualizer-ranges" ?hidden="{{!visualizerSpans.length}}"><summary>Source ranges ({{visualizerSpans.length}})</summary><for each="span in visualizerSpans"><button key="{{span.id}}" type="button" class="secondary compact-button" ?disabled="{{visualizerFrozen}}" @click="{showSpan(span)}">{{span.label}}</button></for></details>
      </section>
    </div>
  </section>
</template>
