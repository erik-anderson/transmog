<template>
  <dialog w-ref="{comparisonDialog}" class="comparison-dialog" aria-labelledby="comparison-heading" @close="{comparisonClosed()}" @keydown="{comparisonKeyboard(e)}">
    <header><h2 id="comparison-heading">Compare requests and responses</h2><p role="status">{{comparisonSummary}}</p></header>
      <div class="comparison-controls"><label>Section<select @change="{setSection(e)}"><for each="section in comparisonSections"><option key="{{section}}" ?selected="{{section == comparisonSection}}">{{section}}</option></for></select></label><label><input type="checkbox" ?checked="{{comparisonChangesOnly}}" @change="{setChangesOnly(e)}"> Hide equal rows</label><button type="button" class="secondary compact-button" @click="{change(-1)}">Previous change</button><button type="button" class="secondary compact-button" @click="{change(1)}">Next change</button></div>
      <p role="status" class="comparison-position">{{comparisonChangePosition}}</p>

    <div class="comparison-scroll" w-ref="{comparisonScroll}"><p ?hidden="{{!comparisonPairingNote}}">{{comparisonPairingNote}}</p>
      <if condition="comparisonResult"><div class="comparison-sides">
        <section><strong>{{comparisonLeftName}} · {{comparisonResult.left.label}}</strong><span>{{comparisonResult.left.source}}</span><small>{{comparisonResult.left.boundary}}</small><button type="button" class="secondary compact-button" ?disabled="{{!comparisonResult.left.entryId}}" @click="{showSource(comparisonResult.left.entryId)}">Open left source</button><details><summary>Label and acquisition time</summary><label>Left label<input value="{{comparisonLeftName}}" maxlength="80" @input="{renameSide('left',e)}"></label><small>Snapshot acquired (UTC): {{comparisonLeftTime}}</small></details></section>
        <section><strong>{{comparisonRightName}} · {{comparisonResult.right.label}}</strong><span>{{comparisonResult.right.source}}</span><small>{{comparisonResult.right.boundary}}</small><button type="button" class="secondary compact-button" ?disabled="{{!comparisonResult.right.entryId}}" @click="{showSource(comparisonResult.right.entryId)}">Open right source</button><details><summary>Label and acquisition time</summary><label>Right label<input value="{{comparisonRightName}}" maxlength="80" @input="{renameSide('right',e)}"></label><small>Snapshot acquired (UTC): {{comparisonRightTime}}</small></details></section>
      </div></if>
      <details><summary>Boundaries and comparison options</summary><p>Defaults: original client request and final client-visible response. Missing stages remain unavailable.</p><div class="comparison-boundaries"><button type="button" class="secondary compact-button" @click="{boundary('client-request','client-response')}">Client boundaries</button><button type="button" class="secondary compact-button" @click="{boundary('upstream-request','upstream-response')}">Upstream boundaries</button></div><label>Exclude header names (comma separated)<input w-ref="{excludedHeaders}" maxlength="4096" placeholder="None"></label><label><input type="checkbox" ?checked="{{comparisonNormalize}}" @change="{setNormalize(e)}"> Normalize newlines in derived text view</label><button type="button" class="secondary compact-button" @click="{refreshComparison()}" ?disabled="{{comparisonBusy}}">Apply options / refresh snapshot</button></details>
      <if condition="comparisonResult"><details class="comparison-fields" @toggle="{toggleFieldComparison(e)}"><summary>Compare structured body fields</summary><p>Compare complete frozen bodies with an enabled Binary formats reader. Possible interpretations remain alternatives. Findings include changed encodings and ordered duplicate occurrences; original byte comparison remains available.</p><div class="comparison-controls"><label>Body<select aria-label="Field comparison body" @change="{chooseFieldSection(e)}"><for each="section in comparisonResult.bodySections"><option key="{{section}}" ?selected="{{section == comparisonFieldsSection}}">{{section}}</option></for></select></label><label>Format<select aria-label="Field comparison format" @change="{chooseFieldFormat(e)}"><option value="protobuf" ?selected="{{comparisonFieldsFormat == 'protobuf'}}">Protobuf</option><option value="bond" ?selected="{{comparisonFieldsFormat == 'bond'}}">Bond Compact Binary</option><option value="msgpack" ?selected="{{comparisonFieldsFormat == 'msgpack'}}">MessagePack</option><option value="cbor" ?selected="{{comparisonFieldsFormat == 'cbor'}}">CBOR</option><option value="bson" ?selected="{{comparisonFieldsFormat == 'bson'}}">BSON</option></select></label><button type="button" class="secondary compact-button" ?disabled="{{comparisonBusy || comparisonFieldsBusy}}" @click="{compareFields()}">Compare fields</button><if condition="comparisonFieldsBusy"><progress aria-label="Comparing fields"></progress><button type="button" class="secondary compact-button" @click="{cancelFields()}">Cancel field comparison</button></if></div><p role="status">{{comparisonFieldsStatus}}</p><if condition="comparisonFields"><div class="comparison-field-view"><extension-visualizer slot="comparison-fields" ?active="{{comparisonFieldsOpen}}" :snapshot="{{comparisonFields}}"></extension-visualizer></div></if></details></if>
      <p class="comparison-warning" ?hidden="{{!comparisonStale}}">Source changed or expired — refresh comparison. Displayed evidence remains the frozen snapshot.</p>
      <div class="comparison-evidence"><for each="row in comparisonRows"><article key="{{row.index}}" id="comparison-change-{{row.index}}" tabindex="-1" data-state="{{row.state}}" ?data-active="{{row.index == comparisonActive}}"><h3>{{row.section}} · {{row.field}} <small>{{row.state}}</small></h3><div class="comparison-values"><pre tabindex="0" data-copy-surface aria-label="Left value">{{row.left}}</pre><pre tabindex="0" data-copy-surface aria-label="Right value">{{row.right}}</pre></div><p>{{row.note}}</p></article></for></div>
      <if condition="!comparisonRows.length"><p>No evidence rows in this page and section. Change the section or page to inspect other evidence.</p></if>
      <div class="comparison-controls"><button type="button" class="secondary compact-button" @click="{page(-1)}" ?disabled="{{comparisonOffset == 0}}">Previous evidence page</button><span>{{comparisonRange}}</span><button type="button" class="secondary compact-button" @click="{page(1)}" ?disabled="{{!comparisonNext}}">Next evidence page</button></div>
      <if condition="comparisonResult"><details><summary>Original byte ranges</summary><p>Frozen original representation. Source Hex/Save as remains available beyond comparison limits.</p><label>Body<select @change="{setByteSection(e)}"><for each="section in comparisonResult.bodySections"><option key="{{section}}" ?selected="{{section == comparisonByteSection}}">{{section}}</option></for></select></label><div class="comparison-controls"><button type="button" class="secondary compact-button" @click="{readBytes(0)}">First 256 bytes</button><button type="button" class="secondary compact-button" @click="{readBytes(-1)}" ?disabled="{{comparisonByteOffset == 0}}">Previous bytes</button><span>Offset {{comparisonByteOffset}}</span><button type="button" class="secondary compact-button" @click="{readBytes(1)}" ?disabled="{{!comparisonByteNext}}">Next bytes</button></div><div class="comparison-values"><pre tabindex="0" data-copy-surface>{{comparisonByteLeft}}</pre><pre tabindex="0" data-copy-surface>{{comparisonByteRight}}</pre></div><p>{{comparisonByteNote}}</p></details></if>
    </div>
    <footer><p role="status">{{comparisonStatus}}</p><div class="comparison-controls"><button type="button" class="secondary" @click="{swapSides()}" ?disabled="{{comparisonBusy}}">Swap sides</button><button type="button" class="secondary" @click="{refreshComparison()}" ?disabled="{{comparisonBusy}}">Refresh comparison</button><if condition="comparisonBusy"><progress aria-label="Comparing evidence"></progress><button type="button" class="secondary" @click="{cancelComparison()}">Cancel comparison</button></if><if condition="comparisonResult && comparisonCaseAvailable"><button type="button" class="secondary comparison-more" w-ref="{comparisonMoreButton}" popovertarget="comparison-more">More</button><div popover="auto" id="comparison-more" w-ref="{comparisonMore}" class="comparison-menu"><button type="button" class="secondary" @click="{saveCase()}" ?disabled="{{comparisonBusy}}">Save comparison in case…</button></div></if><button type="button" class="secondary" @click="{closeComparison()}">Close</button></div></footer>
  <inspection-copy-menu></inspection-copy-menu></dialog>
  <dialog w-ref="{captureDialog}" class="comparison-dialog capture-comparison-dialog" aria-labelledby="capture-comparison-heading" @close="{captureClosed()}">
    <header><h2 id="capture-comparison-heading">Compare capture scopes</h2><p>{{captureSummary}}</p></header>
    <div class="comparison-scroll"><if condition="captureResult"><p>Frozen scopes: {{captureResult.leftLabel}} / {{captureResult.rightLabel}}</p></if><div class="comparison-sides"><label>Left scope<select @change="{selectScope('left',e)}"><for each="choice in captureChoices"><option key="{{choice.value}}" value="{{choice.value}}" ?selected="{{choice.value == captureLeft}}">{{choice.label}}</option></for></select></label><label>Right scope<select @change="{selectScope('right',e)}"><for each="choice in captureChoices"><option key="{{choice.value}}" value="{{choice.value}}" ?selected="{{choice.value == captureRight}}">{{choice.label}}</option></for></select></label></div>
      <details><summary>Pairing criteria</summary><p>These criteria choose counterparts. They do not hide differences when a pair is opened. Response status/content never selects a counterpart.</p><label>Exclude query names (comma separated)<input w-ref="{queryNames}" maxlength="4096" placeholder="None"></label><label>Require request header values (comma separated)<input w-ref="{pairingHeaders}" maxlength="4096" placeholder="None"></label><label><input type="checkbox" ?checked="{{pairingBodyDigest}}" @change="{setPairBody(e)}"> Require complete request-body digest</label><button type="button" class="secondary compact-button" @click="{capturePage(0,'',null,null,true)}" ?disabled="{{!captureResult || captureBusy}}">Re-pair frozen scopes; preserve manual choices</button></details>
      <if condition="counterpartRow"><section class="comparison-counterpart"><h3>Choose counterpart</h3><p>{{counterpartRow.leftLabel}} / {{counterpartRow.rightLabel}}</p><label>Find request<input w-ref="{counterpartSearch}" type="search" maxlength="1024"></label><button type="button" class="secondary compact-button" @click="{loadCounterparts(0)}">Find counterparts</button><label>Counterpart<select @change="{counterpartChanged(e)}"><for each="entry in counterpartChoices"><option key="{{entry.id}}" value="{{entry.id}}" ?selected="{{entry.id == counterpartValue}}">{{entry.label}}</option></for></select></label><div class="comparison-controls"><button type="button" class="secondary compact-button" @click="{loadCounterparts(-1)}" ?disabled="{{counterpartOffset == 0}}">Previous choices</button><button type="button" class="secondary compact-button" @click="{loadCounterparts(1)}" ?disabled="{{!counterpartMore}}">More choices</button><button type="button" @click="{applyCounterpart()}" ?disabled="{{!counterpartValue || captureBusy}}">Pair selected requests</button><button type="button" class="secondary" @click="{closeCounterpart()}">Cancel choice</button></div></section></if>
      <if condition="captureResult"><details><summary>Frozen scope times and fidelity</summary><p>Left: {{captureResult.leftDetails}}</p><p>Right: {{captureResult.rightDetails}}</p></details><div class="comparison-pairs"><for each="row in captureResult.rows"><article key="{{row.index}}"><h3>{{row.state}}</h3><div class="comparison-values"><p>{{row.leftLabel}}</p><p>{{row.rightLabel}}</p></div><p>{{row.reason}}</p><p ?hidden="{{!row.timingDelta}}">Measured request-to-completion delta (right − left): {{row.timingDelta}}</p><p ?hidden="{{!row.group}}">Candidate group: {{row.group}}</p><div class="comparison-controls"><button type="button" class="secondary compact-button" @click="{openPair(row)}" ?disabled="{{!row.left || !row.right}}">Compare pair</button><button type="button" class="secondary compact-button" @click="{chooseCounterpart(row)}" ?disabled="{{captureBusy}}">Change pairing…</button><button type="button" class="secondary compact-button" @click="{keepUnmatched(row)}" ?disabled="{{captureBusy}}">Keep unmatched</button></div></article></for></div><div class="comparison-controls"><button type="button" class="secondary compact-button" @click="{capturePage(-1)}" ?disabled="{{captureOffset == 0 || captureBusy}}">Previous pairs</button><span>{{captureRange}}</span><button type="button" class="secondary compact-button" @click="{capturePage(1)}" ?disabled="{{!captureNext || captureBusy}}">Next pairs</button><button type="button" class="secondary compact-button" @click="{capturePage(0,'undo')}" ?disabled="{{captureBusy || !captureResult.canUndo}}">Undo pairing correction</button><button type="button" class="secondary compact-button" @click="{capturePage(0,'reset')}" ?disabled="{{captureBusy}}">Reset proposed pairs</button></div></if>
    </div>
    <footer><p role="status">{{captureStatus}}</p><div class="comparison-controls"><button type="button" @click="{runCaptures()}" ?disabled="{{captureBusy || !captureChoices.length}}">Compare selected scopes</button><if condition="captureBusy"><progress aria-label="Comparing capture scopes"></progress><button type="button" class="secondary" @click="{cancelCapture()}">Cancel comparison</button></if><if condition="captureResult"><button type="button" class="secondary capture-more" w-ref="{captureMoreButton}" popovertarget="capture-more">More</button><div popover="auto" id="capture-more" w-ref="{captureMore}" class="comparison-menu"><button type="button" class="secondary" @click="{saveCase(true)}" ?disabled="{{captureBusy}}">Save comparison in case…</button></div></if><button type="button" class="secondary" @click="{closeCaptures()}">Close</button></div></footer>
  <inspection-copy-menu></inspection-copy-menu></dialog>
</template>
