<template>
<if condition="bodyEditorLoaded"><link w-ref="{bodyEditorStyles}" rel="stylesheet" href="/monaco.css"></if>
<dialog w-ref="{surface}" class="response-body-dialog" aria-labelledby="body-dialog-title" aria-busy="{{bodyBusy}}" @cancel="{cancel(e)}" @close="{closed()}" @keydown="{keyboard(e)}">
  <header><h2 id="body-dialog-title">Edit response body</h2><label>View <select w-ref="{modeSelect}" aria-label="Body view" @change="{changeMode(e)}" ?disabled="{{bodyBusy || bodyFormatting}}"><option value="text">Text</option><option value="hex">Hex</option></select></label><label ?hidden="{{bodyMode == 'hex'}}">Language <select w-ref="{languageSelect}" aria-label="Body language" @change="{changeLanguage(e)}" ?disabled="{{bodyBusy || bodyFormatting}}"><option value="plaintext">Plain text</option><option value="html">HTML</option><option value="svg">SVG</option><option value="css">CSS</option><option value="javascript">JavaScript</option><option value="json">JSON</option></select></label><button type="button" class="secondary" @click="{format()}" ?hidden="{{bodyMode == 'hex'}}" ?disabled="{{!bodyEditorReady || bodyBusy || bodyFormatting || bodyLanguage == 'plaintext' || bodyLanguage == 'svg'}}"><if condition="bodyFormatting">Formatting…</if><if condition="!bodyFormatting">Format</if></button></header>
  <div class="body-editor-information"><p class="body-editor-status" role="status">{{bodyEditorStatus}}</p><span class="body-byte-status">{{bodyByteStatus}}</span></div>
  <div class="body-dialog-content"><label ?hidden="{{bodyEditorReady}}">{{bodyValueLabel}}<textarea w-ref="{fallbackInput}" rows="20" spellcheck="false" @input="{updateByteStatus()}" ?disabled="{{bodyBusy}}"></textarea></label><div w-ref="{editorHost}" class="body-code-host" ?hidden="{{!bodyEditorReady}}" ?inert="{{bodyBusy}}"></div></div>
  <footer><p class="field-help"><if condition="bodyCanSave">{{bodySaveDescription}} Cancel discards only this dialog’s edits.</if><if condition="!bodyCanSave">Cancel discards only this dialog’s edits.</if></p><small ?hidden="{{bodyCanSave}}">{{bodySaveUnavailableReason}}</small><p class="field-error" role="alert" ?hidden="{{!bodyError}}">{{bodyError}}</p><div class="actions"><button type="button" class="body-apply" ?data-secondary="{{bodyCanSave}}" @click="{commit(false)}" ?disabled="{{bodyBusy || bodyFormatting}}">Apply to draft</button><if condition="bodyCanSave"><button type="button" @click="{commit(true)}" ?disabled="{{bodyBusy || bodyFormatting}}"><if condition="!bodyBusy">{{bodySaveLabel}}</if><if condition="bodyBusy">Saving…</if></button></if><button type="button" class="secondary" @click="{cancel()}" ?disabled="{{bodyBusy}}">Cancel</button></div></footer>
  <div w-ref="{overflowHost}" class="body-editor-overflow monaco-editor" ?inert="{{bodyBusy}}"></div>
</dialog>
</template>
