<template>
<if condition="bodyEditorLoaded"><link w-ref="{bodyEditorStyles}" rel="stylesheet" href="/monaco.css"></if>
<dialog w-ref="{surface}" class="response-body-dialog" aria-labelledby="body-dialog-title" aria-busy="{{bodyBusy}}" @cancel="{cancel(e)}" @close="{closed()}" @keydown="{keyboard(e)}">
  <header><h2 id="body-dialog-title">Edit response body</h2><label>Language <select w-ref="{languageSelect}" aria-label="Body language" @change="{changeLanguage(e)}" ?disabled="{{bodyBusy || bodyFormatting}}"><option value="plaintext">Plain text</option><option value="html">HTML</option><option value="css">CSS</option><option value="javascript">JavaScript</option><option value="json">JSON</option></select></label><button type="button" class="secondary" @click="{format()}" ?disabled="{{!bodyEditorReady || bodyBusy || bodyFormatting || bodyLanguage == 'plaintext'}}"><if condition="bodyFormatting">Formatting…</if><if condition="!bodyFormatting">Format</if></button></header>
  <p class="body-editor-status" role="status">{{bodyEditorStatus}}</p>
  <div class="body-dialog-content"><label ?hidden="{{bodyEditorReady}}">Response body text<textarea w-ref="{fallbackInput}" rows="20" maxlength="16777216" ?disabled="{{bodyBusy}}"></textarea></label><div w-ref="{editorHost}" class="body-code-host" ?hidden="{{!bodyEditorReady}}" ?inert="{{bodyBusy}}"></div></div>
  <footer><small ?hidden="{{bodyCanSave}}">Apply changes to the draft, then Save rule to use them.</small><p class="field-error" role="alert" ?hidden="{{!bodyError}}">{{bodyError}}</p><div class="actions"><button type="button" class="body-apply" ?data-secondary="{{bodyCanSave}}" @click="{commit(false)}" ?disabled="{{bodyBusy || bodyFormatting}}">Apply</button><if condition="bodyCanSave"><button type="button" @click="{commit(true)}" ?disabled="{{bodyBusy || bodyFormatting}}"><if condition="!bodyBusy">Save rule</if><if condition="bodyBusy">Saving…</if></button></if><button type="button" class="secondary" @click="{cancel()}" ?disabled="{{bodyBusy}}">Cancel</button></div></footer>
</dialog>
</template>
