<template>
  <section class="message-inspector">
    <header class="message-tabs">
      <strong><if condition="side == 'request'">Request</if><if condition="side == 'response'">Response</if></strong>
      <button type="button" ?data-selected="{{mode == 'headers'}}" @click="{showMode('headers')}">Headers</button>
      <button type="button" ?data-selected="{{mode == 'body'}}" @click="{showMode('body')}">Body</button>
      <button type="button" ?data-selected="{{mode == 'split'}}" @click="{showMode('split')}">Split</button>
      <if condition="authCount > 0 || authScanFailed || mode == 'auth'"><button w-ref="{authTab}" type="button" ?data-selected="{{mode == 'auth'}}" @click="{showMode('auth')}">Auth <span>{{authBadge}}</span></button></if>
      <button type="button" ?data-selected="{{mode == 'details'}}" @click="{showMode('details')}">Raw data</button>
    </header>
    <div class="message-stage" ?hidden="{{boundaries.length <= 1}}">
      <select aria-label="Message stage" @change="{changeBoundary(e)}"><for each="stage in boundaries"><option key="{{stage.id}}" value="{{stage.id}}" ?selected="{{stage.id == boundary}}">{{stage.label}}</option></for></select>
      <span title="{{headSummary}}">{{headSummary}}</span>
    </div>
    <if condition="authSourceNotice"><p class="auth-source-notice" role="status">{{authSourceNotice}}</p></if>
    <div class="message-content" data-mode="{{mode}}" data-header-share="{{headerShare}}">
      <auth-inspector slot="{{pane}}-auth" ?hidden="{{mode != 'auth'}}" ?active="{{mode == 'auth'}}" ?visible="{{authVisible}}" :selection="{{authSelection}}" :interpretation="{{authInterpretation}}" @auth-body-close="{closeAuthBody()}" @auth-count="{onAuthCount(e)}" @auth-source="{showAuthSource(e)}"></auth-inspector>
      <if condition="mode != 'auth'">
      <section class="headers-view" ?hidden="{{mode != 'headers' && mode != 'split'}}">
        <div class="inspector-actions"><label class="header-viewer" ?hidden="{{!headerChoices.length}}">View <select aria-label="Headers viewer" @change="{changeHeaderViewer(e)}"><option value="raw" ?selected="{{headerViewer == 'raw'}}">Raw headers</option><for each="choice in headerChoices"><option key="{{choice.key}}" value="{{choice.key}}" ?selected="{{choice.key == headerViewer}}">{{choice.name}}</option></for></select></label><button type="button" class="secondary compact-button" @click="{copyUrl()}" ?disabled="{{!detail}}">Copy URL</button><button type="button" class="secondary compact-button" @click="{copyHeaders()}" ?disabled="{{!headerRows.length}}">Copy headers</button><details class="header-options" ?hidden="{{headerChoice}}"><summary>Header options</summary><div class="header-options-panel"><label class="checkbox-label"><input type="checkbox" ?checked="{{showHeaderSizes}}" @change="{toggleHeaderSizes(e)}"> Show byte sizes</label><button type="button" class="secondary compact-button" @click="{toggleHeaderOrder()}" ?disabled="{{!headerRows.length}}" aria-pressed="{{largestFirst}}">Largest first</button><span class="field-help" title="{{headersSummaryTitle}}">{{headersSummary}}</span><if condition="authorizationPresent"><span class="status-badge" title="Authorization header was present">AUTH</span></if><if condition="proxyAuthorizationPresent"><span class="status-badge" title="Proxy-Authorization header was present">PROXY AUTH</span></if><p>Authorization: {{authorizationState}} · Proxy-Authorization: {{proxyAuthorizationState}}</p><if condition="sourceIp"><span class="field-help">Client {{sourceIp}}</span></if></div></details></div>
        <if condition="headerChoice"><extension-visualizer slot="{{headerSlot}}" ?active="{{mode == 'headers' || mode == 'split'}}" :selection="{{headerSelection}}" :choice="{{headerChoice}}"></extension-visualizer></if>
        <div class="raw-headers" ?hidden="{{headerChoice}}"><if condition="headerPageText"><nav class="header-pages" aria-label="Header pages"><span>{{headerPageText}}</span><button type="button" class="secondary compact-button" @click="{previousHeaders()}" ?disabled="{{headerOffset == 0 || headersBusy}}">Previous headers</button><button type="button" class="secondary compact-button" @click="{nextHeaders()}" ?disabled="{{headerNextOffset == null || headersBusy}}">Next headers</button></nav></if>
        <table class="headers-table"><thead><tr><th>Name</th><th>Value</th><th class="header-size" ?hidden="{{!showHeaderSizes}}">Value size</th><th class="header-size" ?hidden="{{!showHeaderSizes}}">Field size</th></tr></thead><tbody><for each="header in headerRows"><tr id="{{pane}}-header-{{header.id}}" key="{{header.id}}" tabindex="0" @contextmenu="{headerContext(header,e)}" @keydown="{headerContext(header,e)}"><td>{{header.name}}</td><td>{{header.value}}</td><td class="header-size" ?hidden="{{!showHeaderSizes}}" title="{{header.valueSizeTitle}}">{{header.valueSize}}</td><td class="header-size" ?hidden="{{!showHeaderSizes}}" title="{{header.sizeTitle}}">{{header.size}}</td></tr></for></tbody></table>
        <if condition="!headerRows.length"><p class="inspector-empty">No headers available.</p></if></div>
      </section>
      <pane-divider ?hidden="{{mode != 'split'}}" orientation="horizontal" label="Resize headers and body" value="{{split}}" initial="35" @pane-resize="{resizeHeaders(e)}"></pane-divider>
      <section class="body-view" ?data-extension="{{bodyExtension}}" ?hidden="{{mode != 'body' && mode != 'split'}}">
        <div class="body-toolbar">
          <select w-ref="{bodyViewerControl}" aria-label="Body viewer" @change="{changeViewer(e)}"><option value="auto" ?selected="{{viewer == 'auto'}}">Auto</option><option value="formatted">Formatted JSON</option><option value="original-text">Text</option><option value="bytes">Hex</option><option value="image">Image</option><option value="metadata">Metadata</option><optgroup label="Authentication · entire body" ?disabled="{{!bodyMetadata || bodyMetadata.availability != 'complete' || bodyMetadata.retainedBytes == 0}}"><option value="auth:jose">JWT / JWS / JWE</option><option value="auth:saml">SAML XML</option><option value="auth:ntlm">NTLM token</option><option value="auth:negotiate">Negotiate token</option></optgroup><for each="choice in bodyChoices"><option key="{{choice.key}}" value="{{choice.key}}" ?selected="{{choice.key == viewer}}">{{choice.name}}</option></for></select>
          <if condition="bodySource && bodySourceFields"><div class="body-source-tabs" role="group" aria-label="JSON body view"><if condition="bodySourceMode == 'source'"><button w-ref="{bodySourceSourceTab}" type="button" class="secondary compact-button" aria-pressed="true">Source</button><button w-ref="{bodySourceFieldsTab}" type="button" class="secondary compact-button" aria-pressed="false" @click="{changeSourceMode('fields',e)}">Fields</button></if><if condition="bodySourceMode != 'source'"><button w-ref="{bodySourceSourceTab}" type="button" class="secondary compact-button" aria-pressed="false" @click="{changeSourceMode('source',e)}">Source</button><button w-ref="{bodySourceFieldsTab}" type="button" class="secondary compact-button" aria-pressed="true">Fields</button></if></div></if><details w-ref="{bodyOptions}" class="body-options" ?hidden="{{bodyExtension}}"><summary>Body options</summary><div class="body-options-panel">          <label class="checkbox-label"><input type="checkbox" ?checked="{{decodeContent && viewer != 'bytes' && viewer != 'metadata'}}" ?disabled="{{viewer == 'bytes' || viewer == 'metadata'}}" @change="{changeDecoding(e)}"> Decode</label>
          <div class="preview-options" ?hidden="{{viewer == 'bytes' || pagedHex}}"><label>Preview limit (bytes) <input w-ref="{bodyLimit}" type="number" min="1" max="16777216" value="262144" @change="{inspectBody()}"></label><button type="button" class="secondary compact-button" @click="{inspectBody()}">Refresh preview</button></div><p>Copy uses the displayed preview. Save as saves the full retained body with content decoding.</p>
<if condition="bodySource"><label>Language <select aria-label="Source language" @change="{changeSourceLanguage(e)}"><option value="auto" ?selected="{{bodySourceLanguage == 'auto'}}">Auto</option><option value="plaintext" ?selected="{{bodySourceLanguage == 'plaintext'}}">Plain text</option><option value="json" ?selected="{{bodySourceLanguage == 'json'}}">JSON</option><option value="html" ?selected="{{bodySourceLanguage == 'html'}}">HTML</option><option value="xml" ?selected="{{bodySourceLanguage == 'xml'}}">XML</option><option value="css" ?selected="{{bodySourceLanguage == 'css'}}">CSS</option><option value="javascript" ?selected="{{bodySourceLanguage == 'javascript'}}">JavaScript</option></select></label><label class="checkbox-label"><input type="checkbox" ?checked="{{bodySourceWrap}}" @change="{changeSourceWrap(e)}"> Wrap</label><button type="button" class="secondary compact-button" @click="{findSource()}" ?disabled="{{bodySourceLimited}}" title="Find in loaded preview (Ctrl+F)">Find</button><if condition="bodySourceLimited"><p>Find requires a syntax preview up to 1 MiB. Lower Preview limit to use it; this larger preview remains selectable plain text.</p></if></if></div></details>
          <if condition="side == 'response'"><button type="button" class="secondary compact-button" title="Save the full original response body with content decoding" @click="{saveBody()}" ?disabled="{{saving || !bodyMetadata || bodyMetadata.availability != 'complete' || bodyMetadata.retainedBytes == 0}}"><if condition="saving">Saving…</if><if condition="!saving">Save as…</if></button></if>
        </div>
        <if condition="bodyChoice"><extension-visualizer slot="{{bodySlot}}" ?automatic="{{viewer == 'auto'}}" @automatic-rejected="{automaticRejected(e)}" ?active="{{mode == 'body' || mode == 'split'}}" :selection="{{bodySelection}}" :choice="{{bodyChoice}}"></extension-visualizer></if>
        <details class="body-facts" ?hidden="{{bodyExtension}}"><summary><strong>{{viewerLabel}}</strong><span>{{bodySummary}}</span></summary><p>{{bodyFacts}}</p></details>
        <div class="body-scroll" ?hidden="{{bodyExtension}}" ?data-hex="{{hexPreview != null}}">
          <if condition="bodyNotice"><pre ?data-copy-surface="{{!loading}}" data-copy-label="Explanation" class="body-notice" role="status" tabindex="0">{{bodyNotice}}</pre></if><if condition="hexPreview != null"><hex-viewer :preview="{{hexPreview}}"></hex-viewer></if>
          <if condition="bodySource"><body-source-viewer w-ref="{bodySourceViewer}" :preview="{{bodySource}}" :language="{{bodySourceLanguage}}" :sourceWrap="{{bodySourceWrap}}" :sourceMode="{{bodySourceMode}}" @source-fields="{sourceFields(e)}" @source-mode="{sourceMode(e)}" @source-ready="{sourceReady(e)}" @source-limited="{sourceLimited(e)}" ?active="{{mode == 'body' || mode == 'split'}}"></body-source-viewer></if>
          <if condition="!bodySource && bodyText"><pre data-copy-surface class="body-preview" data-copy-label="{{bodyCopyLabel}}" tabindex="0">{{bodyText}}</pre></if>
          <if condition="imageUrl"><img class="body-image-preview" src="{{imageUrl}}" alt="Response image preview" decoding="async"></if>
        </div>
      </section>
      <pre data-copy-surface class="exchange-details" data-copy-label="Raw data" tabindex="0" ?hidden="{{mode != 'details'}}">{{detailsText}}</pre>
      </if>
    </div>
  </section>
</template>
