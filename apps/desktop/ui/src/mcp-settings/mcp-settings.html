<template>
<section class="mcp-panel" aria-labelledby="mcp-heading">
 <h2 id="mcp-heading">MCP agent access</h2>
 <p>Let Codex, Copilot CLI and other agents inspect and change traffic using individually authorized access keys.</p>
 <label class="mcp-switch"><input type="checkbox" ?checked="{{mcpEnabled}}" ?disabled="{{mcpBusy || !mcpLoaded}}" @change="{toggle(e)}"> Allow MCP connections</label>
 <p class="field-help">Connections are available only on this computer. Turning this off ends connections and temporary changes; saved keys can reconnect when re-enabled. Starting MCP does not start the proxy or recording.</p>
 <p role="status" class="mcp-status">{{mcpText}}</p>
 <if condition="mcpError"><p role="alert" class="mcp-error">{{mcpError}}</p></if>
 <div class="mcp-actions"><button type="button" class="secondary compact-button" @click="{refresh()}" ?disabled="{{mcpBusy}}">Refresh</button><if condition="mcpEnabled"><button type="button" class="secondary compact-button" @click="{retry()}" ?disabled="{{mcpBusy}}">Retry listener</button><span class="field-help">{{mcpEndpoint}}</span></if></div>
 <div class="mcp-actions mcp-key-heading"><h3>Access keys</h3><button type="button" w-ref="{mcpCreateButton}" @click="{create()}" ?disabled="{{mcpBusy || !mcpLoaded}}">Create access key…</button><if condition="mcpRows.length"><button type="button" class="secondary" @click="{revokeAll(e)}" ?disabled="{{mcpBusy}}">Revoke all access…</button></if></div>
 <if condition="!mcpRows.length"><p class="field-help">Create a key, choose its permissions, then put it in one agent's configuration. Each CLI invocation must present the key.</p></if>
 <div class="mcp-keys"><for each="key in mcpRows"><article key="{{key.id}}" class="mcp-key"><div class="mcp-actions"><h4>{{key.name}}</h4><span>{{key.stateText}}</span><if condition="!key.revoked"><button type="button" class="secondary compact-button" @click="{edit(key.id, e)}" ?disabled="{{mcpBusy}}">Edit permissions…</button><button type="button" class="secondary compact-button" @click="{replace(key.id, e)}" ?disabled="{{mcpBusy}}">Replace key…</button><button type="button" class="secondary compact-button" @click="{revoke(key.id, e)}" ?disabled="{{mcpBusy}}">Revoke…</button></if><if condition="key.revoked"><button type="button" class="secondary compact-button" @click="{removeRecord(key.id)}" ?disabled="{{mcpBusy}}">Remove record</button></if></div><p>{{key.scopeText}}</p><p class="field-help">{{key.permissionText}}</p><if condition="key.omitSensitiveValues != false"><p class="field-help">Authentication headers and bodies are omitted unless you temporarily allow original values.</p></if><p class="field-help">Last used: {{key.lastUsedText}} · Expires: {{key.expiryText}}</p></article></for></div>
 <if condition="mcpControls.length"><h3>Temporary control sessions</h3><for each="control in mcpControls"><div key="{{control.id}}" class="mcp-control"><span>{{control.name}} · expires {{control.expiryText}}</span><button type="button" class="secondary compact-button" @click="{endControl(control.id)}" ?disabled="{{mcpBusy}}">End control</button></div></for></if>
 <if condition="mcpRules.length"><details><summary>Agent rule drafts and temporary changes</summary><for each="rule in mcpRules"><div key="{{rule.id}}" class="mcp-control"><span>{{rule.name}} <if condition="rule.enabled">· Active</if><if condition="!rule.enabled">· Disabled draft</if></span><button type="button" class="secondary compact-button" @click="{reviewRule(rule.id)}">Review in Rules</button><button type="button" class="secondary compact-button" @click="{keepRule(rule.id, e)}" ?disabled="{{mcpBusy}}">Keep changes…</button></div></for></details></if>
 <if condition="mcpActivity.length"><details><summary>Recent activity in this app run</summary><for each="activity in mcpActivity"><p class="field-help">{{activity.timeText}} · {{activity.name}} · {{activity.operation}} · {{activity.outcome}}</p></for></details></if>
 <p class="field-help mcp-help">A key identifies its approved grant, not a verified executable. Give each agent a separate key so its access can be revoked independently. Keys survive restarts until they expire or are revoked; temporary control sessions do not.</p>
</section>
<dialog w-ref="{mcpDialog}" class="mcp-dialog" aria-labelledby="mcp-create-title" @cancel="{cancelEditor(e)}" @close="{editorClosed()}"><form w-ref="{mcpForm}" @submit="{save(e)}" @input="{changed()}" @change="{changed()}">
 <h2 id="mcp-create-title"><if condition="!mcpEditingId">Create access key</if><if condition="mcpEditingId">Edit agent permissions</if></h2>
 <fieldset ?disabled="{{mcpBusy}}"><label>Name <input name="name" required maxlength="80" autocomplete="off" placeholder="For example, Codex — work"></label>
 <label>Traffic scope <select name="scope" aria-label="Traffic scope"><option value="hosts">Specific hosts</option><option value="requests">Selected requests</option><option value="all">All traffic in the main workspace</option></select></label>
 <div ?hidden="{{mcpScopeKind != 'hosts'}}"><label>Exact hosts <textarea name="hosts" rows="3" placeholder="localhost&#10;api.example.test"></textarea></label><p class="field-help">One host per line, on any port. No schemes, paths or wildcards. Includes existing and future matching traffic.</p></div>
 <if condition="mcpScopeKind == 'requests'"><div class="mcp-actions"><span>{{mcpSelectedCount}} requests</span><button type="button" class="secondary compact-button" @click="{useSelection()}">Use current selection</button></div><p class="field-help">These exact requests are frozen when you choose them. Changing selection does not expand access. This scope expires when the workspace is closed or restarted.</p></if>
 <label>Expires <input name="expiry" type="datetime-local"></label><p class="field-help">Leave empty to allow access until revoked.</p>
 <label><input name="omit-sensitive-values" type="checkbox" checked> Omit authentication headers and bodies</label><p class="field-help">On by default. Known authentication headers and all message bodies stay hidden even when their read permissions are selected. An agent can ask you here in Transmog for a one-minute exception or to turn this off permanently.</p><div class="mcp-permissions"><label><input name="inspect" type="checkbox" checked> View request details</label><p class="field-help">Search URLs, masked headers, status, timings and modification evidence.</p><p class="field-help">Every valid key can read relevant rules and their side effects. Credential and body values require their separate permissions.</p><label><input name="read-bodies" type="checkbox"> Read message bodies</label><p class="field-help">Request and response content may contain personal data or credentials.</p><label><input name="collect" type="checkbox"> Control collection</label><p class="field-help">Start or stop the shared proxy and recording. Proxy control affects the whole live workspace and may change system proxy settings.</p><label><input name="prepare-changes" type="checkbox"> Prepare changes</label><p class="field-help">Create and test your own disabled header and response-text rule drafts.</p><label><input name="edit-shared-rules" type="checkbox"> Edit shared rules</label><p class="field-help">Collaborate with a human on existing saved header and response-text rules. Saved edits are durable and remain after access ends. Updating or disabling an enabled rule also requires Change live traffic.</p><label><input name="modify" type="checkbox"> Change live traffic</label><p class="field-help">Apply temporary rules and targeted breakpoints. Combined with Edit shared rules, also change or disable existing enabled rules. Ending temporary control aborts unresolved paused requests.</p><label><input name="send" type="checkbox"> Send requests</label><p class="field-help">Send or replay requests to approved destinations; requests can change server data.</p></div>
 <details><summary>Sensitive header access</summary><label><input name="read-credentials" type="checkbox"> Read unmasked credential headers</label><p class="field-help">Includes Authorization, cookies and related credentials. Whole-workspace recordings and editable breakpoint envelopes require this permission. Header masking does not sanitize arbitrary URLs or bodies.</p></details>
 </fieldset><p class="field-help">Data shared with an agent may be sent to its AI provider. Creating or saving this key grants the selected access without another connection prompt.</p>
 <if condition="mcpDialogError"><p role="alert" class="mcp-error">{{mcpDialogError}}</p></if><div class="mcp-actions"><button type="submit" ?disabled="{{mcpBusy || !mcpDirty}}"><if condition="!mcpEditingId">Create key</if><if condition="mcpEditingId">Save permissions</if></button><button type="button" class="secondary" @click="{closeEditor()}" ?disabled="{{mcpBusy}}">Cancel</button></div>
</form></dialog>
<dialog w-ref="{mcpKeyDialog}" class="mcp-dialog" aria-labelledby="mcp-key-title" @close="{clearKey()}"><h2 id="mcp-key-title">Save your access key</h2><p>This key is shown once. Save it in this agent's private configuration. Transmog stores a verifier and cannot show it again.</p><label>Access key <input type="password" readonly autocomplete="off" value="{{mcpSecret}}"></label><div class="mcp-actions"><button type="button" @click="{copyKey()}">Copy key</button></div><label>Agent configuration <select aria-label="Agent configuration" @change="{configChanged(e)}"><option value="codex" ?selected="{{mcpClient == 'codex'}}">Codex</option><option value="copilot" ?selected="{{mcpClient == 'copilot'}}">Copilot CLI / JSON configuration</option></select></label><label><input type="checkbox" ?checked="{{mcpAutoStart}}" @change="{configChanged(e)}"> Start Transmog when needed</label><p class="field-help">Allows an explicit connection request to launch the desktop. MCP must already be enabled. The CLI must be installed beside the desktop executable.</p><p role="status">{{mcpCopyText}}</p><textarea class="mcp-config" readonly rows="9" aria-label="Agent configuration containing access key">{{mcpConfig}}</textarea><p class="field-help">The configuration contains the secret. Keep it out of source control and shared logs. Each agent should use its own key.</p><if condition="mcpDialogError"><p role="alert" class="mcp-error">{{mcpDialogError}}</p></if><div class="mcp-actions"><button type="button" @click="{copyConfig()}">Copy configuration</button><button type="button" class="secondary" @click="{closeKey()}">Done</button></div></dialog>
<dialog w-ref="{mcpConfirmDialog}" class="mcp-dialog mcp-confirm" aria-labelledby="mcp-confirm-title" @close="{confirmClosed()}"><h2 id="mcp-confirm-title">{{mcpConfirmLabel}}</h2><p>{{mcpConfirmText}}</p><div class="mcp-actions"><button type="button" @click="{confirmNow()}">{{mcpConfirmLabel}}</button><button type="button" class="secondary" @click="{closeConfirm()}">Cancel</button></div></dialog>
</template>
