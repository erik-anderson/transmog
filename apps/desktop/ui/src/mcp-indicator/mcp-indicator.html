<template>
<button type="button" class="secondary compact-button mcp-indicator-button" ?hidden="{{!mcpIndicatorVisible}}" ?data-connected="{{mcpActiveAgents.length > 0}}" w-ref="{mcpIndicatorButton}" title="Manage MCP agent access and temporary approvals" popovertarget="mcp-access-panel"><span class="mcp-access-badge" ?hidden="{{!mcpBadgeText}}" ?data-sensitive="{{mcpSensitiveTemporary.length > 0}}">{{mcpBadgeText}}</span><span class="mcp-indicator-label"><span class="status-dot" aria-hidden="true"></span>{{mcpIndicatorText}}</span></button>
<section popover="auto" id="mcp-access-panel" w-ref="{mcpAccessPanel}" class="mcp-access-panel" role="dialog" aria-labelledby="mcp-access-heading" @toggle="{panelToggled(e)}">
 <header><h2 id="mcp-access-heading">Agent access</h2><button type="button" class="secondary compact-button" aria-label="Close agent access" @click="{prepareClose()}" popovertarget="mcp-access-panel" popovertargetaction="hide">Close</button></header>
 <if condition="mcpSensitiveTemporary.length"><h3>Temporary unredacted access</h3><for each="approval in mcpSensitiveTemporary"><article key="{{approval.id}}"><h4>{{approval.name}}</h4><p class="mcp-access-scope">{{approval.scopeText}}</p><div class="mcp-access-actions"><strong>Ends in {{approval.remainingText}}</strong><button type="button" class="secondary" @click="{revoke(approval.id)}" ?disabled="{{mcpSensitiveBusy}}">Revoke access now</button></div></article></for></if>
 <if condition="mcpSensitiveRequests.length"><h3>Unredacted values requested</h3><p>Allow this agent to read known authentication headers and all message bodies within its existing traffic scope. These values may contain credentials or personal data and may be sent to the agent's provider.</p>
 <for each="request in mcpSensitiveRequests"><article key="{{request.id}}"><h4>{{request.name}}</h4><p class="mcp-access-scope">{{request.scopeText}}</p><p class="mcp-access-reason">{{request.reason}}</p><div class="mcp-access-actions"><button type="button" @click="{decide(request.id, 'minute')}" ?disabled="{{mcpSensitiveBusy}}">For next 1 minute</button><button type="button" class="secondary" @click="{decide(request.id, 'always')}" ?disabled="{{mcpSensitiveBusy}}">Always</button><button type="button" class="secondary" @click="{decide(request.id, 'deny')}" ?disabled="{{mcpSensitiveBusy}}">Deny</button></div></article></for>
 <p class="field-help">Always turns off this key's saved redaction setting. Temporary approval does not change the saved setting and ends after 60 seconds, on revocation, or when the app closes. Other operations and traffic scope stay the same.</p></if>
 <if condition="mcpActiveAgents.length"><h3>Connected agents</h3><ul class="mcp-connected-agents"><for each="agent in mcpActiveAgents"><li key="{{agent.id}}">{{agent.name}}</li></for></ul><p class="field-help">Authenticated desktop calls, including those completed in the last 3 seconds. Names identify access keys.</p></if>
 <if condition="mcpControlText"><p>{{mcpControlText}}</p></if>
 <if condition="!mcpSensitiveRequests.length && !mcpSensitiveTemporary.length"><p>No requests for unredacted values or temporary approvals. Saved permissions and redaction settings still apply.</p></if>
 <if condition="mcpSensitiveError"><p role="alert" class="mcp-access-error">{{mcpSensitiveError}}</p></if>
 <button type="button" class="secondary" @click="{open()}">Manage access keys…</button>
</section>
</template>
