<template>
<section id="captures" class="app-view tool-view" aria-labelledby="captures-heading" ?hidden="{{view != 'captures'}}" ?data-active="{{view == 'captures'}}">
 <div class="capture-page">
  <header class="workspace-header"><h1 id="captures-heading">Capture tools</h1><nav class="capture-tabs" aria-label="Capture tasks"><button type="button" ?data-selected="{{captureTask == 'record'}}" @click="{showCaptureTask('record')}">Record to file</button><button type="button" ?data-selected="{{captureTask == 'inspect'}}" @click="{showCaptureTask('inspect')}">Inspect / recover</button><button type="button" ?data-selected="{{captureTask == 'export'}}" @click="{showCaptureTask('export')}">Convert / export</button></nav><span class="capture-state" role="status">{{captureStateText}}</span></header>
  <div class="capture-content">
   <section ?hidden="{{captureTask != 'record'}}"><p class="capture-path" ?hidden="{{!capturePathText}}">{{capturePathText}}</p><form w-ref="{captureForm}" @submit="{startCapture(e)}"><fieldset ?disabled="{{captureBusy || captureActive}}"><p class="field-help">Write traffic to a TMCap file without adding it to Traffic. Choose a file to start recording. If the proxy is running, active requests finish before recording begins. Stop recording saves the file and turns off proxy routing.</p><label><input name="encrypt" type="checkbox"> Encrypt with a password (AES-256)</label><p class="field-help">Records are compressed individually. Encryption protects traffic and trace metadata; keep the password to reopen the file.</p><label><input name="redactHeaders" type="checkbox"> Redact sensitive header values in this recording</label><p class="field-help">Redacts Authorization, Proxy-Authorization, Cookie and Set-Cookie. Privacy settings also apply; bodies, URLs and network context may contain private data.</p><label>Traffic to record<select name="bodies" aria-label="Traffic to record" @change="{recordBodiesChanged(e)}"><option value="headers" ?selected="{{recordingContent == 'headers'}}">Headers only</option><option value="bodies" ?selected="{{recordingContent == 'bodies'}}">Headers and bodies</option></select></label><label><input name="networkContext" type="checkbox"> Include this computer’s network configuration</label><p class="field-help">Records adapter addresses, DNS settings and computer names. Files have no size ceiling. Bodies follow your request retention limit; captured traffic may contain private data.</p><button type="submit" ?disabled="{{lifecycle == 'starting' || lifecycle == 'stopping' || lifecycle == 'failed'}}"><if condition="lifecycle == 'stopped'">Start recording…</if><if condition="lifecycle != 'stopped'">Switch to recording…</if></button></fieldset><div class="actions"><button type="button" class="secondary" ?hidden="{{!captureWaiting}}" @click="{cancelRecordingStart()}">Cancel recording</button><button type="button" @click="{stopCapture()}" ?disabled="{{captureBusy || !captureActive}}">Stop recording</button><button type="button" class="secondary" @click="{refreshCapture()}" ?disabled="{{captureBusy}}">Refresh status</button></div></form><if condition="captureActive"><section aria-label="Incident marker"><label>Optional incident note<textarea w-ref="{incidentNote}" maxlength="2048" rows="2"></textarea></label><p class="field-help">Record when the issue happens. The marker belongs to this file recording; it does not add requests to Traffic.</p><button type="button" class="secondary" @click="{markIncident()}" ?disabled="{{incidentMarkBusy}}">Issue happened here</button></section></if><p role="status">{{incidentMarkStatus}}</p></section>
   <section ?hidden="{{captureTask != 'inspect'}}"><trace-drop-target ?active="{{view == 'captures' && captureTask == 'inspect'}}" ?busy="{{captureBusy}}"></trace-drop-target><form w-ref="{inspectionForm}" @submit="{inspectCapture(e)}"><label>Trace file <span class="file-field"><input name="source" aria-label="Trace file" value="session.tmcap" required><button type="button" class="secondary" @click="{chooseInspectionPath()}" ?disabled="{{captureBusy}}">Browse…</button></span></label><div class="actions"><button type="submit" ?disabled="{{captureBusy}}">Inspect trace metadata</button><button type="button" @click="{importInspectionTrace()}" ?disabled="{{captureBusy}}">Import trace</button><button type="button" class="secondary" @click="{useInspectedForExport()}" ?hidden="{{!canExportInspected}}">Convert/export inspected trace…</button></div></form></section>
   <section ?hidden="{{captureTask != 'export'}}"><form w-ref="{exportForm}" @submit="{exportCapture(e)}"><label>Source capture <span class="file-field"><input name="source" aria-label="Source capture" value="session.tmcap" required><button type="button" class="secondary" @click="{chooseExportSource()}" ?disabled="{{captureBusy}}">Browse…</button></span></label><label>Format <select name="format" aria-label="Format" @change="{exportFormatChanged()}"><option value="native">TMCap snapshot</option><option value="json-lines">JSON lines</option><option value="saz-strict">SAZ · compatibility</option><option value="saz-extended">SAZ · extended fidelity</option></select></label><label>New export file <span class="file-field"><input name="destination" aria-label="New export file" value="session.exported.tmcap" required><button type="button" class="secondary" @click="{chooseCapturePath('export')}" ?disabled="{{captureBusy}}">Choose…</button></span></label><label ?hidden="{{!exportCanEncrypt}}"><input name="encrypt" type="checkbox" ?disabled="{{!exportCanEncrypt}}"> Encrypt with a password (AES-256)</label><p class="field-help" ?hidden="{{!exportCanEncrypt}}">Encrypted SAZ files require a password-capable ZIP reader. ZIP member names remain visible.</p><label><input name="redactHeaders" type="checkbox"> Redact sensitive header values in this copy</label><p class="field-help">Redacts Authorization, Proxy-Authorization, Cookie and Set-Cookie. Bodies, URLs and metadata may still contain private data.</p><button type="submit" ?disabled="{{captureBusy}}">Export file</button><p class="field-help">Exports create a new file. Choose an unused name to keep existing files intact.</p></form></section>
   <section class="capture-receipt" ?hidden="{{!captureFacts.length}}" aria-label="Capture result"><dl><for each="fact in captureFacts"><div key="{{fact.label}}"><dt>{{fact.label}}</dt><dd>{{fact.value}}</dd></div></for></dl><details ?open="{{captureMetadataExpanded}}" @toggle="{captureMetadataToggled(e)}"><summary>Trace metadata and technical details</summary><pre tabindex="0">{{captureDetails}}</pre></details></section>
  </div>
  <output class="capture-feedback" aria-live="polite"><if condition="captureBusy && !captureWaiting">Working…</if><if condition="captureWaiting">{{captureText}}</if><if condition="!captureBusy">{{captureText}}</if><span class="capture-error" ?hidden="{{!captureError}}"><span class="field-error">{{captureError}}</span><button type="button" class="secondary compact-button" aria-label="Dismiss capture error" @click="{dismissCaptureError()}">×</button></span></output>
 </div>
</section>
</template>
