<template>
<section id="captures" class="app-view tool-view" aria-labelledby="captures-heading" ?hidden="{{view != 'captures'}}" ?data-active="{{view == 'captures'}}">
 <div class="capture-page">
  <header class="workspace-header"><h1 id="captures-heading">Capture tools</h1><nav class="capture-tabs" aria-label="Capture tasks"><button type="button" w-ref="{recordTaskButton}" ?data-selected="{{captureTask == 'record'}}" aria-pressed="{{captureTaskPressed.record}}" @click="{showCaptureTask('record')}">Record to file</button><button type="button" ?data-selected="{{captureTask == 'inspect'}}" aria-pressed="{{captureTaskPressed.inspect}}" @click="{showCaptureTask('inspect')}">Inspect / recover</button><button type="button" ?data-selected="{{captureTask == 'convert'}}" aria-pressed="{{captureTaskPressed.convert}}" @click="{showCaptureTask('convert')}">Convert</button><button type="button" ?data-selected="{{captureTask == 'export'}}" aria-pressed="{{captureTaskPressed.export}}" @click="{showCaptureTask('export')}">Export</button></nav><span class="capture-state" role="status">{{captureStateText}}</span></header>
  <div class="capture-content">
   <section ?hidden="{{captureTask != 'record'}}"><p class="capture-path" ?hidden="{{!capturePathText}}">{{capturePathText}}</p><form w-ref="{captureForm}" @submit="{startCapture(e)}"><fieldset ?disabled="{{captureBusy || captureActive}}"><p class="field-help">Write traffic to a TMCap file without adding it to Traffic. Choose a file to start recording. If the proxy is running, active requests finish before recording begins. Stop recording saves the file and turns off proxy routing.</p><label><input name="encrypt" type="checkbox"> Encrypt with a password (AES-256)</label><p class="field-help">Records are compressed individually. Encryption protects traffic and trace metadata; keep the password to reopen the file.</p><label><input name="redactHeaders" type="checkbox"> Redact sensitive header values in this recording</label><p class="field-help">Redacts Authorization, Proxy-Authorization, Cookie and Set-Cookie. Privacy settings also apply; bodies, URLs and network context may contain private data.</p><label>Traffic to record<select name="bodies" aria-label="Traffic to record" @change="{recordBodiesChanged(e)}"><option value="headers" ?selected="{{recordingContent == 'headers'}}">Headers only</option><option value="bodies" ?selected="{{recordingContent == 'bodies'}}">Headers and bodies</option></select></label><label><input name="networkContext" type="checkbox"> Include this computer’s network configuration</label><p class="field-help">Records adapter addresses, DNS settings and computer names. Files have no size ceiling. Bodies follow your request retention limit; captured traffic may contain private data.</p><button type="submit" ?disabled="{{lifecycle == 'starting' || lifecycle == 'stopping' || lifecycle == 'failed'}}"><if condition="lifecycle == 'stopped'">Start recording…</if><if condition="lifecycle != 'stopped'">Switch to recording…</if></button></fieldset><div class="actions"><button type="button" class="secondary" ?hidden="{{!captureWaiting}}" @click="{cancelRecordingStart()}">Cancel recording</button><button type="button" @click="{stopCapture()}" ?disabled="{{captureBusy || !captureActive}}">Stop recording</button><button type="button" class="secondary" @click="{refreshCapture()}" ?disabled="{{captureBusy}}">Refresh status</button></div></form><if condition="captureActive"><section aria-label="Incident marker"><label>Optional incident note<textarea w-ref="{incidentNote}" maxlength="2048" rows="2"></textarea></label><p class="field-help">Record when the issue happens. The marker belongs to this file recording; it does not add requests to Traffic.</p><button type="button" class="secondary" @click="{markIncident()}" ?disabled="{{incidentMarkBusy}}">Issue happened here</button></section></if><p role="status">{{incidentMarkStatus}}</p></section>
   <section ?hidden="{{captureTask != 'inspect'}}"><p class="capture-intro">Inspect a saved trace’s metadata, recover a readable recording, or import its requests into Traffic.</p><trace-drop-target ?active="{{view == 'captures' && captureTask == 'inspect'}}" ?busy="{{captureBusy}}"></trace-drop-target><form w-ref="{inspectionForm}" @submit="{inspectCapture(e)}"><label>Trace file <span class="file-field"><input name="source" aria-label="Trace file" placeholder="Choose or enter a saved trace path" required><button type="button" class="secondary" @click="{chooseInspectionPath()}" ?disabled="{{captureBusy}}">Browse…</button></span></label><div class="actions"><button type="submit" ?disabled="{{captureBusy}}">Inspect trace metadata</button><button type="button" @click="{importInspectionTrace()}" ?disabled="{{captureBusy}}">Import trace</button><button type="button" class="secondary" @click="{useInspectedForExport()}" ?hidden="{{!canExportInspected}}">Convert inspected trace…</button></div></form></section>
   <section ?hidden="{{captureTask != 'convert'}}"><p class="capture-intro" id="capture-convert-help">Convert a saved TMCap file to a new TMCap, JSON lines or SAZ file. Choose the source file, output format and a new destination below.</p><form aria-describedby="capture-convert-help" w-ref="{exportForm}" @submit="{exportCapture(e)}"><label>Source file (.tmcap) <span class="file-field"><input name="source" aria-label="Source file (.tmcap)" placeholder="Choose or enter a saved TMCap path" required><button type="button" class="secondary" @click="{chooseExportSource()}" ?disabled="{{captureBusy}}">Browse…</button></span></label><label>Format <select name="format" aria-label="Format" @change="{exportFormatChanged()}"><option value="native">TMCap snapshot</option><option value="json-lines">JSON lines</option><option value="saz-strict">SAZ · compatibility</option><option value="saz-extended">SAZ · extended fidelity</option></select></label><label>Destination file <span class="file-field"><input name="destination" aria-label="Destination file" placeholder="Choose or enter a new file path" required><button type="button" class="secondary" @click="{chooseCapturePath('export')}" ?disabled="{{captureBusy}}">Choose…</button></span></label><label ?hidden="{{!exportCanEncrypt}}"><input name="encrypt" type="checkbox" ?disabled="{{!exportCanEncrypt}}"> Encrypt with a password (AES-256)</label><p class="field-help" ?hidden="{{!exportCanEncrypt}}">Keep the password to reopen the converted file. For SAZ, ZIP member names remain visible.</p><label><input name="redactHeaders" type="checkbox"> Redact sensitive header values in this copy</label><p class="field-help">Redacts Authorization, Proxy-Authorization, Cookie and Set-Cookie. Bodies, URLs and metadata may still contain private data.</p><button type="submit" ?disabled="{{captureBusy}}">Convert file</button><p class="field-help">Creates a new file and keeps the source unchanged. Choose an unused destination name.</p></form></section>
   <section ?hidden="{{captureTask != 'export'}}" aria-label="Export traffic">
    <h2 class="capture-task-heading">Export traffic from the Traffic view</h2>
    <p class="capture-intro">To save captured or imported requests, open <strong>Traffic → Files → Save copy…</strong>.</p>
    <p class="capture-intro">Choose all retained traffic, selected requests or filtered results, then save as TMCap, HAR or SAZ.</p>
    <button type="button" w-ref="{trafficFilesButton}" @click="{openTrafficFiles()}">Open Traffic Files</button>
   </section>
   <section class="capture-receipt" ?hidden="{{captureTask == 'export' || !captureFacts.length}}" aria-label="Capture result"><dl data-copy-surface><for each="fact in captureFacts"><div key="{{fact.label}}"><dt>{{fact.label}}</dt><dd tabindex="0">{{fact.value}}</dd></div></for></dl><details ?open="{{captureMetadataExpanded}}" @toggle="{captureMetadataToggled(e)}"><summary>Trace metadata and technical details</summary><pre data-copy-surface tabindex="0">{{captureDetails}}</pre></details></section>
  </div>
  <output class="capture-feedback" aria-live="polite"><if condition="captureBusy && !captureWaiting">Working…</if><if condition="captureWaiting">{{captureText}}</if><if condition="!captureBusy">{{captureText}}</if><span class="capture-error" ?hidden="{{!captureError}}"><span class="field-error">{{captureError}}</span><button type="button" class="secondary compact-button" aria-label="Dismiss capture error" @click="{dismissCaptureError()}">×</button></span></output>
 </div>
</section>
</template>
