[package]
name = "transmog-desktop"
description = "Windows Tauri product shell for Transmog"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[lib]
name = "transmog_desktop"
path = "src/lib.rs"

[[bin]]
name = "transmog"
path = "src/main.rs"

[dependencies]
transmog-app = { version = "=1.0.0", path = "../../crates/app" }
transmog-app-webui = { version = "=1.0.0", path = "../../crates/app-webui" }
transmog-session = { version = "=1.0.0", path = "../../crates/proxy-session" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
minisign-verify = "=0.2.5"
semver = "=1.0.28"
percent-encoding.workspace = true
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
transmog-webview-preview-windows = { version = "=1.0.0", path = "../../crates/webview-preview-windows" }
rfd = { version = "=0.17.2", default-features = false }
tauri = { version = "=2.12.1", default-features = false, features = ["wry"] }
tauri-plugin-single-instance = "=2.4.5"
tauri-plugin-updater = { version = "=2.13.2", default-features = false, features = ["rustls-tls", "system-proxy"] }
transmog-host-windows = { version = "=1.0.0", path = "../../crates/host-windows" }

[target.'cfg(windows)'.build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[lints]
workspace = true

