[package]
name = "transmog-desktop"
description = "Windows Tauri product shell for Transmog"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[features]
# Owned loopback peers and public fixture metadata for opt-in desktop acceptance.
# No fixture is created unless the isolated-profile environment flag is present.
desktop-test-fixtures = ["dep:boring", "dep:bytes", "dep:http", "dep:http-body-util", "dep:hyper", "dep:hyper-util", "dep:quiche", "dep:tokio-boring", "dep:transmog-core", "dep:transmog-http"]

[lib]
name = "transmog_desktop"
path = "src/lib.rs"

[[bin]]
name = "transmog"
path = "src/main.rs"

[dependencies]
transmog-app = { version = "=0.1.11", path = "../../crates/app" }
transmog-portable = { version = "=0.1.11", path = "../../crates/portable" }
transmog-capture = { version = "=0.1.11", path = "../../crates/proxy-capture" }
getrandom.workspace = true
transmog-app-webui = { version = "=0.1.11", path = "../../crates/app-webui" }
transmog-session = { version = "=0.1.11", path = "../../crates/proxy-session" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
minisign-verify = "=0.3.0"
semver = "=1.0.28"
percent-encoding.workspace = true
tempfile.workspace = true

[target.'cfg(windows)'.dependencies]
windows-registry = "=0.6.1"
hex.workspace = true
sha2.workspace = true
boring = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
http = { workspace = true, optional = true }
http-body-util = { workspace = true, optional = true }
hyper = { workspace = true, optional = true }
hyper-util = { workspace = true, optional = true }
quiche = { workspace = true, optional = true }
tokio-boring = { workspace = true, optional = true }
transmog-core = { version = "=0.1.11", path = "../../crates/proxy-core", optional = true }
transmog-http = { version = "=0.1.11", path = "../../crates/proxy-http", optional = true }
transmog-tls = { version = "=0.1.11", path = "../../crates/proxy-tls" }
transmog-webview-preview-windows = { version = "=0.1.11", path = "../../crates/webview-preview-windows" }
rfd = { version = "=0.17.2", default-features = false }
tauri = { version = "=2.12.4", default-features = false, features = ["wry"] }
tauri-plugin-single-instance = "=2.5.4"
tauri-plugin-updater = { version = "=2.14.0", default-features = false, features = ["rustls-tls", "system-proxy"] }
# Configure the updater's existing client without introducing another TLS stack.
reqwest = { version = "=0.13.5", default-features = false }
transmog-host-windows = { version = "=0.1.11", path = "../../crates/host-windows" }

[target.'cfg(windows)'.dev-dependencies]
tauri = { version = "=2.12.4", default-features = false, features = ["test"] }
transmog-automation = { version = "=0.1.11", path = "../../crates/proxy-automation" }
transmog-core = { version = "=0.1.11", path = "../../crates/proxy-core" }

[build-dependencies]
transmog-extensions = { version = "=0.1.11", path = "../../crates/extensions" }

[target.'cfg(windows)'.build-dependencies]
tauri-build = { version = "=2.7.3", features = [] }

[lints]
workspace = true

