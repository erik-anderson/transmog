[package]
name = "transmog-dotnet-sample-native"
description = "Educational C ABI bridge for the Transmog .NET embedding sample"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
http.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
transmog-core = { version = "=0.1.2", path = "../../../crates/proxy-core" }
transmog-h3 = { version = "=0.1.2", path = "../../../crates/proxy-h3" }
transmog-http = { version = "=0.1.2", path = "../../../crates/proxy-http" }
transmog-tls = { version = "=0.1.2", path = "../../../crates/proxy-tls" }

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
