name: Complete ARM64 recovery fixture with retained app
on:
  push:
    branches: [codex/proxy-recovery-task-probe]
    paths: [.github/workflows/proxy-recovery-native-harness-probe.yml]
permissions: {}
defaults:
  run:
    shell: pwsh
jobs:
  fixture:
    runs-on: windows-11-arm
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    env:
      CARGO_INCREMENTAL: '0'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 30a972bfafaa94cc0677800de715f584eae9bce3
          persist-credentials: false
      - name: Verify immutable retained debug binary origin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $a = Invoke-RestMethod -Headers @{Authorization="Bearer $env:GH_TOKEN"; Accept='application/vnd.github+json'} -Uri 'https://api.github.com/repos/erik-anderson/transmog/actions/artifacts/14139171363'
          if ($a.expired -or $a.workflow_run.id -ne 43657175707 -or $a.workflow_run.head_sha -cne '673364e3fe626d52a4ed16e585e031e9da7130c3' -or $a.digest -cne 'sha256:12f5c9e93b548650c756e516f579e18d456a4845bbb4cb6a60ccc44f93a70aad') { throw 'Debug artifact mismatch.' }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: '14139171363'
          run-id: '43657175707'
          github-token: ${{ github.token }}
          path: artifacts/native-debug
      - uses: ./.github/actions/windows-release-setup
        timeout-minutes: 10
        with:
          target: aarch64-pc-windows-msvc
      - name: Prepare the exact integration fixture without rebuilding desktop
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          . ./scripts/dev-env.ps1 -Target aarch64-pc-windows-msvc
          python scripts/dev-env.py --check
          $exe = (Resolve-Path artifacts/native-debug/proxy-recovery-task-native-probe/debug-transmog.exe).Path
          if ((Get-FileHash -LiteralPath $exe).Hash -ine '20f90f698dde593cdd888002996918ac5023c4b8575f69efc183eb60a1c3154e') { throw 'Debug executable hash mismatch.' }
          $out = Join-Path $PWD 'artifacts/proxy-recovery-native-harness'
          New-Item -ItemType Directory -Force $out,crates/host-windows/tests/support | Out-Null
          Copy-Item apps/desktop/tests/proxy_recovery_task.rs crates/host-windows/tests/recovery_native_probe.rs
          Copy-Item apps/desktop/tests/support/run_proxy_recovery_task.ps1 crates/host-windows/tests/support/run_proxy_recovery_task.ps1
          $bytes = [IO.File]::ReadAllBytes($exe); $pe = [BitConverter]::ToInt32($bytes, 0x3c)
          if ([BitConverter]::ToUInt16($bytes, $pe + 4) -ne 0xaa64) { throw 'Wrong debug architecture.' }
          $stamp = [BitConverter]::GetBytes([uint32][DateTimeOffset]::UtcNow.ToUnixTimeSeconds())
          [Array]::Copy($stamp, 0, $bytes, $pe + 8, 4)
          $variant = Join-Path (Split-Path $exe) 'debug-unique-timestamp.exe'
          [IO.File]::WriteAllBytes($variant, $bytes)
          @{ checkoutSource=(git rev-parse HEAD); workflowSource=$env:GITHUB_SHA; run=$env:GITHUB_RUN_ID; originalDebugSource='673364e3fe626d52a4ed16e585e031e9da7130c3'; originalDebugRun=43657175707; originalDebugArtifact=14139171363; originalHash=(Get-FileHash $exe).Hash; variantHash=(Get-FileHash $variant).Hash; variantOnlyChange='Four COFF timestamp bytes; diagnostic only, never a release input'; testSourceHash=(Get-FileHash apps/desktop/tests/proxy_recovery_task.rs).Hash } | ConvertTo-Json | Set-Content (Join-Path $out identity.json)
          "PROBE_ORIGINAL_EXE=$exe" | Add-Content $env:GITHUB_ENV
          "PROBE_VARIANT_EXE=$variant" | Add-Content $env:GITHUB_ENV
      - name: Run the original complete fixture for known and new image hashes
        timeout-minutes: 20
        run: |
          . ./scripts/dev-env.ps1 -Target aarch64-pc-windows-msvc
          $PSNativeCommandUseErrorActionPreference = $false
          $results = @()
          foreach ($kind in @('original','unique')) {
            $env:CARGO_BIN_EXE_transmog = if ($kind -eq 'original') { $env:PROBE_ORIGINAL_EXE } else { $env:PROBE_VARIANT_EXE }
            $env:TRANSMOG_TEST_TASK_DIAGNOSTICS = Join-Path $PWD "artifacts/proxy-recovery-native-harness/$kind"
            & cargo test -p transmog-host-windows --all-features --locked --test recovery_native_probe -- --ignored --nocapture *> "artifacts/proxy-recovery-native-harness/$kind.log"
            $results += @{ kind=$kind; exitCode=$LASTEXITCODE }
          }
          $results | ConvertTo-Json | Set-Content artifacts/proxy-recovery-native-harness/original-results.json
          # Retain both failure codes and continue to the diagnostic capture case.
          exit 0
      - name: Add diagnostic stream capture to the owned task and repeat the same assertions
        timeout-minutes: 10
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          . ./scripts/dev-env.ps1 -Target aarch64-pc-windows-msvc
          $test = 'crates/host-windows/tests/recovery_native_probe.rs'
          $text = Get-Content -Raw $test
          $capture = @'
          const CAPTURE_TASK: &str = r#"
          $ErrorActionPreference = 'Stop'
          $service = New-Object -ComObject Schedule.Service; $service.Connect(); $folder = $service.GetFolder('\')
          $definition = $folder.GetTask($env:TRANSMOG_TEST_TASK).Definition
          $action = $definition.Actions.Item(1)
          $prefix = '-NoLogo -NoProfile -NonInteractive -WindowStyle Hidden -EncodedCommand '
          $launcher = [Text.Encoding]::Unicode.GetString([Convert]::FromBase64String($action.Arguments.Substring($prefix.Length)))
          $start = '$process = [Diagnostics.Process]::Start($start)'
          $wait = '$process.WaitForExit()'
          if (-not $launcher.Contains($start) -or -not $launcher.Contains($wait)) { throw 'Unexpected original launcher.' }
          $launcher = $launcher.Replace($start, '$start.RedirectStandardOutput = $true; $start.RedirectStandardError = $true; ' + $start + '; $readOut = $process.StandardOutput.ReadToEndAsync(); $readErr = $process.StandardError.ReadToEndAsync()')
          $launcher = $launcher.Replace($wait, $wait + '; [IO.File]::WriteAllText([IO.Path]::ChangeExtension($payload.journal, ''native-stdout.txt''), $readOut.Result); [IO.File]::WriteAllText([IO.Path]::ChangeExtension($payload.journal, ''native-stderr.txt''), $readErr.Result)')
          $action.Arguments = $prefix + [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($launcher))
          $data = $definition.RegistrationInfo.Documentation | ConvertFrom-Json; $data.actionArguments = $action.Arguments
          $definition.RegistrationInfo.Documentation = $data | ConvertTo-Json -Compress
          $null = $folder.RegisterTaskDefinition($env:TRANSMOG_TEST_TASK, $definition, 6, $definition.Principal.UserId, $null, 3)
          "#;
          '@
          $text = $text.Replace('task.register().unwrap();', 'task.register().unwrap(); scheduler(CAPTURE_TASK, name);')
          # The first replacement also matches the suffix of guard.task; repair
          # its call-site argument while preserving the original test body.
          $text = $text.Replace('guard.task.register().unwrap(); scheduler(CAPTURE_TASK, name);', 'guard.task.register().unwrap(); scheduler(CAPTURE_TASK, &name);')
          $text = $text.Replace('const RUN_TASK: &str', $capture + [Environment]::NewLine + 'const RUN_TASK: &str')
          [IO.File]::WriteAllText((Join-Path $PWD $test), $text, [Text.UTF8Encoding]::new($false))
          $helper = Join-Path $PWD 'crates/host-windows/tests/support/run_proxy_recovery_task.ps1'
          $observer = [IO.File]::ReadAllText($helper)
          $copyStreams = @'
          $payload = $definition.RegistrationInfo.Documentation | ConvertFrom-Json
          foreach ($suffix in @('native-stdout.txt','native-stderr.txt')) {
              $path = [IO.Path]::ChangeExtension($payload.journal, $suffix)
              if ([IO.File]::Exists($path)) { [IO.File]::Copy($path, (Join-Path $env:TRANSMOG_TEST_TASK_DIAGNOSTICS ([Guid]::NewGuid().ToString('N') + '-' + $suffix)), $true) }
          }
          '@
          $observer = $observer.Replace('$json = $record | ConvertTo-Json -Depth 8', $copyStreams + [Environment]::NewLine + '$json = $record | ConvertTo-Json -Depth 8')
          [IO.File]::WriteAllText($helper, $observer, [Text.UTF8Encoding]::new($false))
          $env:CARGO_BIN_EXE_transmog = $env:PROBE_VARIANT_EXE
          $env:TRANSMOG_TEST_TASK_DIAGNOSTICS = Join-Path $PWD 'artifacts/proxy-recovery-native-harness/captured'
          & cargo test -p transmog-host-windows --all-features --locked --test recovery_native_probe -- --ignored --nocapture *> artifacts/proxy-recovery-native-harness/captured.log
      - name: Retain full fixture and recovery diagnostics only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proxy-recovery-task-probe-native-harness-${{ github.run_id }}
          path: |
            artifacts/proxy-recovery-native-harness/
            artifacts/windows-msvc.json
          if-no-files-found: error
          retention-days: 14
