name: Windows unsigned installer

on:
  workflow_dispatch:
    inputs:
      use_cache:
        description: Reuse dependency downloads after the first cold build
        type: boolean
        default: false

permissions: {}
env:
  PYTHONUTF8: '1'

concurrency:
  group: windows-unsigned-installer
  cancel-in-progress: false

jobs:
  engine:
    if: github.event.repository.private == false
    uses: ./.github/workflows/prepare-windows-v8.yml
    permissions:
      contents: read
    with:
      include_arm64: false
      use_cache: ${{ inputs.use_cache }}
  package:
    needs: engine
    # Standard runners are free for public repositories. Keep private runs disabled.
    if: github.event.repository.private == false
    runs-on: windows-2025
    timeout-minutes: 120
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      TRANSMOG_CI_USE_CACHE: ${{ inputs.use_cache }}

    steps:
      - name: Check out the requested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/windows-release-setup
        timeout-minutes: 8
        with:
          target: x86_64-pc-windows-msvc
          use-cache: ${{ inputs.use_cache }}
      - name: Download exact engine producer
        timeout-minutes: 2
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.engine.outputs.artifact-id-x64 }}
          path: artifacts/v8-engine
      - name: Verify engine before enabling reuse
        timeout-minutes: 2
        env:
          V8_ID: ${{ needs.engine.outputs.artifact-id-x64 }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          . ./scripts/dev-env.ps1
          python ./scripts/dev-env.py --check
          python ./scripts/v8_artifact.py verify --target x86_64-pc-windows-msvc --directory artifacts/v8-engine
          "TRANSMOG_V8_ARTIFACT=$((Resolve-Path artifacts/v8-engine).Path)" | Add-Content -LiteralPath $env:GITHUB_ENV
          "V8_ARTIFACT_ID=$env:V8_ID" | Add-Content -LiteralPath $env:GITHUB_ENV
      - name: Test and build the unsigned NSIS installer
        timeout-minutes: 100
        run: ./scripts/ci-windows-installer.ps1

      - name: Upload the unsigned installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: transmog-windows-x64-unsigned-${{ github.run_number }}-${{ github.run_attempt }}
          path: artifacts/windows-ci/installer/
          if-no-files-found: error
          retention-days: 7

      - name: Upload build measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-build-measurements-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            artifacts/native-tools-cache-checkpoint.json
            artifacts/windows-ci/build-metrics.json
            artifacts/windows-ci/build-summary.md
            artifacts/windows-ci/tool-versions.txt
          if-no-files-found: warn
          retention-days: 7
