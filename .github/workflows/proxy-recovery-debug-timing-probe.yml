name: ARM64 debug recovery task timing
on:
  push:
    branches: [codex/proxy-recovery-task-probe]
    paths:
      - .github/workflows/proxy-recovery-debug-timing-probe.yml
      - scripts/probe-proxy-recovery-debug-timing.ps1
permissions: {}
jobs:
  timing:
    runs-on: windows-11-arm
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify the retained successful debug compilation
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $h = @{Authorization="Bearer $env:GH_TOKEN"; Accept='application/vnd.github+json'}
          $a = Invoke-RestMethod -Headers $h -Uri 'https://api.github.com/repos/erik-anderson/transmog/actions/artifacts/14139171363'
          if ($a.expired -or $a.workflow_run.id -ne 43657175707 -or $a.workflow_run.head_sha -cne '673364e3fe626d52a4ed16e585e031e9da7130c3' -or $a.digest -cne 'sha256:12f5c9e93b548650c756e516f579e18d456a4845bbb4cb6a60ccc44f93a70aad') { throw 'Debug artifact identity mismatch.' }
          $j = Invoke-RestMethod -Headers $h -Uri 'https://api.github.com/repos/erik-anderson/transmog/actions/jobs/132638183392'
          if ($j.head_sha -cne $a.workflow_run.head_sha -or @($j.steps | Where-Object { $_.name -eq 'Compile the original native test feature graph' -and $_.conclusion -eq 'success' }).Count -ne 1) { throw 'Successful native debug compilation not verified.' }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: '14139171363'
          run-id: '43657175707'
          github-token: ${{ github.token }}
          path: artifacts/native-debug
      - name: Observe cold and warm launches beyond the original test limit
        shell: pwsh
        run: |
          & "$env:WINDIR/System32/WindowsPowerShell/v1.0/powershell.exe" -NoLogo -NoProfile -NonInteractive -File scripts/probe-proxy-recovery-debug-timing.ps1
          if ($LASTEXITCODE -ne 0) { throw "Timing probe failed: $LASTEXITCODE" }
      - name: Retain timing evidence only
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proxy-recovery-task-probe-debug-timing-${{ github.run_id }}
          path: artifacts/proxy-recovery-debug-timing/
          if-no-files-found: error
          retention-days: 14
