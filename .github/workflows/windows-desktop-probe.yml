name: Windows hosted WebView startup probe
on:
  workflow_dispatch:
    inputs:
      full_smoke:
        description: Run the fast WebView checks using the unsigned baseline
        type: boolean
        default: false
permissions: {}
defaults:
  run:
    shell: pwsh
jobs:
  probe:
    if: github.event.repository.private == false && github.ref == 'refs/heads/main'
    runs-on: windows-2025
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: '11467353434'
          run-id: '37586689686'
          github-token: ${{ github.token }}
          merge-multiple: true
          path: artifacts/baseline
      - name: Ensure hosted Evergreen runtime is available
        run: |
          ./scripts/setup-windows-webview-ci.ps1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: inputs.full_smoke
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Install locked browser-test tooling
        if: inputs.full_smoke
        run: |
          npm ci --prefix apps/desktop/ui
          npm ci --prefix e2e/playwright
      - name: Probe the already-built unsigned baseline
        env:
          FULL_SMOKE: ${{ inputs.full_smoke }}
        run: |
          $installer = Get-ChildItem artifacts/baseline/*-setup.exe
          if ($installer.Count -ne 1 -or (Get-FileHash $installer.FullName).Hash -ne 'EF3228015BA38A4DBE60570F54C36E7603419BD04DC8A10CE476D079A8D83445') { throw 'Baseline installer checksum mismatch.' }
          $installRoot = Join-Path $env:RUNNER_TEMP 'transmog-webview-baseline'
          $install = Start-Process -FilePath $installer.FullName -ArgumentList '/S',"/D=$installRoot" -WindowStyle Hidden -PassThru
          if (-not $install.WaitForExit(180000) -or $install.ExitCode -ne 0) { throw 'Baseline install failed.' }
          $exe = Join-Path $installRoot 'transmog-desktop.exe'
          try {
            ./scripts/test-windows-desktop.ps1 -ExecutablePath $exe -SkipReleaseBuild -StartupOnly
          } catch { Write-Host "Environment-only startup probe failed: $($_.Exception.Message)" }
          ./scripts/test-windows-desktop.ps1 -ExecutablePath $exe -SkipReleaseBuild -StartupOnly -HostedRunnerDevToolsPolicy
          if ($env:FULL_SMOKE -eq 'true') {
            # Match smoke assertions to the older test application, not current UI semantics.
            Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/erik-anderson/transmog/b52c2f8b5d5fa2c13a10cd1840089616c7865779/apps/desktop/ui/scripts/smoke-webview.mjs' -OutFile apps/desktop/ui/scripts/smoke-webview.mjs
            ./scripts/test-windows-desktop.ps1 -ExecutablePath $exe -SkipReleaseBuild -HostedRunnerDevToolsPolicy
          }
      - name: Retain isolated startup evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hosted-webview-startup-${{ github.run_id }}
          path: |
            artifacts/windows-desktop-validation/**/stdout.txt
            artifacts/windows-desktop-validation/**/stderr.txt
            artifacts/windows-desktop-validation/**/startup.json
          if-no-files-found: warn
          retention-days: 7
