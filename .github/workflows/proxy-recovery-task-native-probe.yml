name: Native ARM64 proxy recovery test diagnosis
on:
  push:
    branches: [codex/proxy-recovery-task-probe]
    paths:
      - .github/workflows/proxy-recovery-task-native-probe.yml
      - apps/desktop/tests/proxy_recovery_task.rs
permissions: {}
defaults:
  run:
    shell: pwsh
jobs:
  native:
    runs-on: windows-11-arm
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/windows-release-setup
        timeout-minutes: 10
        with:
          target: aarch64-pc-windows-msvc
      - name: Verify exact original successful engine producer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $a = Invoke-RestMethod -Headers @{Authorization="Bearer $env:GH_TOKEN"; Accept='application/vnd.github+json'} -Uri 'https://api.github.com/repos/erik-anderson/transmog/actions/artifacts/14135776063'
          if ($a.expired -or $a.workflow_run.id -ne 43648981179 -or $a.workflow_run.head_sha -cne '37e8290627dd38faf7279b3d592cc0bd368d1813' -or $a.digest -cne 'sha256:19f891ef6dc914d740b51d8f03b1ad2501257e99408a56399a6385ac3ce3a059') { throw 'Original engine identity mismatch.' }
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: '14135776063'
          run-id: '43648981179'
          github-token: ${{ github.token }}
          path: artifacts/v8-engine
      - name: Verify engine bytes and native tools
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          . ./scripts/dev-env.ps1 -Target aarch64-pc-windows-msvc
          python scripts/dev-env.py --check
          python scripts/v8_artifact.py verify --target aarch64-pc-windows-msvc --directory artifacts/v8-engine
          "TRANSMOG_V8_ARTIFACT=$((Resolve-Path artifacts/v8-engine).Path)" | Add-Content $env:GITHUB_ENV
          'V8_ARTIFACT_ID=14135776063' | Add-Content $env:GITHUB_ENV
          "TRANSMOG_TEST_TASK_DIAGNOSTICS=$PWD/artifacts/proxy-recovery-task-native-probe" | Add-Content $env:GITHUB_ENV
      - name: Prepare only the native test build prerequisites
        timeout-minutes: 6
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm ci --ignore-scripts
          npm ci --prefix apps/desktop/ui
          npm --prefix apps/desktop/ui run build
      - name: Compile the original native test feature graph
        timeout-minutes: 35
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          . ./scripts/dev-env.ps1 -Target aarch64-pc-windows-msvc
          cargo test --workspace --all-features --locked --test proxy_recovery_task --no-run
      - name: Reproduce the original Scheduler invocation with diagnostics
        timeout-minutes: 5
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          . ./scripts/dev-env.ps1 -Target aarch64-pc-windows-msvc
          cargo test --workspace --all-features --locked --test proxy_recovery_task -- --ignored --nocapture
      - name: Retain diagnosis only (never native proof or release inputs)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proxy-recovery-task-probe-native-arm64-${{ github.run_id }}
          path: |
            artifacts/proxy-recovery-task-native-probe/
            artifacts/windows-msvc.json
          if-no-files-found: error
          retention-days: 14
