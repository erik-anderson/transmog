name: Diagnose extension debugger sandbox
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
defaults:
  run:
    shell: pwsh
env:
  PYTHONUTF8: '1'
  CARGO_INCREMENTAL: '0'
  RUST_BACKTRACE: '1'
jobs:
  probe:
    name: Extension debugger probe (arm64)
    runs-on: windows-11-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/windows-release-setup
        timeout-minutes: 10
        with:
          target: aarch64-pc-windows-msvc
      - name: Download exact failed-candidate engine
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          artifact-ids: '14311907603'
          run-id: '44046670292'
          github-token: ${{ github.token }}
          path: artifacts/v8-engine
      - name: Verify existing engine and build only the affected sandbox test
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          . ./scripts/dev-env.ps1
          python ./scripts/dev-env.py --check
          python ./scripts/v8_artifact.py verify --target aarch64-pc-windows-msvc --directory artifacts/v8-engine
          $env:TRANSMOG_V8_ARTIFACT = (Resolve-Path artifacts/v8-engine).Path
          New-Item -ItemType Directory -Force artifacts/debugger-probe | Out-Null
          cargo test --locked -p transmog-extension-host --test sandbox --no-run --message-format=json 1> artifacts/debugger-probe/build.jsonl 2> artifacts/debugger-probe/build.log
          $build = @(Get-Content artifacts/debugger-probe/build.jsonl | ForEach-Object { $_ | ConvertFrom-Json })
          $test = @($build | Where-Object { $_.reason -eq 'compiler-artifact' -and $_.target.name -eq 'sandbox' -and $_.executable })
          if ($test.Count -ne 1) { throw 'Expected exactly one native sandbox test binary.' }
          $test[0].executable | Set-Content artifacts/debugger-probe/test-path.txt
          Get-FileHash -LiteralPath $test[0].executable | ConvertTo-Json | Set-Content artifacts/debugger-probe/test-hash.json
      - name: Reproduce concurrent and focused debugger sessions without changing limits
        timeout-minutes: 8
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $test = (Get-Content artifacts/debugger-probe/test-path.txt).Trim()
          $results = [Collections.Generic.List[object]]::new()
          foreach ($iteration in 1..60) {
            $arguments = @('--nocapture')
            if ($iteration -gt 20) { $arguments += @('debugger_preserves_initializer_heap_locals_and_idle_detach_in_the_real_sandbox', '--exact') }
            $started = [Diagnostics.Stopwatch]::StartNew()
            & $test @arguments *> "artifacts/debugger-probe/run-$iteration.log"
            $code = $LASTEXITCODE
            $started.Stop()
            $results.Add(@{Iteration=$iteration;ExitCode=$code;ElapsedSeconds=$started.Elapsed.TotalSeconds;Focused=($iteration -gt 20)})
            $results | ConvertTo-Json -Depth 5 | Set-Content artifacts/debugger-probe/results.json
            Get-Content "artifacts/debugger-probe/run-$iteration.log" -Tail 12
            if ($code) { throw "Native sandbox failed in iteration $iteration; exact session state is retained." }
          }
      - name: Retain native diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: extension-debugger-probe-arm64-${{ github.run_attempt }}
          path: |
            artifacts/debugger-probe/
            artifacts/windows-msvc.json
            artifacts/native-tools-cache-checkpoint.json
          if-no-files-found: error
          retention-days: 7
