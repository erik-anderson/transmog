name: Windows signed release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Use the checked-in release track, or choose Beta/Stable for a release branch; main is Canary
        type: choice
        default: Branch default
        options:
          - Branch default
          - Beta
          - Stable
          - Canary

permissions: {}
env:
  # Python child processes must match the tooling's UTF-8 subprocess decoder.
  PYTHONUTF8: '1'
concurrency:
  group: windows-signed-release
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  policy:
    name: Dependency policy preflight
    if: github.repository == 'erik-anderson/transmog' && github.event.repository.private == false && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      snapshot-id: ${{ steps.snapshot.outputs.artifact-id }}
      release-type: ${{ steps.versions.outputs.release-type }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      # Keep policy downloads separate so preflight cannot reserve a partial native build cache.
      - name: Cache Cargo dependency downloads
        uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: release-policy-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'scripts/setup-windows-ci.ps1', 'scripts/cache-v8.py') }}-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.lock') }}
          restore-keys: |
            release-policy-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'scripts/setup-windows-ci.ps1', 'scripts/cache-v8.py') }}-
      - name: Set up pinned policy tools
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $pin = [regex]::Match((Get-Content -Raw rust-toolchain.toml), '(?m)^channel\s*=\s*"([^"]+)"').Groups[1].Value
          rustup toolchain install $pin --profile minimal --component rustfmt
          ./scripts/setup-release-validation-tools.ps1
      - name: Check versions, formatting and npm advisories before compilation
        id: versions
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REQUESTED_RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python ./scripts/check-published-release-version.py
          python ./scripts/set-release-version.py --check
          cargo fmt --all -- --check
          npm audit --prefix apps/desktop/ui --audit-level=low
          npm audit --prefix e2e/playwright --audit-level=low
      - name: Fetch one RustSec snapshot and check both locked graphs
        run: python ./scripts/release-policy.py --prepare --snapshot artifacts/release-policy/snapshot --output artifacts/release-policy/preflight
      - name: Retain the immutable advisory snapshot for both architectures
        id: snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-advisory-snapshot-${{ github.run_attempt }}
          path: artifacts/release-policy/snapshot/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - name: Retain dependency policy diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-policy-preflight-${{ github.run_attempt }}
          path: artifacts/release-policy/preflight/
          if-no-files-found: warn
          retention-days: 7

  engine:
    needs: policy
    uses: ./.github/workflows/prepare-windows-v8.yml
    permissions:
      contents: read
      actions: read

  frontend:
    name: UI and browser acceptance (shared, x64)
    needs: policy
    runs-on: windows-2025
    # One source/run-bound frontend result is shared by both native targets.
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.payload.outputs.artifact-id }}
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/windows-release-setup
        timeout-minutes: 8
        with:
          target: x86_64-pc-windows-msvc
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.policy.outputs.snapshot-id }}
          path: artifacts/release-policy/shared-snapshot
      - name: Install locked UI and browser dependencies
        timeout-minutes: 6
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm ci --ignore-scripts
          npm ci --prefix apps/desktop/ui
          npm ci --prefix e2e/playwright
          Push-Location e2e/playwright
          try { npx playwright install chromium } finally { Pop-Location }
          python ./scripts/cache-v8.py --prepare-only --target x86_64-pc-windows-msvc
      - name: Release safety fixtures
        timeout-minutes: 5
        run: ./scripts/test-release-safety.ps1
      - name: Frontend gate - UI
        timeout-minutes: 4
        run: ./scripts/build-windows-release.ps1 -Stage Frontend -Target x86_64-pc-windows-msvc -Phase UI -PolicySnapshot artifacts/release-policy/shared-snapshot
      - name: Frontend gate - Browser
        timeout-minutes: 25
        run: ./scripts/build-windows-release.ps1 -Stage Frontend -Target x86_64-pc-windows-msvc -Phase Browser
      - name: Retain immutable frontend producer
        id: payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release-frontend-shared-${{ github.run_attempt }}
          path: artifacts/windows-build/
          if-no-files-found: error
          retention-days: 7
      - name: Retain frontend diagnostics even after a step timeout
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release-diagnostics-frontend-shared-${{ github.run_attempt }}
          path: |
            artifacts/windows-build-state.json
            artifacts/native-tools-cache-checkpoint.json
            artifacts/windows-msvc.json
            artifacts/windows-build-gates/
            target/ui-check/workspace-failure.png
            artifacts/windows-build/evidence/
            artifacts/windows-desktop-validation/
            artifacts/client-certificate-desktop/
          if-no-files-found: warn
          retention-days: 7

  validation:
    name: Native validation (${{ matrix.arch }})
    needs: [policy, engine, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            runner: windows-2025
          - arch: arm64
            target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      artifact-id-x64: ${{ steps.reference.outputs.artifact-id-x64 }}
      artifact-id-arm64: ${{ steps.reference.outputs.artifact-id-arm64 }}
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/windows-release-setup
        timeout-minutes: 8
        with:
          target: ${{ matrix.target }}
      - name: Download exact engine producer
        timeout-minutes: 2
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ matrix.arch == 'x64' && needs.engine.outputs.artifact-id-x64 || needs.engine.outputs.artifact-id-arm64 }}
          path: artifacts/v8-engine
      - name: Verify engine before enabling reuse
        timeout-minutes: 2
        env:
          V8_ID: ${{ matrix.arch == 'x64' && needs.engine.outputs.artifact-id-x64 || needs.engine.outputs.artifact-id-arm64 }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          . ./scripts/dev-env.ps1
          python ./scripts/dev-env.py --check
          python ./scripts/v8_artifact.py verify --target ${{ matrix.target }} --directory artifacts/v8-engine
          "TRANSMOG_V8_ARTIFACT=$((Resolve-Path artifacts/v8-engine).Path)" | Add-Content -LiteralPath $env:GITHUB_ENV
          "V8_ARTIFACT_ID=$env:V8_ID" | Add-Content -LiteralPath $env:GITHUB_ENV
      - name: Prepare native desktop UI and WebView prerequisites
        timeout-minutes: 8
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          ./scripts/setup-windows-webview-ci.ps1
          npm ci --ignore-scripts
          node --input-type=module -e "await import('./scripts/binary-reference-fixtures.mjs')"
          npm ci --prefix apps/desktop/ui
          npm --prefix apps/desktop/ui run build
          npm ci --prefix e2e/playwright
      - name: Validation gate - Analysis
        timeout-minutes: 20
        run: ./scripts/build-windows-release.ps1 -Stage Validation -Target ${{ matrix.target }} -Phase Analysis
      - name: Validation gate - Tests
        timeout-minutes: 35
        run: ./scripts/build-windows-release.ps1 -Stage Validation -Target ${{ matrix.target }} -Phase Tests
      - name: Validation gate - Native
        timeout-minutes: 25
        run: ./scripts/build-windows-release.ps1 -Stage Validation -Target ${{ matrix.target }} -Phase Native -HostedRunnerDevToolsPolicy
      - name: Validation gate - Archives
        timeout-minutes: 8
        run: ./scripts/build-windows-release.ps1 -Stage Validation -Target ${{ matrix.target }} -Phase Archives
      - name: Retain immutable validation producer
        id: payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release-validation-${{ matrix.arch }}-${{ github.run_attempt }}
          path: artifacts/windows-build/
          if-no-files-found: error
          retention-days: 7
      - id: reference
        env:
          ARTIFACT_ID: ${{ steps.payload.outputs.artifact-id }}
        run: '"artifact-id-${{ matrix.arch }}=$env:ARTIFACT_ID" | Add-Content -LiteralPath $env:GITHUB_OUTPUT'
      - name: Retain validation diagnostics even after a step timeout
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release-diagnostics-validation-${{ matrix.arch }}-${{ github.run_attempt }}
          path: |
            artifacts/windows-build-state.json
            artifacts/native-tools-cache-checkpoint.json
            artifacts/windows-msvc.json
            artifacts/windows-build-gates/
            artifacts/windows-build/evidence/
            artifacts/windows-desktop-validation/
            artifacts/client-certificate-desktop/
          if-no-files-found: warn
          retention-days: 7

  package_compile:
    name: Compile optimized package on x64 (${{ matrix.arch }})
    needs: [policy, engine, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            runner: windows-2025
          - arch: arm64
            target: aarch64-pc-windows-msvc
            runner: windows-2025
    runs-on: windows-2025
    timeout-minutes: 90
    permissions:
      contents: read
    outputs:
      artifact-id-x64: ${{ steps.reference.outputs.artifact-id-x64 }}
      artifact-id-arm64: ${{ steps.reference.outputs.artifact-id-arm64 }}
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/windows-release-setup
        timeout-minutes: 8
        with:
          target: ${{ matrix.target }}
          host-target: x86_64-pc-windows-msvc
      - name: Download exact engine producer
        timeout-minutes: 2
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ matrix.arch == 'x64' && needs.engine.outputs.artifact-id-x64 || needs.engine.outputs.artifact-id-arm64 }}
          path: artifacts/v8-engine
      - name: Verify engine before enabling reuse
        timeout-minutes: 2
        env:
          V8_ID: ${{ matrix.arch == 'x64' && needs.engine.outputs.artifact-id-x64 || needs.engine.outputs.artifact-id-arm64 }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          . ./scripts/dev-env.ps1 -Target ${{ matrix.target }}
          python ./scripts/dev-env.py --check
          python ./scripts/v8_artifact.py verify --target ${{ matrix.target }} --directory artifacts/v8-engine
          "TRANSMOG_V8_ARTIFACT=$((Resolve-Path artifacts/v8-engine).Path)" | Add-Content -LiteralPath $env:GITHUB_ENV
          "V8_ARTIFACT_ID=$env:V8_ID" | Add-Content -LiteralPath $env:GITHUB_ENV
      - name: Install locked compilation tooling
        timeout-minutes: 6
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm ci --ignore-scripts
          node --input-type=module -e "await import('./scripts/binary-reference-fixtures.mjs')"
          npm ci --prefix apps/desktop/ui
      - name: Package gate - Build
        timeout-minutes: 55
        run: ./scripts/build-windows-release.ps1 -Stage Package -Target ${{ matrix.target }} -Phase Build
      - name: Export source-bound compiled binaries, full PDBs and UI
        timeout-minutes: 3
        run: python ./scripts/windows_compiled.py export --target ${{ matrix.target }} --directory artifacts/compiled-package
      - name: Retain immutable compiled producer
        id: payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release-compiled-${{ matrix.arch }}-${{ github.run_attempt }}
          path: artifacts/compiled-package/
          if-no-files-found: error
          retention-days: 7
      - id: reference
        env:
          ARTIFACT_ID: ${{ steps.payload.outputs.artifact-id }}
        run: '"artifact-id-${{ matrix.arch }}=$env:ARTIFACT_ID" | Add-Content -LiteralPath $env:GITHUB_OUTPUT'
      - name: Retain compilation diagnostics even after a step timeout
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release-diagnostics-compile-${{ matrix.arch }}-${{ github.run_attempt }}
          path: |
            artifacts/windows-build-state.json
            artifacts/native-tools-cache-checkpoint.json
            artifacts/windows-msvc.json
            artifacts/windows-build-gates/
            artifacts/windows-build/evidence/
            artifacts/windows-desktop-validation/
            artifacts/client-certificate-desktop/
          if-no-files-found: warn
          retention-days: 7

  package:
    name: Native optimized package qualification (${{ matrix.arch }})
    needs: [policy, engine, frontend, package_compile]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            runner: windows-2025
          - arch: arm64
            target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      artifact-id-x64: ${{ steps.reference.outputs.artifact-id-x64 }}
      artifact-id-arm64: ${{ steps.reference.outputs.artifact-id-arm64 }}
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always
      RELEASE_TYPE: ${{ needs.policy.outputs.release-type }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/windows-release-setup
        timeout-minutes: 8
        with:
          target: ${{ matrix.target }}
      - name: Download exact engine producer
        timeout-minutes: 2
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ matrix.arch == 'x64' && needs.engine.outputs.artifact-id-x64 || needs.engine.outputs.artifact-id-arm64 }}
          path: artifacts/v8-engine
      - name: Verify engine before enabling reuse
        timeout-minutes: 2
        env:
          V8_ID: ${{ matrix.arch == 'x64' && needs.engine.outputs.artifact-id-x64 || needs.engine.outputs.artifact-id-arm64 }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          . ./scripts/dev-env.ps1
          python ./scripts/dev-env.py --check
          python ./scripts/v8_artifact.py verify --target ${{ matrix.target }} --directory artifacts/v8-engine
          "TRANSMOG_V8_ARTIFACT=$((Resolve-Path artifacts/v8-engine).Path)" | Add-Content -LiteralPath $env:GITHUB_ENV
          "V8_ARTIFACT_ID=$env:V8_ID" | Add-Content -LiteralPath $env:GITHUB_ENV
      - name: Install locked packaging and desktop tooling
        timeout-minutes: 6
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          ./scripts/setup-windows-webview-ci.ps1
          npm ci --ignore-scripts
          node --input-type=module -e "await import('./scripts/binary-reference-fixtures.mjs')"
          npm ci --prefix apps/desktop/ui
          npm ci --prefix e2e/playwright
      - name: Download exact compiled producer
        timeout-minutes: 3
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ matrix.arch == 'x64' && needs.package_compile.outputs.artifact-id-x64 || needs.package_compile.outputs.artifact-id-arm64 }}
          path: artifacts/compiled-package
      - name: Package gate - Verify compiled build
        timeout-minutes: 3
        env:
          COMPILED_ID: ${{ matrix.arch == 'x64' && needs.package_compile.outputs.artifact-id-x64 || needs.package_compile.outputs.artifact-id-arm64 }}
        run: ./scripts/build-windows-release.ps1 -Stage Package -Target ${{ matrix.target }} -Phase Build -CompiledBuild artifacts/compiled-package -CompiledBuildId $env:COMPILED_ID
      - name: Package gate - Qualify
        timeout-minutes: 10
        run: ./scripts/build-windows-release.ps1 -Stage Package -Target ${{ matrix.target }} -Phase Qualify -HostedRunnerDevToolsPolicy
      - name: Package gate - Assemble
        timeout-minutes: 2
        run: ./scripts/build-windows-release.ps1 -Stage Package -Target ${{ matrix.target }} -Phase Assemble
      - name: Retain immutable package producer
        id: payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release-package-${{ matrix.arch }}-${{ github.run_attempt }}
          path: artifacts/windows-build/
          if-no-files-found: error
          retention-days: 7
      - id: reference
        env:
          ARTIFACT_ID: ${{ steps.payload.outputs.artifact-id }}
        run: '"artifact-id-${{ matrix.arch }}=$env:ARTIFACT_ID" | Add-Content -LiteralPath $env:GITHUB_OUTPUT'
      - name: Retain package diagnostics even after a step timeout
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release-diagnostics-package-${{ matrix.arch }}-${{ github.run_attempt }}
          path: |
            artifacts/windows-build-state.json
            artifacts/native-tools-cache-checkpoint.json
            artifacts/windows-msvc.json
            artifacts/windows-build-gates/
            artifacts/windows-build/evidence/
            artifacts/windows-desktop-validation/
            artifacts/client-certificate-desktop/
          if-no-files-found: warn
          retention-days: 7

  build:
    name: Verify all release gates (${{ matrix.arch }})
    needs: [frontend, validation, package]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            runner: windows-2025
          - arch: arm64
            target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      artifact-id-x64: ${{ steps.reference.outputs.artifact-id-x64 }}
      artifact-id-arm64: ${{ steps.reference.outputs.artifact-id-arm64 }}
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download immutable frontend producer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.frontend.outputs.artifact-id }}
          path: artifacts/stages/frontend
      - name: Download immutable validation producer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ matrix.arch == 'x64' && needs.validation.outputs.artifact-id-x64 || needs.validation.outputs.artifact-id-arm64 }}
          path: artifacts/stages/validation
      - name: Download immutable package producer
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ matrix.arch == 'x64' && needs.package.outputs.artifact-id-x64 || needs.package.outputs.artifact-id-arm64 }}
          path: artifacts/stages/package
      - name: Merge only matching successful source/run-bound gates
        env:
          FRONTEND_ID: ${{ needs.frontend.outputs.artifact-id }}
          VALIDATION_ID: ${{ matrix.arch == 'x64' && needs.validation.outputs.artifact-id-x64 || needs.validation.outputs.artifact-id-arm64 }}
          PACKAGE_ID: ${{ matrix.arch == 'x64' && needs.package.outputs.artifact-id-x64 || needs.package.outputs.artifact-id-arm64 }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python ./scripts/release_stages.py merge --commit $env:GITHUB_SHA --target ${{ matrix.target }} --root artifacts/windows-build --frontend artifacts/stages/frontend --frontend-id $env:FRONTEND_ID --validation artifacts/stages/validation --validation-id $env:VALIDATION_ID --package artifacts/stages/package --package-id $env:PACKAGE_ID
          . ./scripts/windows-release-common.ps1
          Assert-ReleasePayload -PayloadRoot artifacts/windows-build -Commit $env:GITHUB_SHA -RunId $env:GITHUB_RUN_ID | Out-Null
      - name: Retain immutable build producer
        id: payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release-build-${{ matrix.arch }}-${{ github.run_attempt }}
          path: artifacts/windows-build/
          if-no-files-found: error
          retention-days: 7
      - id: reference
        env:
          ARTIFACT_ID: ${{ steps.payload.outputs.artifact-id }}
        run: '"artifact-id-${{ matrix.arch }}=$env:ARTIFACT_ID" | Add-Content -LiteralPath $env:GITHUB_OUTPUT'
      - name: Retain build diagnostics even after a step timeout
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-release-diagnostics-build-${{ matrix.arch }}-${{ github.run_attempt }}
          path: |
            artifacts/windows-build-state.json
            artifacts/windows-build-gates/
            artifacts/windows-build/evidence/
            artifacts/windows-desktop-validation/
            artifacts/client-certificate-desktop/
          if-no-files-found: warn
          retention-days: 7

  final-policy:
    name: Refresh dependency policy before signing
    needs: [policy, build]
    runs-on: windows-2025
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      # Keep policy downloads separate so preflight cannot reserve a partial native build cache.
      - name: Cache Cargo dependency downloads
        uses: actions/cache@a7833574556fa59680c1b7cb190c1735db73ebf0 # v5.0.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: release-policy-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'scripts/setup-windows-ci.ps1', 'scripts/cache-v8.py') }}-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.lock') }}
          restore-keys: |
            release-policy-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'scripts/setup-windows-ci.ps1', 'scripts/cache-v8.py') }}-
      - name: Set up pinned policy tools
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $pin = [regex]::Match((Get-Content -Raw rust-toolchain.toml), '(?m)^channel\s*=\s*"([^"]+)"').Groups[1].Value
          rustup toolchain install $pin --profile minimal --component rustfmt
          ./scripts/setup-release-validation-tools.ps1
      - name: Check current advisories before protected signing
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm audit --prefix apps/desktop/ui --audit-level=low
          npm audit --prefix e2e/playwright --audit-level=low
          python ./scripts/release-policy.py --prepare --snapshot artifacts/release-policy/final-snapshot --output artifacts/release-policy/final
      - name: Retain final security evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-policy-final-${{ github.run_attempt }}
          path: artifacts/release-policy/final/
          if-no-files-found: warn
          retention-days: 7

  sign:
    needs: [build, final-policy]
    runs-on: windows-2025
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.signed.outputs.artifact-id }}
    environment: release-signing
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      SIGNING_ENDPOINT: ${{ secrets.SIGNING_ENDPOINT }}
      SIGNING_ACCOUNT_NAME: ${{ secrets.SIGNING_ACCOUNT_NAME }}
      SIGNING_CERTIFICATE_PROFILE: ${{ secrets.SIGNING_CERTIFICATE_PROFILE }}
      SIGNING_PUBLISHER: ${{ vars.SIGNING_PUBLISHER }}
      SIGNING_DENIED_PROFILE: ${{ secrets.SIGNING_DENIED_PROFILE }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TRANSMOG_UPDATER_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TRANSMOG_UPDATER_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Mask operational signing configuration
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          foreach ($name in @('AZURE_CLIENT_ID', 'AZURE_TENANT_ID', 'SIGNING_ENDPOINT', 'SIGNING_ACCOUNT_NAME', 'SIGNING_CERTIFICATE_PROFILE', 'SIGNING_DENIED_PROFILE')) {
            $value = [Environment]::GetEnvironmentVariable($name)
            if ($value) { Write-Output "::add-mask::$value" }
          }
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw 'Configure TRANSMOG_UPDATER_PRIVATE_KEY in the release-signing environment before requesting Azure signing.' }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id-x64 }}
          path: artifacts/downloaded-build/x64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.build.outputs.artifact-id-arm64 }}
          path: artifacts/downloaded-build/arm64
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      - name: Prepare bundler and verify payload before Azure login
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          npm ci --ignore-scripts --prefix apps/desktop/ui
          $pin = [regex]::Match((Get-Content -Raw rust-toolchain.toml), '(?m)^channel\s*=\s*"([^"]+)"').Groups[1].Value
          rustup toolchain install $pin --profile minimal --target x86_64-pc-windows-msvc
          . ./scripts/windows-release-common.ps1
          foreach ($arch in @('x64', 'arm64')) {
            $manifest = Assert-ReleasePayload -PayloadRoot "artifacts/downloaded-build/$arch" -Commit $env:GITHUB_SHA -RunId $env:GITHUB_RUN_ID
            if ((Get-WindowsReleaseTarget $manifest.Target).Architecture -cne $arch) { throw 'The build artifact has the wrong architecture.' }
            ./scripts/prepare-windows-signing.ps1 -PayloadRoot "artifacts/downloaded-build/$arch"
          }
      - name: Download and verify signing SDK
        id: sdk
        run: ./scripts/setup-artifact-signing-client.ps1
      - name: Authenticate using protected environment OIDC
        uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Sign binaries and NSIS bundle and prove profile restriction
        env:
          SIGNING_CLIENT_DLL: ${{ steps.sdk.outputs.client-dll }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          foreach ($arch in @('x64', 'arm64')) {
            $payloadRoot = "artifacts/downloaded-build/$arch"
            ./scripts/package-signed-windows-release.ps1 -PayloadRoot $payloadRoot -ClientDll $env:SIGNING_CLIENT_DLL
          }
          ./scripts/merge-windows-releases.ps1 -X64Root artifacts/windows-signed-x64 -Arm64Root artifacts/windows-signed-arm64 -OutputRoot artifacts/windows-signed
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: signed
        with:
          name: windows-release-signed-${{ github.run_attempt }}
          path: artifacts/windows-signed/
          if-no-files-found: error
          retention-days: 7

  installer-test:
    needs: sign
    name: Signed installer qualification (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            runner: windows-2025
          - arch: arm64
            target: aarch64-pc-windows-msvc
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    outputs:
      artifact-id-x64: ${{ steps.reference.outputs.artifact-id-x64 }}
      artifact-id-arm64: ${{ steps.reference.outputs.artifact-id-arm64 }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.sign.outputs.artifact-id }}
          path: artifacts/windows-signed
      - name: Verify and install signed bundle without Azure credentials
        run: ./scripts/test-signed-windows-installer.ps1 -Target ${{ matrix.target }} -ReleaseRoot artifacts/windows-signed -ReportPath artifacts/release-evidence/installer-test-${{ matrix.arch }}.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        id: evidence
        with:
          name: windows-release-installer-test-${{ matrix.arch }}-${{ github.run_attempt }}
          path: artifacts/release-evidence/
          if-no-files-found: error
          retention-days: 7
      - name: Retain the immutable qualification artifact ID for this architecture
        id: reference
        env:
          ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
        run: '"artifact-id-${{ matrix.arch }}=$env:ARTIFACT_ID" | Add-Content -LiteralPath $env:GITHUB_OUTPUT'

  identity-test:
    needs: sign
    runs-on: windows-2025
    timeout-minutes: 10
    outputs:
      artifact-id: ${{ steps.evidence.outputs.artifact-id }}
    # Deliberately no environment: even an OIDC-capable job must fail Azure login.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require Azure to reject the unprotected GitHub subject
        env:
          PROBE_CLIENT_ID: ${{ secrets.AZURE_SIGNING_PROBE_CLIENT_ID }}
          PROBE_TENANT_ID: ${{ secrets.AZURE_SIGNING_PROBE_TENANT_ID }}
        run: ./scripts/test-unprotected-signing-identity.ps1 -ClientId $env:PROBE_CLIENT_ID -TenantId $env:PROBE_TENANT_ID -ReportPath artifacts/release-evidence/identity-permission-test.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: evidence
        with:
          name: windows-release-identity-test-${{ github.run_attempt }}
          path: artifacts/release-evidence/
          if-no-files-found: error
          retention-days: 7

  attest:
    needs: [sign, installer-test, identity-test]
    runs-on: windows-2025
    timeout-minutes: 10
    outputs:
      artifact-id: ${{ steps.evidence.outputs.artifact-id }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.sign.outputs.artifact-id }}
          path: artifacts/windows-signed
      - name: Check signed artifact provenance and checksums
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          . ./scripts/windows-release-common.ps1
          Assert-SignedRelease -ReleaseRoot artifacts/windows-signed -Commit $env:GITHUB_SHA -RunId $env:GITHUB_RUN_ID | Out-Host
      - name: Attest the final signed installer, standalone CLI and release metadata
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            artifacts/windows-signed/*-setup.exe
            artifacts/windows-signed/transmog-cli*.exe
            artifacts/windows-signed/release-manifest.json
            artifacts/windows-signed/*sbom.cdx.json
            artifacts/windows-signed/latest.json
            artifacts/windows-signed/*-setup.exe.sig
            artifacts/windows-signed/*_windows-*-symbols.zip
          create-storage-record: false
      - name: Retain and verify the Sigstore bundle
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force artifacts/attestation | Out-Null
          Copy-Item -LiteralPath $env:BUNDLE_PATH -Destination artifacts/attestation/provenance.sigstore.json
          $subjects = @(Get-ChildItem artifacts/windows-signed/*-setup.exe) + @(Get-ChildItem artifacts/windows-signed/transmog-cli*.exe) + @(Get-ChildItem artifacts/windows-signed/*_windows-*-symbols.zip)
          if ($subjects.Count -ne 6) { throw 'Expected installer, CLI and symbols for both architectures.' }
          foreach ($subject in $subjects) {
            gh attestation verify $subject.FullName --repo erik-anderson/transmog --bundle artifacts/attestation/provenance.sigstore.json --signer-workflow erik-anderson/transmog/.github/workflows/windows-release.yml --source-ref $env:GITHUB_REF --source-digest $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { throw "Attestation verification failed: $($subject.Name)" }
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: evidence
        with:
          name: windows-release-attestation-${{ github.run_attempt }}
          path: artifacts/attestation/
          if-no-files-found: error
          retention-days: 7

  publish-draft:
    needs: [sign, installer-test, identity-test, attest]
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.sign.outputs.artifact-id }}
          path: artifacts/windows-signed
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.installer-test.outputs.artifact-id-x64 }},${{ needs.installer-test.outputs.artifact-id-arm64 }}
          path: artifacts/release-evidence
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.identity-test.outputs.artifact-id }}
          path: artifacts/release-evidence
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.attest.outputs.artifact-id }}
          path: artifacts/release-evidence
      - name: Create or update a draft without Azure access
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/publish-windows-draft.ps1 -ReleaseRoot artifacts/windows-signed -EvidenceRoot artifacts/release-evidence
