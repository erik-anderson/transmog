[workspace]
members = ["engine", "facade", "bindings"]
resolver = "2"

[workspace.package]
version = "0.1.9"
edition = "2024"
rust-version = "1.90"
license = "MIT"
publish = false

[workspace.dependencies]
transmog-app = { path = "../crates/app" }
http = "1.3.1"
serde = { version = "1.0.228", features = ["derive", "rc"] }
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }

# Keep these identical to the root selections; build-sdk.py verifies them.
[patch.crates-io]
h2 = { path = "../third_party/rust-transport/vendor/h2" }
hyper = { path = "../third_party/rust-transport/vendor/hyper" }
quiche = { path = "../third_party/rust-transport/vendor/quiche" }
boring = { git = "https://github.com/cloudflare/boring", rev = "9c57211afd4e99479e4fbba73cd603128726275b" }
boring-sys = { git = "https://github.com/cloudflare/boring", rev = "9c57211afd4e99479e4fbba73cd603128726275b" }
hyper-boring = { git = "https://github.com/cloudflare/boring", rev = "9c57211afd4e99479e4fbba73cd603128726275b" }
tokio-boring = { git = "https://github.com/cloudflare/boring", rev = "9c57211afd4e99479e4fbba73cd603128726275b" }

[profile.release]
lto = "thin"
codegen-units = 1
