[graph]
all-features = true
targets = [
    "x86_64-pc-windows-msvc",
    "aarch64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
]

[advisories]
yanked = "deny"
# Tauri's metadata includes GTK 0.18 target dependencies even though the
# desktop crate selects Tauri only on Windows. No configured Transmog target
# can reach proc-macro-error (verified with target-specific cargo tree checks).
# Remove this exception before enabling the Linux desktop target.
#
# `paste` is an unmaintained proc-macro used only while building the pinned V8
# runtime. This advisory reports no security vulnerability and the pinned V8
# stack has no compatible upgrade that removes it. Keep this exact exception
# only until upstream removes the dependency; vulnerability advisories remain
# denied globally.
# Tauri single-instance still requires zbus 5 and its standalone crates.
# These maintenance advisories describe their merge into zbus 6. Neither Windows
# target reaches them. Remove the exceptions after the plugin migrates to zbus 6;
# re-review before enabling Linux desktop.
ignore = [
    "RUSTSEC-2024-0370",
    "RUSTSEC-2024-0436",
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0372",
]

[licenses]
confidence-threshold = 0.93
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = [
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "native-tls" },
    # The supported Tauri updater owns an isolated HTTPS client. The crypto graph
    # gate separately forbids these paths from every other production root.
    { name = "tauri-plugin-updater", wrappers = ["transmog-desktop"] },
    { name = "reqwest", wrappers = ["tauri-plugin-updater", "transmog-desktop"] },
    { name = "hyper-rustls", wrappers = ["reqwest"] },
    { name = "tokio-rustls", wrappers = ["reqwest", "hyper-rustls"] },
    { name = "rustls-platform-verifier", wrappers = ["reqwest"] },
    { name = "rustls", wrappers = ["tauri-plugin-updater", "reqwest", "hyper-rustls", "tokio-rustls", "rustls-platform-verifier"] },
    { name = "rustls-webpki", wrappers = ["rustls", "rustls-platform-verifier"] },
    { name = "webpki" },
]
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = ["https://github.com/cloudflare/boring"]
